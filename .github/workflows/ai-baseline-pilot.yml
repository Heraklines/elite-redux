name: AI Baseline Pilot (Non-Production)

# Artifact-only research lane. It has no deployment job, environment, production
# endpoint, cloud credential, or write permission.
on:
  workflow_dispatch:
    inputs:
      run_training:
        description: Generate contract-v3 diagnostic data and train CPU baseline trees
        required: true
        default: false
        type: boolean
      run_benchmark:
        description: Run the source-account-held-out mirrored five-controller benchmark
        required: true
        default: false
        type: boolean
  push:
    branches:
      - codex/combat-ai-baselines-20260728
    paths:
      - ".github/workflows/ai-baseline-pilot.yml"
      - "ml/baselines/**"
      - "ml/policy/**"
      - "ml/evaluation/**"
      - "ml/training/**"
      - "scripts/ai/**"
      - "scripts/export-data-dictionary.mjs"
      - "scripts/export-data-dictionary.test.ts"
      - "scripts/run-combat-batch.mjs"
      - "scripts/run-scenario.mjs"
      - "src/data/elite-redux/ability-upgrades/requested-field-effects.ts"
      - "src/data/elite-redux/abilities/**"
      - "src/data/elite-redux/ai/**"
      - "src/dev-tools/registry.ts"
      - "src/dev-tools/test-suite/scenario-spec.ts"
      - "src/phases/encounter-phase.ts"
      - "test/framework/game-manager.ts"
      - "test/node/combat-contract.test.ts"
      - "test/data/elite-redux/er-requested-field-effects.test.ts"
      - "test/tests/elite-redux/er-scenario-spec.test.ts"
      - "test/tools/run-scenario.test.ts"

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-baseline-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.repository == 'Heraklines/elite-redux'
    name: Contract and pure tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Run fast contract tests
        run: pnpm exec vitest run --config test/node/vitest.config.ts test/node/combat-contract.test.ts --no-color
      - name: Verify visibility and private ER state through real combat
        env:
          ER_SCENARIO: "1"
          ER_AI_CONTRACT_CHECK: "1"
          ER_NEWCOMER_SIGNATURE_CHECK: "1"
        run: >-
          pnpm exec vitest run test/tools/run-scenario.test.ts --no-color
          -t "combat observation contract|Foul Harvest|generated per-mon held items"
      - name: Verify ghost fields reach the dev-scenario engine adapter
        run: ER_SCENARIO=1 pnpm exec vitest run test/tests/elite-redux/er-scenario-spec.test.ts --no-color
      - name: Guard requested field ability resolution
        run: >-
          pnpm exec vitest run
          test/data/elite-redux/er-requested-field-effects.test.ts
          test/data/elite-redux/er-flammable-coat-mental-pollution.test.ts
          --no-color
      - name: Validate mirrored ghost-team fixtures
        run: node scripts/ai/test-ghost-gauntlet.mjs
      - name: Check changed AI files
        run: >-
          pnpm exec biome check
          scripts/ai/compare-run-results.mjs
          scripts/ai/build-ghost-anchor.mjs
          scripts/ai/ghost-gauntlet.mjs
          scripts/ai/make-pilot-batch.mjs
          scripts/ai/make-pilot-scenario.mjs
          scripts/ai/make-ghost-gauntlet.mjs
          scripts/ai/make-ghost-eval-batch.mjs
          scripts/ai/summarize-ghost-gauntlet.mjs
          scripts/ai/summarize-ghost-batch-eval.mjs
          scripts/ai/test-ghost-gauntlet.mjs
          scripts/export-data-dictionary.mjs
          scripts/export-data-dictionary.test.ts
          scripts/run-combat-batch.mjs
          src/field/pokemon.ts
          src/modifier/modifier.ts
          src/data/elite-redux/ability-upgrades/requested-field-effects.ts
          src/data/elite-redux/ai/combat-contract.ts
          src/data/elite-redux/ai/combat-data-dictionary.ts
          src/data/elite-redux/ai/combat-engine-adapter.ts
          src/data/elite-redux/ai/combat-features.ts
          src/data/elite-redux/ai/combat-private-state.ts
          src/data/elite-redux/ai/combat-tree-model.ts
          src/dev-tools/registry.ts
          src/dev-tools/test-suite/scenario-spec.ts
          src/phases/encounter-phase.ts
          test/framework/game-manager.ts
          test/framework/phase-interceptor.ts
          test/node/combat-contract.test.ts
          test/data/elite-redux/er-flammable-coat-mental-pollution.test.ts
          test/data/elite-redux/er-requested-field-effects.test.ts
          test/tests/elite-redux/er-scenario-spec.test.ts
          test/tools/run-scenario.test.ts
          test/tools/ai-neural-policy-client.ts

  identity:
    if: github.repository == 'Heraklines/elite-redux'
    name: Canonical runtime data dictionary
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dex_hash: ${{ steps.identity.outputs.dex_hash }}
      dictionary_hash: ${{ steps.identity.outputs.dictionary_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Export initialized runtime registries
        run: node scripts/export-data-dictionary.mjs --out ai-identity/er-combat-data-dictionary.json
      - name: Compute immutable data identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          dex_hash=$(find src/data/elite-redux -type f -name '*.ts' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          dictionary_hash=$(sha256sum ai-identity/er-combat-data-dictionary.json | cut -d' ' -f1)
          echo "dex_hash=$dex_hash" >> "$GITHUB_OUTPUT"
          echo "dictionary_hash=$dictionary_hash" >> "$GITHUB_OUTPUT"
      - name: Upload canonical runtime dictionary
        uses: actions/upload-artifact@v4
        with:
          name: ai-data-dictionary
          path: ai-identity/er-combat-data-dictionary.json
          retention-days: 30
          if-no-files-found: error

  generate:
    if: github.repository == 'Heraklines/elite-redux' && github.event_name == 'workflow_dispatch' && inputs.run_training
    name: Ghost self-play shard ${{ matrix.shard }}
    needs: [identity, capture-neutrality]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Build source-disjoint ghost combat batch
        shell: bash
        run: >-
          node scripts/ai/make-pilot-batch.mjs
          "$(( ${{ matrix.shard }} * 40 ))" 40
          "ai-work/batch-${{ matrix.shard }}.json"
      - name: Generate real-engine decisions
        env:
          ER_AI_BUILD_SHA: ${{ github.sha }}
          ER_AI_DEX_HASH: ${{ needs.identity.outputs.dex_hash }}
          ER_AI_DICTIONARY_HASH: ${{ needs.identity.outputs.dictionary_hash }}
        run: >-
          node scripts/run-combat-batch.mjs "@ai-work/batch-${{ matrix.shard }}.json"
          --turns 80 --real-rng --ai-policy smart-default
          --json-out "ai-work/result-${{ matrix.shard }}.json"
          --ai-data-out "ai-work/decisions-${{ matrix.shard }}.jsonl"
      - name: Upload immutable shard
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-shard-${{ matrix.shard }}
          path: |
            ai-work/decisions-${{ matrix.shard }}.jsonl
            ai-work/result-${{ matrix.shard }}.json
            ai-work/batch-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: error

  capture-neutrality:
    if: github.repository == 'Heraklines/elite-redux'
    name: Recorder preserves real-engine outcome
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Build deterministic smoke batch
        run: node scripts/ai/make-pilot-batch.mjs 0 1 ai-neutral/batch.json
      - name: Run without capture
        run: >-
          node scripts/run-combat-batch.mjs @ai-neutral/batch.json
          --turns 20 --real-rng --ai-policy smart-default
          --json-out ai-neutral/without-capture.json
      - name: Run with capture
        env:
          ER_AI_BUILD_SHA: ${{ github.sha }}
          ER_AI_DEX_HASH: capture-neutrality-smoke
          ER_AI_DICTIONARY_HASH: capture-neutrality-smoke
        run: >-
          node scripts/run-combat-batch.mjs @ai-neutral/batch.json
          --turns 20 --real-rng --ai-policy smart-default
          --json-out ai-neutral/with-capture.json
          --ai-data-out ai-neutral/decisions.jsonl
      - name: Assert capture neutrality and visibility boundary
        run: >-
          node scripts/ai/compare-run-results.mjs
          ai-neutral/without-capture.json ai-neutral/with-capture.json ai-neutral/decisions.jsonl

  train:
    if: github.repository == 'Heraklines/elite-redux' && github.event_name == 'workflow_dispatch' && inputs.run_training
    name: CPU baseline leaderboard
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-baseline-shard-*
          path: ai-data
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: ai-data-dictionary
          path: ai-dictionary
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/baselines/requirements.txt
      - name: Install pinned CPU baselines
        run: python -m pip install --requirement ml/baselines/requirements.txt
      - name: Run baseline trainer unit tests
        run: python -m unittest discover -s ml/baselines -p 'test_*.py' -v
      - name: Train and evaluate leakage-safe baselines
        run: >-
          python ml/baselines/train_candidate_baselines.py
          --data ai-data
          --dictionary ai-dictionary/er-combat-data-dictionary.json
          --report-json ai-report/leaderboard.json
          --report-md ai-report/leaderboard.md
          --models-dir ai-report/models
          --diagnostic-source-imitation
      - name: Publish run summary
        shell: bash
        run: cat ai-report/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload leaderboard
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-leaderboard
          path: ai-report
          retention-days: 30
          if-no-files-found: error

  mirrored-benchmark:
    if: github.repository == 'Heraklines/elite-redux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmark
    name: Dispatch mirrored ghost benchmark
    uses: ./.github/workflows/ai-mirrored-benchmark.yml
    secrets: inherit
