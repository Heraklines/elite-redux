name: AI Checkpoint League Generation (Non-Production)

# Artifact-only research lane. It has read-only permissions, no deployment job,
# no environment, and no game or production endpoint.
on:
  push:
    branches:
      - codex/combat-ai-baselines-20260728
    paths:
      - ".github/workflows/ai-checkpoint-league.yml"
  workflow_dispatch:
    inputs:
      base_kernel:
        description: Private Kaggle kernel containing the sealed starting checkpoint
        required: true
        default: michaelferjani/er-ai-policy-firewall-v5-transfer-gpu-20260731
        type: string
      tree_run_id:
        description: Actions run containing the strongest held-out tree controller
        required: true
        default: "30693145953"
        type: string
      episodes_per_shard:
        description: Real-engine battles generated by each of six shards
        required: true
        default: 80
        type: number
      epsilon:
        description: Seeded exploration probability for both checkpoint seats
        required: true
        default: "0.08"
        type: string
      reuse_run_id:
        description: Completed checkpoint-league run to reuse; skips combat and reruns training only
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-checkpoint-league-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model:
    if: github.repository == 'Heraklines/elite-redux' && inputs.reuse_run_id == '' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[checkpoint-league]'))
    name: Seal starting checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Kaggle client
        run: python -m pip install kaggle==1.8.4
      - name: Download private starting checkpoint
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          BASE_KERNEL: ${{ inputs.base_kernel || 'michaelferjani/er-ai-policy-firewall-v5-transfer-gpu-20260731' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_KEY"
          mkdir -p ai-model
          kaggle kernels output "$BASE_KERNEL" --path ai-model --force
      - name: Validate one schema-v4 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          weights=$(find ai-model -name model.safetensors -type f)
          test "$(printf '%s\n' "$weights" | wc -l)" -eq 1
          model_dir=$(dirname "$weights")
          python - "$model_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          model_dir = Path(sys.argv[1])
          config = json.loads((model_dir / "config.json").read_text(encoding="utf-8"))
          if config.get("schemaVersion") != 4 or config.get("model") != "er-domain-candidate-transformer-v4":
              raise SystemExit("starting checkpoint is not an ER candidate-transformer-v4 artifact")
          weights = config.get("weights")
          if not isinstance(weights, str) or Path(weights).name != weights or not (model_dir / weights).is_file():
              raise SystemExit("starting checkpoint does not reference one local weights file")
          if config.get("dictionaryHash") is None or config.get("tokenVocabulary") is None:
              raise SystemExit("starting checkpoint is missing dictionary or vocabulary identity")
          PY
      - name: Download strongest held-out tree controller
        uses: actions/download-artifact@v6
        with:
          name: ai-baseline-leaderboard
          path: ai-model/tree
          run-id: ${{ inputs.tree_run_id || '30693145953' }}
          github-token: ${{ github.token }}
      - name: Validate tree controller identity
        shell: bash
        run: |
          set -euo pipefail
          test -f ai-model/tree/models/stacked_tree_ensemble.json
          node - <<'JS'
          const model = require("./ai-model/tree/models/stacked_tree_ensemble.json");
          if (model.schemaVersion !== 2 || model.featureSchemaVersion !== 2 || model.featureCount !== 4326) {
            throw new Error("tree controller does not match feature schema 2 / 4326");
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ai-checkpoint-league-starting-model
          path: ai-model
          retention-days: 14
          if-no-files-found: error

  identity:
    if: github.repository == 'Heraklines/elite-redux' && inputs.reuse_run_id == '' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[checkpoint-league]'))
    name: Seal current combat identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dex_hash: ${{ steps.identity.outputs.dex_hash }}
      dictionary_hash: ${{ steps.identity.outputs.dictionary_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Export canonical runtime dictionary
        run: node scripts/export-data-dictionary.mjs --out ai-identity/er-combat-data-dictionary.json
      - name: Compute immutable runtime identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          dex_hash=$(find src/data/elite-redux -type f -name '*.ts' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          dictionary_hash=$(sha256sum ai-identity/er-combat-data-dictionary.json | cut -d' ' -f1)
          echo "dex_hash=$dex_hash" >> "$GITHUB_OUTPUT"
          echo "dictionary_hash=$dictionary_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-checkpoint-league-dictionary
          path: ai-identity/er-combat-data-dictionary.json
          retention-days: 14
          if-no-files-found: error

  self-play:
    if: github.repository == 'Heraklines/elite-redux' && inputs.reuse_run_id == '' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[checkpoint-league]'))
    name: Checkpoint self-play shard ${{ matrix.shard }}
    needs: [model, identity]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/policy/requirements.txt
      - name: Install neural-policy inference dependencies
        run: python -m pip install --requirement ml/policy/requirements.txt
      - uses: actions/download-artifact@v6
        with:
          name: ai-checkpoint-league-starting-model
          path: ai-model
      - name: Resolve sealed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          weights=$(find ai-model -name model.safetensors -type f)
          test "$(printf '%s\n' "$weights" | wc -l)" -eq 1
          echo "BASE_MODEL=$(dirname "$weights")" >> "$GITHUB_ENV"
          test -f ai-model/tree/models/stacked_tree_ensemble.json
          echo "TREE_MODEL=ai-model/tree/models/stacked_tree_ensemble.json" >> "$GITHUB_ENV"
      - name: Build source-account-disjoint mixed league batches
        shell: bash
        run: |
          set -euo pipefail
          total=${{ inputs.episodes_per_shard || 80 }}
          mixed=$(( total * 2 / 5 ))
          self=$(( total * 2 / 5 ))
          hell=$(( total - mixed - self ))
          start=$(( ${{ matrix.shard }} * total ))
          node scripts/ai/make-pilot-batch.mjs \
            "$start" "$mixed" "ai-work/mixed-batch-${{ matrix.shard }}.json" \
            ml/training/ghost-self-play-teams.v2.json
          node scripts/ai/make-pilot-batch.mjs \
            "$(( start + mixed ))" "$self" "ai-work/self-batch-${{ matrix.shard }}.json" \
            ml/training/ghost-self-play-teams.v2.json
          node scripts/ai/make-pilot-batch.mjs \
            "$(( start + mixed + self ))" "$hell" "ai-work/hell-batch-${{ matrix.shard }}.json" \
            ml/training/ghost-self-play-teams.v2.json
          echo "MIXED_EPISODES=$mixed" >> "$GITHUB_ENV"
          echo "SELF_EPISODES=$self" >> "$GITHUB_ENV"
          echo "HELL_EPISODES=$hell" >> "$GITHUB_ENV"
      - name: Run neural-vs-tree checkpoint league
        env:
          ER_AI_BUILD_SHA: ${{ github.sha }}
          ER_AI_DEX_HASH: ${{ needs.identity.outputs.dex_hash }}
          ER_AI_DICTIONARY_HASH: ${{ needs.identity.outputs.dictionary_hash }}
        run: >-
          node scripts/run-combat-batch.mjs "@ai-work/mixed-batch-${{ matrix.shard }}.json"
          --turns 80 --real-rng
          --ai-neural-model "$BASE_MODEL"
          --ai-epsilon "${{ inputs.epsilon || '0.08' }}"
          --ai-source checkpoint-neural-v4 --ai-policy-target 1
          --opponent-ai-model "$TREE_MODEL"
          --opponent-ai-epsilon "${{ inputs.epsilon || '0.08' }}"
          --opponent-ai-source checkpoint-tree-v1 --opponent-ai-policy-target 1
          --test-timeout-ms 14400000
          --json-out "ai-work/mixed-result-${{ matrix.shard }}.json"
          --ai-data-out "ai-work/mixed-decisions-${{ matrix.shard }}.jsonl"
      - name: Assert neural-vs-tree policy boundaries
        run: node scripts/ai/validate-checkpoint-selfplay.mjs "ai-work/mixed-decisions-${{ matrix.shard }}.jsonl" "ai-work/mixed-result-${{ matrix.shard }}.json" "$MIXED_EPISODES" checkpoint-neural-v4 checkpoint-tree-v1
      - name: Run neural checkpoint self-play
        env:
          ER_AI_BUILD_SHA: ${{ github.sha }}
          ER_AI_DEX_HASH: ${{ needs.identity.outputs.dex_hash }}
          ER_AI_DICTIONARY_HASH: ${{ needs.identity.outputs.dictionary_hash }}
        run: >-
          node scripts/run-combat-batch.mjs "@ai-work/self-batch-${{ matrix.shard }}.json"
          --turns 80 --real-rng
          --ai-neural-model "$BASE_MODEL"
          --ai-epsilon "${{ inputs.epsilon || '0.08' }}"
          --ai-source checkpoint-neural-v4 --ai-policy-target 1
          --opponent-ai-neural-model "$BASE_MODEL"
          --opponent-ai-epsilon "${{ inputs.epsilon || '0.08' }}"
          --opponent-ai-source checkpoint-neural-v4 --opponent-ai-policy-target 1
          --test-timeout-ms 14400000
          --json-out "ai-work/self-result-${{ matrix.shard }}.json"
          --ai-data-out "ai-work/self-decisions-${{ matrix.shard }}.jsonl"
      - name: Assert neural self-play boundaries
        run: node scripts/ai/validate-checkpoint-selfplay.mjs "ai-work/self-decisions-${{ matrix.shard }}.jsonl" "ai-work/self-result-${{ matrix.shard }}.json" "$SELF_EPISODES" checkpoint-neural-v4 checkpoint-neural-v4
      - name: Spar neural checkpoint against native hardest AI
        env:
          ER_AI_BUILD_SHA: ${{ github.sha }}
          ER_AI_DEX_HASH: ${{ needs.identity.outputs.dex_hash }}
          ER_AI_DICTIONARY_HASH: ${{ needs.identity.outputs.dictionary_hash }}
        run: >-
          node scripts/run-combat-batch.mjs "@ai-work/hell-batch-${{ matrix.shard }}.json"
          --turns 80 --real-rng --record-engine-baseline
          --ai-neural-model "$BASE_MODEL"
          --ai-epsilon "${{ inputs.epsilon || '0.08' }}"
          --ai-source checkpoint-neural-v4 --ai-policy-target 1
          --test-timeout-ms 14400000
          --json-out "ai-work/hell-result-${{ matrix.shard }}.json"
          --ai-data-out "ai-work/hell-decisions-${{ matrix.shard }}.jsonl"
      - name: Assert Hell actions are value-only
        run: node scripts/ai/validate-checkpoint-selfplay.mjs "ai-work/hell-decisions-${{ matrix.shard }}.jsonl" "ai-work/hell-result-${{ matrix.shard }}.json" "$HELL_EPISODES" checkpoint-neural-v4 engine-hardest-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-checkpoint-league-shard-${{ matrix.shard }}
          path: |
            ai-work/*-decisions-${{ matrix.shard }}.jsonl
            ai-work/*-result-${{ matrix.shard }}.json
            ai-work/*-batch-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: warn

  train-and-package:
    if: always() && github.repository == 'Heraklines/elite-redux' && (inputs.reuse_run_id != '' || (needs.self-play.result == 'success' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[checkpoint-league]'))))
    name: Winner-only tree and resumed-transformer bundle
    needs: self-play
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-checkpoint-league-shard-*
          path: ai-data
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: ai-checkpoint-league-dictionary
          path: ai-dictionary
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: ai-checkpoint-league-starting-model
          path: ai-model
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/baselines/requirements.txt
      - name: Install pinned CPU tree dependencies
        run: python -m pip install --requirement ml/baselines/requirements.txt
      - name: Train winner-only tree policy
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: >-
          python ml/baselines/train_candidate_baselines.py
          --data ai-data
          --dictionary ai-dictionary/er-combat-data-dictionary.json
          --loss-episode-weight 0
          --winner-only-policy
          --max-policy-decisions 4000
          --report-json ai-report/leaderboard.json
          --report-md ai-report/leaderboard.md
          --models-dir ai-report/models
      - name: Package strict checkpoint-resume GPU training bundle
        shell: bash
        run: |
          set -euo pipefail
          weights=$(find ai-model -name model.safetensors -type f)
          test "$(printf '%s\n' "$weights" | wc -l)" -eq 1
          model_dir=$(dirname "$weights")
          node scripts/ai/prepare-kaggle-candidate-training.mjs \
            ai-data \
            ai-dictionary/er-combat-data-dictionary.json \
            ai-report/er-ai-training-bundle.zip \
            baseline 20260801 - 0 - "$model_dir"
      - name: Publish tree summary
        shell: bash
        run: cat ai-report/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-checkpoint-league-training-output
          path: ai-report
          retention-days: 30
          if-no-files-found: error
