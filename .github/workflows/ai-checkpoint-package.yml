name: AI Checkpoint League Training (Non-Production)

# Artifact-only research lane. It reuses a completed checkpoint-league corpus,
# has read-only permissions, and has no deployment job or environment.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed checkpoint-league run containing six validated shards
        required: true
        default: "30723563131"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-checkpoint-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-and-package:
    if: github.repository == 'Heraklines/elite-redux'
    name: Winner-only tree and resumed-transformer bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-checkpoint-league-shard-*
          path: ai-data
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: ai-checkpoint-league-dictionary
          path: ai-dictionary
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: ai-checkpoint-league-starting-model
          path: ai-model
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/baselines/requirements.txt
      - name: Install pinned CPU tree dependencies
        run: python -m pip install --requirement ml/baselines/requirements.txt
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install production Node.js dependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Train winner-only tree policy
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: >-
          python ml/baselines/train_candidate_baselines.py
          --data ai-data
          --dictionary ai-dictionary/er-combat-data-dictionary.json
          --loss-episode-weight 0
          --winner-only-policy
          --max-policy-decisions 4000
          --report-json ai-report/leaderboard.json
          --report-md ai-report/leaderboard.md
          --models-dir ai-report/models
      - name: Preserve trained tree policy
        uses: actions/upload-artifact@v4
        with:
          name: ai-checkpoint-league-tree-output
          path: |
            ai-report/leaderboard.json
            ai-report/leaderboard.md
            ai-report/models
          retention-days: 30
          if-no-files-found: error
      - name: Package strict checkpoint-resume GPU training bundle
        shell: bash
        run: |
          set -euo pipefail
          weights=$(find ai-model -name model.safetensors -type f)
          test "$(printf '%s\n' "$weights" | wc -l)" -eq 1
          model_dir=$(dirname "$weights")
          node scripts/ai/prepare-kaggle-candidate-training.mjs \
            ai-data \
            ai-dictionary/er-combat-data-dictionary.json \
            ai-report/er-ai-training-bundle.zip \
            baseline 20260801 - 0 - "$model_dir"
      - name: Publish tree summary
        shell: bash
        run: cat ai-report/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-checkpoint-league-training-output
          path: ai-report
          retention-days: 30
          if-no-files-found: error
