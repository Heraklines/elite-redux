name: AI Human Legacy Baseline (Non-Production)

# Read-only research lane. It never deploys, writes to Cloudflare, or uploads raw player telemetry.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-human-legacy-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    if: github.repository == 'Heraklines/elite-redux'
    name: Import and train human baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/baselines/requirements.txt
      - name: Install tree dependencies
        run: python -m pip install --requirement ml/baselines/requirements.txt
      - name: Download production telemetry read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ai/download-production-combat-telemetry.mjs --out "$RUNNER_TEMP/production-human-telemetry"
      - name: Export exact runtime dictionary
        run: node scripts/export-data-dictionary.mjs --out "$RUNNER_TEMP/er-combat-data-dictionary.json"
      - name: Train account-split human move tree
        run: >-
          python ml/baselines/train_legacy_human_tree.py
          --decisions "$RUNNER_TEMP/production-human-telemetry/legacy-decisions.jsonl"
          --dictionary "$RUNNER_TEMP/er-combat-data-dictionary.json"
          --out ai-human/models
          --environment production
          --jobs 2
      - name: Train immediate turn-outcome baseline
        run: >-
          python ml/baselines/train_legacy_turn_outcomes.py
          --decisions "$RUNNER_TEMP/production-human-telemetry/legacy-decisions.jsonl"
          --outcomes "$RUNNER_TEMP/production-human-telemetry/legacy-turn-outcomes.jsonl"
          --out ai-human/outcomes
          --environment production
      - name: Validate policy and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(Path("ai-human/models/selected-model.json").read_text(encoding="utf-8"))
          report = json.loads(Path("ai-human/models/report.json").read_text(encoding="utf-8"))
          outcome = json.loads(Path("ai-human/outcomes/report.json").read_text(encoding="utf-8"))
          if model.get("candidateScope") != "move-only" or model.get("policySource") != "human-v1":
              raise SystemExit("human tree does not declare its legacy move-only policy scope")
          if model.get("terminalOutcomeKnown") is not False or report.get("terminalOutcomeKnown") is not False:
              raise SystemExit("legacy tree inferred a forbidden terminal outcome")
          if outcome.get("terminalLabelsInferred") is not False:
              raise SystemExit("legacy transition model inferred forbidden terminal labels")
          if model.get("featureSchemaVersion") != 2 or model.get("featureCount") != 4326:
              raise SystemExit("human tree does not match runtime feature schema 2 / 4326")
          if set(report["sourcePartitions"]) != {"train", "validation", "test"}:
              raise SystemExit("human telemetry lacks a strict three-way account split")
          PY
      - name: Publish sanitized reports and model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-human-legacy-baseline
          path: |
            ai-human/models/*.json
            ai-human/outcomes/report.json
            ai-human/outcomes/legacy-turn-outcome-model.pkl
          retention-days: 30
          if-no-files-found: error

  benchmark:
    if: github.repository == 'Heraklines/elite-redux'
    name: Human-tree mirrored shard ${{ matrix.shard }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Co-op work may need the same runner pool; this lane never occupies more than four runners.
      max-parallel: 4
      matrix:
        include:
          - { shard: 0, start: 0, count: 25 }
          - { shard: 1, start: 25, count: 25 }
          - { shard: 2, start: 50, count: 25 }
          - { shard: 3, start: 75, count: 25 }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@v6
        with:
          name: ai-human-legacy-baseline
          path: ai-human
      - name: Build frozen difficulty-balanced mirrored batch
        run: >-
          node scripts/ai/make-ghost-eval-batch.mjs
          ml/evaluation/ghost-winner-teams.v3.json
          "${{ matrix.start }}" "${{ matrix.count }}"
          ai-gauntlet
          "shard-${{ matrix.shard }}"
          "human-legacy-tree-v1"
      - name: Play human legacy tree against hardest trainer AI
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-model ai-human/models/selected-model.json
          --test-timeout-ms 3600000
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-human-legacy-tree-v1-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-human-legacy-benchmark-shard-${{ matrix.shard }}
          path: ai-gauntlet
          retention-days: 14
          if-no-files-found: warn

  report:
    if: always() && github.repository == 'Heraklines/elite-redux'
    name: Human-tree benchmark report
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-human-legacy-benchmark-shard-*
          path: ai-gauntlet
          merge-multiple: true
      - name: Report real battle outcomes and confidence intervals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          node scripts/ai/summarize-ghost-batch-eval.mjs \
            ai-gauntlet \
            ai-report/human-legacy-mirrored-benchmark.json \
            ai-report/human-legacy-mirrored-benchmark.md
          cat ai-report/human-legacy-mirrored-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-human-legacy-benchmark-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
