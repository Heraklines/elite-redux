name: AI Human Legacy Benchmark Resume (Non-Production)

# Resumes exact-prefix checkpoints from a prior human-tree benchmark. It only
# downloads prior artifacts, runs combat, and uploads a combined report.
on:
  workflow_dispatch:
    inputs:
      prior_run_id:
        description: Actions run containing the model and resumable benchmark shards
        required: true
        type: string
      shards_json:
        description: JSON array of incomplete shards to resume
        required: true
        default: "[1,2,3]"
        type: string
      test_timeout_ms:
        description: Vitest timeout for the remaining episodes in each shard
        required: true
        default: "7200000"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-human-legacy-benchmark-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.repository == 'Heraklines/elite-redux'
    name: Resume human-tree shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Co-op work may need the same pool; this lane never occupies more than four runners.
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.shards_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Restore the exact trained human model
        uses: actions/download-artifact@v6
        with:
          name: ai-human-legacy-baseline
          path: ai-human
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Restore the exact-prefix shard checkpoint
        uses: actions/download-artifact@v6
        with:
          name: ai-human-legacy-benchmark-shard-${{ matrix.shard }}
          path: ai-gauntlet
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Resume human legacy tree against hardest trainer AI
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-model ai-human/models/selected-model.json
          --resume
          --test-timeout-ms "${{ inputs.test_timeout_ms }}"
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-human-legacy-tree-v1-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-human-legacy-benchmark-resumed-shard-${{ matrix.shard }}
          path: ai-gauntlet
          retention-days: 14
          if-no-files-found: error

  report:
    if: always() && github.repository == 'Heraklines/elite-redux'
    name: Resumed human-tree benchmark report
    needs: resume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Restore all prior shards
        uses: actions/download-artifact@v6
        with:
          pattern: ai-human-legacy-benchmark-shard-*
          path: ai-gauntlet
          merge-multiple: true
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Overlay resumed shards
        uses: actions/download-artifact@v6
        with:
          pattern: ai-human-legacy-benchmark-resumed-shard-*
          path: ai-gauntlet
          merge-multiple: true
      - name: Report real battle outcomes and confidence intervals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          node scripts/ai/summarize-ghost-batch-eval.mjs \
            ai-gauntlet \
            ai-report/human-legacy-mirrored-benchmark.json \
            ai-report/human-legacy-mirrored-benchmark.md
          cat ai-report/human-legacy-mirrored-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-human-legacy-benchmark-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
