name: AI Mirrored Benchmark Engine Repair (Non-Production)

# Completes a prior benchmark whose expensive neural/tree/smart artifacts are
# intact but whose hardest-engine adapter failed. It only downloads artifacts,
# runs combat, and uploads a combined report.
on:
  push:
    branches:
      - codex/combat-ai-baselines-20260728
    paths:
      - ".github/workflows/ai-mirrored-benchmark-engine-repair.yml"
  workflow_dispatch:
    inputs:
      prior_run_id:
        description: Actions run containing the six intact benchmark shard artifacts
        required: true
        default: "30694811394"
        type: string
      prior_repair_run_id:
        description: Repair run containing the already-complete shards 1, 3, and 4
        required: true
        default: "30701672488"
        type: string
      additional_repair_run_id:
        description: Optional repair run containing other completed shards to reuse
        required: false
        default: ""
        type: string
      shards_json:
        description: JSON array of hardest-engine shards to run
        required: true
        default: "[0,2,5]"
        type: string
      test_timeout_ms:
        description: Vitest timeout for the complete shard batch
        required: true
        default: "5400000"
        type: string
      resume_results:
        description: Resume exact-prefix shard checkpoints from additional_repair_run_id
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-mirrored-benchmark-engine-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Heraklines/elite-redux'
    name: Hardest-engine repair shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(inputs.shards_json || '[0,2,5]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Restore completed controller legs from the prior run
        uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-shard-${{ matrix.shard }}
          path: ai-gauntlet
          run-id: ${{ inputs.prior_run_id || '30694811394' }}
          github-token: ${{ github.token }}
      - name: Restore resumable hardest-engine checkpoint
        if: inputs.resume_results
        uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-repaired-shard-${{ matrix.shard }}
          path: ai-gauntlet
          run-id: ${{ inputs.additional_repair_run_id }}
          github-token: ${{ github.token }}
      - name: Remove any incomplete hardest-engine output
        if: ${{ !inputs.resume_results }}
        shell: bash
        run: rm -f "ai-gauntlet/shard-${{ matrix.shard }}-engine-hardest-v1-results.json"
      - name: Play corrected hardest-engine baseline
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-policy engine-hardest
          ${{ inputs.resume_results && '--resume' || '' }}
          --test-timeout-ms "${{ inputs.test_timeout_ms || '5400000' }}"
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-engine-hardest-v1-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-mirrored-benchmark-repaired-shard-${{ matrix.shard }}
          path: ai-gauntlet
          retention-days: 14
          if-no-files-found: error

  report:
    if: always() && github.repository == 'Heraklines/elite-redux'
    name: Repaired five-controller benchmark report
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Restore completed repair shard 1
        uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-repaired-shard-1
          path: ai-gauntlet
          run-id: ${{ inputs.prior_repair_run_id || '30701672488' }}
          github-token: ${{ github.token }}
      - name: Restore completed repair shard 3
        uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-repaired-shard-3
          path: ai-gauntlet
          run-id: ${{ inputs.prior_repair_run_id || '30701672488' }}
          github-token: ${{ github.token }}
      - name: Restore completed repair shard 4
        uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-repaired-shard-4
          path: ai-gauntlet
          run-id: ${{ inputs.prior_repair_run_id || '30701672488' }}
          github-token: ${{ github.token }}
      - name: Restore additional completed repair shards
        if: inputs.additional_repair_run_id != ''
        uses: actions/download-artifact@v6
        with:
          pattern: ai-mirrored-benchmark-repaired-shard-*
          path: ai-gauntlet
          merge-multiple: true
          run-id: ${{ inputs.additional_repair_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-mirrored-benchmark-repaired-shard-*
          path: ai-gauntlet
          merge-multiple: true
      - name: Summarize held-out per-tier and macro win rates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          node scripts/ai/summarize-ghost-batch-eval.mjs \
            ai-gauntlet \
            ai-report/mirrored-benchmark.json \
            ai-report/mirrored-benchmark.md
          cat ai-report/mirrored-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mirrored-benchmark-repaired-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
