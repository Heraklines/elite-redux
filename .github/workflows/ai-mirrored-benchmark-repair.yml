name: AI Mirrored Benchmark Repair (Non-Production)

# Repairs one incomplete result checkpoint from an earlier benchmark run. This
# workflow reads only GitHub artifacts, runs the combat harness, and cannot deploy.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run containing all six benchmark shard artifacts
        required: true
        type: string
      shard:
        description: Incomplete shard to resume
        required: true
        default: "5"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      controller:
        description: Incomplete controller checkpoint
        required: true
        default: engine-hardest-v1
        type: choice
        options:
          - engine-hardest-v1
          - smart-default-v1

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-mirrored-benchmark-repair-${{ inputs.source_run_id }}-${{ inputs.shard }}-${{ inputs.controller }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Heraklines/elite-redux'
    name: Resume shard ${{ inputs.shard }} / ${{ inputs.controller }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ER_COMBAT_EPISODE_TIMEOUT_MS: 300000
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Test combat-batch watchdog contract
        run: node --test scripts/combat-batch-watchdog.test.mjs
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-mirrored-benchmark-shard-*
          path: ai-gauntlet
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild the exact shard batch
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          starts=(0 17 34 51 68 84)
          counts=(17 17 17 17 16 16)
          node scripts/ai/make-ghost-eval-batch.mjs \
            ml/evaluation/ghost-winner-teams.v3.json \
            "${starts[$SHARD]}" "${counts[$SHARD]}" \
            ai-gauntlet \
            "shard-$SHARD" \
            "selected-tree-v1,smart-default-v1,engine-hardest-v1"
      - name: Resume incomplete controller checkpoint
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          CONTROLLER: ${{ inputs.controller }}
        run: |
          set -euo pipefail
          args=(
            node scripts/run-combat-batch.mjs
            "@ai-gauntlet/shard-$SHARD-batch.json"
            --turns 80
            --real-rng
            --resume
            --test-timeout-ms 3600000
            --json-out "ai-gauntlet/shard-$SHARD-$CONTROLLER-results.json"
          )
          if [[ "$CONTROLLER" == "engine-hardest-v1" ]]; then
            args+=(--ai-policy engine-hardest)
          else
            args+=(--ai-policy smart-default)
          fi
          "${args[@]}"
      - name: Summarize repaired benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          node scripts/ai/summarize-ghost-batch-eval.mjs \
            ai-gauntlet \
            ai-report/mirrored-benchmark.json \
            ai-report/mirrored-benchmark.md
          cat ai-report/mirrored-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mirrored-benchmark-repaired-${{ inputs.source_run_id }}
          path: |
            ai-report
            ai-gauntlet/shard-${{ inputs.shard }}-${{ inputs.controller }}-results.json
          retention-days: 30
          if-no-files-found: error
