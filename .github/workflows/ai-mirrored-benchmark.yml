name: AI Mirrored Ghost Benchmark (Non-Production)

# Artifact-only research lane. It cannot deploy or reach a game environment.
on:
  workflow_dispatch:
    inputs:
      control_kernel:
        description: Private Kaggle kernel containing the random-init control output
        required: true
        default: michaelferjani/er-ai-fw-v5-matched-control-gpu-20260731
        type: string
      transfer_kernel:
        description: Private Kaggle kernel containing the Showdown-transfer output
        required: true
        default: michaelferjani/er-ai-policy-firewall-v5-transfer-gpu-20260731
        type: string
      tree_run_id:
        description: Actions run containing the diagnostic tree-ensemble artifact
        required: true
        default: "30588067756"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-mirrored-ghost-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  models:
    if: github.repository == 'Heraklines/elite-redux'
    name: Seal benchmark model inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Kaggle client
        run: python -m pip install kaggle==1.8.4
      - name: Download private matched transformer outputs
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          CONTROL_KERNEL: ${{ inputs.control_kernel }}
          TRANSFER_KERNEL: ${{ inputs.transfer_kernel }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_KEY"
          mkdir -p ai-models/control ai-models/transfer
          kaggle kernels output "$CONTROL_KERNEL" --path ai-models/control --force
          kaggle kernels output "$TRANSFER_KERNEL" --path ai-models/transfer --force
      - uses: actions/download-artifact@v6
        with:
          name: ai-iterated-leaderboard
          path: ai-models/tree
          run-id: ${{ inputs.tree_run_id }}
          github-token: ${{ github.token }}
      - name: Validate exact model inventory and policy firewall
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ai-models/control -name model.safetensors -type f | wc -l)" -eq 1
          test "$(find ai-models/transfer -name model.safetensors -type f | wc -l)" -eq 1
          test -f ai-models/tree/models/stacked_tree_ensemble.json
          python - <<'PY'
          import json
          from pathlib import Path

          reports = {}
          for arm in ("control", "transfer"):
              paths = list(Path("ai-models", arm).rglob("report.json"))
              if len(paths) != 1:
                  raise SystemExit(f"expected one {arm} report, found {paths}")
              report = json.loads(paths[0].read_text(encoding="utf-8"))
              if report["checkpointSelection"]["metric"] != "valueBrier":
                  raise SystemExit(f"{arm} did not use value-only ER checkpoint selection")
              reports[arm] = report
          control = reports["control"]
          transfer = reports["transfer"]
          if control["architecture"] != transfer["architecture"] or control["seed"] != transfer["seed"]:
              raise SystemExit("matched transformer arms differ in architecture or seed")
          if control["tokenVocabularySha256"] != transfer["tokenVocabularySha256"]:
              raise SystemExit("matched transformer arms differ in token vocabulary")
          if control["data"]["erJsonlSha256"] != transfer["data"]["erJsonlSha256"]:
              raise SystemExit("matched transformer arms differ in ER data")
          if control["data"]["identity"] != transfer["data"]["identity"]:
              raise SystemExit("matched transformer arms differ in runtime identity")
          if control["data"]["transferDecisions"] != 0 or transfer["data"]["transferDecisions"] <= 0:
              raise SystemExit("matched transfer assignment is invalid")
          if control["data"]["policyTargetDecisions"] != 0:
              raise SystemExit("control ER data contains forbidden policy targets")
          if transfer["data"]["policyTargetDecisions"] != transfer["data"]["transferDecisions"]:
              raise SystemExit("transfer arm policy targets are not confined to transfer decisions")
          if control["data"]["excludedPolicyDecisions"] != transfer["data"]["excludedPolicyDecisions"]:
              raise SystemExit("matched arms disagree on excluded ER policy decisions")
          if control["objective"]["transferPretrainEpochs"] != 0:
              raise SystemExit("random-init control unexpectedly performed transfer pretraining")
          if transfer["objective"]["transferPretrainEpochs"] <= 0:
              raise SystemExit("Showdown-transfer arm did not perform transfer pretraining")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mirrored-benchmark-models
          path: ai-models
          retention-days: 7
          if-no-files-found: error

  benchmark:
    if: github.repository == 'Heraklines/elite-redux'
    name: Mirrored benchmark shard ${{ matrix.shard }}
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { shard: 0, start: 0, count: 17 }
          - { shard: 1, start: 17, count: 17 }
          - { shard: 2, start: 34, count: 17 }
          - { shard: 3, start: 51, count: 17 }
          - { shard: 4, start: 68, count: 16 }
          - { shard: 5, start: 84, count: 16 }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/policy/requirements.txt
            ml/baselines/requirements.txt
      - name: Install neural-policy inference dependencies
        run: python -m pip install --requirement ml/policy/requirements.txt
      - uses: actions/download-artifact@v6
        with:
          name: ai-mirrored-benchmark-models
          path: ai-models
      - name: Resolve sealed model directories
        shell: bash
        run: |
          set -euo pipefail
          control_weights=$(find ai-models/control -name model.safetensors -type f)
          transfer_weights=$(find ai-models/transfer -name model.safetensors -type f)
          test "$(printf '%s\n' "$control_weights" | wc -l)" -eq 1
          test "$(printf '%s\n' "$transfer_weights" | wc -l)" -eq 1
          echo "CONTROL_MODEL=$(dirname "$control_weights")" >> "$GITHUB_ENV"
          echo "TRANSFER_MODEL=$(dirname "$transfer_weights")" >> "$GITHUB_ENV"
      - name: Build difficulty-balanced mirrored batch
        run: >-
          node scripts/ai/make-ghost-eval-batch.mjs
          ml/evaluation/ghost-winner-teams.v3.json
          "${{ matrix.start }}" "${{ matrix.count }}"
          ai-gauntlet
          "shard-${{ matrix.shard }}"
      - name: Play random-init transformer
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-neural-model "$CONTROL_MODEL"
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-random-init-transformer-v4-results.json"
      - name: Play Showdown-transfer transformer
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-neural-model "$TRANSFER_MODEL"
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-showdown-transfer-transformer-v4-results.json"
      - name: Play diagnostic tree ensemble
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-model ai-models/tree/models/stacked_tree_ensemble.json
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-tree-ensemble-v1-results.json"
      - name: Play smart-default baseline
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-policy smart-default
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-smart-default-v1-results.json"
      - name: Play hardest-engine baseline
        run: >-
          node scripts/run-combat-batch.mjs
          "@ai-gauntlet/shard-${{ matrix.shard }}-batch.json"
          --turns 80 --real-rng
          --ai-policy engine-hardest
          --json-out "ai-gauntlet/shard-${{ matrix.shard }}-engine-hardest-v1-results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mirrored-benchmark-shard-${{ matrix.shard }}
          path: ai-gauntlet
          retention-days: 14
          if-no-files-found: error

  report:
    if: github.repository == 'Heraklines/elite-redux'
    name: Difficulty-balanced benchmark report
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ai-mirrored-benchmark-shard-*
          path: ai-gauntlet
          merge-multiple: true
      - name: Summarize per-tier and macro win rates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          node scripts/ai/summarize-ghost-batch-eval.mjs \
            ai-gauntlet \
            ai-report/mirrored-benchmark.json \
            ai-report/mirrored-benchmark.md
          cat ai-report/mirrored-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mirrored-benchmark-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
