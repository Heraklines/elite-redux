name: AI Production V4 Sharded Curation (Private)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First UTC telemetry prefix to curate
        required: true
        type: string
        default: "2026-08-03"
      end_date:
        description: Last UTC telemetry prefix to curate (empty means today)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-production-v4-sharded-curation
  cancel-in-progress: false

jobs:
  extract:
    if: github.repository == 'Heraklines/elite-redux'
    name: Extract private episodes ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - name: Verify private episode audit contract
        run: node --test scripts/ai/combat-contract-v4-audit.test.mjs
      - name: Assign UTC date prefixes
        shell: bash
        run: |
          set -euo pipefail
          start="${{ inputs.start_date }}"
          end="${{ inputs.end_date }}"
          if [[ -z "$end" ]]; then end="$(date -u +%F)"; fi
          python - "$start" "$end" "${{ matrix.shard }}" 5 > "$RUNNER_TEMP/dates.txt" <<'PY'
          from datetime import date, timedelta
          import sys

          start = date.fromisoformat(sys.argv[1])
          end = date.fromisoformat(sys.argv[2])
          shard = int(sys.argv[3])
          shard_count = int(sys.argv[4])
          if end < start:
              raise SystemExit("end_date precedes start_date")
          current = start
          offset = 0
          while current <= end:
              if offset % shard_count == shard:
                  print(current.isoformat())
              current += timedelta(days=1)
              offset += 1
          PY
      - name: Extract and publish temporary private date shards
        env:
          TELEMETRY_EXPORT_TOKEN: ${{ secrets.ER_AI_TELEMETRY_EXPORT_TOKEN }}
          TELEMETRY_EXPORT_URL: https://er-ai-telemetry-export.heraklines.workers.dev/v1/export
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/episodes" "$RUNNER_TEMP/audits" "$RUNNER_TEMP/manifests"
          while IFS= read -r day; do
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            episode_file="$RUNNER_TEMP/episodes/$day.jsonl.gz"
            audit_dir="$RUNNER_TEMP/audits/$day"
            node scripts/ai/run-production-combat-v4-audit.mjs \
              --max-invalid-objects 100 \
              --shards 32 \
              --prefix "$day/" \
              --out "$audit_dir" \
              --private-episode-out "$episode_file"
            object_key="ai-private/contract-v4-work/$GITHUB_RUN_ID/$day.jsonl.gz"
            npx wrangler r2 object put "er-telemetry/$object_key" --file "$episode_file" --remote
            jq -n \
              --arg day "$day" \
              --arg objectKey "$object_key" \
              --arg sha256 "$(sha256sum "$episode_file" | cut -d' ' -f1)" \
              --argjson bytes "$(stat -c%s "$episode_file")" \
              --argjson episodes "$(jq '.corpus.privateEpisodesWritten' "$audit_dir/production-v4-semantic-audit.json")" \
              '{day:$day, objectKey:$objectKey, sha256:$sha256, bytes:$bytes, episodes:$episodes}' \
              > "$RUNNER_TEMP/manifests/$day.json"
          done < "$RUNNER_TEMP/dates.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-v4-curation-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/manifests/*.json
          retention-days: 1
          if-no-files-found: error
      - name: Delete private runner-local extraction data
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/episodes" "$RUNNER_TEMP/audits" "$RUNNER_TEMP/manifests"

  curate:
    if: always() && github.repository == 'Heraklines/elite-redux'
    needs: extract
    name: Merge and globally curate private episodes
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify merge and global curation logic
        working-directory: ml/policy
        run: >-
          python -m unittest
          test_merge_contract_v4_episode_shards
          test_curate_contract_v4
      - name: Build expected UTC date list
        shell: bash
        run: |
          set -euo pipefail
          start="${{ inputs.start_date }}"
          end="${{ inputs.end_date }}"
          if [[ -z "$end" ]]; then end="$(date -u +%F)"; fi
          python - "$start" "$end" > "$RUNNER_TEMP/dates.txt" <<'PY'
          from datetime import date, timedelta
          import sys

          current = date.fromisoformat(sys.argv[1])
          end = date.fromisoformat(sys.argv[2])
          if end < current:
              raise SystemExit("end_date precedes start_date")
          while current <= end:
              print(current.isoformat())
              current += timedelta(days=1)
          PY
      - uses: actions/download-artifact@v6
        if: needs.extract.result == 'success'
        with:
          pattern: ai-v4-curation-manifest-*
          path: ${{ runner.temp }}/manifests
          merge-multiple: true
      - name: Fetch and verify temporary private date shards
        if: needs.extract.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/episodes"
          while IFS= read -r day; do
            manifest="$RUNNER_TEMP/manifests/$day.json"
            test -f "$manifest"
            test "$(jq -r '.day' "$manifest")" = "$day"
            object_key=$(jq -r '.objectKey' "$manifest")
            file="$RUNNER_TEMP/episodes/$day.jsonl.gz"
            npx wrangler r2 object get "er-telemetry/$object_key" --file "$file" --remote
            test "$(sha256sum "$file" | cut -d' ' -f1)" = "$(jq -r '.sha256' "$manifest")"
            test "$(stat -c%s "$file")" = "$(jq -r '.bytes' "$manifest")"
          done < "$RUNNER_TEMP/dates.txt"
      - name: Merge unique episodes and globally curate source-disjoint shards
        if: needs.extract.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report
          python ml/policy/merge_contract_v4_episode_shards.py \
            --inputs "$RUNNER_TEMP"/episodes/*.jsonl.gz \
            --output "$RUNNER_TEMP/eligible-episodes.jsonl.gz" \
            --report ai-report/episode-merge-report.json
          python ml/policy/curate_contract_v4.py \
            --episodes "$RUNNER_TEMP/eligible-episodes.jsonl.gz" \
            --private-out "$RUNNER_TEMP/curated-v4" \
            --report ai-report/curation-report.json
      - name: Publish final private curated shards to R2
        if: needs.extract.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/curated-v4/manifest.json"
          dataset_id=$(jq -r '.datasetId' "$manifest")
          [[ "$dataset_id" =~ ^[0-9a-f]{24}$ ]]
          cp "$manifest" ai-report/curation-manifest.json
          while IFS=$'\t' read -r name expected_hash; do
            [[ "$name" =~ ^[a-z0-9-]+\.jsonl\.gz$ ]]
            file="$RUNNER_TEMP/curated-v4/$name"
            test "$(sha256sum "$file" | cut -d' ' -f1)" = "$expected_hash"
            npx wrangler r2 object put \
              "er-telemetry/ai-private/contract-v4/${dataset_id}/${name}" \
              --file "$file" \
              --remote
          done < <(jq -r '.files[] | [.name, .sha256] | @tsv' "$manifest")
          npx wrangler r2 object put \
            "er-telemetry/ai-private/contract-v4/${dataset_id}/manifest.json" \
            --file "$manifest" \
            --remote
          jq '{passed, datasetId, identity, episodesScanned, policy, critic, excluded}' \
            ai-report/curation-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Delete temporary private R2 date shards
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          while IFS= read -r day; do
            npx wrangler r2 object delete \
              "er-telemetry/ai-private/contract-v4-work/$GITHUB_RUN_ID/$day.jsonl.gz" \
              --remote || true
          done < "$RUNNER_TEMP/dates.txt"
      - name: Delete private runner-local curation data
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/episodes" \
            "$RUNNER_TEMP/manifests" \
            "$RUNNER_TEMP/curated-v4"
          rm -f "$RUNNER_TEMP/eligible-episodes.jsonl.gz"
      - uses: actions/upload-artifact@v4
        if: needs.extract.result == 'success'
        with:
          name: ai-v4-global-curation-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
      - name: Require every extractor
        if: needs.extract.result != 'success'
        shell: bash
        run: |
          echo "::error::One or more private date extractors failed"
          exit 1
