name: AI Production V4 Remote Training (Private)

# Research-only bridge: production R2 -> ephemeral GitHub runner -> private
# Kaggle dataset/kernel. Raw telemetry is never uploaded as an Actions artifact.
on:
  push:
    branches:
      - codex/combat-ai-baselines-20260728
    paths:
      - ".github/workflows/ai-production-v4-remote-training.yml"
  workflow_dispatch:
    inputs:
      reuse_existing_dataset:
        description: Reuse the current private Kaggle dataset instead of publishing a new version
        required: false
        type: boolean
        default: false
      diagnose_existing_kernel:
        description: Inspect the private Kaggle kernel without importing telemetry or training
        required: false
        type: boolean
        default: false
      target_build_sha:
        description: Exact production build to train; blank resolves the live production version endpoint
        required: false
        type: string
        default: ""
      cpu_tree_only:
        description: Import the exact production cut and fit a CPU tree without publishing or launching Kaggle
        required: false
        type: boolean
        default: false
      trainer_tree:
        description: Restrict the CPU winner tree to recorded trainer battles
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.diagnose_existing_kernel && 'ai-kaggle-diagnostics' || inputs.cpu_tree_only && 'ai-production-v4-tree' || 'ai-production-v4-remote-training' }}
  cancel-in-progress: false

jobs:
  launch-existing-kaggle:
    if: >-
      github.repository == 'Heraklines/elite-redux'
      && github.event_name == 'workflow_dispatch'
      && inputs.reuse_existing_dataset
      && !inputs.diagnose_existing_kernel
    name: Launch GPU from ready private dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Kaggle client
        run: python -m pip install kaggle==1.8.4
      - name: Build private Kaggle kernel manifest
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: >-
          python scripts/ai/build_private_kaggle_manifests.py
          "$RUNNER_TEMP"
          "$KAGGLE_USERNAME"
      - name: Verify existing private dataset matches checked-out trainer
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          dataset_slug="$KAGGLE_USERNAME/er-ai-production-v4-human-20260803"
          verify_dir="$RUNNER_TEMP/kaggle-dataset-verification"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          kaggle datasets download "$dataset_slug" \
            --path "$verify_dir" \
            --force --quiet --unzip
          python scripts/ai/verify_kaggle_training_bundle.py \
            "$verify_dir/er-ai-training-bundle.zip" \
            "$GITHUB_WORKSPACE"
      - name: Launch private GPU kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          dataset_slug="$KAGGLE_USERNAME/er-ai-production-v4-human-20260803"
          dataset_status=$(kaggle datasets status "$dataset_slug" 2>/dev/null | tail -n 1 || true)
          if [[ "$dataset_status" != "ready" ]]; then
            echo "::error::Existing private Kaggle dataset is not ready (status: ${dataset_status:-unavailable})"
            exit 1
          fi
          kaggle kernels push --path "$RUNNER_TEMP/ai-kaggle-kernel"

  diagnose-existing-kaggle:
    if: >-
      github.repository == 'Heraklines/elite-redux'
      && github.event_name == 'workflow_dispatch'
      && inputs.diagnose_existing_kernel
    name: Inspect private Kaggle training failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Kaggle client
        run: python -m pip install kaggle==1.8.4
      - name: Inspect status and sanitized output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          kernel_slug="$KAGGLE_USERNAME/er-ai-production-v4-human-baseline-gpu-20260803"
          python - <<'PY'
          import json
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()
          status = api.kernels_status(
              f"{os.environ['KAGGLE_USERNAME']}/er-ai-production-v4-human-baseline-gpu-20260803"
          )
          print(json.dumps({"status": str(status.status), "failureMessage": status.failure_message or None}))
          PY
          mkdir -p "$RUNNER_TEMP/kaggle-output"
          kaggle kernels output "$kernel_slug" --path "$RUNNER_TEMP/kaggle-output" --force || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "kaggle-output"
          files = sorted(path for path in root.rglob("*") if path.is_file())
          print(json.dumps({
              "outputFiles": [
                  {"path": path.relative_to(root).as_posix(), "bytes": path.stat().st_size}
                  for path in files
              ]
          }))
          for path in files:
              if path.name == "failure.json":
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  print(json.dumps({"failure": payload}, indent=2))
              elif path.suffix == ".log":
                  lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  print(json.dumps({"kernelLogTail": lines[-240:]}, indent=2))
          PY

  prepare:
    if: >-
      github.repository == 'Heraklines/elite-redux'
      && !inputs.diagnose_existing_kernel
      && !inputs.reuse_existing_dataset
      && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v4-train]'))
    name: Prepare private v4 GPU run and fresh winner tree
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/baselines/requirements.txt
      - name: Install pinned research clients
        run: >-
          python -m pip install
          --requirement ml/baselines/requirements.txt
          kaggle==1.8.4
      - name: Stream production v4 telemetry into ephemeral runner storage
        env:
          TELEMETRY_EXPORT_TOKEN: ${{ secrets.ER_AI_TELEMETRY_EXPORT_TOKEN }}
          TELEMETRY_EXPORT_URL: https://er-ai-telemetry-export.heraklines.workers.dev/v1/export
        run: >-
          node scripts/ai/download-production-combat-telemetry-export.mjs
          --contract-version 4
          --max-invalid-objects 100
          --out "$RUNNER_TEMP/production-v4-telemetry"
      - name: Resolve exact production training build
        env:
          REQUESTED_BUILD_SHA: ${{ inputs.target_build_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$REQUESTED_BUILD_SHA"
          if [[ -z "$target" ]]; then
            target=$(curl --fail --silent --show-error https://elite-redux.pages.dev/version.json | jq -er '.identity.sha')
          fi
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid production training build SHA: $target"
            exit 1
          fi
          echo "PRODUCTION_TRAINING_BUILD_SHA=$target" >> "$GITHUB_ENV"
          echo "Training exact production build: $target"
      - name: Materialize one identity-bound training cut
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/ai/select-largest-contract-identity.mjs \
            "$RUNNER_TEMP/production-v4-telemetry/contract-records.jsonl" \
            "$RUNNER_TEMP/production-v4-selected.jsonl" \
            "$RUNNER_TEMP/production-v4-identity-report.json" \
            --build-sha "$PRODUCTION_TRAINING_BUILD_SHA"
          node scripts/ai/materialize-human-contract-training.mjs \
            "$RUNNER_TEMP/production-v4-selected.jsonl" \
            "$RUNNER_TEMP/production-v4-training"
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "production-v4-training" / "report.json").read_text(encoding="utf-8"))
          hashes = report.get("dictionaryHashes")
          if not isinstance(hashes, list) or len(hashes) != 1:
              raise SystemExit(f"training cut must name one dictionary hash, got {hashes!r}")
          expected = hashes[0]
          key = urllib.parse.quote(f"dictionaries/{expected}.json", safe="")
          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{os.environ['CLOUDFLARE_ACCOUNT_ID']}/r2/buckets/er-telemetry/objects/{key}"
          )
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"},
              method="GET",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"production dictionary hash mismatch: expected {expected}, got {actual}")
          (temp / "er-combat-data-dictionary.json").write_bytes(payload)
          PY
          node scripts/ai/build-runtime-item-dictionary-supplement.mjs \
            "$RUNNER_TEMP/er-combat-data-dictionary.json" \
            "$RUNNER_TEMP/production-v4-training/runtime-item-dictionary-supplement.json"
      - name: Seal baseline-profile Kaggle bundle
        if: ${{ !inputs.cpu_tree_only }}
        run: >-
          node scripts/ai/prepare-kaggle-candidate-training.mjs
          "$RUNNER_TEMP/production-v4-training"
          "$RUNNER_TEMP/er-combat-data-dictionary.json"
          "$RUNNER_TEMP/ai-kaggle-dataset/er-ai-training-bundle.zip"
          baseline 20260803
      - name: Preserve sanitized census before model fitting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-census
          cp "$RUNNER_TEMP/production-v4-telemetry/report.json" ai-census/import-report.json
          cp "$RUNNER_TEMP/production-v4-training/report.json" ai-census/materialized-report.json
          cp "$RUNNER_TEMP/production-v4-identity-report.json" ai-census/identity-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-production-v4-remote-census
          path: ai-census
          retention-days: 30
          if-no-files-found: error
      - name: Build private Kaggle manifests
        if: ${{ !inputs.cpu_tree_only }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: >-
          python scripts/ai/build_private_kaggle_manifests.py
          "$RUNNER_TEMP"
          "$KAGGLE_USERNAME"
      - name: Publish private dataset and launch private GPU kernel
        if: ${{ !inputs.cpu_tree_only }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          REUSE_EXISTING_DATASET: ${{ inputs.reuse_existing_dataset || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_KEY"
          dataset_slug="$KAGGLE_USERNAME/er-ai-production-v4-human-20260803"
          kernel_slug="$KAGGLE_USERNAME/er-ai-production-v4-human-baseline-gpu-20260803"
          dataset_status=$(kaggle datasets status "$dataset_slug" 2>/dev/null | tail -n 1 || true)
          if [[ "$REUSE_EXISTING_DATASET" == "true" ]]; then
            test -n "$dataset_status"
            echo "Reusing existing private Kaggle dataset with status: $dataset_status"
          elif [[ -n "$dataset_status" ]]; then
            kaggle datasets version \
              --path "$RUNNER_TEMP/ai-kaggle-dataset" \
              --message "production v4 cut from $GITHUB_SHA"
          else
            kaggle datasets create --path "$RUNNER_TEMP/ai-kaggle-dataset"
          fi
          for attempt in $(seq 1 360); do
            dataset_status=$(kaggle datasets status "$dataset_slug" 2>/dev/null | tail -n 1 || true)
            [[ "$dataset_status" == "ready" ]] && break
            if [[ "$dataset_status" == "error" || "$dataset_status" == "failed" ]]; then
              echo "::error::Private Kaggle dataset entered terminal status: $dataset_status"
              exit 1
            fi
            if (( attempt == 1 || attempt % 30 == 0 )); then
              echo "Private Kaggle dataset status after $((attempt * 10))s: ${dataset_status:-unavailable}"
            fi
            sleep 10
          done
          if [[ "$dataset_status" != "ready" ]]; then
            echo "::error::Private Kaggle dataset did not become ready within 60 minutes (status: ${dataset_status:-unavailable})"
            exit 1
          fi
          verify_dir="$RUNNER_TEMP/kaggle-dataset-verification"
          bundle_verified=false
          for attempt in $(seq 1 30); do
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            if kaggle datasets download "$dataset_slug" \
              --path "$verify_dir" \
              --force --quiet --unzip \
              && python scripts/ai/verify_kaggle_training_bundle.py \
                "$verify_dir/er-ai-training-bundle.zip" \
                "$GITHUB_WORKSPACE"; then
              bundle_verified=true
              break
            fi
            echo "Private Kaggle dataset has not exposed the uploaded source hashes after $((attempt * 20))s"
            sleep 20
          done
          if [[ "$bundle_verified" != "true" ]]; then
            echo "::error::Private Kaggle dataset did not converge to the uploaded trainer sources"
            exit 1
          fi
          if [[ "$REUSE_EXISTING_DATASET" != "true" ]]; then
            kaggle kernels push --path "$RUNNER_TEMP/ai-kaggle-kernel"
          fi
          {
            echo "### Private production-v4 GPU training"
            echo "- Dataset: \`$dataset_slug\` (private)"
            echo "- Kernel: \`$kernel_slug\` (private GPU)"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Production data build: \`$PRODUCTION_TRAINING_BUILD_SHA\`"
            echo "- Policy labels: victorious human battles only"
            echo "- Value labels: all completed battle wins and defeats"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Train fresh battle-victory tree on the same remote cut
        env:
          TRAINER_TREE: ${{ inputs.trainer_tree || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          battle_type_args=()
          if [[ "$TRAINER_TREE" == "true" ]]; then
            battle_type_args+=(--battle-type 1)
          fi
          python ml/baselines/train_candidate_baselines.py \
            --data "$RUNNER_TEMP/production-v4-training" \
            --dictionary "$RUNNER_TEMP/er-combat-data-dictionary.json" \
            --dictionary-supplement "$RUNNER_TEMP/production-v4-training/runtime-item-dictionary-supplement.json" \
            --winner-only-policy \
            --winner-scope battle \
            --max-policy-decisions 4000 \
            "${battle_type_args[@]}" \
            --report-json "$RUNNER_TEMP/ai-tree/leaderboard.json" \
            --report-md "$RUNNER_TEMP/ai-tree/leaderboard.md" \
            --models-dir "$RUNNER_TEMP/ai-tree/models"
      - name: Publish only sanitized reports and selected tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-report/tree ai-report/census
          cp "$RUNNER_TEMP/production-v4-telemetry/report.json" ai-report/census/import-report.json
          cp "$RUNNER_TEMP/production-v4-training/report.json" ai-report/census/materialized-report.json
          cp "$RUNNER_TEMP/production-v4-identity-report.json" ai-report/census/identity-selection.json
          cp "$RUNNER_TEMP/ai-tree/leaderboard.json" ai-report/tree/
          cp "$RUNNER_TEMP/ai-tree/leaderboard.md" ai-report/tree/
          cp "$RUNNER_TEMP/ai-tree/models/selected-model.json" ai-report/tree/
          cat "$RUNNER_TEMP/ai-tree/leaderboard.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-production-v4-remote-training-report
          path: ai-report
          retention-days: 30
          if-no-files-found: error
