name: Refresh PKRM Community Editor

on:
  push:
    branches:
      - feat/elite-redux-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkrm-community-editor-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Heraklines/elite-redux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out current Elite Redux source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'feat/elite-redux-port' }}

      - name: Record source revision
        run: echo "EDITOR_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-deps

      - name: Generate editor catalogs
        run: |
          node scripts/gen-editor-data.mjs
          node scripts/elite-redux/build-community-suggestion-achievements.mjs

      - name: Generate initialized runtime catalogs
        env:
          ER_SCENARIO: "1"
        run: pnpm exec vitest run test/tests/elite-redux/tools/dump-editor-data.test.ts

      - name: Generate Pokedex catalogs
        env:
          GEN_EDITOR_DATA: "1"
        run: pnpm exec vitest run scripts/gen-editor-data/gen-pokedex-data.test.ts

      - name: Build clean community editor directory
        run: |
          rm -rf community-editor/_deploy
          mkdir -p community-editor/_deploy/data
          cp editor/index.html editor/app.js editor/community-mode.js editor/suggestions.js community-editor/_deploy/
          sed -i 's#<body>#<body><script>window.ER_EDITOR_MODE = "community";</script>#' community-editor/_deploy/index.html
          cp editor/data/*.json community-editor/_deploy/data/
          printf '{"sourceSha":"%s"}\n' "$EDITOR_SOURCE_SHA" > community-editor/_deploy/version.json
          cat > community-editor/_deploy/_headers <<'EOF'
          /*
            Cache-Control: public, max-age=0, must-revalidate
          /data/*
            Cache-Control: public, max-age=0, must-revalidate
          /version.json
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - name: Validate community editor bundle
        run: |
          node --check community-editor/_deploy/app.js
          node --check community-editor/_deploy/community-mode.js
          node --check community-editor/_deploy/suggestions.js
          node scripts/validate-editor-data.mjs community-editor/_deploy/data

      - name: Deploy PKRM Community Editor to Cloudflare Pages
        run: >-
          npx wrangler pages deploy community-editor/_deploy
          --project-name=pkrm-community-editor
          --branch=main
          --commit-hash="$EDITOR_SOURCE_SHA"
          --commit-dirty=true
