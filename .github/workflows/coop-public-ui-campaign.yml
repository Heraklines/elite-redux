name: Co-op Public UI Campaign

on:
  workflow_dispatch:
    inputs:
      campaign_waves:
        description: Co-op wave depth for the animations-skipped public-UI profile (four fits one hosted-runner budget)
        required: true
        type: string
        default: "4"
      surface_waves:
        description: Complete real-animation waves (two covers both reward-owner directions)
        required: false
        type: string
        default: "2"
      campaign_profile:
        description: Run every browser campaign profile, or isolate one profile for fast diagnosis
        required: true
        type: choice
        default: all
        options:
          - all
          - surface
          - depth
          - mystery
          - dirty
      mystery_waves:
        description: Mystery-gauntlet wave depth (10 is the milestone path; lower values are feedback-only)
        required: false
        type: string
        default: "10"
      cadence:
        description: Human input cadence (fast maximizes causal wave coverage inside the CI budget)
        required: true
        type: choice
        default: fast
        options:
          - fast
          - normal
          - slow
      reward_mode:
        description: Reward shop policy each wave (owner leaves, or takes the best visible survival option)
        required: true
        type: choice
        default: pick-first
        options:
          - leave
          - pick-first
      auto_first:
        description: Press through any UNKNOWN interactive surface (logs [auto-first] <phase>) instead of failing loudly
        required: true
        type: boolean
        default: false
      raise_speed:
        description: Drive Game Speed through the real Settings UI early in the run
        required: true
        type: boolean
        default: true
      game_speed:
        description: In-game speed to attest (benchmark 5/7/10 under SwiftShader; normal default is 10)
        required: true
        type: choice
        default: "10"
        options:
          - "5"
          - "7"
          - "10"
      speed_keys:
        description: Override Settings key sequence; blank uses the built-in 10x path, "[]" leaves speed unchanged
        required: false
        type: string
        default: ""
      requester_seat:
        description: Seat that sends the first lobby invitation
        required: true
        type: choice
        default: guest-seat
        options:
          - guest-seat
          - host-seat
  push:
    # Narrowly scoped to this campaign branch so pushes run a cheap live smoke
    # (4 waves, the measured single-runner capacity) without needing the workflow on the default branch. LOUD-FAIL: a push
    # run never auto-firsts - an unknown/undriven surface fails the run so a missing
    # driver surfaces immediately instead of being pressed through silently.
    branches:
      - "ci/coop/p33-campaign-30w"
  schedule:
    # Nightly full campaign soak.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  # Different explicitly selected profiles may qualify in parallel on separate hosted machines.
  # Repeated runs of the same profile/ref remain serialized so they cannot contend for one diagnosis line.
  group: coop-public-ui-campaign-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.campaign_profile) || github.event_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.game_speed) || '10' }}
  cancel-in-progress: false

env:
  COOP_BROWSER_ENTRY_CONTRACT: public-ui-v1
  # Isolated P33 staging workers (deployed from the integration tip, same COOP_IDENTITY_SECRET
  # so the save-API-minted identity tickets validate on the signal worker). Both hardcoded so a
  # stale repo var cannot split the ticket-issuer from the signal origin.
  COOP_UI_SIGNAL_ORIGIN: https://er-coop-api-staging.heraklines.workers.dev
  COOP_UI_API_ORIGIN: https://er-save-api-staging.heraklines.workers.dev

jobs:
  staging-health:
    name: Staging health precheck (skip gameplay if the workers are down)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    steps:
      - name: Probe the signal + save workers
        id: check
        shell: bash
        run: |
          set +e
          SIG=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$COOP_UI_SIGNAL_ORIGIN/coop/health")
          API=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$COOP_UI_API_ORIGIN/account/info")
          set -e
          echo "signal $COOP_UI_SIGNAL_ORIGIN/coop/health -> $SIG"
          echo "save   $COOP_UI_API_ORIGIN/account/info -> $API"
          # Signal must be 200; save must answer at all and not 404/5xx (401/400 = up + auth-gated).
          if [ "$SIG" = "200" ] && [ -n "$API" ] && [ "$API" != "000" ] && [ "$API" != "404" ] && [ "$API" -lt 500 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "Staging is healthy; gameplay jobs will run."
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging unhealthy::signal=$SIG save=$API - skipping build + gameplay (no doomed run)."
          fi

  browser-build:
    name: Build and seal exact-SHA browser bundle once
    needs: staging-health
    if: needs.staging-health.outputs.healthy == 'true'
    runs-on: ${{ vars.COOP_UI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: recursive

      - uses: ./.github/actions/setup-deps

      - name: Resolve exact production asset SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(gh api repos/Heraklines/er-assets/commits/main --jq .sha)"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Invalid er-assets SHA: $SHA"; exit 1; }
          echo "COOP_BROWSER_ASSET_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Sealing er-assets pin $SHA into the public-UI bundle"

      - name: Run owned-file format gate for the campaign additions
        shell: bash
        run: |
          pnpm exec biome check --diagnostic-level=error --max-diagnostics=none \
            .github/workflows/coop-public-ui-campaign.yml \
            scripts/coop-browser-entry.ts \
            scripts/prepare-coop-browser-artifact.mjs \
            src/phases/party-heal-phase.ts \
            test/browser/coop-public-ui/browser-artifact-prune.test.mjs \
            test/browser/coop-public-ui/browser-workflow-fanout.test.mjs \
            test/browser/coop-public-ui/campaign-lifecycle.mjs \
            test/browser/coop-public-ui/campaign-lifecycle.test.mjs \
            test/browser/coop-public-ui/campaign-nav.mjs \
            test/browser/coop-public-ui/campaign-policy.mjs \
            test/browser/coop-public-ui/campaign.mjs \
            test/browser/coop-public-ui/campaign-exp-phase.test.mjs \
            test/browser/coop-public-ui/campaign-render-profile.test.mjs \
            test/browser/coop-public-ui/checkpoint-pixel-profile.test.mjs \
            test/browser/coop-public-ui/mystery-gauntlet-campaign.test.mjs \
            test/browser/coop-public-ui/solo-classic.mjs \
            test/browser/coop-public-ui/run-campaign.mjs \
            test/browser/coop-public-ui/check-campaign-boundary.mjs \
            test/browser/coop-public-ui/environment-seal.mjs \
            test/browser/coop-public-ui/evidence.mjs \
            test/browser/coop-public-ui/faint-replacement-evidence.test.mjs \
            test/browser/coop-public-ui/preview-server.mjs \
            test/browser/coop-public-ui/preview-server.test.mjs \
            test/browser/coop-public-ui/public-ui-harness.mjs \
            test/browser/coop-public-ui/public-ui-post-turn-budget.test.mjs \
            test/browser/coop-public-ui/semantic-surface-evidence.test.mjs \
            test/browser/coop-public-ui/wave-progression-presentation-evidence.test.mjs

      - name: Enforce public-driver boundary (original harness files)
        run: node test/browser/coop-public-ui/check-public-boundary.mjs

      - name: Enforce public-driver boundary (new campaign files)
        run: node test/browser/coop-public-ui/check-campaign-boundary.mjs

      - name: Verify campaign wait and rendering-profile contracts
        run: >-
          node --test
          test/browser/coop-public-ui/browser-artifact-prune.test.mjs
          test/browser/coop-public-ui/browser-workflow-fanout.test.mjs
          test/browser/coop-public-ui/campaign-lifecycle.test.mjs
          test/browser/coop-public-ui/campaign-exp-phase.test.mjs
          test/browser/coop-public-ui/campaign-render-profile.test.mjs
          test/browser/coop-public-ui/checkpoint-pixel-profile.test.mjs
          test/browser/coop-public-ui/faint-replacement-evidence.test.mjs
          test/browser/coop-public-ui/mystery-gauntlet-campaign.test.mjs
          test/browser/coop-public-ui/preview-server.test.mjs
          test/browser/coop-public-ui/public-ui-post-turn-budget.test.mjs
          test/browser/coop-public-ui/semantic-surface-evidence.test.mjs
          test/browser/coop-public-ui/wave-progression-presentation-evidence.test.mjs

      # Cache the built bundle keyed on the GAME-SOURCE inputs only (src/public/lockfile/
      # entry/sealer/vite-config/workflow-env) - NOT the harness driver. A harness-only push
      # therefore reuses the identical-source bundle and skips the ~build. The seal step below
      # ALWAYS re-runs, re-stamping the manifest with the current commit SHA + recomputing the
      # digest from the (identical) source, so the exact-SHA seal semantics are preserved and a
      # bad reuse fails loudly at the gameplay job's manifest verification.
      - name: Restore source-keyed browser bundle
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: dist-coop-public-ui
          key: >-
            coop-ui-bundle-v1-${{ hashFiles('src/**', 'public/**', 'pnpm-lock.yaml',
            'scripts/coop-browser-entry.ts', 'scripts/prepare-coop-browser-artifact.mjs',
            'test/browser/coop-public-ui/vite.config.mjs', '.github/workflows/coop-public-ui-campaign.yml') }}

      - name: Build normal application with CI-only read-only observer
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        env:
          COOP_BROWSER_OUT_DIR: dist-coop-public-ui
          VITE_BYPASS_LOGIN: 0
          VITE_BYPASS_TUTORIAL: 0
          # Staging/dev exposes the fifth Mystery difficulty. This exact immutable bundle therefore
          # exercises the same dev-gated picker and gauntlet schedule testers use on staging.
          VITE_DEV_TOOLS: 1
          # The exact campaign bundle accepts URL-gated visible starter fixtures. Mystery uses the
          # level-100 survival roster and clean depth uses the normal-level point-legal roster;
          # surface and dirty-account profiles keep ordinary account-owned starter state.
          VITE_COOP_BROWSER_FIXTURE: campaign-survival
          VITE_COOP_LOBBY_ROOM_QUERY: 1
          # The production-fidelity campaign must exercise the architecture being promoted, not silently
          # fall back to legacy because browser bundles cannot read Node's COOP_AUTHORITY_V2_TURN variable.
          VITE_COOP_AUTHORITY_V2_TURN: "on"
          VITE_COOP_AUTHORITY_V2_REPLACEMENT: "on"
          VITE_COOP_AUTHORITY_V2_WAVE: "on"
          VITE_COOP_AUTHORITY_V2_INTERACTION: "on"
          VITE_COOP_AUTHORITY_V2_RECOVERY: "on"
          VITE_COOP_SERVER_URL: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          VITE_COOP_SIGNALING_PROTOCOL: p33
          VITE_SERVER_URL: ${{ env.COOP_UI_API_ORIGIN }}
        run: pnpm exec vite build --mode beta --config test/browser/coop-public-ui/vite.config.mjs

      - name: Seal immutable execution input (always, re-stamps the current commit SHA)
        env:
          COOP_BROWSER_DIST: dist-coop-public-ui
          COOP_BROWSER_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          VITE_COOP_SERVER_URL: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
        run: |
          rm -f dist-coop-public-ui/coop-browser-artifact.json
          node scripts/prepare-coop-browser-artifact.mjs
          echo "bundle-source-cache-hit=${{ steps.bundle-cache.outputs.cache-hit == 'true' }}"

      - name: Publish exact bundle for the isolated campaign runner
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-campaign-bundle-${{ github.sha }}
          path: dist-coop-public-ui/**
          include-hidden-files: true
          compression-level: 9
          retention-days: 1
          if-no-files-found: error

  solo-nav:
    name: Solo classic navigation-primitive validation (no pairing)
    needs: browser-build
    runs-on: ${{ vars.COOP_UI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation SHA (harness only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/setup-deps

      - name: Download the once-built exact-SHA bundle
        uses: actions/download-artifact@v4
        with:
          name: coop-public-ui-campaign-bundle-${{ github.sha }}
          path: dist-coop-public-ui

      - name: Install isolated Chrome runtime
        run: pnpm exec puppeteer browsers install chrome

      - name: Prepare an isolated account pair for visible registration
        run: node test/browser/coop-public-ui/provision-accounts.mjs

      - name: Drive a solo classic run to validate selectOptionById against the v2 mirror
        env:
          COOP_UI_BASE_URL: http://127.0.0.1:4175/?coopdebug=1
          COOP_UI_BROWSER_DIST: dist-coop-public-ui
          COOP_UI_ASSET_DIR: .coop-no-local-asset-fallback
          COOP_UI_EXPECTED_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          COOP_UI_EXPECTED_SIGNAL_ORIGIN: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          COOP_UI_ACCOUNT_MODE: register
          COOP_UI_ACTION_DELAY_MS: 70
          COOP_UI_SETTLE_DELAY_MS: 300
          NODE_OPTIONS: --max-old-space-size=4096
        run: node test/browser/coop-public-ui/run-solo.mjs

      - name: Upload solo navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-solo-${{ github.sha }}-${{ github.run_attempt }}
          path: dev-logs/coop-public-ui/**
          retention-days: 14
          if-no-files-found: warn

  campaign-plan:
    name: Select concrete campaign profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the requested profile matrix
        id: matrix
        env:
          SELECTED_PROFILE: ${{ inputs.campaign_profile || 'all' }}
          DEPTH_WAVES: ${{ inputs.campaign_waves || '4' }}
          SURFACE_WAVES: ${{ inputs.surface_waves || '2' }}
          MYSTERY_WAVES: ${{ inputs.mystery_waves || '10' }}
          DEPTH_REWARD_MODE: ${{ inputs.reward_mode || 'pick-first' }}
        shell: bash
        run: |
          profiles="$(jq -cn \
            --arg depthWaves "$DEPTH_WAVES" \
            --arg surfaceWaves "$SURFACE_WAVES" \
            --arg mysteryWaves "$MYSTERY_WAVES" \
            --arg depthRewardMode "$DEPTH_REWARD_MODE" \
            '[
              {
                profile: "animations-on-surface", artifact: "surface", waves: $surfaceWaves,
                difficulty: "ace", difficulty_option: "ace", require_mystery: "0",
                proxy_assets: "0",
                reward_mode: "leave", campaign_timeout_ms: "3120000",
                process_timeout: "55m", job_timeout_minutes: 65
              },
              {
                profile: "animations-skipped-depth", artifact: "depth", waves: $depthWaves,
                difficulty: "youngster", difficulty_option: "youngster", require_mystery: "0",
                proxy_assets: "1",
                reward_mode: $depthRewardMode,
                campaign_timeout_ms: (if ($depthWaves | tonumber) > 4 then "4800000" else "2700000" end),
                process_timeout: (if ($depthWaves | tonumber) > 4 then "83m" else "48m" end),
                job_timeout_minutes: (if ($depthWaves | tonumber) > 4 then 90 else 55 end)
              },
              {
                profile: "mystery-gauntlet", artifact: "mystery", waves: $mysteryWaves,
                difficulty: "mystery", difficulty_option: "mystery", require_mystery: "1",
                proxy_assets: "1",
                reward_mode: "pick-first", campaign_timeout_ms: "4800000",
                process_timeout: "83m", job_timeout_minutes: 90
              },
              {
                profile: "animations-skipped-depth", artifact: "dirty", waves: "3",
                difficulty: "ace", difficulty_option: "ace", require_mystery: "0",
                proxy_assets: "1", dirty_accounts: "1", reward_mode: "leave", campaign_timeout_ms: "2700000",
                process_timeout: "48m", job_timeout_minutes: 55
              }
            ]')"
          if [[ "$SELECTED_PROFILE" != "all" ]]; then
            profiles="$(jq -c --arg selected "$SELECTED_PROFILE" '[.[] | select(.artifact == $selected)]' <<<"$profiles")"
          fi
          if [[ "$(jq 'length' <<<"$profiles")" -eq 0 ]]; then
            echo "Unknown campaign profile: $SELECTED_PROFILE" >&2
            exit 1
          fi
          echo "matrix=$(jq -cn --argjson include "$profiles" '{include: $include}')" >> "$GITHUB_OUTPUT"

  campaign:
    name: ${{ matrix.waves }}-wave co-op / ${{ matrix.profile }} / ${{ inputs.cadence || 'fast' }}
    needs:
      - browser-build
      - campaign-plan
    runs-on: ${{ vars.COOP_UI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.campaign-plan.outputs.matrix) }}
    steps:
      - name: Check out exact implementation SHA (harness only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/setup-deps

      - name: Download the once-built exact-SHA bundle
        uses: actions/download-artifact@v4
        with:
          name: coop-public-ui-campaign-bundle-${{ github.sha }}
          path: dist-coop-public-ui

      # ENVIRONMENT SEAL / attestation (P33 audit #920): record the EXACT versions under test so
      # this run's artifacts are reproducible evidence. Runs early (post-checkout, post-bundle) so
      # the four facts are captured around the decisive run:
      #   - app_sha:  git rev-parse HEAD (the integrated commit this job checked out)
      #   - assets_sha:  the Heraklines/er-assets pin the build sealed into coop-browser-artifact.json
      #   - er_save_api_version / er_coop_api_version:  the DEPLOYED staging worker versions serving
      #     the run, read from the Cloudflare API using the SAME CLOUDFLARE_API_TOKEN +
      #     CLOUDFLARE_ACCOUNT_ID secrets the deploy workflows use; falls back to an HTTP probe (the
      #     workers expose no /version route) and flags degraded provenance when auth is unavailable.
      # The seal lands at dev-logs/coop-public-ui/environment-seal.json so it rides the evidence
      # artifacts uploaded below, and is echoed to the job log with a [env-seal] prefix.
      - name: Seal exact environment under test (attestation)
        env:
          COOP_BROWSER_DIST: dist-coop-public-ui
          COOP_SEAL_OUT_DIR: dev-logs/coop-public-ui
          COOP_SEAL_SAVE_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          COOP_SEAL_COOP_ORIGIN: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          COOP_SEAL_SAVE_WORKER: er-save-api-staging
          COOP_SEAL_COOP_WORKER: er-coop-api-staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node test/browser/coop-public-ui/environment-seal.mjs

      - name: Install isolated Chrome runtime
        run: pnpm exec puppeteer browsers install chrome

      - name: Prepare an isolated account pair for visible registration
        run: node test/browser/coop-public-ui/provision-accounts.mjs

      # Account-state fidelity: registers a FRESH pair via the API, seeds both accounts full
      # (4 solo saves + 1 divergent slot-4 remnant), and switches the run to visible LOGIN. The
      # browser login is deliberately the LAST login so its clientSessionId is the active one
      # (a later node-side login would invalidate the browser session - "session out of date").
      - name: Seed dirty account state (account-state fidelity lane)
        if: matrix.dirty_accounts == '1'
        run: node test/browser/coop-public-ui/account-seeder.mjs --api-origin "$COOP_UI_API_ORIGIN" --emit-env >> "$GITHUB_ENV"

      - name: Drive two isolated built clients through the ${{ matrix.profile }} campaign
        env:
          # `run-campaign.mjs` shares the public-UI config with the shorter journeys. Keep its
          # runtime identity explicit: without this, config silently defaults to `probe`, making
          # campaign-only fixture/proof branches unreachable while summary.json still says campaign.
          COOP_UI_JOURNEY: campaign
          COOP_UI_BASE_URL: http://127.0.0.1:4175/?coopdebug=1
          COOP_UI_BROWSER_DIST: dist-coop-public-ui
          COOP_UI_ASSET_DIR: .coop-no-local-asset-fallback
          # Depth/Mystery/dirty still fetch the exact sealed jsDelivr SHA, but both seats share one
          # bounded preview cache. The animation-surface oracle stays on the direct production 302 path.
          COOP_UI_PROXY_PRODUCTION_ASSETS: ${{ matrix.proxy_assets }}
          COOP_UI_EXPECTED_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          COOP_UI_EXPECTED_SIGNAL_ORIGIN: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          COOP_UI_ACCOUNT_MODE: ${{ matrix.dirty_accounts == '1' && 'login' || 'register' }}
          COOP_UI_EXPECT_RECLAIM: ${{ matrix.dirty_accounts == '1' && '1' || '0' }}
          COOP_UI_LOBBY_ROOM: campaign-${{ github.run_id }}-${{ matrix.artifact }}-${{ github.run_attempt }}
          # The surface lane keeps real move animations on for a short breadth proof. The depth lane
          # visibly selects Move Animations OFF and spends its runner budget on more waves instead.
          COOP_UI_CAMPAIGN_WAVES: ${{ matrix.waves }}
          COOP_UI_RENDER_PROFILE: ${{ matrix.profile }}
          COOP_UI_DIFFICULTY_ID: ${{ matrix.difficulty }}
          COOP_UI_DIFFICULTY_OPTION_ID: ${{ matrix.difficulty_option }}
          COOP_UI_REQUIRE_MYSTERY_GAUNTLET: ${{ matrix.require_mystery }}
          COOP_UI_MYSTERY_MIN_SURFACES: "6"
          # This is the whole lifecycle budget (preview boot + pairing + all waves), not a
          # refreshable or per-wave wait. It expires early enough to preserve failure evidence.
          COOP_UI_CAMPAIGN_HARD_TIMEOUT_MS: ${{ matrix.campaign_timeout_ms }}
          # Setup through the first shared command must fit the fast-lane contract. A renderer that
          # takes longer is runner starvation, not useful wave coverage, and fails with a causal marker.
          # Two fresh registrations + onboarding + Settings + consent lobby + starter setup use
          # the public path and reached pairing after 10-11m under full runner fan-out. Preserve a
          # hard causal bound without turning healthy progress into a deterministic setup false red.
          COOP_UI_SETUP_HARD_TIMEOUT_MS: "1200000"
          COOP_UI_DIAGNOSTIC_TIMEOUT_MS: "20000"
          COOP_UI_CLEANUP_TIMEOUT_MS: "60000"
          # Loud-fail everywhere by default. `shakedown` (the ONLY mode that permits press-through of
          # an unknown surface) is now reachable ONLY by an explicit dispatch with auto_first=true - a
          # deliberate ordering test. push = loud-fail smoke, schedule = nightly, dispatch = gating.
          COOP_UI_CAMPAIGN_MODE: ${{ (github.event_name == 'schedule' && 'nightly') || (inputs.auto_first && 'shakedown') || 'gating' }}
          COOP_UI_REWARD_MODE: ${{ matrix.reward_mode }}
          # auto-first is NEVER a default (not on push, not on nightly). Explicit opt-in only.
          COOP_UI_AUTO_FIRST: ${{ (inputs.auto_first && '1') || '0' }}
          # Default ON for push/schedule; only an explicit dispatch raise_speed=false turns it off.
          # (A bare `inputs.raise_speed == false` is TRUE on push, where inputs is null -> would wrongly skip.)
          COOP_UI_RAISE_SPEED: ${{ (github.event_name != 'workflow_dispatch' || inputs.raise_speed) && '1' || '0' }}
          # Blank -> the driver's observation-gated Settings walk to COOP_UI_GAME_SPEED.
          COOP_UI_SPEED_KEYS: ${{ inputs.speed_keys }}
          COOP_UI_GAME_SPEED: ${{ inputs.game_speed || '10' }}
          COOP_UI_REQUESTER_SEAT: ${{ inputs.requester_seat || 'guest-seat' }}
          COOP_UI_ACTION_DELAY_MS: ${{ (inputs.cadence == 'slow' && '420') || (inputs.cadence == 'normal' && '180') || '70' }}
          COOP_UI_SETTLE_DELAY_MS: ${{ (inputs.cadence == 'slow' && '1300') || (inputs.cadence == 'normal' && '750') || '300' }}
          # CPU headroom for two 10x co-op engines on one shared runner: skip the Chrome devtools
          # performance trace (records both browsers for the whole run). The mandatory JSONL evidence
          # + the per-press latency instrumentation are unaffected; only the heavy combined-trace
          # artifact is dropped. Solo-nav keeps it on (one browser, no starvation).
          COOP_UI_CHROME_TRACE: "0"
          # Gold paired screenshots use a visible Chromium compositor under a virtual display.
          # Headless WebGL can return a mostly black inactive process even after foregrounding.
          COOP_UI_HEADLESS: "0"
          COOP_UI_VIEWPORT_WIDTH: "1440"
          COOP_UI_VIEWPORT_HEIGHT: "900"
          # Optimization brief R5: persistent per-seat Chromium profiles (disk-backed HTTP
          # cache survives page replacement; storage sanitized at rig start, cache kept).
          COOP_UI_SEAT_PROFILE_DIR: ${{ runner.temp }}/coop-seat-profiles
          NODE_OPTIONS: --max-old-space-size=4096
        # GNU timeout is the non-cooperative process-group backstop. The Node deadline above
        # normally fails first and writes summary.json; SIGINT leaves two minutes for bounded
        # evidence cleanup before SIGKILL. The normal Node deadline preserves seven upload minutes;
        # even the forced-kill path retains four minutes before the job deadline.
        #
        # Optimization brief R1: ONE Xvfb DISPLAY PER SEAT (two players use two devices).
        # The harness detects COOP_UI_DISPLAY_HOST/GUEST and switches to per-seat input
        # queues with no cross-seat focus arbitration; each Chromium is alone on its display.
        run: |
          Xvfb :98 -screen 0 1440x900x24 > /dev/null 2>&1 &
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          for socket in /tmp/.X11-unix/X98 /tmp/.X11-unix/X99; do
            for _ in $(seq 1 50); do
              [ -S "$socket" ] && break
              sleep 0.1
            done
            [ -S "$socket" ] || { echo "Xvfb for $socket failed to start" >&2; exit 1; }
          done
          COOP_UI_DISPLAY_HOST=:98 COOP_UI_DISPLAY_GUEST=:99 \
            timeout --signal=INT --kill-after=3m ${{ matrix.process_timeout }} node \
            test/browser/coop-public-ui/run-campaign.mjs &
          campaign_pid=$!
          (
            while kill -0 "$campaign_pid" 2>/dev/null; do
              sleep 60
              kill -0 "$campaign_pid" 2>/dev/null || break
              progress_file="$(find dev-logs/coop-public-ui -type f -name campaign-progress.jsonl -print -quit 2>/dev/null || true)"
              if [ -n "$progress_file" ]; then
                printf '[coop-soak:runner-heartbeat] pid=%s latest=%s\n' "$campaign_pid" "$(tail -n 1 "$progress_file")"
              else
                printf '[coop-soak:runner-heartbeat] pid=%s latest=campaign-progress-not-created\n' "$campaign_pid"
              fi
            done
          ) &
          heartbeat_pid=$!
          set +e
          wait "$campaign_pid"
          campaign_status=$?
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          exit "$campaign_status"

      # The environment seal is small, decisive audit evidence - upload it as its own artifact
      # (always, even if the run fails/times out before the evidence uploads below) so audit #920
      # can always recover the exact versions under test.
      - name: Upload environment seal (attestation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-campaign-${{ matrix.artifact }}-environment-seal-${{ github.sha }}-${{ github.run_attempt }}
          path: dev-logs/coop-public-ui/environment-seal.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload compact campaign diagnosis first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-campaign-${{ matrix.artifact }}-compact-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dev-logs/coop-public-ui/environment-seal.json
            dev-logs/coop-public-ui/**/summary.json
            dev-logs/coop-public-ui/**/campaign-progress.jsonl
            dev-logs/coop-public-ui/**/*.jsonl
            dev-logs/coop-public-ui/**/*.png
            dev-logs/coop-public-ui/**/*.dom.json
            dev-logs/coop-public-ui/**/*.cookies.json
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Upload full campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-campaign-${{ matrix.artifact }}-${{ github.sha }}-${{ github.run_attempt }}
          path: dev-logs/coop-public-ui/**
          retention-days: 14
          if-no-files-found: warn

  campaign-required:
    name: Co-op public UI campaign required
    if: always()
    needs:
      - staging-health
      - browser-build
      - solo-nav
      - campaign
    runs-on: ubuntu-latest
    steps:
      - name: Require healthy staging and every requested browser profile
        env:
          STAGING_HEALTHY: ${{ needs.staging-health.outputs.healthy }}
          HEALTH_RESULT: ${{ needs.staging-health.result }}
          BUILD_RESULT: ${{ needs.browser-build.result }}
          SOLO_RESULT: ${{ needs.solo-nav.result }}
          CAMPAIGN_RESULT: ${{ needs.campaign.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEALTH_RESULT" = "success"
          test "$STAGING_HEALTHY" = "true"
          test "$BUILD_RESULT" = "success"
          test "$SOLO_RESULT" = "success"
          test "$CAMPAIGN_RESULT" = "success"
          echo "Campaign closure proven: healthy staging, sealed build, solo navigation, and every matrix profile passed."
