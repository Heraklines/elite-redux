name: Co-op Public UI Journey

on:
  push:
    branches:
      - "ci/coop/**"
    paths:
      - ".github/workflows/coop-public-ui-journey.yml"
      - "scripts/coop-browser-entry.ts"
      - "scripts/prepare-coop-browser-artifact.mjs"
      # The production renderer is spread across transport, stream, runtime, V2 adapters, recovery,
      # and the default-deny phase gate. A narrow file list previously let an allowlist omission skip
      # the only test that constructs the phase through a real production browser.
      - "src/data/elite-redux/coop/**"
      - "src/data/elite-redux/showdown/**"
      - "src/dev-tools/registry.ts"
      # Co-op control boundaries are distributed across ordinary gameplay phases.
      # Keep this broad so a new or migrated phase cannot bypass the two-browser
      # production journey merely because it was not added to this list yet.
      - "src/field/**"
      - "src/phase-manager.ts"
      - "src/phase.ts"
      - "src/phases/**"
      - "src/ui/**"
      - "test/browser/coop-public-ui/**"
      - "test/tests/elite-redux/coop/coop-duo-wave-operation.test.ts"
      - "test/tests/elite-redux/coop/coop-guest-renderer.test.ts"
      - "workers/er-save-api/**"
      - "workers/er-coop-api/**"
  workflow_dispatch:
    inputs:
      journey:
        description: Public player journey to drive on the primary account pair
        required: true
        type: choice
        default: fresh-resume
        options:
          - probe
          - fresh-wave2
          - fresh-resume
          - reward-pause-settings
          - same-tab-rejoin
          - reverse-resume
          - faint-replacement
          - half-wipe
          - commander-skip
          - game-over
          - registered-interactions
          - ability-capsule
          - party-mutating-rewards
          - showdown-battle
          - resume-scan-isolation
          - save-mutations
          - market-wide-lens
          - navigation-depth-30
          - evolution-sync
      requester_seat:
        description: Seat that sends the first lobby invitation
        required: true
        type: choice
        default: guest-seat
        options:
          - guest-seat
          - host-seat
      faint_owner_seat:
        description: Prepared fainted battler owner for faint-replacement
        required: true
        type: choice
        default: guest-seat
        options:
          - guest-seat
          - host-seat
      cadence:
        description: Human input cadence
        required: true
        type: choice
        default: normal
        options:
          - fast
          - normal
          - slow
      fan_out_reverse:
        description: Also run reverse-resume on the separately provisioned alternate account pair
        required: true
        type: boolean
        default: false
      chrome_trace:
        description: Diagnostic opt-in for the resource-heavy Chrome CDP performance timeline
        required: true
        type: boolean
        default: false
      host_title_keys:
        description: JSON keys before host selects New Game; use ["ArrowDown"] for an existing save
        required: true
        type: string
        default: "[]"
      guest_title_keys:
        description: JSON keys before guest selects New Game; use ["ArrowDown"] for an existing save
        required: true
        type: string
        default: "[]"
      party_reward_ids:
        description: Optional closed JSON subset for a focused party-mutating-rewards rerun
        required: false
        type: string
        default: ""
      render_profile:
        description: Presentation fidelity for manually dispatched journeys
        required: true
        type: choice
        default: animations-skipped-depth
        options:
          - animations-skipped-depth
          - animations-on-surface

permissions:
  contents: read

concurrency:
  # Presentation-fidelity qualification is independent from the fast mechanical lane. Keep each profile
  # serialized with itself, but do not make an animations-on proof wait behind an animations-skipped run.
  group: coop-public-ui-${{ github.ref }}-${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}-${{ inputs.render_profile || 'animations-skipped-depth' }}
  cancel-in-progress: false

env:
  COOP_BROWSER_ENTRY_CONTRACT: public-ui-v1
  # Ordinary journeys use the isolated P33 staging workers, hardcoded to match the campaign workflow (same
  # COOP_IDENTITY_SECRET so the save-API-minted identity tickets validate on the signal worker).
  # Previously the signal origin defaulted to the PROD worker (er-coop-api, no -staging) while the
  # save-API defaulted to staging - a stale/unset repo var split the ticket-issuer from the signal
  # origin, so the staging-minted ticket failed to validate on the prod signal worker and pairing
  # never completed (the audit's journey-run pairing failure). Both stay paired. Save mutation and
  # resume-scan isolation journeys instead seal localhost origins and run fresh in-memory real Workers.
  COOP_UI_SIGNAL_ORIGIN: ${{ (inputs.journey == 'save-mutations' || inputs.journey == 'resume-scan-isolation') && 'http://127.0.0.1:8789' || 'https://er-coop-api-staging.heraklines.workers.dev' }}
  COOP_UI_API_ORIGIN: ${{ (inputs.journey == 'save-mutations' || inputs.journey == 'resume-scan-isolation') && 'http://127.0.0.1:8788' || 'https://er-save-api-staging.heraklines.workers.dev' }}

jobs:
  browser-build:
    name: Build and seal exact-SHA browser bundle once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: recursive

      - uses: ./.github/actions/setup-deps

      - name: Resolve exact production asset SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA=""
          for attempt in 1 2 3; do
            SHA="$(gh api repos/Heraklines/er-assets/commits/main --jq .sha 2>/dev/null || true)"
            echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' && break
            echo "er-assets API lookup attempt $attempt failed; retrying exact main ref"
            sleep "$((attempt * 2))"
          done
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            SHA="$(git ls-remote https://github.com/Heraklines/er-assets.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          fi
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Invalid er-assets SHA: $SHA"; exit 1; }
          echo "COOP_BROWSER_ASSET_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Sealing er-assets pin $SHA into the public-UI bundle"

      - name: Run owned-file type and format gate externally
        shell: bash
        run: |
          set +e
          pnpm typecheck > coop-public-ui-typecheck.log 2>&1
          status=$?
          set -e
          diagnostics="$(grep -Ec '^[^(]+\([0-9]+,[0-9]+\): error TS' coop-public-ui-typecheck.log || true)"
          owned="$(grep -E '^(scripts/coop-browser-entry|src/battle-scene|src/data/elite-redux/coop/[^()]+|src/data/moves/move|src/dev-tools/registry|src/phase-manager|src/phase|src/phases/command-phase|src/phases/coop-guest-faint-switch-phase|src/phases/coop-replay-learn-move-batch|src/phases/coop-replay-learn-move-phase|src/phases/coop-replay-phases|src/phases/coop-replay-turn-phase|src/phases/encounter-phase|src/phases/er-ability-capsule-phase|src/phases/er-crossroads-phase|src/phases/er-dex-nav-phase|src/phases/er-greater-ability-capsule-phase|src/phases/er-greater-ability-randomizer-phase|src/phases/learn-move-phase|src/phases/party-heal-phase|src/phases/select-modifier-phase|src/phases/select-starter-phase|src/phases/title-phase|src/system/game-data|src/ui-inputs|src/ui/handlers/modifier-select-ui-handler|src/ui/handlers/party-ui-handler|src/ui/handlers/save-slot-select-ui-handler|src/ui/handlers/starter-select-ui-handler|src/ui/ui|test/tests/elite-redux/coop/coop-ability-picker-relay.test|test/tests/elite-redux/coop/coop-battle-stream.test|test/tests/elite-redux/coop/coop-shop-check-ops.test|test/tests/elite-redux/coop/coop-ui-mirror.test|test/tools/coop-soak-driver)\.ts\([0-9]+,[0-9]+\): error TS' coop-public-ui-typecheck.log || true)"
          if [ -n "$owned" ]; then
            printf '%s\n' "$owned"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$diagnostics" -eq 0 ]; then
            cat coop-public-ui-typecheck.log
            echo "Repository typecheck failed without parseable diagnostics"
            exit 1
          fi
          echo "Public-UI TypeScript slice is clean; repository baseline reported $diagnostics unrelated diagnostics"
          pnpm exec biome check --diagnostic-level=error --max-diagnostics=none \
            .github/workflows/coop-public-ui-journey.yml \
            scripts/coop-browser-entry.ts \
            src/battle-scene.ts \
            scripts/prepare-coop-browser-artifact.mjs \
            src/data/elite-redux/coop/authority-v2/shadow.ts \
            src/data/elite-redux/coop/authority-v2/cutover-interaction.ts \
            src/data/elite-redux/coop/coop-battle-stream.ts \
            src/data/elite-redux/coop/coop-durability.ts \
          src/data/elite-redux/coop/coop-field-presentation.ts \
          src/data/elite-redux/coop/coop-trainer-transition-observer.ts \
          src/data/elite-redux/coop/coop-operation-envelope.ts \
            src/data/elite-redux/coop/coop-party-reorder-presentation.ts \
            src/data/elite-redux/coop/coop-reward-operation.ts \
            src/data/elite-redux/coop/coop-runtime.ts \
            src/data/elite-redux/coop/coop-transport.ts \
            src/data/elite-redux/coop/coop-ui-mirror.ts \
            src/data/elite-redux/coop/coop-ui-registry.ts \
            src/data/elite-redux/coop/coop-wave-resolution-bridge.ts \
            src/data/elite-redux/coop/coop-webrtc-transport.ts \
            src/data/moves/move.ts \
            src/dev-tools/registry.ts \
            src/phase-manager.ts \
            src/phase.ts \
            src/phases/command-phase.ts \
            src/phases/coop-guest-faint-switch-phase.ts \
            src/phases/coop-replay-learn-move-batch.ts \
            src/phases/coop-replay-phases.ts \
            src/phases/coop-replay-turn-phase.ts \
            src/phases/encounter-phase.ts \
            src/phases/er-ability-capsule-phase.ts \
            src/phases/er-crossroads-phase.ts \
            src/phases/er-dex-nav-phase.ts \
            src/phases/er-greater-ability-capsule-phase.ts \
            src/phases/er-greater-ability-randomizer-phase.ts \
            src/phases/party-heal-phase.ts \
            src/phases/select-modifier-phase.ts \
            src/phases/select-starter-phase.ts \
            src/phases/title-phase.ts \
            src/ui-inputs.ts \
            src/ui/handlers/modifier-select-ui-handler.ts \
            src/ui/handlers/party-ui-handler.ts \
            src/ui/handlers/save-slot-select-ui-handler.ts \
            src/ui/handlers/starter-select-ui-handler.ts \
            src/ui/ui.ts \
            test/browser/coop-public-ui/browser-workflow-fanout.test.mjs \
            test/browser/coop-public-ui/authority-v2-gate-contract.test.mjs \
            test/browser/coop-public-ui/campaign-exp-phase.test.mjs \
            test/browser/coop-public-ui/campaign-render-profile.test.mjs \
            test/browser/coop-public-ui/campaign-policy.mjs \
            test/browser/coop-public-ui/campaign.mjs \
            test/browser/coop-public-ui/campaign-nav.mjs \
            test/browser/coop-public-ui/check-campaign-boundary.mjs \
            test/browser/coop-public-ui/check-public-boundary.mjs \
            test/browser/coop-public-ui/commander-evidence.test.mjs \
            test/browser/coop-public-ui/config.mjs \
            test/browser/coop-public-ui/evidence.mjs \
            test/browser/coop-public-ui/faint-replacement-evidence.test.mjs \
            test/browser/coop-public-ui/fatal-console-evidence.test.mjs \
            test/browser/coop-public-ui/game-over-evidence.test.mjs \
            test/browser/coop-public-ui/journeys.mjs \
            test/browser/coop-public-ui/local-worker-server.ts \
            test/browser/coop-public-ui/local-worker-vite.config.mjs \
            test/browser/coop-public-ui/market-gold-standard.test.mjs \
            test/browser/coop-public-ui/market-journey.mjs \
            test/browser/coop-public-ui/mystery-gauntlet-campaign.test.mjs \
            test/browser/coop-public-ui/navigation-depth-campaign.test.mjs \
            test/browser/coop-public-ui/pause-overlay-journey.test.mjs \
            test/browser/coop-public-ui/preview-server.mjs \
            test/browser/coop-public-ui/preview-server.test.mjs \
            test/browser/coop-public-ui/provision-accounts.mjs \
            test/browser/coop-public-ui/public-ui-harness.mjs \
            test/browser/coop-public-ui/public-ui-post-turn-budget.test.mjs \
            test/browser/coop-public-ui/run-campaign.mjs \
            test/browser/coop-public-ui/run.mjs \
            test/browser/coop-public-ui/save-mutation-evidence.test.mjs \
            test/browser/coop-public-ui/semantic-surface-evidence.test.mjs \
            test/browser/coop-public-ui/wave-progression-presentation-evidence.test.mjs \
            test/browser/coop-public-ui/showdown-browser-evidence.test.mjs \
            test/browser/coop-public-ui/terminal-watchdog.mjs \
            test/browser/coop-public-ui/vite.config.mjs \
            test/tests/elite-redux/coop/coop-duo-wave-operation.test.ts \
            test/tests/elite-redux/coop/coop-ability-picker-relay.test.ts \
            test/tests/elite-redux/coop/coop-battle-stream.test.ts \
            test/tests/elite-redux/coop/coop-guest-renderer.test.ts \
            test/tests/elite-redux/coop/coop-p33-client.test.ts \
            test/tests/elite-redux/coop/coop-session-controller.test.ts \
            test/tests/elite-redux/coop/coop-shop-check-ops.test.ts \
            test/tests/elite-redux/coop/coop-ui-mirror.test.ts \
            test/tests/elite-redux/coop/coop-wave-operation-durability.test.ts \
            test/tools/coop-soak-driver.ts

      - name: Verify party-reorder presentation and reward cursor mirroring
        if: inputs.journey == 'party-mutating-rewards'
        run: >-
          npx vitest run
          test/tests/elite-redux/coop/coop-shop-check-ops.test.ts
          test/tests/elite-redux/coop/coop-ui-mirror.test.ts
          --reporter=dot

      - name: Verify retained GameOver two-engine operation regression
        if: inputs.journey == 'game-over'
        env:
          ER_SCENARIO: "1"
          # The build below is full Authority V2; its exact two-engine prerequisite must qualify the same
          # authority graph rather than accidentally exercising legacy progression.
          COOP_AUTHORITY_V2_TURN: "on"
          COOP_AUTHORITY_V2_REPLACEMENT: "on"
          COOP_AUTHORITY_V2_WAVE: "on"
          COOP_AUTHORITY_V2_INTERACTION: "on"
          COOP_AUTHORITY_V2_RECOVERY: "on"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: >-
          npx vitest run
          test/tests/elite-redux/coop/coop-duo-wave-operation.test.ts
          test/tests/elite-redux/coop/coop-guest-renderer.test.ts
          test/tests/elite-redux/coop/coop-p33-client.test.ts
          test/tests/elite-redux/coop/coop-session-controller.test.ts
          test/tests/elite-redux/coop/coop-wave-operation-durability.test.ts
          --reporter=dot

      - name: Enforce public-driver boundary
        run: node test/browser/coop-public-ui/check-public-boundary.mjs

      - name: Enforce public campaign-driver boundary
        run: node test/browser/coop-public-ui/check-campaign-boundary.mjs

      - name: Verify browser fan-out checkout isolation
        run: node --test test/browser/coop-public-ui/browser-workflow-fanout.test.mjs

      - name: Verify replica half-wipe public-browser contracts
        run: node --test test/browser/coop-public-ui/faint-replacement-evidence.test.mjs

      - name: Verify sealed preview exact-SHA proxy contracts
        run: node --test test/browser/coop-public-ui/preview-server.test.mjs

      - name: Verify bounded public post-turn progress contracts
        run: node --test test/browser/coop-public-ui/public-ui-post-turn-budget.test.mjs

      - name: Verify human-skew trainer settlement contracts
        run: node --test test/browser/coop-public-ui/campaign-exp-phase.test.mjs

      - name: Verify signed guest trainer-transition contracts
        env:
          ER_SCENARIO: "1"
          COOP_AUTHORITY_V2_TURN: "on"
          COOP_AUTHORITY_V2_REPLACEMENT: "on"
          COOP_AUTHORITY_V2_WAVE: "on"
          COOP_AUTHORITY_V2_INTERACTION: "on"
          COOP_AUTHORITY_V2_RECOVERY: "on"
        run: >-
          npx vitest run
          test/tests/elite-redux/coop/coop-guest-renderer.test.ts
          -t "guest's player-trainer transition|projected trainer cue"
          --reporter=dot

      - name: Verify progressing Mystery battle contracts
        run: node --test test/browser/coop-public-ui/mystery-gauntlet-campaign.test.mjs

      - name: Verify local pause overlay input and two-browser journey contracts
        run: >-
          node --test test/browser/coop-public-ui/pause-overlay-journey.test.mjs

      - name: Verify local pause overlay classification
        run: npx vitest run test/tests/elite-redux/coop/coop-ui-registry.test.ts --reporter=dot

      - name: Verify strict Commander browser evidence contracts
        run: node --test test/browser/coop-public-ui/commander-evidence.test.mjs

      - name: Verify strict Wide Lens market contracts
        run: node --test test/browser/coop-public-ui/market-gold-standard.test.mjs

      - name: Verify continuous navigation-depth contracts
        run: node --test test/browser/coop-public-ui/navigation-depth-campaign.test.mjs

      - name: Verify strict semantic surface evidence contracts
        run: node --test test/browser/coop-public-ui/semantic-surface-evidence.test.mjs

      - name: Verify retained wave-progression presentation contracts
        run: node --test test/browser/coop-public-ui/wave-progression-presentation-evidence.test.mjs

      - name: Verify exact retained GameOver browser contracts
        run: >-
          node --test
          test/browser/coop-public-ui/fatal-console-evidence.test.mjs
          test/browser/coop-public-ui/game-over-evidence.test.mjs

      - name: Verify exact save mutation browser evidence contracts
        run: node --test test/browser/coop-public-ui/save-mutation-evidence.test.mjs

      - name: Verify public journey uses the release Authority V2 cutover
        run: node --test test/browser/coop-public-ui/authority-v2-gate-contract.test.mjs

      - name: Verify replacement live-order stream regression
        if: inputs.journey == 'faint-replacement'
        env:
          ER_SCENARIO: "1"
          COOP_AUTHORITY_V2_TURN: "on"
          COOP_AUTHORITY_V2_REPLACEMENT: "on"
          COOP_AUTHORITY_V2_WAVE: "on"
          COOP_AUTHORITY_V2_INTERACTION: "on"
          COOP_AUTHORITY_V2_RECOVERY: "on"
        run: npx vitest run test/tests/elite-redux/coop/coop-battle-stream.test.ts --reporter=dot

      - name: Verify authoritative modal scheduler ownership regression
        if: inputs.journey == 'registered-interactions'
        env:
          ER_SCENARIO: "1"
          COOP_AUTHORITY_V2_TURN: "on"
          COOP_AUTHORITY_V2_REPLACEMENT: "on"
          COOP_AUTHORITY_V2_WAVE: "on"
          COOP_AUTHORITY_V2_INTERACTION: "on"
          COOP_AUTHORITY_V2_RECOVERY: "on"
        run: >-
          npx vitest run
          test/tests/elite-redux/coop/coop-ability-picker-relay.test.ts
          --reporter=dot

      - name: Verify immutable trainer-victory material before browser launch
        env:
          ER_SCENARIO: "1"
          COOP_AUTHORITY_V2_TURN: "on"
          COOP_AUTHORITY_V2_REPLACEMENT: "on"
          COOP_AUTHORITY_V2_WAVE: "on"
          COOP_AUTHORITY_V2_INTERACTION: "on"
          COOP_AUTHORITY_V2_RECOVERY: "on"
        run: npx vitest run test/tests/elite-redux/coop/coop-trainer-victory-boundary.test.ts --reporter=dot

      - name: Verify exact two-browser Showdown admission and turn contracts
        run: node --test test/browser/coop-public-ui/showdown-browser-evidence.test.mjs

      - name: Build normal application with CI-only read-only observer
        env:
          COOP_BROWSER_OUT_DIR: dist-coop-public-ui
          VITE_BYPASS_LOGIN: 0
          VITE_BYPASS_TUTORIAL: 0
          # Mystery difficulty is intentionally staging/dev-only. The focused registered-interactions
          # journey must expose the same fifth public picker option as staging; every other journey keeps
          # the ordinary four-difficulty production surface.
          VITE_DEV_TOOLS: ${{ inputs.journey == 'registered-interactions' && '1' || '0' }}
          VITE_COOP_LOBBY_ROOM_QUERY: 1
          VITE_COOP_SERVER_URL: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          VITE_COOP_BROWSER_FIXTURE: ${{ (inputs.journey == 'commander-skip' && 'commander-skip') || ((inputs.journey == 'faint-replacement' || inputs.journey == 'half-wipe') && 'faint-replacement') || (inputs.journey == 'game-over' && 'game-over') || (inputs.journey == 'registered-interactions' && 'registered-interactions') || (inputs.journey == 'ability-capsule' && 'ability-capsule') || (inputs.journey == 'party-mutating-rewards' && 'party-mutating-rewards') || ((inputs.journey == 'navigation-depth-30' || inputs.journey == 'market-wide-lens') && 'navigation-depth-30') || (inputs.journey == 'evolution-sync' && 'evolution-sync') || (inputs.journey == 'showdown-battle' && 'showdown-battle') || 'off' }}
          VITE_COOP_SIGNALING_PROTOCOL: p33
          VITE_COOP_AUTHORITY_V2_TURN: "on"
          VITE_COOP_AUTHORITY_V2_REPLACEMENT: "on"
          VITE_COOP_AUTHORITY_V2_WAVE: "on"
          VITE_COOP_AUTHORITY_V2_INTERACTION: "on"
          VITE_COOP_AUTHORITY_V2_RECOVERY: "on"
          VITE_SERVER_URL: ${{ env.COOP_UI_API_ORIGIN }}
        run: pnpm exec vite build --mode beta --config test/browser/coop-public-ui/vite.config.mjs

      - name: Seal immutable execution input
        env:
          COOP_BROWSER_DIST: dist-coop-public-ui
          COOP_BROWSER_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          VITE_COOP_SERVER_URL: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
        run: node scripts/prepare-coop-browser-artifact.mjs

      - name: Publish exact bundle for isolated journey runners
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-bundle-${{ github.sha }}
          path: dist-coop-public-ui/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  primary-journey:
    name: ${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }} / ${{ inputs.cadence || 'normal' }} / ${{ inputs.journey == 'party-mutating-rewards' && matrix.party_reward_id || (inputs.journey == 'commander-skip' && matrix.commander_owner_seat || 'primary accounts') }}
    needs: browser-build
    runs-on: ubuntu-latest
    # The fresh+resume journey deliberately runs two complete launches. Its adaptive progress budget can
    # remain healthy for roughly 48 minutes on the constrained ~3-fps runner; a 35-minute outer job ceiling
    # previously cancelled it mid-ShowAbilityPhase while both peers were connected and assertion-clean.
    timeout-minutes: ${{ (inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'navigation-depth-30' && 240 || (inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'market-wide-lens' && 100 || ((inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'fresh-resume' || (inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'same-tab-rejoin') && 55 || ((inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'save-mutations' || (inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'resume-scan-isolation') && 50 || (inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume') == 'commander-skip' && 45 || 35 }}
    strategy:
      fail-fast: false
      # The repository account exposes forty hosted runners, with eight reserved for the other active
      # workstream. The complete consumable matrix is intentionally wider than that budget, so Actions
      # queues the tail rather than ever exceeding the agreed 32-runner ceiling (the build has finished
      # before this job starts, leaving four additional slots for summaries/transient overlap).
      max-parallel: 28
      matrix:
        commander_owner_seat: ${{ fromJSON(inputs.journey == 'commander-skip' && '["host-seat","guest-seat"]' || '["host-seat"]') }}
        party_reward_id: ${{ fromJSON(inputs.journey == 'party-mutating-rewards' && inputs.party_reward_ids != '' && inputs.party_reward_ids || inputs.journey == 'party-mutating-rewards' && '["TM_CASE","ER_LEARNERS_SHROOM","MEMORY_MUSHROOM","TM_COMMON","TM_GREAT","TM_ULTRA","ER_ABILITY_CAPSULE","ER_GREATER_ABILITY_CAPSULE","ER_GREATER_ABILITY_RANDOMIZER","ABILITY_RANDOMIZER","MOVE_SLOT_EXPANDER","PP_UP","PP_MAX","ETHER","MAX_ETHER","ELIXIR","MAX_ELIXIR","MINT","TERA_SHARD","RARE_CANDY","RARER_CANDY","POTION","SUPER_POTION","HYPER_POTION","MAX_POTION","FULL_RESTORE","REVIVE","MAX_REVIVE","FULL_HEAL","SACRED_ASH","EVOLUTION_ITEM","RARE_EVOLUTION_ITEM","FORM_CHANGE_ITEM","RARE_FORM_CHANGE_ITEM","DNA_SPLICERS","ER_DEX_NAV"]' || '["NONE"]') }}
    steps:
      - name: Check out exact implementation SHA (harness only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/setup-deps

      - name: Download the once-built exact-SHA bundle
        uses: actions/download-artifact@v4
        with:
          name: coop-public-ui-bundle-${{ github.sha }}
          path: dist-coop-public-ui

      - name: Install isolated Chrome runtime
        run: pnpm exec puppeteer browsers install chrome

      - name: Start isolated in-memory Worker fixtures for persistence coverage
        if: inputs.journey == 'save-mutations' || inputs.journey == 'resume-scan-isolation'
        shell: bash
        run: |
          pnpm exec vite build --config test/browser/coop-public-ui/local-worker-vite.config.mjs
          nohup node dist-coop-local-workers/local-worker-server.mjs > local-worker-fixture.log 2>&1 &
          for attempt in $(seq 1 60); do
            save_status="$(curl --silent --output save-worker-health.txt --write-out '%{http_code}' http://127.0.0.1:8788/game/titlestats || true)"
            coop_status="$(curl --silent --output coop-worker-health.txt --write-out '%{http_code}' http://127.0.0.1:8789/coop/health || true)"
            if [[ "$save_status" == "200" && "$coop_status" == "200" ]]; then
              exit 0
            fi
            if [[ "$attempt" == "1" || $((attempt % 10)) == "0" ]]; then
              printf 'worker readiness attempt=%s save=%s coop=%s\n' "$attempt" "$save_status" "$coop_status"
              cat save-worker-health.txt coop-worker-health.txt 2>/dev/null || true
            fi
            sleep 1
          done
          cat local-worker-fixture.log
          printf 'save status=%s body=' "$save_status"
          cat save-worker-health.txt || true
          printf '\ncoop status=%s body=' "$coop_status"
          cat coop-worker-health.txt || true
          printf '\n'
          exit 1

      - name: Prepare an isolated account pair for visible registration
        run: node test/browser/coop-public-ui/provision-accounts.mjs

      - name: Drive two isolated built clients exclusively through public UI
        env:
          COOP_UI_BASE_URL: http://127.0.0.1:4175/?coopdebug=1
          COOP_UI_BROWSER_DIST: dist-coop-public-ui
          COOP_UI_ASSET_DIR: .coop-no-local-asset-fallback
          # Ordinary journeys test UI -> relay -> Authority V2 behavior, not CDN availability. Serve the
          # same immutable ER_ASSETS_SHA through the sealed preview's byte-bounded same-origin cache so a
          # transient jsDelivr CORS/error response cannot counterfeit hundreds of product failures. The
          # animations-enabled campaign surface remains the dedicated direct-production asset oracle.
          COOP_UI_PROXY_PRODUCTION_ASSETS: "1"
          COOP_UI_EXPECTED_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          COOP_UI_EXPECTED_SIGNAL_ORIGIN: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          # Keep the selected campaign identity intact. The public rig uses it to attach the exact,
          # build-gated navigation fixture URL token; reducing market-wide-lens to `probe` silently
          # launched ordinary level-5 starters in exact-SHA run 30698494882.
          COOP_UI_JOURNEY: ${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}
          COOP_UI_ACCOUNT_MODE: register
          COOP_UI_LOBBY_ROOM: primary-${{ github.run_id }}-${{ matrix.commander_owner_seat }}-${{ matrix.party_reward_id }}-${{ github.run_attempt }}
          COOP_UI_REQUESTER_SEAT: ${{ inputs.requester_seat || 'guest-seat' }}
          # Browser roles remain tied to their public seats regardless of which seat sends the invitation.
          # The half-wipe caller explicitly selects the replica-owned guest seat.
          COOP_UI_FAINT_OWNER_SEAT: ${{ inputs.faint_owner_seat || 'guest-seat' }}
          COOP_UI_COMMANDER_OWNER_SEAT: ${{ matrix.commander_owner_seat }}
          # The focused registered-interaction journey must exercise the real alternative successor
          # after Stormglass, not depend on a random Ace-mode ME roll. Selecting Mystery through the
          # public difficulty menu guarantees wave 2 is an ME while every other journey retains Ace.
          COOP_UI_DIFFICULTY_ID: ${{ inputs.journey == 'registered-interactions' && 'mystery' || 'ace' }}
          COOP_UI_DIFFICULTY_OPTION_ID: ${{ inputs.journey == 'registered-interactions' && 'mystery' || 'ace' }}
          COOP_UI_HOST_LOCALE: en
          # The retained GameOver oracle isolates terminal ordering from the separately-gated
          # cross-locale fingerprint contract. All other public journeys keep the EN/DE lane.
          COOP_UI_GUEST_LOCALE: ${{ inputs.journey == 'game-over' && 'en' || 'de' }}
          COOP_UI_HOST_TITLE_NEW_GAME_KEYS: ${{ inputs.host_title_keys || '[]' }}
          COOP_UI_GUEST_TITLE_NEW_GAME_KEYS: ${{ inputs.guest_title_keys || '[]' }}
          # The 36-item reward matrix can push jsDelivr's immutable first-load past five minutes
          # without entering gameplay (run 30785547999 reached LoginPhase at 307-311s). Preserve the
          # ordinary strict boot budget and give only this high-fanout diagnostic profile measured headroom.
          COOP_UI_BOOT_TIMEOUT_MS: ${{ inputs.journey == 'party-mutating-rewards' && '420000' || '300000' }}
          COOP_UI_ACTION_DELAY_MS: ${{ (inputs.cadence == 'fast' && '70') || (inputs.cadence == 'slow' && '420') || '180' }}
          COOP_UI_SETTLE_DELAY_MS: ${{ (inputs.cadence == 'fast' && '300') || (inputs.cadence == 'slow' && '1300') || '750' }}
          # The continuous wave-1 -> wave-20 profile naturally reaches the wave-10 guest-owned
          # and wave-20 host-owned markets (boss auto-grants do not consume an interaction).
          # Each visit must buy Wide Lens once, return to the same grid, leave normally and prove
          # the following public command surface. This is one real run, so no save/runtime
          # fixture or cross-job aggregation can counterfeit the owner alternation.
          COOP_UI_CAMPAIGN_WAVES: ${{ inputs.journey == 'navigation-depth-30' && '30' || '20' }}
          COOP_UI_CAMPAIGN_MODE: ${{ inputs.journey == 'navigation-depth-30' && 'nightly' || 'gating' }}
          # The measured default 2-vCPU runner reached synchronized wave 13 at the old 45-minute
          # market deadline. Give the continuous wave-20 proof its measured 85-minute lifecycle;
          # this remains immutable and leaves 15 minutes for bounded diagnosis/artifact upload.
          COOP_UI_CAMPAIGN_HARD_TIMEOUT_MS: ${{ inputs.journey == 'navigation-depth-30' && '13800000' || inputs.journey == 'market-wide-lens' && '5100000' || '2700000' }}
          COOP_UI_RENDER_PROFILE: ${{ inputs.render_profile || 'animations-skipped-depth' }}
          COOP_UI_REWARD_MODE: ${{ (inputs.journey == 'ability-capsule' || inputs.journey == 'party-mutating-rewards') && 'pick-first' || 'leave' }}
          COOP_UI_PARTY_REWARD_ID: ${{ inputs.journey == 'party-mutating-rewards' && matrix.party_reward_id || '' }}
          COOP_UI_REWARD_PARTY_SLOT: ${{ inputs.journey == 'party-mutating-rewards' && contains(fromJSON('["POTION","SUPER_POTION","HYPER_POTION","MAX_POTION","FULL_RESTORE","REVIVE","MAX_REVIVE","FULL_HEAL"]'), matrix.party_reward_id) && '3' || inputs.journey == 'party-mutating-rewards' && '1' || '0' }}
          COOP_UI_RAISE_SPEED: "1"
          COOP_UI_MARKET_MODE: ${{ (inputs.journey == 'market-wide-lens' || inputs.journey == 'navigation-depth-30') && 'target-held' || 'leave' }}
          COOP_UI_MARKET_TARGET_ID: WIDE_LENS
          # One purchase per market proves both owner parities without attempting a fourth copy
          # after the held-item stack reaches its cap of three across the two visits.
          COOP_UI_MARKET_SECOND_PURCHASE: "0"
          COOP_UI_MARKET_REQUIRED_PURCHASES: ${{ (inputs.journey == 'market-wide-lens' || inputs.journey == 'navigation-depth-30') && '2' || '0' }}
          COOP_UI_MARKET_REQUIRE_BOTH_OWNER_SEATS: ${{ (inputs.journey == 'market-wide-lens' || inputs.journey == 'navigation-depth-30') && '1' || '0' }}
          COOP_UI_REQUIRE_NAVIGATION_DEPTH: ${{ inputs.journey == 'navigation-depth-30' && '1' || '0' }}
          COOP_UI_CROSSROADS_ROUTE: '["stay","leave","stay","leave"]'
          # One exact, point-legal journey deterministically self-faints, revives through the real
          # PARTY submenu, clears wave 1, then chooses the host's newly-held Stormglass at wave 2.
          COOP_UI_REQUIRE_REGISTERED_INTERACTIONS: ${{ inputs.journey == 'registered-interactions' && '1' || '0' }}
          COOP_UI_REQUIRE_ABILITY_CAPSULE: ${{ inputs.journey == 'ability-capsule' && '1' || '0' }}
          COOP_UI_REWARD_INSPECT_SUMMARY: ${{ inputs.journey == 'ability-capsule' && '1' || '0' }}
          COOP_UI_PREFERRED_MOVE_ID: ${{ inputs.journey == 'registered-interactions' && '863' || '0' }}
          # A measured 537 MB screenshot-enabled CDP performance trace starved two real 10x clients.
          # Normal two-player fidelity keeps PNGs, semantic/network JSONL, key latency, render and
          # WebRTC evidence while omitting only that optional timeline. Manual diagnostics may opt in.
          COOP_UI_CHROME_TRACE: ${{ inputs.chrome_trace && '1' || '0' }}
          # Two players run on two independent visible displays, matching separate devices while
          # eliminating artificial cross-seat focus/input serialization on one CI desktop.
          COOP_UI_HEADLESS: "0"
          COOP_UI_VIEWPORT_WIDTH: "1440"
          COOP_UI_VIEWPORT_HEIGHT: "900"
          COOP_UI_SEAT_PROFILE_DIR: ${{ runner.temp }}/coop-seat-profiles
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          Xvfb :98 -screen 0 1440x900x24 > /dev/null 2>&1 &
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          for socket in /tmp/.X11-unix/X98 /tmp/.X11-unix/X99; do
            for _ in $(seq 1 50); do
              [ -S "$socket" ] && break
              sleep 0.1
            done
            [ -S "$socket" ] || { echo "Xvfb for $socket failed to start" >&2; exit 1; }
          done
          export COOP_UI_DISPLAY_HOST=:98 COOP_UI_DISPLAY_GUEST=:99
          if [[ "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "registered-interactions" ]]; then
            # Clear wave 1, choose Stormglass at wave 2, then finish the forced Mystery successor.
            # A Mystery option may embed a battle at the same address, so target wave 2 keeps the
            # campaign alive until the event reaches its real wave-3 terminal frontier.
            export COOP_UI_CAMPAIGN_WAVES=2
          elif [[ "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "ability-capsule" || "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "party-mutating-rewards" ]]; then
            export COOP_UI_CAMPAIGN_WAVES=1
          fi
          if [[ "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "market-wide-lens" || "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "registered-interactions" || "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "ability-capsule" || "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "party-mutating-rewards" || "${{ inputs.journey || (github.event_name == 'push' && 'fresh-wave2') || 'fresh-resume' }}" == "navigation-depth-30" ]]; then
            node test/browser/coop-public-ui/run-campaign.mjs &
            campaign_pid=$!
            (
              heartbeat_count=0
              while kill -0 "$campaign_pid" 2>/dev/null; do
                sleep 60
                kill -0 "$campaign_pid" 2>/dev/null || break
                heartbeat_count=$((heartbeat_count + 1))
                progress_file="$(find dev-logs/coop-public-ui -type f -name campaign-progress.jsonl -print -quit 2>/dev/null || true)"
                if [ -n "$progress_file" ]; then
                  latest="$(tail -n 1 "$progress_file")"
                else
                  latest="campaign-progress-not-created"
                fi
                printf '[coop-journey:runner-heartbeat] pid=%s latest=%s\n' "$campaign_pid" "$latest"
                if (( heartbeat_count % 5 == 0 )); then
                  notice="$(printf '%s' "$latest" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
                  printf '::notice title=Co-op journey heartbeat::%s\n' "$notice"
                fi
              done
            ) &
            heartbeat_pid=$!
            set +e
            wait "$campaign_pid"
            campaign_status=$?
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            exit "$campaign_status"
          else
            node test/browser/coop-public-ui/run.mjs
          fi

      - name: Upload compact public-UI diagnosis first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-primary-compact-${{ matrix.commander_owner_seat }}-${{ matrix.party_reward_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dev-logs/coop-public-ui/**/summary.json
            dev-logs/coop-public-ui/**/*.jsonl
            dev-logs/coop-public-ui/**/*.png
            dev-logs/coop-public-ui/**/*.dom.json
            dev-logs/coop-public-ui/**/*.cookies.json
            local-worker-fixture.log
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Upload full public-UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-primary-${{ matrix.commander_owner_seat }}-${{ matrix.party_reward_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: dev-logs/coop-public-ui/**
          retention-days: 14
          if-no-files-found: warn

  reverse-journey:
    if: github.event_name == 'workflow_dispatch' && inputs.fan_out_reverse && inputs.journey != 'save-mutations' && inputs.journey != 'resume-scan-isolation'
    name: reverse-resume / slow / alternate accounts
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact implementation SHA (harness only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/setup-deps

      - name: Download the same exact-SHA bundle
        uses: actions/download-artifact@v4
        with:
          name: coop-public-ui-bundle-${{ github.sha }}
          path: dist-coop-public-ui

      - name: Install isolated Chrome runtime
        run: pnpm exec puppeteer browsers install chrome

      - name: Reject missing alternate staging credentials
        env:
          HOST_USERNAME: ${{ secrets.COOP_UI_ALT_HOST_USERNAME }}
          HOST_PASSWORD: ${{ secrets.COOP_UI_ALT_HOST_PASSWORD }}
          GUEST_USERNAME: ${{ secrets.COOP_UI_ALT_GUEST_USERNAME }}
          GUEST_PASSWORD: ${{ secrets.COOP_UI_ALT_GUEST_PASSWORD }}
        shell: bash
        run: |
          test -n "$HOST_USERNAME" || { echo "COOP_UI_ALT_HOST_USERNAME is not configured"; exit 1; }
          test -n "$HOST_PASSWORD" || { echo "COOP_UI_ALT_HOST_PASSWORD is not configured"; exit 1; }
          test -n "$GUEST_USERNAME" || { echo "COOP_UI_ALT_GUEST_USERNAME is not configured"; exit 1; }
          test -n "$GUEST_PASSWORD" || { echo "COOP_UI_ALT_GUEST_PASSWORD is not configured"; exit 1; }

      - name: Drive reverse invitation and resume at slow cadence
        env:
          COOP_UI_BASE_URL: http://127.0.0.1:4176/?coopdebug=1
          COOP_UI_BROWSER_DIST: dist-coop-public-ui
          COOP_UI_ASSET_DIR: .coop-no-local-asset-fallback
          COOP_UI_PROXY_PRODUCTION_ASSETS: "1"
          COOP_UI_EXPECTED_API_ORIGIN: ${{ env.COOP_UI_API_ORIGIN }}
          COOP_UI_EXPECTED_SIGNAL_ORIGIN: ${{ env.COOP_UI_SIGNAL_ORIGIN }}
          COOP_UI_JOURNEY: reverse-resume
          COOP_UI_LOBBY_ROOM: reverse-${{ github.run_id }}-${{ github.run_attempt }}
          COOP_UI_REQUESTER_SEAT: host-seat
          COOP_UI_HOST_LOCALE: en
          COOP_UI_GUEST_LOCALE: de
          COOP_UI_ACTION_DELAY_MS: 420
          COOP_UI_SETTLE_DELAY_MS: 1300
          COOP_UI_HOST_USERNAME: ${{ secrets.COOP_UI_ALT_HOST_USERNAME }}
          COOP_UI_HOST_PASSWORD: ${{ secrets.COOP_UI_ALT_HOST_PASSWORD }}
          COOP_UI_GUEST_USERNAME: ${{ secrets.COOP_UI_ALT_GUEST_USERNAME }}
          COOP_UI_GUEST_PASSWORD: ${{ secrets.COOP_UI_ALT_GUEST_PASSWORD }}
          COOP_UI_HEADLESS: "0"
          COOP_UI_VIEWPORT_WIDTH: "1440"
          COOP_UI_VIEWPORT_HEIGHT: "900"
          COOP_UI_SEAT_PROFILE_DIR: ${{ runner.temp }}/coop-seat-profiles
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          Xvfb :98 -screen 0 1440x900x24 > /dev/null 2>&1 &
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          for socket in /tmp/.X11-unix/X98 /tmp/.X11-unix/X99; do
            for _ in $(seq 1 50); do
              [ -S "$socket" ] && break
              sleep 0.1
            done
            [ -S "$socket" ] || { echo "Xvfb for $socket failed to start" >&2; exit 1; }
          done
          export COOP_UI_DISPLAY_HOST=:98 COOP_UI_DISPLAY_GUEST=:99
          node test/browser/coop-public-ui/run.mjs

      - name: Upload compact reverse diagnosis first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-reverse-compact-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dev-logs/coop-public-ui/**/summary.json
            dev-logs/coop-public-ui/**/*.jsonl
            dev-logs/coop-public-ui/**/*.png
            dev-logs/coop-public-ui/**/*.dom.json
            dev-logs/coop-public-ui/**/*.cookies.json
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Upload full reverse public-UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-public-ui-reverse-${{ github.sha }}-${{ github.run_attempt }}
          path: dev-logs/coop-public-ui/**
          retention-days: 14
          if-no-files-found: warn
