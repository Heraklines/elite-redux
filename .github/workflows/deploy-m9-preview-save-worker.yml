name: Deploy M9 Preview-Only Save Worker

on:
  push:
    branches: [ops/m9-r1-preview-validation]
    paths: [.github/workflows/deploy-m9-preview-save-worker.yml]
  workflow_dispatch:
    inputs:
      platform_sha:
        description: Exact preview platform source SHA
        required: true
        type: string
      qualification_mode:
        description: G52 for qualified deployment; FOCUSED_PREQUAL for isolated live-browser validation
        required: true
        default: G52
        type: choice
        options: [G52, FOCUSED_PREQUAL]
      focused_run_id:
        description: Exact candidate focused run; required for FOCUSED_PREQUAL
        required: false
        default: 0
        type: number
      g52_run_id:
        description: Successful G52 aggregate run; required for G52
        required: false
        default: 0
        type: number
      rust_regression_run_id:
        description: G52 run that owns the successful Rust regression job; required for G52
        required: false
        default: 0
        type: number
      explicit_confirmation:
        description: Type DEPLOY_M9_PREVIEW_ONLY_SAVE_WORKER
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-m9-preview-only-save-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.explicit_confirmation == 'DEPLOY_M9_PREVIEW_ONLY_SAVE_WORKER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: m9-preview-save-worker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.platform_sha }}
          fetch-depth: 0
      - name: Verify exact qualified preview source
        uses: actions/github-script@v8
        with:
          script: |
            if ('${{ inputs.qualification_mode }}' === 'FOCUSED_PREQUAL') {
              const focused = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number('${{ inputs.focused_run_id }}'),
              });
              if (focused.data.name !== 'M9 Preview Focused Qualification'
                  || focused.data.head_sha !== '${{ inputs.platform_sha }}'
                  || focused.data.status !== 'completed') {
                core.setFailed('preview Worker prequalification lacks an exact completed focused run');
                return;
              }
              const focusedJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: focused.data.id,
                per_page: 100,
              });
              for (const required of [
                'preview-static',
                'candidate-source-bundle',
                'immutable-release-inspection',
                'browser-save-reload',
              ]) {
                const matches = focusedJobs.filter(job => job.name === required);
                if (matches.length !== 1 || matches[0].conclusion !== 'success') {
                  core.setFailed(`preview Worker prequalification job ${required} is missing or non-successful`);
                }
              }
              return;
            }
            const aggregate = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.g52_run_id }}'),
            });
            const owner = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.rust_regression_run_id }}'),
            });
            if (aggregate.data.conclusion !== 'success'
                || aggregate.data.name !== 'Rust Kernel M9 G52 Production Qualification'
                || owner.data.status !== 'completed'
                || owner.data.name !== 'Rust Kernel M9 G52 Production Qualification') {
              core.setFailed('preview Worker source lacks bound G52 aggregate and regression-owner evidence');
              return;
            }
            const ownerBound = owner.data.head_sha === '${{ inputs.platform_sha }}' || owner.data.conclusion === 'success';
            const ownerJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: owner.data.id,
              per_page: 100,
            });
            const regression = ownerJobs.filter(job => job.name === 'rust-regression');
            const binding = ownerJobs.filter(job => job.name === 'candidate-binding');
            if (!ownerBound
                || regression.length !== 1
                || regression[0].conclusion !== 'success'
                || (owner.data.head_sha !== '${{ inputs.platform_sha }}'
                  && (binding.length !== 1 || binding[0].conclusion !== 'success'))) {
              core.setFailed('preview Worker source lacks a bound successful Rust regression job');
            }
      - name: Prove capability-only Worker configuration
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.platform_sha }}"
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = readFileSync('workers/er-m9-preview-save/wrangler.toml', 'utf8');
          const source = readFileSync('workers/er-m9-preview-save/src/index.ts', 'utf8');
          const blocks = [...config.matchAll(/\[\[d1_databases\]\]([\s\S]*?)(?=\n\[\[|\n\[|$)/g)].map(match => match[1]);
          if (blocks.length !== 1
              || !/binding\s*=\s*"RUST_PREVIEW_DB"/.test(blocks[0])
              || !/database_id\s*=\s*"9d410e94-8719-4a86-aa0b-c1cad2291e88"/.test(blocks[0])
              || /binding\s*=\s*"DB"/.test(config)
              || !/\[\[services\]\][\s\S]*binding\s*=\s*"M9_TELEMETRY"[\s\S]*service\s*=\s*"er-telemetry"/.test(config)
              || !/M9_PREVIEW_ONLY_WORKER\s*=\s*"true"/.test(config)
              || !/M9_PREVIEW_DATABASE_IDENTITY_HASH\s*=\s*"b860cac56eb16855e2a46fc6ba2f458666f06d0ab4e04ca4c83f0e3962afd36e"/.test(config)
              || !/M9_LEGACY_MIGRATION_ENABLED\s*=\s*"false"/.test(config)) {
            throw new Error('preview Worker D1 capability configuration is invalid');
          }
          for (const forbidden of ['session_saves', '/savedata/', '/account/info', 'pokerogue_sessionId']) {
            if (source.includes(forbidden)) throw new Error(`preview Worker contains forbidden legacy surface: ${forbidden}`);
          }
          NODE
      - name: Capture immutable legacy schema sentinel before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.127.1 d1 execute er-saves --remote \
            --config workers/er-save-api/wrangler.toml \
            --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE tbl_name = 'session_saves' OR name = 'session_saves' ORDER BY type, name" \
            --json > "$RUNNER_TEMP/legacy-before-raw.json"
          jq -S '.[0].results' "$RUNNER_TEMP/legacy-before-raw.json" > "$RUNNER_TEMP/legacy-before.json"
          test "$(jq 'length' "$RUNNER_TEMP/legacy-before.json")" -ge 1
          sha256sum "$RUNNER_TEMP/legacy-before.json" | cut -d' ' -f1 > "$RUNNER_TEMP/legacy-before.sha256"
      - name: Initialize isolated preview schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.127.1 d1 execute er-m9-rust-preview-saves --remote \
            --config workers/er-m9-preview-save/wrangler.toml \
            --file workers/er-m9-preview-save/schema.sql
          npx --yes wrangler@4.127.1 d1 execute er-m9-rust-preview-saves --remote \
            --config workers/er-m9-preview-save/wrangler.toml \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('rust_preview_accounts','rust_preview_saves','rust_preview_save_backups','rust_preview_save_leases') ORDER BY name" \
            --json > "$RUNNER_TEMP/preview-tables.json"
          jq -e '.[0].results | map(.name) == ["rust_preview_accounts","rust_preview_save_backups","rust_preview_save_leases","rust_preview_saves"]' \
            "$RUNNER_TEMP/preview-tables.json" > /dev/null
      - name: Configure preview-only secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
          M9_PREVIEW_INVITE_SECRET: ${{ secrets.M9_PREVIEW_INVITE_SECRET }}
          M9_PREVIEW_HEALTH_SECRET: ${{ secrets.M9_PREVIEW_HEALTH_SECRET }}
        run: |
          test -n "$M9_RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$M9_PREVIEW_INVITE_SECRET"
          test -n "$M9_PREVIEW_HEALTH_SECRET"
          printf '%s' "$M9_RELEASE_SIGNING_PRIVATE_KEY" | npx --yes wrangler@4.127.1 secret put M9_RELEASE_SIGNING_PRIVATE_KEY --config workers/er-m9-preview-save/wrangler.toml
          printf '%s' "$M9_PREVIEW_INVITE_SECRET" | npx --yes wrangler@4.127.1 secret put M9_PREVIEW_INVITE_SECRET --config workers/er-m9-preview-save/wrangler.toml
          printf '%s' "$M9_PREVIEW_HEALTH_SECRET" | npx --yes wrangler@4.127.1 secret put M9_PREVIEW_HEALTH_SECRET --config workers/er-m9-preview-save/wrangler.toml
          printf '%s' "$M9_PREVIEW_HEALTH_SECRET" | npx --yes wrangler@4.127.1 secret put M9_PREVIEW_HEALTH_SECRET --config workers/er-telemetry/wrangler.toml
      - name: Deploy dedicated preview-only Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 deploy --config workers/er-m9-preview-save/wrangler.toml
      - name: Deploy preview-aware telemetry ingestion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 deploy --config workers/er-telemetry/wrangler.toml
      - name: Prove capability-isolated deploy left legacy schema untouched
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.127.1 d1 execute er-saves --remote \
            --config workers/er-save-api/wrangler.toml \
            --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE tbl_name = 'session_saves' OR name = 'session_saves' ORDER BY type, name" \
            --json > "$RUNNER_TEMP/legacy-after-raw.json"
          jq -S '.[0].results' "$RUNNER_TEMP/legacy-after-raw.json" > "$RUNNER_TEMP/legacy-after.json"
          cmp "$RUNNER_TEMP/legacy-before.json" "$RUNNER_TEMP/legacy-after.json"
          test "$(sha256sum "$RUNNER_TEMP/legacy-after.json" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/legacy-before.sha256")"
      - name: Verify preview-only route surface
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://er-m9-preview-save.heraklines.workers.dev/savedata/session/get)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST https://er-m9-preview-save.heraklines.workers.dev/api/m9/preview-account)" = 403
          printf '%s\n' "Dedicated M9 preview Worker deployed without a legacy DB binding from ${{ inputs.platform_sha }}"
