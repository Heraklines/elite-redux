name: Deploy M9 R0 Platform Workers

on:
  push:
    branches: [arch/rust-kernel-m9-production]
    paths:
      - .github/workflows/deploy-m9-r0-workers.yml
      - workers/er-save-api/m9-rust-preview-schema.sql
      - workers/er-save-api/src/**
      - workers/er-save-api/wrangler.toml
  workflow_dispatch:
    inputs:
      platform_sha:
        description: Exact G52-qualified M9 platform source SHA
        required: true
        type: string
      g52_run_id:
        description: Exact successful G52 run for platform_sha
        required: true
        type: number
      explicit_confirmation:
        description: Type DEPLOY_M9_R0_WORKERS
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-m9-r0-workers
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.explicit_confirmation == 'DEPLOY_M9_R0_WORKERS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: m9-r0-workers
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.platform_sha }}
          fetch-depth: 0
      - name: Verify exact G52-qualified platform source
        uses: actions/github-script@v8
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.g52_run_id }}'),
            });
            if (run.data.head_sha !== '${{ inputs.platform_sha }}'
                || run.data.conclusion !== 'success'
                || run.data.name !== 'Rust Kernel M9 G52 Production Qualification') {
              core.setFailed('M9 worker deployment source lacks exact successful G52 evidence');
            }
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.platform_sha }}"
      - name: Initialize only the isolated Rust preview save database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const config = readFileSync("workers/er-save-api/wrangler.toml", "utf8");
          const blocks = [...config.matchAll(/\[\[d1_databases\]\]([\s\S]*?)(?=\n\[\[|$)/g)].map(match => match[1]);
          const binding = name => blocks.find(block => new RegExp(`binding\\s*=\\s*\"${name}\"`).test(block));
          const id = block => /database_id\s*=\s*\"([^\"]+)\"/.exec(block ?? "")?.[1];
          const legacy = id(binding("DB"));
          const preview = id(binding("M9_RUST_SAVES"));
          if (preview !== "9d410e94-8719-4a86-aa0b-c1cad2291e88" || legacy == null || legacy === preview) {
            throw new Error("Rust preview save D1 binding is missing, unexpected, or aliases the legacy save database");
          }
          NODE
          npx --yes wrangler@4.127.1 d1 execute er-m9-rust-preview-saves \
            --remote \
            --config workers/er-save-api/wrangler.toml \
            --file workers/er-save-api/m9-rust-preview-schema.sql
          npx --yes wrangler@4.127.1 d1 execute er-m9-rust-preview-saves \
            --remote \
            --config workers/er-save-api/wrangler.toml \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('rust_preview_saves','rust_preview_save_backups') ORDER BY name" \
            --json > "$RUNNER_TEMP/m9-rust-preview-tables.json"
          jq -e '.[0].results | map(.name) == [\"rust_preview_save_backups\", \"rust_preview_saves\"]' \
            "$RUNNER_TEMP/m9-rust-preview-tables.json" > /dev/null
      - name: Configure production-only M9 secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
          M9_HEALTH_TOKEN: ${{ secrets.M9_HEALTH_TOKEN }}
          M9_INTERNAL_ACCOUNTS: ${{ secrets.M9_INTERNAL_ACCOUNTS }}
        run: |
          test -n "$M9_RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$M9_HEALTH_TOKEN"
          test -n "$M9_INTERNAL_ACCOUNTS"
          printf '%s' "$M9_RELEASE_SIGNING_PRIVATE_KEY" | npx --yes wrangler@4.127.1 secret put M9_RELEASE_SIGNING_PRIVATE_KEY --config workers/er-save-api/wrangler.toml
          printf '%s' "$M9_INTERNAL_ACCOUNTS" | npx --yes wrangler@4.127.1 secret put M9_INTERNAL_ACCOUNTS --config workers/er-save-api/wrangler.toml
          printf '%s' "$M9_HEALTH_TOKEN" | npx --yes wrangler@4.127.1 secret put M9_HEALTH_TOKEN --config workers/er-telemetry/wrangler.toml
      - name: Deploy exact save and runtime-assignment Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 deploy --config workers/er-save-api/wrangler.toml
      - name: Deploy exact bounded-health Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 deploy --config workers/er-telemetry/wrangler.toml
      - name: Verify bounded production health endpoint
        env:
          M9_HEALTH_TOKEN: ${{ secrets.M9_HEALTH_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${M9_HEALTH_TOKEN}" \
            https://er-telemetry.heraklines.workers.dev/m9/health/r0-platform-smoke \
            > "$RUNNER_TEMP/m9-health-smoke.json"
          jq -e '.schema_version == 1 and .release_id == "r0-platform-smoke" and .hard_stop_fingerprints == []' \
            "$RUNNER_TEMP/m9-health-smoke.json" > /dev/null
          printf '%s\n' "M9 R0 Workers deployed from ${{ inputs.platform_sha }} with G52 run ${{ inputs.g52_run_id }}"
