name: Deploy Production

# Rebuilds the standalone (login) bundle, deploys the production cloud-save
# Worker, then deploys the elite-redux PRODUCTION Cloudflare Pages project.
# VITE_DEV_TOOLS and the co-op bindings are NEVER set in production.
#
# Manual dispatch ONLY, and only after the maintainer explicitly approves a
# production release.

on:
  workflow_dispatch:
    inputs:
      asset_host:
        description: "Asset CDN host. Blank = jsDelivr (normal). 'raw' = serve er-assets from raw.githubusercontent.com (jsDelivr-outage stopgap; redeploy blank to revert)."
        required: false
        type: string
      collect_player_training_data:
        description: Collect player battle-decision training data during this build
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-prod
  # Do not cancel between the Worker and Pages steps and expose mismatched contracts.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Heraklines/elite-redux'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          # No submodules: standalone asset metadata is vendored (see staging).

      - name: Seal exact promotion source
        run: echo "PROMOTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-deps

      - name: Stage standalone asset metadata
        run: |
          mkdir -p assets
          cp -v deploy/standalone-assets/* assets/

      - name: Write standalone login env (PROD - no dev tools)
        run: |
          VITE_ENABLE_NEW_POKEMON=off node scripts/export-data-dictionary.mjs --out "$RUNNER_TEMP/er-combat-data-dictionary.json"
          AI_DICTIONARY_HASH="$(sha256sum "$RUNNER_TEMP/er-combat-data-dictionary.json" | cut -d' ' -f1)"
          echo "AI_DICTIONARY_HASH=${AI_DICTIONARY_HASH}" >> "$GITHUB_ENV"
          {
            echo "VITE_BYPASS_LOGIN=0"
            echo "VITE_SERVER_URL=https://er-save-api.heraklines.workers.dev"
            echo "VITE_SERVER_URL_TELEMETRY=https://er-telemetry.heraklines.workers.dev"
            if [ "${{ inputs.collect_player_training_data }}" = "true" ]; then
              echo "VITE_TELEMETRY=prod"
            else
              echo "VITE_TELEMETRY=off"
            fi
            echo "VITE_BUILD_SHA=${PROMOTED_SHA}"
            echo "VITE_AI_DICTIONARY_HASH=${AI_DICTIONARY_HASH}"
            echo "VITE_ENABLE_NEW_POKEMON=off"
          } > .env.standalone.local

      # ER (#431): resolve the CURRENT er-assets HEAD so this deploy's _redirects
      # pin is never stale (mirrors deploy-staging.yml). Without this, prod kept the
      # committed - and stale - pin, so brand-new atlas frames (e.g. the TM Case
      # icon) 404'd / fell back to the wrong sprite while staging looked fine.
      # Fail closed if the immutable asset revision cannot be resolved.
      - name: Resolve er-assets HEAD for the jsDelivr pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=""
          for attempt in 1 2 3; do
            SHA=$(gh api repos/Heraklines/er-assets/commits/main --jq .sha 2>/dev/null || true)
            echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' && break
            SHA=""
            sleep 3
          done
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote https://github.com/Heraklines/er-assets.git refs/heads/main | awk 'NR == 1 { print $1 }')
          fi
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Could not resolve immutable er-assets/main SHA" >&2; exit 1; }
          echo "ER_ASSETS_SHA=$SHA" >> "$GITHUB_ENV"
          echo "er-assets pin for this deploy: $SHA"
          # Asset CDN host: blank = jsDelivr (normal). 'raw' = serve er-assets from
          # raw.githubusercontent.com (jsDelivr-outage stopgap). Redeploy blank to revert.
          if [ "${{ github.event.inputs.asset_host }}" = "raw" ]; then
            echo "ER_ASSETS_HOST=raw" >> "$GITHUB_ENV"
            echo "asset host OVERRIDE: raw.githubusercontent.com (jsDelivr bypass)"
          fi

      - name: Verify the exact er-assets sprite pin
        run: |
          if [ "${ER_ASSETS_HOST:-}" = "raw" ]; then
            BASE="https://raw.githubusercontent.com/Heraklines/er-assets/${ER_ASSETS_SHA}"
          else
            BASE="https://cdn.jsdelivr.net/gh/Heraklines/er-assets@${ER_ASSETS_SHA}"
          fi
          FILES="
            images/items.png
            images/items.json
            images/types.png
            images/types.json
            images/statuses.png
            images/statuses.json
            images/pokemon/elite-redux/infernape_redux/front.png
            images/pokemon/elite-redux/infernape_redux/back.png
            images/pokemon/elite-redux/infernape_redux/icon.png
            images/pokemon/elite-redux/infernape_redux/shiny.png
            images/pokemon/elite-redux/infernape_redux/shiny-back.png
            images/pokemon/elite-redux/infernape_redux/shiny-2.png
            images/pokemon/elite-redux/infernape_redux/shiny-back-2.png
            images/pokemon/elite-redux/infernape_redux/shiny-3.png
            images/pokemon/elite-redux/infernape_redux/shiny-back-3.png
            images/pokemon/elite-redux/luxray_redux/front.png
            images/pokemon/elite-redux/luxray_redux/back.png
            images/pokemon/elite-redux/luxray_redux/icon.png
            images/pokemon/elite-redux/luxray_redux/shiny.png
            images/pokemon/elite-redux/luxray_redux/shiny-back.png
            images/pokemon/elite-redux/luxray_redux/shiny-2.png
            images/pokemon/elite-redux/luxray_redux/shiny-back-2.png
            images/pokemon/elite-redux/luxray_redux/shiny-3.png
            images/pokemon/elite-redux/luxray_redux/shiny-back-3.png
          "
          for f in $FILES; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE/$f" || echo 000)
              if [ "$code" = "200" ]; then ok=1; echo "asset OK $f"; break; fi
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "Asset unavailable at exact pin: $f" >&2; exit 1; }
          done

      - name: Configure M9 production Worker secrets
        env:
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
          M9_HEALTH_TOKEN: ${{ secrets.M9_HEALTH_TOKEN }}
        run: |
          test -n "$M9_RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$M9_HEALTH_TOKEN"
          printf '%s' "$M9_RELEASE_SIGNING_PRIVATE_KEY" | npx wrangler secret put M9_RELEASE_SIGNING_PRIVATE_KEY --config workers/er-save-api/wrangler.toml
          printf '%s' "$M9_HEALTH_TOKEN" | npx wrangler secret put M9_HEALTH_TOKEN --config workers/er-telemetry/wrangler.toml

      - name: Verify production telemetry prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/er-telemetry" \
            > "$RUNNER_TEMP/prod-telemetry-r2.json"
          jq -e '.success == true and .result.name == "er-telemetry"' "$RUNNER_TEMP/prod-telemetry-r2.json" > /dev/null

          npx wrangler secret list --config workers/er-save-api/wrangler.toml --format json \
            > "$RUNNER_TEMP/prod-save-secrets.json"
          jq -e '[.[].name] | index("SESSION_SECRET") != null and index("SHOWDOWN_GRANT_SECRET") != null and index("M9_RELEASE_SIGNING_PRIVATE_KEY") != null' \
            "$RUNNER_TEMP/prod-save-secrets.json" > /dev/null

          npx wrangler secret list --config workers/er-telemetry/wrangler.toml --format json \
            > "$RUNNER_TEMP/prod-tel-secrets.json"
          jq -e '[.[].name] | index("SHOWDOWN_GRANT_SECRET") != null and index("M9_HEALTH_TOKEN") != null' \
            "$RUNNER_TEMP/prod-tel-secrets.json" > /dev/null

      - name: Build standalone bundle
        run: |
          mkdir -p assets
          cp -f deploy/standalone-assets/* assets/
          pnpm build:standalone
        env:
          NODE_ENV: production

      # build:standalone (scripts/assemble-cloudflare-dist.mjs) already copies the
      # Cloudflare config, strips sourcemaps, and re-pins dist/_redirects to
      # $ER_ASSETS_SHA - same as staging. The old manual "Assemble dist" cp step
      # was a leftover that copied the STALE committed _redirects back over the
      # freshly re-pinned one, so prod shipped an outdated er-assets pin (custom
      # backgrounds 404'd / fell back to vanilla). Just verify the assembled dist.
      - name: Verify assembled dist (built by build:standalone)
        run: |
          for f in _redirects _headers service-worker.js manifest.json version.json; do
            test -f "dist/$f" || { echo "MISSING dist/$f"; exit 1; }
          done
          echo "=== er-assets pins in dist/_redirects ==="
          if [ "${ER_ASSETS_HOST:-}" = "raw" ]; then
            grep -q "raw.githubusercontent.com/Heraklines/er-assets/${ER_ASSETS_SHA}/" dist/_redirects
            ! grep -q 'cdn.jsdelivr.net/gh/Heraklines/er-assets@' dist/_redirects
          else
            PINS=$(grep -o 'er-assets@[0-9a-f]*' dist/_redirects | sort -u)
            echo "$PINS"
            test "$PINS" = "er-assets@${ER_ASSETS_SHA}"
          fi

      - name: Verify production promotion contract
        run: node --test test/browser/coop-public-ui/deploy-prod-contract.test.mjs

      # The production browser depends on the save/ghost routes from this exact
      # checkout. Publish the backward-compatible Worker before the browser.
      - name: Refresh community suggestion achievement catalog
        run: node scripts/elite-redux/build-community-suggestion-achievements.mjs


      - name: Deploy cloud-save API (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/er-save-api/wrangler.toml


      - name: Deploy tournament telemetry API (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/er-telemetry/wrangler.toml

      - name: Upload combat data dictionary (production R2)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            r2 object put
            "er-telemetry/dictionaries/${{ env.AI_DICTIONARY_HASH }}.json"
            --file "${{ runner.temp }}/er-combat-data-dictionary.json"
            --content-type application/json

      - name: Deploy to Cloudflare Pages (PRODUCTION)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name elite-redux --branch main --commit-dirty=true
