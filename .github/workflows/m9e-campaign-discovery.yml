name: M9E Promoted Replay Focus
on:
  push:
    branches: [codex/m9e-replay-promoted-probe-20260923]
permissions:
  contents: read
concurrency:
  group: m9e-campaign-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: [replay]
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Execute complete natural campaign target
        run: python3 scripts/ci/m9e_campaign_discovery.py ${{ matrix.case }}
      - name: Compact result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-campaign-discovery-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-campaign-discovery-${{ matrix.case }}/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Named remote diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-campaign-discovery-logs-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-campaign-discovery-${{ matrix.case }}/diagnostics/
          if-no-files-found: error
          retention-days: 14
