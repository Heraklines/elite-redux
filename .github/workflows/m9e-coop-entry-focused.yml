name: M9E Cooperative Integration Entry Adapter Diagnostic
on:
  push:
    branches: [codex/m9e-coop-entry-focused-20260906]
permissions:
  contents: read
concurrency:
  group: m9e-coop-entry-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Restore existing dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned Rust tooling remotely
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Actual CLI and process Worker setup with native browser-host parity
        run: python3 scripts/ci/m9e_coop_entry_adapter_diagnostic.py
      - name: Compact focused result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-coop-entry-adapter-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-coop-entry-adapter/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Complete remote diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-coop-entry-adapter-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-coop-entry-adapter/diagnostics/
          if-no-files-found: error
          retention-days: 14
