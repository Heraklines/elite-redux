name: M9E Current Entry Focused Diagnostic
on:
  push:
    branches: [codex/m9e-entry-recheck-20260923]
permissions:
  contents: read
concurrency:
  group: m9e-current-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Restore dependency downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Qualify whole current CLI entry, batch and native capture targets
        run: python3 scripts/ci/m9e_current_entry_diagnostic.py
      - name: Upload compact source-bound result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-current-entry-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-current-entry/compact/
          if-no-files-found: error
          retention-days: 14
