name: M9E Owned Phase Native Diagnostic
on:
  push:
    branches: [codex/m9e-current-phase-focused-20260910]
permissions:
  contents: read
concurrency:
  group: m9e-current-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Start shared deadline before checkout
        run: echo "M9E_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Retrieve exact baseline source within shared budget
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          elapsed=$(($(date +%s) - M9E_STARTED_AT))
          test "$elapsed" -ge 0
          remaining=$((1780 - elapsed))
          test "$remaining" -gt 0
          timeout "$((remaining < 600 ? remaining : 600))" git fetch --no-tags --depth=1 origin dcd09ddf17ef2e979b2d344c279ba0e6c5a1f89b
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
      - name: Restore existing dependency downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Check all116 inherited and added whole-target witnesses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/m9e_current_phase_diagnostic.py
      - name: Compact actual native diagnostic result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-current-phase-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-current-phase/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Remote proposal diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-current-phase-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-current-phase/diagnostics/
          if-no-files-found: error
          retention-days: 14
  browser-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CI: 'true'
    steps:
      - name: Start bounded browser qualification before checkout
        run: echo "M9E_JS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v6
        timeout-minutes: 2
        with:
          node-version: 24.9.0
      - uses: pnpm/action-setup@v4
        timeout-minutes: 2
        with:
          version: 10.33.2
          run_install: false
      - name: Execute all eighteen browser input adapter witnesses
        run: python3 scripts/ci/m9e_current_phase_js_diagnostic.py
      - name: Compact browser adapter qualification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-current-phase-js-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m9e-current-phase-js/summary.json
            ${{ runner.temp }}/m9e-current-phase-js/failure.txt
          if-no-files-found: error
          retention-days: 14
