name: M9E Actual Two Bundle Artifact Compatibility
on:
  push:
    branches: [codex/m9e-generated-content-compat-focused-20260907]
permissions:
  contents: read
concurrency:
  group: m9e-generated-content-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Start shared 1800 second budget
        run: echo "M9E_COMPAT_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Exact published generated bundle only on remote runner
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: 24beac2761fec35131380ba4b64fc5bd2cf4129d
          path: .m9e-new-content
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/fixtures/m9/engineering/game-content-bundle-v2.json
      - name: Restore existing dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned Rust tooling remotely
        timeout-minutes: 5
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Actual unfiltered two bundle compatibility target
        run: python3 scripts/ci/m9e_generated_content_compat_diagnostic.py
      - name: Compact focused result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-generated-content-compat-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-generated-content-compat/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Complete bounded remote diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-generated-content-compat-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-generated-content-compat/diagnostics/
          if-no-files-found: error
          retention-days: 14
