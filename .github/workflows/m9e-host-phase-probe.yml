name: M9E Host and Phase Probe
on:
  push:
    branches: [codex/m9e-host-phase-probe-20260923]
permissions:
  contents: read
concurrency:
  group: m9e-host-phase-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Retrieve exact product base for source comparison
        timeout-minutes: 5
        run: git fetch --no-tags --depth=1 origin 2f124b450b5c118191bf0d0775ac42a7d27c00cc
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Execute exact complete phase and host binaries
        run: python3 scripts/ci/m9e_host_phase_probe.py
      - name: Compact result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-host-phase-probe-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-host-phase-probe/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Remote named diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-host-phase-probe-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-host-phase-probe/diagnostics/
          if-no-files-found: error
          retention-days: 14
