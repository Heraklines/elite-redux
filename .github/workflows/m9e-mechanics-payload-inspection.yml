name: M9E Mechanics Payload Inspection
on:
  push:
    branches: [codex/m9e-mechanics-payload-inspection-20260908]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Inspect exact published payloads
        run: python3 scripts/ci/m9e_mechanics_payload_inspection.py
      - uses: actions/upload-artifact@v6
        with:
          name: m9e-mechanics-payload-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-mechanics-inspection/summary.json
          if-no-files-found: error
          retention-days: 14
