name: M9E Native Worker Repro Focused
on:
  push:
    branches: [codex/m9e-native-worker-repro-20260924]
permissions:
  contents: read
concurrency:
  group: m9e-native-worker-repro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Bind exact clean source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned Rust tools remotely
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify focused worker causal repro
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p er-kernel-worker --test current_process_v2 actual_abi2_process_exports_complete_causal_repro -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/m9e-worker-repro.log"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check worker Clippy
        working-directory: rust
        run: cargo clippy --locked -p er-kernel-worker --all-targets --no-deps -- -D warnings
      - name: Publish bounded diagnostic
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m9e-worker-repro"
          if test -f "$RUNNER_TEMP/m9e-worker-repro.log"; then
            tail -c 16384 "$RUNNER_TEMP/m9e-worker-repro.log" > "$RUNNER_TEMP/m9e-worker-repro/test-tail.txt"
          fi
          printf '{"source_sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/m9e-worker-repro/identity.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m9e-native-worker-repro-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-worker-repro/
          if-no-files-found: error
          retention-days: 14
