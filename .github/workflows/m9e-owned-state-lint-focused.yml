name: M9E Owned State Lint Repair
on:
  push:
    branches: [codex/m9e-owned-state-lint-focused-20260907]
permissions:
  contents: read
concurrency:
  group: m9e-owned-state-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Start shared deadline before checkout
        run: echo "M9E_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Restore existing dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Qualify exact one-file lint correction
        run: python3 scripts/ci/m9e_owned_state_lint_diagnostic.py
      - name: Compact lint result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-owned-state-lint-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-owned-state-lint/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Remote lint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-owned-state-lint-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-owned-state-lint/diagnostics/
          if-no-files-found: error
          retention-days: 14
