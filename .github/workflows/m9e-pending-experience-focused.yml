name: M9E Pending Experience Ownership Diagnostic
on:
  push:
    branches: [codex/m9e-pending-experience-focused-20260907]
permissions:
  contents: read
concurrency:
  group: m9e-pending-experience-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Start shared elapsed budget
        run: echo "M9E_FOCUSED_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Restore existing dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned Rust tooling remotely
        timeout-minutes: 5
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Twenty-six actual pending-owner and compatibility tests
        run: python3 scripts/ci/m9e_pending_experience_diagnostic.py
      - name: Compact focused result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-pending-experience-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-pending-experience-focused/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Complete remote diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-pending-experience-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-pending-experience-focused/diagnostics/
          if-no-files-found: error
          retention-days: 14
