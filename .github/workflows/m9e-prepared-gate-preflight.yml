name: M9E Prepared Gate Preflight
on:
  push:
    branches: [codex/m9e-native-proof-preflight-20260907]
permissions:
  contents: read
  actions: read
concurrency:
  group: m9e-prepared-gate-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    name: Prepared gate harness only - no game qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      M9E_EXPECTED_TESTS: '402'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Retrieve only bounded qualified aggregate metadata
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '10002411170'
          run-id: '34074237225'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m9e-retained-aggregate
      - name: Retrieve failed A diagnostics remotely for exact metadata transport regression
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '10005664644'
          run-id: '34085416670'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m9e-retained-native-a
      - name: Retrieve same-run bounded B identity proof
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '10005403375'
          run-id: '34085416670'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m9e-retained-native-b
      - name: Verify candidate and execute only harness selftests
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/m9e-preflight/compact" "$RUNNER_TEMP/m9e-preflight/diagnostics"
          set +e
          ruby -ryaml - <<'RUBY' > "$RUNNER_TEMP/m9e-preflight/diagnostics/workflow-validation.log" 2>&1
          workflow = YAML.safe_load(File.read('.github/workflows/m9e-focused-feedback.yml'), aliases: false)
          raise 'workflow permissions' unless workflow['permissions'] == {'contents' => 'read'}
          jobs = workflow.fetch('jobs')
          raise 'job inventory' unless jobs.keys.sort == %w[focused native_a native_b native_c native_d platform]
          jobs.each_value do |job|
            raise 'existing runner or time cap changed' unless job['runs-on'] == 'ubuntu-24.04' && job['timeout-minutes'] == 35
          end
          %w[a b c d].each do |lane|
            job = jobs.fetch('native_' + lane)
            raise 'conditional native job' if job.key?('if')
            raise 'wrong native lane' unless job.fetch('env')['M9E_NATIVE_LANE'] == lane
            run = job.fetch('steps').find {|step| step['id'] == 'native'}
            raise 'native execution differs' unless run['run'] == 'python3 scripts/ci/m9e_feedback.py'
            proof = job.fetch('steps').find {|step| step['id'] == 'native-proof'}
            raise 'wrong proof target' unless proof.fetch('with')['path'].end_with?('/proof/native-' + lane + '.json')
          end
          aggregate = jobs.fetch('focused')
          raise 'missing aggregate dependency' unless aggregate.fetch('needs').sort == %w[native_a native_b native_c native_d platform]
          raise 'third result binding' unless aggregate.fetch('env')['M9E_NATIVE_C_RESULT'] == '$' + '{{ needs.native_c.result }}'
          raise 'third manifest binding' unless aggregate.fetch('env')['M9E_NATIVE_C_MANIFEST_SHA256'] == '$' + '{{ needs.native_c.outputs.manifest_sha256 }}'
          raise 'fourth result binding' unless aggregate.fetch('env')['M9E_NATIVE_D_RESULT'] == '$' + '{{ needs.native_d.result }}'
          raise 'fourth manifest binding' unless aggregate.fetch('env')['M9E_NATIVE_D_MANIFEST_SHA256'] == '$' + '{{ needs.native_d.outputs.manifest_sha256 }}'
          third = aggregate.fetch('steps').select {|step| step.fetch('with', {})['artifact-ids'] == '$' + '{{ needs.native_c.outputs.proof_artifact_id }}'}
          raise 'third same-run download' unless third.length == 1 && third[0]['if'] == "needs.native_c.result == 'success'" && third[0]['with']['merge-multiple'] == true
          fourth = aggregate.fetch('steps').select {|step| step.fetch('with', {})['artifact-ids'] == '$' + '{{ needs.native_d.outputs.proof_artifact_id }}'}
          raise 'fourth same-run download' unless fourth.length == 1 && fourth[0]['if'] == "needs.native_d.result == 'success'" && fourth[0]['with']['merge-multiple'] == true
          puts 'Passed: parsed existing-runner graph, four mandatory native jobs and exact third/fourth proof transfers.'
          RUBY
          workflow_result=$?
          python3 scripts/ci/m9e_recovery_preflight.py >> "$RUNNER_TEMP/m9e-preflight/diagnostics/workflow-validation.log" 2>&1
          plan_result=$?
          if [ "$plan_result" -ne 0 ]; then workflow_result=$plan_result; fi
          python3 - <<'PY' >> "$RUNNER_TEMP/m9e-preflight/diagnostics/workflow-validation.log" 2>&1
          import copy, hashlib, json, os, pathlib, sys
          sys.path.insert(0, 'scripts/ci')
          import m9e_phases as phases
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          paths = list((root / 'm9e-retained-native-a').rglob('full-summary.json'))
          peers = list((root / 'm9e-retained-native-b').rglob('native-b.json'))
          if len(paths) != 1 or len(peers) != 1:
              raise RuntimeError('exact same-run metadata inputs absent')
          raw, peer = paths[0].read_bytes(), peers[0].read_bytes()
          if len(raw) != 99753 or hashlib.sha256(raw).hexdigest() != 'a1edba8306948c50b6feb8605dee6f0bc198e931ec8bcbcb21d376402ff0dff6':
              raise RuntimeError('actual failed A source evidence differs')
          if len(peer) != 51095 or hashlib.sha256(peer).hexdigest() != 'f4341575ba92f9a3975f610790e14faaa5450d5e6ac3f931df2df70758de10de':
              raise RuntimeError('same-run B identity differs')
          summary = json.loads(raw)
          inventory_receipt = summary['native_inventory']
          if inventory_receipt.get('file') != 'native-inventory.json' or inventory_receipt.get('targets') != 85:
              raise RuntimeError('retained inventory reference differs')
          inventory_path = paths[0].parent / inventory_receipt['file']
          if not inventory_path.is_file() or inventory_path.stat().st_size > 262144:
              raise RuntimeError('retained inventory metadata bound')
          inventory_raw = inventory_path.read_bytes()
          if hashlib.sha256(inventory_raw).hexdigest() != inventory_receipt['sha256']:
              raise RuntimeError('retained inventory hash differs')
          inventory = json.loads(inventory_raw)
          if (set(inventory) != {'native_inventory', 'assigned_targets', 'completed_targets'}
              or len(inventory['native_inventory']) != inventory_receipt['targets']
              or len(inventory['assigned_targets']) != summary['assigned_targets']['count']
              or len(inventory['completed_targets']) != summary['completed_targets']['count']):
              raise RuntimeError('retained inventory and assignment counts differ')
          summary.update(inventory)
          previous = phases.unpack_native_ids(json.loads(peer))
          expected = previous['identity']
          if (summary['product_sha'] != 'cbcd4a8ba1b6e913a3fa41edcb03a634b00520f2'
              or expected['product_sha'] != summary['product_sha'] or expected['run_id'] != '34085416670'
              or summary['first_failure'] != 'phase manifest exceeds 64 KiB'
              or summary['tests'] != {'selected': 699, 'executed': 665, 'passed': 665, 'failed': 0, 'skipped': 0}
              or summary['plan'] != previous['plan'] or summary['native_inventory'] != previous['inventory']):
              details = {'source': summary['product_sha'], 'peer_source': expected['product_sha'],
                  'run': expected['run_id'], 'failure': summary['first_failure'], 'tests': summary['tests'],
                  'same_plan': summary['plan'] == previous['plan'],
                  'same_inventory': summary['native_inventory'] == previous['inventory'],
                  'inventory_counts': [len(summary['native_inventory']), len(previous['inventory'])],
                  'differences': [{'a_keys': sorted(a), 'b_keys': sorted(b), 'a_target': [a.get('crate'), a.get('target')],
                      'b_target': [b.get('crate'), b.get('target')], 'same_ids': a.get('ids') == b.get('ids'),
                      'a_excluded': a.get('historical_excluded_ids'), 'b_excluded': b.get('historical_excluded_ids')}
                      for a, b in zip(summary['native_inventory'], previous['inventory']) if a != b][:3]}
              raise RuntimeError('actual A failure or shared native evidence differs: ' + json.dumps(details, sort_keys=True))
          # Reconstruct export_native's metadata from its captured full summary.
          # This checks serialization only; it never promotes the failed run.
          proof = {'version': 1, 'phase': 'native', 'status': 'passed', 'qualification': 'pending',
              'identity': expected, 'plan': summary['plan'], 'plan_sha256': phases.sha(phases.encoded(summary['plan'])),
              'tests': summary['tests'], 'selected_inventory_validated': summary['selected_inventory_validated'],
              'selected_test_ids_sha256': summary['selected_test_ids']['sha256'],
              'required_native_target_counts': summary['required_native_target_counts'],
              'lane': summary['native_lane'], 'inventory': summary['native_inventory'],
              'inventory_sha256': phases.sha(phases.encoded(summary['native_inventory'])),
              'assigned_targets': summary['assigned_targets'], 'completed_targets': summary['completed_targets'],
              'native_target_timing_ms': summary.get('native_target_timing_ms', {}),
              'native_timer_parity_digest': summary.get('native_timer_parity_digest'), 'cli': None, 'worker': None}
          for key in ('current_cost_probe', 'current_coop_entry', 'timer_mutant', 'replica_mutant', 'ledger_mutant', 'rule_worker'):
              if key in summary:
                  proof[key] = summary[key]
          worker = summary.get('worker_executable')
          if worker is not None:
              proof['worker'] = {key: value for key, value in worker.items() if key != 'path'}
          binding = summary.get('cli_executable')
          if binding is not None:
              proof['cli'] = {key: binding[key] for key in ('bytes', 'sha256', 'source_sha', 'target', 'profile', 'cargo_package_id', 'cargo_profile', 'manifest_path')}
              proof['cli']['file'] = 'er-cli'
          # Source-sensitive validators must read the retained candidate, not
          # this changed serializer. Materialize only their named source files,
          # Cargo manifests and existing content; execute no retained programs.
          import subprocess
          import m9e_current_cost as cost
          import m9e_coop_startup as coop
          retained_sha = expected['product_sha']
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', retained_sha], check=True, timeout=60,
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          retained_root = root / 'm9e-retained-native-source'
          manifests = [str(path.relative_to(pathlib.Path.cwd())) for path in sorted(pathlib.Path.cwd().glob('rust/crates/*/Cargo.toml'))]
          names = set([*cost.BUILD_SOURCE_PATHS, *coop.PRODUCT_PATHS, coop.HELPER, coop.ENTRY_PRODUCER,
                       coop.RTC_PRODUCER, cost.BUNDLE, cost.CONTENT_MANIFEST, *manifests])
          for name in sorted(names):
              relative = pathlib.PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts:
                  raise RuntimeError('retained source path outside repository')
              source = subprocess.run(['git', 'show', retained_sha + ':' + name], check=True, timeout=30,
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout
              if not 0 < len(source) <= (32 << 20 if name == cost.BUNDLE else 4 << 20):
                  raise RuntimeError('retained named source bound')
              destination = retained_root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source)
          phases.ROOT = retained_root
          phases.validate_native(proof, expected)
          indexed = phases.pack_native_ids(proof)
          ids = phases.encoded([[item['ids'], item['historical_excluded_ids']] for item in proof['inventory']])
          import base64, zlib
          old_wire = {'encoding': phases.NATIVE_COMPRESSED_ID_ENCODING,
              'proof': {**indexed['proof'], 'inventory': [{'crate': item['crate'], 'target': item['target']} for item in proof['inventory']]},
              'inventory_ids': {'decoded_bytes': len(ids), 'data': base64.b64encode(zlib.compress(ids, level=9)).decode('ascii')}}
          if len(phases.encoded(old_wire)) <= 65536:
              raise RuntimeError('actual old transport failure was not reproduced')
          output = root / 'm9e-preflight/diagnostics/reconstructed-native-a.json'
          wire_hash = phases.write_bounded(output, proof)
          restored = phases.read_bounded(output, wire_hash)
          if restored != proof:
              raise RuntimeError('complete native proof changed on roundtrip')
          phases.validate_native(restored, expected)
          receipt = {'qualification': 'metadata transport only; source run remains failed',
              'source_sha': os.environ['GITHUB_SHA'], 'retained_run': '34085416670',
              'old_wire_bytes': len(phases.encoded(old_wire)), 'wire_bytes': output.stat().st_size,
              'semantic_bytes': len(phases.encoded(proof)), 'wire_sha256': wire_hash,
              'semantic_sha256': phases.sha(phases.encoded(proof)), 'tests': proof['tests']}
          (root / 'm9e-preflight/compact/native-proof-transport.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
          proof_result=$?
          if [ "$proof_result" -ne 0 ]; then workflow_result=$proof_result; fi
          python3 -m unittest discover -s scripts/ci -p 'test_m9e*.py' -v > "$RUNNER_TEMP/m9e-preflight/diagnostics/harness-tests.log" 2>&1
          result=$?
          set -e
          export M9E_PREFLIGHT_EXIT="$result"
          export M9E_WORKFLOW_EXIT="$workflow_result"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm9e-preflight'
          log_path = root / 'diagnostics/harness-tests.log'
          raw = log_path.read_bytes()
          if len(raw) > 1048576:
              raise RuntimeError('harness log exceeds 1 MiB; no complete harness result')
          text = raw.decode('utf-8', errors='strict')
          finished = re.findall(r'^Ran (\d+) tests? in ([0-9.]+)s$', text, re.M)
          failures = re.findall(r'^(?:FAIL|ERROR): (.+)$', text, re.M)
          expected = int(os.environ['M9E_EXPECTED_TESTS'])
          passed = (os.environ['M9E_PREFLIGHT_EXIT'] == '0' and os.environ['M9E_WORKFLOW_EXIT'] == '0' and len(finished) == 1
                    and int(finished[0][0]) == expected and not failures and text.rstrip().endswith('OK'))
          details = text[text.find('\n======================================================================\n'):] if failures else text[-1024:]
          if os.environ['M9E_WORKFLOW_EXIT'] != '0':
              failures.append('workflow graph validation')
              details += (root / 'diagnostics/workflow-validation.log').read_text()[-8192:]
          diagnostic = details.encode()
          truncated = len(diagnostic) > 245760
          if truncated:
              diagnostic = b'TRUNCATED: full harness-tests.log remains in remote diagnostics.\n' + diagnostic[-245680:]
          (root / 'diagnostics/failure.txt').write_bytes(diagnostic)
          files = {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                   for path in sorted(pathlib.Path('scripts/ci').glob('m9e*.py'))}
          files['scripts/ci/test_m9e_recovery_integration.py'] = hashlib.sha256(pathlib.Path('scripts/ci/test_m9e_recovery_integration.py').read_bytes()).hexdigest()
          files['scripts/ci/test_m9e_ai_commands.py'] = hashlib.sha256(pathlib.Path('scripts/ci/test_m9e_ai_commands.py').read_bytes()).hexdigest()
          files['scripts/ci/test_m9e_coop_startup.py'] = hashlib.sha256(pathlib.Path('scripts/ci/test_m9e_coop_startup.py').read_bytes()).hexdigest()
          files['scripts/ci/test_m9e_feedback.py'] = hashlib.sha256(pathlib.Path('scripts/ci/test_m9e_feedback.py').read_bytes()).hexdigest()
          files['scripts/ci/m9e-targets.json'] = hashlib.sha256(pathlib.Path('scripts/ci/m9e-targets.json').read_bytes()).hexdigest()
          files['.github/workflows/m9e-focused-feedback.yml'] = hashlib.sha256(pathlib.Path('.github/workflows/m9e-focused-feedback.yml').read_bytes()).hexdigest()
          summary = {'status': 'passed' if passed else 'failed', 'qualification': 'harness only; no native or platform game qualification',
                     'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'expected': expected,
                     'actual': int(finished[0][0]) if len(finished) == 1 else None,
                     'seconds': finished[0][1] if len(finished) == 1 else None, 'failures': failures,
                     'exit_code': int(os.environ['M9E_PREFLIGHT_EXIT']), 'workflow_exit_code': int(os.environ['M9E_WORKFLOW_EXIT']), 'source_hashes': files,
                     'log_bytes': len(raw), 'log_sha256': hashlib.sha256(raw).hexdigest(), 'diagnostic_truncated': truncated}
          encoded = (json.dumps(summary, sort_keys=True, indent=2) + '\n').encode()
          if len(encoded) > 16384:
              raise RuntimeError('preflight compact summary exceeds bound')
          (root / 'compact/summary.json').write_bytes(encoded)
          print(encoded.decode())
          raise SystemExit(0 if passed else 1)
          PY
      - name: Compact harness result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-prepared-gate-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-preflight/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Remote harness diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-prepared-gate-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-preflight/diagnostics/
          if-no-files-found: error
          retention-days: 14
