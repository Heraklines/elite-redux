name: M9E Scene Projection Probe

on:
  push:
    branches: [codex/m9e-scene-projection-20260925]

permissions:
  contents: read

jobs:
  scene-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          submodules: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Check Rust formatting at this source SHA
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Execute browser host scene contract witnesses
        working-directory: rust
        run: cargo test --locked -p er-web --test m9e_host_v2 -- --nocapture
      - name: Check strict game and web Clippy
        working-directory: rust
        run: cargo clippy --locked -p er-game -p er-web --all-targets --no-deps -- -D warnings
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute browser effect router contract
        run: pnpm exec vitest run test/node/rust-browser/engineering/browser-effects-v2.test.ts test/node/rust-browser/engineering/current-scene-dom-v1.test.ts
      - name: Typecheck scene browser boundary
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --pretty false --skipLibCheck --strict
          --exactOptionalPropertyTypes --moduleResolution bundler --module ESNext --target ES2024
          --types node,vitest/globals --lib ES2024,DOM,WebWorker
          src/rust-browser/contracts/browser-contracts-v2.ts
          src/rust-browser/host/current-rust-browser-host.ts
          src/rust-browser/routes/browser-effects-v2.ts
          src/rust-browser/routes/current-scene-dom-v1.ts
          src/rust-browser/routes/rust-current-rtc-entry.ts
          src/rust-browser/routes/rust-current-rtc-rebind-entry.ts
          test/node/rust-browser/engineering/browser-effects-v2.test.ts
          test/node/rust-browser/engineering/current-scene-dom-v1.test.ts
      - name: Check browser scene Biome style
        run: >-
          pnpm exec biome ci --diagnostic-level=error
          src/rust-browser/contracts/browser-contracts-v2.ts
          src/rust-browser/routes/browser-effects-v2.ts
          src/rust-browser/routes/current-scene-dom-v1.ts
          test/node/rust-browser/engineering/current-scene-dom-v1.test.ts
      - name: Retain bounded scene Biome correction
        if: failure()
        shell: bash
        run: |
          pnpm exec biome check --write \
            src/rust-browser/contracts/browser-contracts-v2.ts \
            src/rust-browser/routes/browser-effects-v2.ts \
            src/rust-browser/routes/current-scene-dom-v1.ts \
            test/node/rust-browser/engineering/current-scene-dom-v1.test.ts || true
          git diff -- \
            src/rust-browser/contracts/browser-contracts-v2.ts \
            src/rust-browser/routes/browser-effects-v2.ts \
            src/rust-browser/routes/current-scene-dom-v1.ts \
            test/node/rust-browser/engineering/current-scene-dom-v1.test.ts \
            > "$RUNNER_TEMP/m9e-scene-style.patch"
          test "$(wc -c < "$RUNNER_TEMP/m9e-scene-style.patch")" -le 65536
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: m9e-scene-style-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-scene-style.patch
          if-no-files-found: error
          retention-days: 7
