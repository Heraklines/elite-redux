name: M9E Presentation Payload Probe

on:
  push:
    branches: [codex/m9e-presentation-payload-20260925]

permissions:
  contents: read

jobs:
  presentation-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          submodules: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Check Rust formatting at this source SHA
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Execute presentation payload contract witnesses
        working-directory: rust
        run: cargo test --locked -p er-game --test m9e_material_v6 -- --nocapture
      - name: Execute natural defender presentation witness
        working-directory: rust
        run: cargo test --locked -p er-kernel --test m9e_current_defender_ability -- --nocapture
      - name: Check strict game and kernel Clippy
        working-directory: rust
        run: cargo clippy --locked -p er-game -p er-kernel --all-targets --no-deps -- -D warnings
