name: M9E Scene Projection Probe

on:
  push:
    branches: [codex/m9e-scene-projection-20260925]

permissions:
  contents: read

jobs:
  scene-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          submodules: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Check Rust formatting at this source SHA
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Execute browser host scene contract witnesses
        working-directory: rust
        run: cargo test --locked -p er-web --test m9e_host_v2 -- --nocapture
      - name: Check strict game and web Clippy
        working-directory: rust
        run: cargo clippy --locked -p er-game -p er-web --all-targets --no-deps -- -D warnings
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Execute browser effect router contract
        run: npx vitest run test/node/rust-browser/engineering/browser-effects-v2.test.ts
