name: M9E Static Move Recoil
on:
  push:
    branches: [codex/m9e-static-recoil-focused-20260908]
permissions:
  contents: read
concurrency:
  group: m9e-static-recoil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Start shared deadline before checkout
        run: echo "M9E_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Retrieve exact baseline source within shared budget
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          elapsed=$(($(date +%s) - M9E_STARTED_AT))
          test "$elapsed" -ge 0
          remaining=$((1780 - elapsed))
          test "$remaining" -gt 0
          timeout "$((remaining < 600 ? remaining : 600))" git fetch --no-tags --depth=1 origin 5631395162aea5dfdafc95326d3142ddcb1ae533
      - name: Restore existing dependency downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - uses: actions/checkout@v6
        with:
          ref: 399d5d368f0b5642ebf8f45bd8a5e73350fa4de7
          path: oracle
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualify all five source-generated recoil tests
        run: python3 scripts/ci/m9e_static_recoil_diagnostic.py
      - name: Compact static recoil result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-static-recoil-summary-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-static-recoil/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Remote proposal diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-static-recoil-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-static-recoil/diagnostics/
          if-no-files-found: error
          retention-days: 14
