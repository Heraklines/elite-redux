name: M9E Town V2 Content Source Probe
on:
  push:
    branches: [codex/m9e-next-encounter-source-20260923, codex/m9e-connected-successor-20260924]
permissions:
  contents: read
concurrency:
  group: m9e-town-content-${{ github.ref }}
  cancel-in-progress: true
jobs:
  town-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Observe exact V2 Town pool remotely
        run: python3 scripts/ci/m9e_town_content_probe.py
      - name: Compact source-bound observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-content-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-content/summary.json
          if-no-files-found: error
          retention-days: 14
  town-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-focused-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned Rust tools remotely
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Qualify exact source-bound Town root selector
        run: python3 scripts/ci/m9e_town_selector_diagnostic.py
      - name: Search bounded natural wave-two Town seeds remotely
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --locked -p er-game --test m9e_town_seed_search -- --nocapture 2>&1 | tee "$RUNNER_TEMP/m9e-town-seed.log"
          grep -o 'candidate=m9e-town-handoff-[0-9]* before=!rnd,[^[:space:]]* time_offset=[0-9]* first=[0-9]*' "$RUNNER_TEMP/m9e-town-seed.log" > "$RUNNER_TEMP/m9e-town-seed-candidates.txt"
          test "$(wc -l < "$RUNNER_TEMP/m9e-town-seed-candidates.txt")" -eq 24
      - name: Publish bounded seed candidates
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-seed-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-seed-candidates.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Admit candidate seeds through natural raw bootstrap
        run: |
          set -uo pipefail
          M9E_TOWN_SEED_CANDIDATES="$RUNNER_TEMP/m9e-town-seed-candidates.txt" cargo test --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_phase_execution bounded_town_candidates_admit_natural_first_battle -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/m9e-town-natural.log"
          result=${PIPESTATUS[0]}
          grep -E 'admitted=m9e-town-handoff-|rejected=m9e-town-handoff-' "$RUNNER_TEMP/m9e-town-natural.log" > "$RUNNER_TEMP/m9e-town-natural-candidates.txt" || true
          exit "$result"
      - name: Qualify source Vine Whip owned turn
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_target_execution source_vine_whip_enters_the_owned_single_target_turn -- --exact
          cargo clippy --manifest-path rust/Cargo.toml --locked -p er-battle --lib --no-deps -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_target_execution --no-deps -- -D warnings
      - name: Qualify skipped reward Town plan
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_phase_execution fresh_account_town_opening_retains_source_enemy_shell -- --exact
          cargo test --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_phase_execution actual_reward_skip_admits_read_only_town_wave_two_plan -- --exact
          cargo clippy --manifest-path rust/Cargo.toml --locked -p er-game --lib --no-deps -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --locked -p er-kernel --test m9e_current_phase_execution --no-deps -- -D warnings
      - name: Publish bounded natural admission
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-natural-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-natural-candidates.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Compact source-bound selector result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-selector-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-selector/compact/
          if-no-files-found: error
          retention-days: 14
      - name: Bounded source formatting patch
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-selector-format-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-selector/format.patch
          if-no-files-found: ignore
          retention-days: 14
