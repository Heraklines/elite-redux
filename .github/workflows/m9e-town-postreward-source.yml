name: M9E Town Postreward Source Probe
on:
  push:
    branches: [codex/m9e-town-postreward-source-20260923]
permissions:
  contents: read
concurrency:
  group: m9e-town-postreward-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_NO_LAZY_FETCH: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout exact additive probe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned source without assets
        uses: actions/checkout@v6
        with:
          ref: 399d5d368f0b5642ebf8f45bd8a5e73350fa4de7
          path: .m9e-town-postreward-source-store
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
          package_json_file: .m9e-town-postreward-source-store/package.json
      - name: Observe actual reward to wave two in two fresh source processes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/m9e_town_postreward_source.py
      - name: Upload compact source-bound result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m9e-town-postreward-source-${{ github.sha }}
          path: ${{ runner.temp }}/m9e-town-postreward-source/compact/
          if-no-files-found: error
          retention-days: 14
