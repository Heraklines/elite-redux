name: Promote M9 Rollout Policy

on:
  push:
    branches: [arch/rust-kernel-m9-production]
    paths: [.github/workflows/promote-m9-rollout.yml]
  workflow_dispatch:
    inputs:
      candidate_release:
        required: true
        type: string
      stable_release:
        required: true
        type: string
      legacy_release:
        required: false
        type: string
      target_ring:
        required: true
        type: choice
        options: [R0, R1, R2, R3, R4, R5, R6, R7]
      expected_current_policy_hash:
        description: SHA-256 of current signed policy, or NONE for R0
        required: true
        type: string
      observation_run_id:
        description: Successful deployed-preview journey workflow run; required for R2
        required: false
        type: number
      explicit_confirmation:
        description: Type PROMOTE_IDENTICAL_BYTES
        required: true
        type: string

permissions:
  actions: read
  contents: read
jobs:
  promote:
    if: inputs.explicit_confirmation == 'PROMOTE_IDENTICAL_BYTES'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m9-rollout-promotion
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Validate deployed-preview observation run
        if: inputs.target_ring == 'R2'
        uses: actions/github-script@v8
        with:
          script: |
            const runId = Number('${{ inputs.observation_run_id }}');
            if (!Number.isSafeInteger(runId) || runId < 1) {
              core.setFailed('R2 requires a deployed-preview observation run');
              return;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.data.name !== 'M9 Preview Focused Qualification' || run.data.conclusion !== 'success') {
              core.setFailed('R2 observation workflow is not the exact successful focused qualification');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const journeys = artifacts.filter(
              artifact => artifact.name.startsWith('m9-preview-live-journey-') && !artifact.expired,
            );
            if (journeys.length !== 1) {
              core.setFailed('R2 observation run must contain exactly one live-journey artifact');
            }
      - name: Download deployed-preview observation
        if: inputs.target_ring == 'R2'
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.observation_run_id }}
          pattern: m9-preview-live-journey-*
          path: ${{ runner.temp }}/m9-observation
          github-token: ${{ github.token }}
      - name: Validate deployed-preview observation
        if: inputs.target_ring == 'R2'
        run: |
          EVIDENCE=$(find "$RUNNER_TEMP/m9-observation" -name evidence.json -type f -print -quit)
          test -n "$EVIDENCE"
          test "$(jq -r .release_id "$EVIDENCE")" = "${{ inputs.candidate_release }}"
          test "$(jq -r .active_duration_ms "$EVIDENCE")" -ge 60000
          test "$(jq -r .hard_stop_failures "$EVIDENCE")" = 0
          test "$(jq -r .imports_disabled "$EVIDENCE")" = true
          test "$(jq -r .signed_r1_assignment "$EVIDENCE")" = true
          test "$(jq -r .exact_release_cache "$EVIDENCE")" = true
          test "$(jq -r .raw_input_transition "$EVIDENCE")" = true
          test "$(jq -r .save_write_readback "$EVIDENCE")" = true
          test "$(jq -r .natural_reload_readback "$EVIDENCE")" = true
          test "$(jq -r .teardown.lease_reacquired_after_close "$EVIDENCE")" = true
      - name: Fetch immutable release, current policy, and health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.127.1 r2 object get "er-m9-releases/manifests/${{ inputs.candidate_release }}.json" --file "$RUNNER_TEMP/manifest.json" --remote
          npx --yes wrangler@4.127.1 r2 object get "er-m9-releases/manifests/${{ inputs.stable_release }}.json" --file "$RUNNER_TEMP/stable.json" --remote
          if [ "${{ inputs.expected_current_policy_hash }}" != NONE ]; then
            npx --yes wrangler@4.127.1 r2 object get er-m9-releases/policies/current.json --file "$RUNNER_TEMP/current.json" --remote
            npx --yes wrangler@4.127.1 r2 object get "er-m9-releases/health/${{ inputs.candidate_release }}.json" --file "$RUNNER_TEMP/health.json" --remote
            test "$(sha256sum "$RUNNER_TEMP/current.json" | cut -d' ' -f1)" = "${{ inputs.expected_current_policy_hash }}"
            node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/current.json"
            jq -r .payload "$RUNNER_TEMP/current.json" > "$RUNNER_TEMP/current-payload.json"
            CURRENT_ARGS="--current $RUNNER_TEMP/current.json"
            echo "CURRENT_ARGS=$CURRENT_ARGS" >> "$GITHUB_ENV"
          else
            test "${{ inputs.target_ring }}" = R0
            NOW=$(($(date +%s) * 1000))
            MANIFEST_HASH=$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)
            EMPTY_HASH=$(printf '[]' | sha256sum | cut -d' ' -f1)
            NO_POLICY_HASH=$(printf 'M9_R0_NO_CURRENT_POLICY' | sha256sum | cut -d' ' -f1)
            jq -n \
              --arg release '${{ inputs.candidate_release }}' \
              --arg policy "$NO_POLICY_HASH" \
              --arg manifest "$MANIFEST_HASH" \
              --arg aggregate "$EMPTY_HASH" \
              --argjson start "$((NOW - 1))" \
              --argjson end "$NOW" \
              '{schema_version:1,release_id:$release,policy_hash:$policy,release_manifest_hash:$manifest,
                input_event_aggregate_hash:$aggregate,window_start_ms:$start,window_end_ms:$end,
                observed_sessions:0,observed_minutes:0,worker_initialization_failure_basis_points:0,
                unrecoverable_kernel_fault_basis_points:0,deterministic_migration_failures:0,
                cloud_save_regression_basis_points:0,coop_relative_regression_percent:0,
                coop_absolute_regression_basis_points:0,input_latency_regression_percent:0,
                crash_free_regression_basis_points:0,hard_stop:false,hard_stop_fingerprint:null}' \
              > "$RUNNER_TEMP/health.json"
          fi
          node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/manifest.json"
          node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/stable.json"
          test "$(jq -r .payload.release_id "$RUNNER_TEMP/manifest.json")" = "${{ inputs.candidate_release }}"
          test "$(jq -r .payload.release_id "$RUNNER_TEMP/stable.json")" = "${{ inputs.stable_release }}"
          LEGACY='${{ inputs.legacy_release }}'
          if [ -n "$LEGACY" ]; then
            echo "$LEGACY" | grep -Eq '^[a-zA-Z0-9._:-]{1,128}$'
            echo "LEGACY_ARGS=--legacy-release $LEGACY" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.target_ring }}" = R0 ]; then
            test "$LEGACY" = "${{ inputs.stable_release }}"
            test "$(jq -r .payload.channel "$RUNNER_TEMP/stable.json")" = LEGACY_TRANSITION
            test "$(jq -r .payload.channel "$RUNNER_TEMP/manifest.json")" != LEGACY_TRANSITION
          fi
          test "$(jq -r .release_id "$RUNNER_TEMP/health.json")" = "${{ inputs.candidate_release }}"
          test "$(jq -r .release_manifest_hash "$RUNNER_TEMP/health.json")" = "$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)"
          if [ "${{ inputs.expected_current_policy_hash }}" != NONE ]; then
            test "$(jq -r .policy_hash "$RUNNER_TEMP/health.json")" = "${{ inputs.expected_current_policy_hash }}"
          fi
      - name: Evaluate health and sign next policy
        env:
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/m9-rollout-policy.mjs \
            --target-ring "${{ inputs.target_ring }}" \
            --candidate-release "${{ inputs.candidate_release }}" \
            --stable-release "${{ inputs.stable_release }}" \
            --health "$RUNNER_TEMP/health.json" \
            --output "$RUNNER_TEMP/policy-payload.json" \
            $CURRENT_ARGS \
            $LEGACY_ARGS
          node scripts/m9-sign-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/policy-payload.json" --output "$RUNNER_TEMP/policy.json" --key-id m9-prod-2026-01
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/policy.json"
      - name: Publish policy revision only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          REVISION=$(jq -r .payload.policy_version "$RUNNER_TEMP/policy.json")
          npx --yes wrangler@4.127.1 r2 object put "er-m9-releases/policies/${REVISION}.json" --file "$RUNNER_TEMP/policy.json" --content-type application/json --remote
          npx --yes wrangler@4.127.1 r2 object put er-m9-releases/policies/current.json --file "$RUNNER_TEMP/policy.json" --content-type application/json --remote
          sha256sum "$RUNNER_TEMP/policy.json"
