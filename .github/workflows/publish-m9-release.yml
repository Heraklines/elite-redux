name: Publish M9 Immutable Release

on:
  push:
    branches: [arch/rust-kernel-m9-production]
    paths: [.github/workflows/publish-m9-release.yml]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build M9 Immutable Release run ID
        required: true
        type: number
      release_id:
        required: true
        type: string
      explicit_confirmation:
        description: Type PUBLISH_IMMUTABLE_RELEASE
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: inputs.explicit_confirmation == 'PUBLISH_IMMUTABLE_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: m9-release-publish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: m9-release-${{ inputs.release_id }}
          path: ${{ runner.temp }}/m9-release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify immutable release before publication
        run: node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/m9-release/signed-manifest.json" --artifacts "$RUNNER_TEMP/m9-release"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Publish content-addressed artifacts without activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4.127.1 r2 bucket list --json | jq -e '.[] | select(.name == "er-m9-releases")' > /dev/null; then
            npx --yes wrangler@4.127.1 r2 bucket create er-m9-releases
          fi
          MANIFEST="$RUNNER_TEMP/m9-release/signed-manifest.json"
          for kind in bootstrap_js browser_js worker_js wasm_glue_js wasm content asset_manifest service_worker session_template; do
            URL=$(jq -r ".payload.artifacts.${kind}.url" "$MANIFEST")
            NAME=$(basename "$URL")
            MEDIA=$(jq -r ".payload.artifacts.${kind}.media_type" "$MANIFEST")
            KEY=${URL#/__m9_releases/}
            npx --yes wrangler@4.127.1 r2 object put "er-m9-releases/${KEY}" --file "$RUNNER_TEMP/m9-release/${NAME}" --content-type "$MEDIA" --remote
          done
          npx --yes wrangler@4.127.1 r2 object put "er-m9-releases/manifests/${{ inputs.release_id }}.json" --file "$MANIFEST" --content-type application/json --remote
      - name: Record publication identity
        run: |
          sha256sum "$RUNNER_TEMP/m9-release/signed-manifest.json"
          printf '%s\n' "Published immutable release ${{ inputs.release_id }}; activation unchanged"
