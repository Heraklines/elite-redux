name: Reset M9 Candidate to R0

on:
  push:
    branches: [arch/rust-kernel-m9-production]
    paths: [.github/workflows/reset-m9-r0.yml]
  workflow_dispatch:
    inputs:
      candidate_release:
        required: true
        type: string
      stable_release:
        required: true
        type: string
      legacy_release:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      g52_run_id:
        required: true
        type: number
      expected_current_policy_hash:
        required: true
        type: string
      explicit_confirmation:
        description: Type RESET_NEW_CANDIDATE_TO_R0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: m9-rollout-promotion
  cancel-in-progress: false

jobs:
  reset:
    if: github.event_name == 'workflow_dispatch' && inputs.explicit_confirmation == 'RESET_NEW_CANDIDATE_TO_R0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m9-rollout-promotion
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact candidate qualification
        uses: actions/github-script@v8
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.g52_run_id }}'),
            });
            if (run.data.head_sha !== '${{ inputs.candidate_sha }}'
                || run.data.conclusion !== 'success'
                || run.data.name !== 'Rust Kernel M9 G52 Production Qualification') {
              core.setFailed('M9 R0 reset candidate lacks exact successful G52 evidence');
            }
      - name: Fetch and verify current R0 plus immutable releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.127.1 r2 object get er-m9-releases/policies/current.json --file "$RUNNER_TEMP/current.json" --remote
          test "$(sha256sum "$RUNNER_TEMP/current.json" | cut -d' ' -f1)" = "${{ inputs.expected_current_policy_hash }}"
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/current.json"
          test "$(jq -r .payload.active_ring "$RUNNER_TEMP/current.json")" = R0
          for pair in candidate:${{ inputs.candidate_release }} stable:${{ inputs.stable_release }} legacy:${{ inputs.legacy_release }}; do
            NAME=${pair%%:*}; RELEASE=${pair#*:}
            npx --yes wrangler@4.127.1 r2 object get "er-m9-releases/manifests/${RELEASE}.json" --file "$RUNNER_TEMP/${NAME}.json" --remote
            node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/${NAME}.json"
            test "$(jq -r .payload.release_id "$RUNNER_TEMP/${NAME}.json")" = "$RELEASE"
          done
          test "$(jq -r .payload.integration_sha "$RUNNER_TEMP/candidate.json")" = "${{ inputs.candidate_sha }}"
          test "$(jq -r .payload.channel "$RUNNER_TEMP/candidate.json")" != LEGACY_TRANSITION
          test "$(jq -r .payload.channel "$RUNNER_TEMP/stable.json")" = LEGACY_TRANSITION
          cmp "$RUNNER_TEMP/stable.json" "$RUNNER_TEMP/legacy.json"
      - name: Sign a new zero-percent R0 policy
        env:
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          NOW=$(($(date +%s) * 1000)); EXPIRES=$((NOW + 2592000000))
          VERSION=$(( $(jq -r .payload.policy_version "$RUNNER_TEMP/current.json") + 1 ))
          jq \
            --arg candidate '${{ inputs.candidate_release }}' \
            --arg stable '${{ inputs.stable_release }}' \
            --arg legacy '${{ inputs.legacy_release }}' \
            --arg policy "m9-policy-r0-${VERSION}-${{ inputs.candidate_release }}" \
            --argjson version "$VERSION" --argjson now "$NOW" --argjson expires "$EXPIRES" \
            '.payload | .policy_id=$policy | .policy_version=$version | .candidate_release=$candidate |
             .stable_release=$stable | .legacy_release=$legacy | .active_ring="R0" |
             .issued_at=$now | .expires_at=$expires' \
            "$RUNNER_TEMP/current.json" > "$RUNNER_TEMP/reset-payload.json"
          node scripts/m9-sign-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/reset-payload.json" --output "$RUNNER_TEMP/reset-policy.json" --key-id m9-prod-2026-01
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/reset-policy.json"
      - name: Publish R0 policy only without touching saves or active sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION=$(jq -r .payload.policy_version "$RUNNER_TEMP/reset-policy.json")
          npx --yes wrangler@4.127.1 r2 object put "er-m9-releases/policies/${VERSION}.json" --file "$RUNNER_TEMP/reset-policy.json" --content-type application/json --remote
          npx --yes wrangler@4.127.1 r2 object put er-m9-releases/policies/current.json --file "$RUNNER_TEMP/reset-policy.json" --content-type application/json --remote
          sha256sum "$RUNNER_TEMP/reset-policy.json"
