name: Rollback M9 Rollout Policy

on:
  push:
    branches: [arch/rust-kernel-m9-production]
    paths: [.github/workflows/rollback-m9-rollout.yml]
  workflow_dispatch:
    inputs:
      affected_release:
        required: true
        type: string
      target_release:
        required: true
        type: string
      scope:
        required: true
        type: choice
        options: [NEW_SESSIONS, UNSTARTED_ASSIGNED_SESSIONS, ALL_SAFE_BOUNDARY_SESSIONS]
      reason:
        required: true
        type: choice
        options: [HARD_STOP, RATE_REGRESSION, OPERATOR_DRILL, RELEASE_REVOKED]
      expected_current_policy_hash:
        required: true
        type: string
      explicit_confirmation:
        description: Type ROLLBACK_TO_PREVIOUS_RUST
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    if: inputs.explicit_confirmation == 'ROLLBACK_TO_PREVIOUS_RUST'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m9-rollout-rollback
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Fetch and verify immutable rollback inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler r2 object get "er-m9-releases/manifests/${{ inputs.affected_release }}.json" --file "$RUNNER_TEMP/affected.json" --remote
          pnpm exec wrangler r2 object get "er-m9-releases/manifests/${{ inputs.target_release }}.json" --file "$RUNNER_TEMP/target.json" --remote
          pnpm exec wrangler r2 object get er-m9-releases/policies/current.json --file "$RUNNER_TEMP/current-policy.json" --remote
          node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/affected.json"
          node scripts/verify-kernel-m9-release.mjs --manifest "$RUNNER_TEMP/target.json"
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/current-policy.json"
          test "$(sha256sum "$RUNNER_TEMP/current-policy.json" | cut -d' ' -f1)" = "${{ inputs.expected_current_policy_hash }}"
          test "$(jq -r .payload.previous_rust_release "$RUNNER_TEMP/affected.json")" = "${{ inputs.target_release }}"
          test "$(jq -r .payload.channel "$RUNNER_TEMP/target.json")" != LEGACY_TRANSITION
      - name: Sign rollback directive and policy pointer
        env:
          M9_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.M9_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          NOW=$(($(date +%s) * 1000)); EXPIRES=$((NOW + 86400000))
          CURRENT_VERSION=$(jq -r .payload.policy_version "$RUNNER_TEMP/current-policy.json")
          jq -n --arg affected '${{ inputs.affected_release }}' --arg target '${{ inputs.target_release }}' \
            --arg scope '${{ inputs.scope }}' --arg reason '${{ inputs.reason }}' --argjson now "$NOW" --argjson expires "$EXPIRES" --argjson version "$((CURRENT_VERSION + 1))" \
            '{schema_version:1,directive_id:("rollback-"+($version|tostring)),affected_release:$affected,target_release:$target,target_runtime:"RUST_PRODUCTION",scope:$scope,reason:$reason,issued_at:$now,expires_at:$expires,policy_version:$version}' \
            > "$RUNNER_TEMP/directive-payload.json"
          node scripts/m9-sign-document.mjs --domain er-m9:rollback-directive-v1 --input "$RUNNER_TEMP/directive-payload.json" --output "$RUNNER_TEMP/directive.json" --key-id m9-prod-2026-01
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollback-directive-v1 --input "$RUNNER_TEMP/directive.json"
          jq --arg target '${{ inputs.target_release }}' --argjson now "$NOW" --argjson expires "$((NOW + 2592000000))" \
            '.payload | .policy_version += 1 | .candidate_release=$target | .stable_release=$target | .issued_at=$now | .expires_at=$expires' \
            "$RUNNER_TEMP/current-policy.json" > "$RUNNER_TEMP/rollback-policy-payload.json"
          node scripts/m9-sign-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/rollback-policy-payload.json" --output "$RUNNER_TEMP/rollback-policy.json" --key-id m9-prod-2026-01
          node scripts/verify-m9-signed-document.mjs --domain er-m9:rollout-policy-v1 --input "$RUNNER_TEMP/rollback-policy.json"
      - name: Publish rollback pointers without rebuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(jq -r .payload.directive_id "$RUNNER_TEMP/directive.json")
          pnpm exec wrangler r2 object put "er-m9-releases/rollback/${ID}.json" --file "$RUNNER_TEMP/directive.json" --content-type application/json --remote
          pnpm exec wrangler r2 object put er-m9-releases/rollback/current.json --file "$RUNNER_TEMP/directive.json" --content-type application/json --remote
          pnpm exec wrangler r2 object put er-m9-releases/policies/current.json --file "$RUNNER_TEMP/rollback-policy.json" --content-type application/json --remote
