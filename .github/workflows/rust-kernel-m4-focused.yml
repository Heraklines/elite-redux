name: Rust Kernel M4 Focused

on:
  push:
    branches:
      - "wrk/rk-m4-*"
      - "ci/rust-m4/**"
    paths:
      - ".github/workflows/rust-kernel-m4-focused.yml"
      - "rust/**"
      - "schemas/kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m4-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-rust:
    name: Focused M4 Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out focused candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/
            /schemas/kernel/
          submodules: false

      - name: Determine affected crates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin arch/rust-kernel-m4
          base="$(git merge-base origin/arch/rust-kernel-m4 "$GITHUB_SHA")"
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/m4-focused-paths"

          : > "$RUNNER_TEMP/m4-focused-crates"
          while IFS= read -r path; do
            case "$path" in
              rust/crates/*)
                crate_dir="${path#rust/crates/}"
                crate_dir="${crate_dir%%/*}"
                manifest="rust/crates/$crate_dir/Cargo.toml"
                if [[ -f "$manifest" ]]; then
                  package="$(sed -n 's/^name = "\([^"]*\)"/\1/p' "$manifest")"
                  if [[ -n "$package" ]]; then
                    printf '%s|%s\n' "$package" "rust/crates/$crate_dir" >> "$RUNNER_TEMP/m4-focused-crates"
                  fi
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/m4-focused-paths"

          sort -u "$RUNNER_TEMP/m4-focused-crates" -o "$RUNNER_TEMP/m4-focused-crates"
          if [[ ! -s "$RUNNER_TEMP/m4-focused-crates" ]]; then
            printf '%s|%s\n' "er-run" "rust/crates/er-run" > "$RUNNER_TEMP/m4-focused-crates"
          fi
          cat "$RUNNER_TEMP/m4-focused-crates"

      - name: Cache focused Rust artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m4-focused-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            m4-focused-${{ runner.os }}-${{ runner.arch }}-
            m4-foundation-${{ runner.os }}-${{ runner.arch }}-

      - name: Format and compile workspace
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all -- --check
            cargo check --workspace --all-targets
          } 2>&1 | tee focused-check.log

      - name: Run affected M4 tests
        shell: bash
        run: |
          set -euo pipefail
          : > rust/focused-test.log
          while IFS='|' read -r package crate_dir; do
            echo "== $package ==" | tee -a rust/focused-test.log
            cargo test --manifest-path rust/Cargo.toml -p "$package" --lib 2>&1 | tee -a rust/focused-test.log
            for test_file in "$crate_dir"/tests/m4_*.rs; do
              [[ -f "$test_file" ]] || continue
              test_name="$(basename "$test_file" .rs)"
              cargo test --manifest-path rust/Cargo.toml -p "$package" --test "$test_name" 2>&1 | tee -a rust/focused-test.log
            done
          done < "$RUNNER_TEMP/m4-focused-crates"

      - name: Require committed lockfile
        working-directory: rust
        run: git diff --exit-code -- Cargo.lock

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-focused-rust-log
          path: |
            rust/focused-check.log
            rust/focused-test.log
          if-no-files-found: ignore
          retention-days: 7
