name: Rust Kernel M4 Gate

on:
  push:
    branches:
      - "arch/rust-kernel-m4"
      - "wrk/rk-m4-*"
    paths:
      - ".github/workflows/rust-kernel-m4.yml"
      - "docs/plans/rust-kernel/m4-*.md"
      - "rust/**"
      - "scripts/check-kernel-m4-contract.mjs"
      - "scripts/export-kernel-m4-oracle.mjs"
      - "test/kernel-fixtures/m4/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/rust-kernel-m4.yml"
      - "docs/plans/rust-kernel/m4-*.md"
      - "rust/**"
      - "scripts/check-kernel-m4-contract.mjs"
      - "scripts/export-kernel-m4-oracle.mjs"
      - "test/kernel-fixtures/m4/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m4-${{ github.ref }}
  cancel-in-progress: true

env:
  M3_BASE_SHA: 45c89493e7edec9c4da247a98cd7858b1f015c09

jobs:
  m4-source-lock:
    name: M4 source lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Preserve M3 production TypeScript and source lock
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M3_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$M3_BASE_SHA" "$GITHUB_SHA"
          git diff --exit-code "$M3_BASE_SHA" "$GITHUB_SHA" -- rust/source-lock.toml src
          git diff --check "$M3_BASE_SHA" "$GITHUB_SHA"

  m4-contract-freeze:
    name: M4 contract freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out contract surface
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/rust-kernel-m4.yml
            /rust/contracts/
            /rust/fixtures/m4/
            /scripts/check-kernel-m4-contract.mjs
          submodules: false

      - name: Validate exact G12 contracts and manifests
        env:
          M4_ATTESTATION_PATH: artifacts/m4-g12-attestation.json
        run: node scripts/check-kernel-m4-contract.mjs

      - name: Upload G12 attestation
        uses: actions/upload-artifact@v6
        with:
          name: m4-g12-attestation
          path: artifacts/m4-g12-attestation.json
          if-no-files-found: error
          retention-days: 30

  m4-foundation-rust:
    name: M4 foundation Rust
    needs:
      - m4-source-lock
      - m4-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Rust foundation
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/
            /test/kernel-fixtures/
            /schemas/kernel/
          submodules: false

      - name: Cache Rust foundation artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m4-foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            m4-foundation-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting and workspace
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all -- --check
            cargo check --workspace --all-targets
          } 2>&1 | tee cargo-diagnostics.log

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-foundation-cargo-log
          path: rust/cargo-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
 
      - name: Run focused M4 foundation contracts
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test -p er-types --test m4_types
            cargo test -p er-state --test m4_state_v2
            cargo test -p er-run --test m4_content
            cargo test -p er-content --test m4_pack
            cargo test -p er-state --test m4_migration
            cargo test -p er-run --test m4_settlement
            cargo test -p er-state --test m4_foundation_properties
            cargo test -p er-run --test m4_foundation_properties
            cargo test -p er-kernel --test m4_snapshot_v3
            cargo test -p er-sim --test m4_pair_snapshot_v3
          } 2>&1 | tee cargo-test-diagnostics.log

      - name: Upload Rust test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-foundation-cargo-test-log
          path: rust/cargo-test-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require committed lockfile
        working-directory: rust
        run: git diff --exit-code -- Cargo.lock

      - name: Upload generated lockfile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-foundation-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  m4-oracle-probe:
    name: M4 oracle fresh-process probe
    needs:
      - m4-source-lock
      - m4-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact oracle candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Install repository-pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install repository-pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore pinned BLAKE3 verifier
        id: b3sum-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m4-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6

      - name: Install pinned BLAKE3 verifier
        run: |
          if ! b3sum --version 2>/dev/null | grep -Fxq 'b3sum 1.8.6'; then
            cargo install b3sum --version 1.8.6 --locked
          fi
          b3sum --version | grep -Fx 'b3sum 1.8.6'

      - name: Save pinned BLAKE3 verifier
        if: steps.b3sum-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m4-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Export exact M4 oracle vectors twice
        env:
          LC_ALL: C
          LANG: C
          TZ: UTC
          M4_ORACLE_GAP_REPORT: ${{ github.workspace }}/artifacts/m4-oracle-gaps.json
        run: |
          mkdir -p artifacts
          node scripts/export-kernel-m4-oracle.mjs --output-root "$RUNNER_TEMP/m4-oracle-output"

      - name: Upload oracle output or typed gaps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-oracle-probe
          path: |
            artifacts/m4-oracle-gaps.json
            ${{ runner.temp }}/m4-oracle-output
          if-no-files-found: warn
          retention-days: 14
