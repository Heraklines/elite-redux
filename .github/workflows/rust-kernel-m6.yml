name: Rust Kernel M6 Gate

on:
  push:
    branches:
      - "arch/rust-kernel-m6"
      - "wrk/rk-m6-*"
      - "ci/rust-m6/**"
    paths:
      - ".github/workflows/rust-kernel-m6.yml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docs/plans/rust-kernel/m6-*.md"
      - "rust/**"
      - "scripts/*kernel-m6*.mjs"
      - "scripts/export-kernel-m3-oracle.mjs"
      - "scripts/export-kernel-m4-oracle.mjs"
      - "scripts/export-kernel-m5-source-catalog.mjs"
      - "scripts/prepare-kernel-m5-oracle-refresh.mjs"
      - "test/kernel-fixtures/m3/**"
      - "test/kernel-fixtures/m4/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m6-${{ github.ref }}
  cancel-in-progress: true

env:
  M5_FINAL_SHA: 200caaee1697fe40a293f0a5da76af8b11f3cea9
  M6_ORACLE_SHA: 3bb6d49c924293ef79e3ab2f11e10cf4f5b9c6c7

jobs:
  m6-source-lock:
    name: M6 source lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false
      - name: Preserve M5 production TypeScript
        run: |
          set -euo pipefail
          git cat-file -e "${M5_FINAL_SHA}^{commit}"
          git merge-base --is-ancestor "$M5_FINAL_SHA" "$GITHUB_SHA"
          git diff --exit-code "$M5_FINAL_SHA" "$GITHUB_SHA" -- src rust/source-lock.toml
          git diff --check "$M5_FINAL_SHA" "$GITHUB_SHA"

  m6-m5-final-manifest:
    name: M6 M5 final manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/fixtures/m5/m5-final-qualification.json
          submodules: false
      - name: Validate exact M5 final evidence
        run: |
          set -euo pipefail
          test "$(jq -r '.sha' rust/fixtures/m5/m5-final-qualification.json)" = "$M5_FINAL_SHA"
          test "$(jq -r '.gate_run_id' rust/fixtures/m5/m5-final-qualification.json)" = 32655233460
          test "$(jq -r '[to_entries[] | select(.key != "milestone" and .key != "sha" and .key != "gate_run_id") | .value] | all(. == "success")' rust/fixtures/m5/m5-final-qualification.json)" = true

  m6-source-catalog:
    name: M6 raw source catalog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize exact M6 oracle
        run: git worktree add --detach "$RUNNER_TEMP/m6-oracle" "$M6_ORACLE_SHA"
      - name: Export deterministic M6 source catalog
        run: |
          set -euo pipefail
          node scripts/export-kernel-m5-source-catalog.mjs \
            --oracle-root "$RUNNER_TEMP/m6-oracle" \
            --oracle-sha "$M6_ORACLE_SHA" \
            --output "$RUNNER_TEMP/m6-source-catalog-v2.json"
      - uses: actions/upload-artifact@v6
        with:
          name: m6-source-catalog
          path: ${{ runner.temp }}/m6-source-catalog-v2.json
          if-no-files-found: error
          retention-days: 30

  m6-oracle-refresh:
    name: M6 ${{ matrix.fixture }} oracle refresh
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        fixture: [m3, m4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v5
        id: b3sum-cache
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m6-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6
      - name: Install pinned BLAKE3 verifier
        run: |
          set -euo pipefail
          if ! b3sum --version 2>/dev/null | grep -Fxq 'b3sum 1.8.6'; then
            cargo install b3sum --version 1.8.6 --locked
          fi
          b3sum --version | grep -Fx 'b3sum 1.8.6'
      - uses: actions/cache/save@v5
        if: steps.b3sum-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m6-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6
      - name: Apply test-only oracle overlay
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/m6-oracle" "$M6_ORACLE_SHA"
          node scripts/prepare-kernel-m5-oracle-refresh.mjs \
            --oracle-root "$RUNNER_TEMP/m6-oracle" \
            --oracle-sha "$M6_ORACLE_SHA"
      - name: Install immutable oracle dependencies
        working-directory: ${{ runner.temp }}/m6-oracle
        run: pnpm install --frozen-lockfile
      - name: Export refreshed fixtures twice
        working-directory: ${{ runner.temp }}/m6-oracle
        env:
          LC_ALL: C
          LANG: C
          TZ: UTC
          M5_ORACLE_REFRESH_SHA: ${{ env.M6_ORACLE_SHA }}
          M4_ORACLE_GAP_REPORT: ${{ runner.temp }}/m6-${{ matrix.fixture }}-oracle/gaps.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m6-${{ matrix.fixture }}-oracle"
          if [[ "${{ matrix.fixture }}" == "m3" ]]; then
            node scripts/export-kernel-m3-oracle.mjs --output-root "$RUNNER_TEMP/m6-m3-oracle" \
              2>&1 | tee "$RUNNER_TEMP/m6-m3-oracle.log"
          else
            node scripts/export-kernel-m4-oracle.mjs --output-root "$RUNNER_TEMP/m6-m4-oracle" \
              2>&1 | tee "$RUNNER_TEMP/m6-m4-oracle.log"
          fi
      - name: Publish failure annotation
        if: failure()
        run: |
          diagnostic="$(tail -n 60 "$RUNNER_TEMP/m6-${{ matrix.fixture }}-oracle.log" 2>/dev/null | tail -c 3500 || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=M6 ${{ matrix.fixture }} oracle refresh failure::$diagnostic"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m6-${{ matrix.fixture }}-oracle-refresh
          path: |
            ${{ runner.temp }}/m6-${{ matrix.fixture }}-oracle
            ${{ runner.temp }}/m6-${{ matrix.fixture }}-oracle.log
          if-no-files-found: warn
          retention-days: 30

  m6-oracle-classification:
    name: M6 oracle drift classification
    needs:
      - m6-source-lock
      - m6-m5-final-manifest
      - m6-source-catalog
      - m6-oracle-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v6
        with:
          name: m6-m3-oracle-refresh
          path: artifacts/fresh-m3
      - uses: actions/download-artifact@v6
        with:
          name: m6-m4-oracle-refresh
          path: artifacts/fresh-m4
      - uses: actions/download-artifact@v6
        with:
          name: m6-source-catalog
          path: artifacts/fresh-catalog
      - name: Classify M3 and M4 drift
        run: |
          set -euo pipefail
          node scripts/classify-kernel-m5-oracle-refresh.mjs \
            --oracle-sha "$M6_ORACLE_SHA" \
            --legacy-m3 rust/fixtures/m3/oracle \
            --fresh-m3 artifacts/fresh-m3/m6-m3-oracle \
            --legacy-m4 rust/fixtures/m4/oracle \
            --fresh-m4 artifacts/fresh-m4/m6-m4-oracle \
            --output "$GITHUB_WORKSPACE/artifacts/m6-oracle-fixture-drift-v1.json"
      - name: Classify M5 catalog drift
        run: |
          node scripts/classify-kernel-m6-catalog-drift.mjs \
            --legacy rust/fixtures/m5/source-catalog-v1.json \
            --fresh artifacts/fresh-catalog/m6-source-catalog-v2.json \
            --oracle-sha "$M6_ORACLE_SHA" \
            --output "$GITHUB_WORKSPACE/artifacts/m6-catalog-drift-v1.json"
      - uses: actions/upload-artifact@v6
        with:
          name: m6-oracle-drift
          path: |
            artifacts/m6-oracle-fixture-drift-v1.json
            artifacts/m6-catalog-drift-v1.json
          if-no-files-found: error
          retention-days: 30

  m6-g21-oracle-bootstrap:
    name: M6 G21 oracle bootstrap
    needs:
      - m6-source-lock
      - m6-m5-final-manifest
      - m6-source-catalog
      - m6-oracle-refresh
      - m6-oracle-classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M6 exact SHA $GITHUB_SHA passed oracle bootstrap"
