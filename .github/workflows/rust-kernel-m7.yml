name: Rust Kernel M7 Gate

on:
  push:
    branches:
      - arch/rust-kernel-m7
    paths:
      - ".github/workflows/rust-kernel-m7.yml"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m7-format-check:
    name: M7 format and workspace check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/
            /test/kernel-fixtures/
          submodules: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m7-foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Check complete Rust workspace
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets

  m7-foundation:
    name: M7A state content IR snapshot foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust/
            /test/kernel-fixtures/
          submodules: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m7-foundation-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m7-foundation-${{ runner.os }}-${{ runner.arch }}-
      - name: Run M7A foundation contracts
        working-directory: rust
        run: |
          set -euo pipefail
          cargo test -p er-types m7
          cargo test -p er-state m7_state
          cargo test -p er-scenario
          cargo test -p er-ai
          cargo test -p er-save
          cargo test -p er-content-compiler --lib m7
          cargo test -p er-game --lib m7_content
          cargo test -p er-kernel --lib snapshot_v6
          cargo test -p er-testkit --test m7_foundation

  m7-g27-foundation-aggregate:
    name: M7 G27 foundation aggregate
    needs:
      - m7-format-check
      - m7-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M7 exact SHA $GITHUB_SHA passed foundation qualification"
