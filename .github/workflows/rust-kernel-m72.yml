name: Rust Kernel M7.2 Instant Agent Laboratory

on:
  push:
    branches:
      - arch/rust-kernel-m7-lab-g35
      - arch/rust-kernel-m7-lab-g36
      - arch/rust-kernel-m7-lab-g37
      - arch/rust-kernel-m7-lab-g38
    paths:
      - ".github/workflows/rust-kernel-m72.yml"
      - "rust/**"
      - "scripts/*kernel-m72*"
      - "docs/plans/rust-kernel/m72-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m72-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m72-base-attestation:
    name: M7.2 exact M7.1 base attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/check-kernel-m72-contract.mjs

  m72-contract-freeze:
    name: M7.2 contract schema ownership freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/check-kernel-m72-contract.mjs
      - name: Reject core dependency on er-lab
        run: |
          set -euo pipefail
          for crate in er-state er-battle er-run er-game er-kernel er-protocol er-mechanics; do
            if grep -F 'er-lab' "rust/crates/$crate/Cargo.toml"; then
              printf 'forbidden core dependency %s -> er-lab\n' "$crate" >&2
              exit 1
            fi
          done

  m72-contract-static:
    name: M7.2 contract formatting and manifest static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check Rust formatting and contract JSON
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Parse M7.2 JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('rust/fixtures/m72/m71-final-attestation.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('rust/fixtures/m72/m72-slice-manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('rust/fixtures/m72/architecture-manifest.json','utf8'))"

  m72-g35-aggregate:
    name: M7.2 G35 contract aggregate
    needs:
      - m72-base-attestation
      - m72-contract-freeze
      - m72-contract-static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M7.2 exact SHA $GITHUB_SHA passed G35 contract freeze"

  m72-foundation:
    name: M7.2 bootstrap scenario search navigation daemon foundation
    if: ${{ github.ref_name != 'arch/rust-kernel-m7-lab-g35' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m72-foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Run instant-lab foundation contracts
        working-directory: rust
        run: |
          set -euo pipefail
          cargo test -p er-testkit --test m72_foundation
          cargo test -p er-cli m72::tests

  m72-foundation-wasm:
    name: M7.2 foundation native Wasm parity
    if: ${{ github.ref_name != 'arch/rust-kernel-m7-lab-g35' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - run: rustup target add wasm32-unknown-unknown
      - name: Check bootstrap and laboratory crates for Wasm
        working-directory: rust
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p er-types -p er-game -p er-repro -p er-agent-protocol -p er-lab

  m72-m0-m71-regression:
    name: M7.2 complete M0-M7.1 regression
    if: ${{ github.ref_name != 'arch/rust-kernel-m7-lab-g35' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m72-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Run complete inherited Rust regression
        working-directory: rust
        run: cargo test --workspace --all-targets

  m72-g36-aggregate:
    name: M7.2 G36 instant-foundation aggregate
    if: >-
      ${{
        github.ref_name == 'arch/rust-kernel-m7-lab-g36' ||
        github.ref_name == 'arch/rust-kernel-m7-lab-g37' ||
        github.ref_name == 'arch/rust-kernel-m7-lab-g38'
      }}
    needs:
      - m72-g35-aggregate
      - m72-foundation
      - m72-foundation-wasm
      - m72-m0-m71-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M7.2 exact SHA $GITHUB_SHA passed G36 instant-agent foundation"

  m72-autonomous-loop:
    name: M7.2 experiments explorer fingerprints bisect mutations
    if: >-
      ${{
        github.ref_name == 'arch/rust-kernel-m7-lab-g37' ||
        github.ref_name == 'arch/rust-kernel-m7-lab-g38'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m72-autonomous-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Run autonomous laboratory contracts
        working-directory: rust
        run: cargo test -p er-testkit --test m72_autonomous

  m72-autonomous-wasm:
    name: M7.2 autonomous loop Wasm parity
    if: >-
      ${{
        github.ref_name == 'arch/rust-kernel-m7-lab-g37' ||
        github.ref_name == 'arch/rust-kernel-m7-lab-g38'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - run: rustup target add wasm32-unknown-unknown
      - name: Check autonomous laboratory for Wasm
        working-directory: rust
        run: cargo check --target wasm32-unknown-unknown -p er-lab

  m72-g37-aggregate:
    name: M7.2 G37 autonomous-loop aggregate
    if: >-
      ${{
        github.ref_name == 'arch/rust-kernel-m7-lab-g37' ||
        github.ref_name == 'arch/rust-kernel-m7-lab-g38'
      }}
    needs:
      - m72-g36-aggregate
      - m72-autonomous-loop
      - m72-autonomous-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M7.2 exact SHA $GITHUB_SHA passed G37 autonomous development loop"

  m72-fast-iteration:
    name: M7.2 incremental reload platform viewer security
    if: ${{ github.ref_name == 'arch/rust-kernel-m7-lab-g38' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m72-final-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Run fast-iteration and simplification contracts
        working-directory: rust
        run: cargo test -p er-testkit --test m72_final

  m72-cross-platform:
    name: M7.2 deterministic corpus (${{ matrix.os }})
    if: ${{ github.ref_name == 'arch/rust-kernel-m7-lab-g38' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run fixed cross-platform determinism proof
        working-directory: rust
        run: >-
          cargo test -p er-testkit --test m72_final
          fixed_platform_corpus_detects_first_divergence -- --exact

  m72-performance:
    name: M7.2 release-profile hard ceilings
    if: ${{ github.ref_name == 'arch/rust-kernel-m7-lab-g38' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m72-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Run release matrix throughput ceiling
        working-directory: rust
        run: >-
          cargo test --release -p er-testkit --test m72_autonomous
          ten_thousand_case_matrix_expands_within_agent_ceiling -- --exact

  m72-final-audit:
    name: M7.2 architecture security API bypass audit
    if: ${{ github.ref_name == 'arch/rust-kernel-m7-lab-g38' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/check-kernel-m72-contract.mjs
      - name: Verify exact M7.1 base remains an ancestor
        run: git merge-base --is-ancestor 79e3544029e422deb8389a12f8b75e7f0febfb3e HEAD

  m72-g38-aggregate:
    name: M7.2 G38 immutable qualification
    if: ${{ github.ref_name == 'arch/rust-kernel-m7-lab-g38' }}
    needs:
      - m72-g37-aggregate
      - m72-fast-iteration
      - m72-cross-platform
      - m72-performance
      - m72-final-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M7.2 exact SHA $GITHUB_SHA passed immutable G38 qualification"
