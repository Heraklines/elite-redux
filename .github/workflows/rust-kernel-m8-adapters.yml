name: Rust Kernel M8 G42 Browser Adapters

on:
  push:
    branches:
      - arch/rust-kernel-m8-browser-g42
    paths:
      - ".github/workflows/rust-kernel-m8-adapters.yml"
      - "rust/**"
      - "scripts/build-kernel-m8-web.mjs"
      - "scripts/check-kernel-m8-contract.mjs"
      - "src/rust-browser/adapters/**"
      - "src/rust-browser/render/**"
      - "src/rust-browser/routes/rust-phaser-entry.ts"
      - "test/browser/rust-browser/adapters/**"
      - "test/node/rust-browser/adapters/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m8-g42-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adapter-static:
    name: M8C adapter static security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check adapter static boundary and unchanged default build
        shell: bash
        run: |
          set +e
          pnpm typecheck > m8c-typecheck.log 2>&1
          status=$?
          set -e
          owned="$(grep -E '^(src/rust-browser/(adapters|render|routes/rust-phaser-entry)|test/(node|browser)/rust-browser/adapters)[^()]*\([0-9]+,[0-9]+\): error TS' m8c-typecheck.log || true)"
          if [ -n "$owned" ]; then printf '%s\n' "$owned"; exit 1; fi
          diagnostics="$(grep -Ec '^[^(]+\([0-9]+,[0-9]+\): error TS' m8c-typecheck.log || true)"
          if [ "$status" -ne 0 ] && [ "$diagnostics" -eq 0 ]; then cat m8c-typecheck.log; exit 1; fi
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched \
            src/rust-browser/adapters src/rust-browser/render src/rust-browser/routes/rust-phaser-entry.ts \
            test/node/rust-browser/adapters test/browser/rust-browser/adapters \
            scripts/check-kernel-m8-contract.mjs
          pnpm exec vitest run --config test/node/vitest.config.ts \
            test/node/rust-browser/adapters/adapter-contracts.test.ts
          node scripts/check-kernel-m8-contract.mjs
          pnpm build

  wasm-bundle:
    name: M8C immutable Rust Phaser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m8-wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.127-${{ hashFiles('rust/Cargo.lock') }}
      - run: rustup target add wasm32-unknown-unknown
      - run: |
          set -euo pipefail
          if ! wasm-bindgen --version 2>/dev/null | grep -Fxq 'wasm-bindgen 0.2.127'; then cargo install wasm-bindgen-cli --version 0.2.127 --locked; fi
      - run: >-
          node scripts/build-kernel-m8-web.mjs
          --out-dir "$RUNNER_TEMP/m8-web"
          --content rust/fixtures/m8/browser-reference/content-pack.json
          --identity rust/fixtures/m8/browser-reference/execution-identity.bin
          --session rust/fixtures/m8/browser-reference/session-start.json
          --authority-session rust/fixtures/m8/browser-reference/session-authority.json
          --replica-session rust/fixtures/m8/browser-reference/session-replica.json
      - run: cp rust/fixtures/m8/browser-reference/expected-terminal-digest.txt "$RUNNER_TEMP/m8-web/"
      - uses: actions/upload-artifact@v6
        with:
          name: m8-adapter-web-${{ github.sha }}
          path: ${{ runner.temp }}/m8-web
          if-no-files-found: error
          retention-days: 14

  browser-adapters:
    name: M8C real Chromium Phaser storage WebRTC rejoin
    needs: wasm-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: m8-adapter-web-${{ github.sha }}
          path: ${{ runner.temp }}/m8-web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run complete adapter browser matrix
        env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m8-web
        run: >-
          pnpm exec playwright test
          test/browser/rust-browser/adapters/phaser-adapter.spec.ts
          test/browser/rust-browser/save-offline.spec.ts
          test/browser/rust-browser/full-solo.spec.ts
          test/browser/rust-browser/adapters/webrtc-two-browser.spec.ts
          --workers=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m8-adapter-browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  inherited-regression:
    name: M8C complete inherited Rust regression
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m8-g42-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - working-directory: rust
        run: >-
          cargo test --workspace --all-targets --
          --skip m3_audited_production_surface_matches_frozen_manifest

  g42-aggregate:
    name: M8 G42 browser adapter qualification
    needs:
      - adapter-static
      - wasm-bundle
      - browser-adapters
      - inherited-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M8 exact SHA $GITHUB_SHA passed G42 browser adapter qualification"
