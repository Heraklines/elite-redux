name: Rust Kernel M8 G43 Final Qualification

on:
  push:
    branches:
      - arch/rust-kernel-m8-browser-g43
    paths:
      - ".github/workflows/rust-kernel-m8-final.yml"
      - "playwright.rust-browser.config.ts"
      - "rust/**"
      - "schemas/browser/m8/**"
      - "scripts/*kernel-m8*"
      - "src/rust-browser/**"
      - "test/browser/rust-browser/**"
      - "test/node/rust-browser/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m8-g43-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-static-security:
    name: M8 final source transplant static security API audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-kernel-m8-contract.mjs
      - run: |
          set -euo pipefail
          node scripts/generate-kernel-m8-transplant.mjs
          git diff --exit-code -- rust/fixtures/m8/m8-transplant-manifest.json
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched \
            src/rust-browser test/node/rust-browser test/browser/rust-browser \
            scripts/check-kernel-m8-contract.mjs scripts/build-kernel-m8-web.mjs scripts/seal-kernel-m8-release.mjs \
            schemas/browser/m8 playwright.rust-browser.config.ts
      - name: Reject M8-owned TypeScript diagnostics and build unchanged production default
        shell: bash
        run: |
          set +e
          pnpm typecheck > m8-final-typecheck.log 2>&1
          status=$?
          set -e
          owned="$(grep -E '^(src/rust-browser|test/(node|browser)/rust-browser|playwright.rust-browser.config)[^()]*\([0-9]+,[0-9]+\): error TS' m8-final-typecheck.log || true)"
          if [ -n "$owned" ]; then printf '%s\n' "$owned"; exit 1; fi
          diagnostics="$(grep -Ec '^[^(]+\([0-9]+,[0-9]+\): error TS' m8-final-typecheck.log || true)"
          if [ "$status" -ne 0 ] && [ "$diagnostics" -eq 0 ]; then cat m8-final-typecheck.log; exit 1; fi
          pnpm build

  rust-native-wasm-regression:
    name: M8 final Rust native Wasm M0-M7.2 regression
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m8-g43-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - run: rustup target add wasm32-unknown-unknown
      - working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p er-web --all-targets --no-deps -- -D warnings
          cargo test -p er-web
          cargo check -p er-web --target wasm32-unknown-unknown
          cargo test --workspace --all-targets -- --skip m3_audited_production_surface_matches_frozen_manifest

  node-contracts:
    name: M8 final worker shadow adapter release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/worker-abi.test.ts
          test/node/rust-browser/worker-security.test.ts
          test/node/rust-browser/shadow-corpus.test.ts
          test/node/rust-browser/shadow-isolation.test.ts
          test/node/rust-browser/shadow-performance.test.ts
          test/node/rust-browser/adapters/adapter-contracts.test.ts
          test/node/rust-browser/release-contract.test.ts

  sealed-bundle:
    name: M8 final sealed Wasm content release unit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m8-wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.127-${{ hashFiles('rust/Cargo.lock') }}
      - run: rustup target add wasm32-unknown-unknown
      - run: |
          set -euo pipefail
          if ! wasm-bindgen --version 2>/dev/null | grep -Fxq 'wasm-bindgen 0.2.127'; then cargo install wasm-bindgen-cli --version 0.2.127 --locked; fi
      - run: >-
          node scripts/build-kernel-m8-web.mjs
          --out-dir "$RUNNER_TEMP/m8-web"
          --content rust/fixtures/m8/browser-reference/content-pack.json
          --identity rust/fixtures/m8/browser-reference/execution-identity.bin
          --session rust/fixtures/m8/browser-reference/session-start.json
          --authority-session rust/fixtures/m8/browser-reference/session-authority.json
          --replica-session rust/fixtures/m8/browser-reference/session-replica.json
      - run: cp rust/fixtures/m8/browser-reference/expected-terminal-digest.txt "$RUNNER_TEMP/m8-web/"
      - name: Seal exact candidate release manifest
        shell: bash
        run: |
          set -euo pipefail
          content_hash="sha256:$(sha256sum "$RUNNER_TEMP/m8-web/content-pack.json" | cut -d' ' -f1)"
          node scripts/seal-kernel-m8-release.mjs \
            --input-dir "$RUNNER_TEMP/m8-web" \
            --output "$RUNNER_TEMP/m8-web/browser-release-manifest.json" \
            --release-id "m8-$GITHUB_SHA" \
            --candidate-sha "$GITHUB_SHA" \
            --content-hash "$content_hash" \
            --private-route "/private/rust-m8"
      - uses: actions/upload-artifact@v6
        with:
          name: m8-final-web-${{ github.sha }}
          path: ${{ runner.temp }}/m8-web
          if-no-files-found: error
          retention-days: 30

  browser-matrix:
    name: M8 final browser matrix (${{ matrix.browser }})
    needs: sealed-bundle
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: m8-final-web-${{ github.sha }}
          path: ${{ runner.temp }}/m8-web
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run complete browser matrix slice
        env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m8-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=${{ matrix.browser }}
          test/browser/rust-browser/full-solo.spec.ts
          test/browser/rust-browser/rust-staging-entry.spec.ts
          test/browser/rust-browser/full-coop.spec.ts
          test/browser/rust-browser/save-offline.spec.ts
          test/browser/rust-browser/release-cache.spec.ts
          test/browser/rust-browser/input-accessibility.spec.ts
          test/browser/rust-browser/adapters/phaser-adapter.spec.ts
          test/browser/rust-browser/adapters/webrtc-two-browser.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m8-browser-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/rust-browser
          if-no-files-found: warn
          retention-days: 30

  mobile-performance:
    name: M8 final mobile performance memory teardown
    needs: sealed-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: m8-final-web-${{ github.sha }}
          path: ${{ runner.temp }}/m8-web
      - run: pnpm exec playwright install --with-deps chromium
      - env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m8-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts --project=chromium
          test/browser/rust-browser/mobile-profile.spec.ts
          test/browser/rust-browser/performance.spec.ts
          --workers=1

  g43-aggregate:
    name: M8 G43 immutable final qualification
    needs:
      - source-static-security
      - rust-native-wasm-regression
      - node-contracts
      - sealed-bundle
      - browser-matrix
      - mobile-performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M8 exact SHA $GITHUB_SHA passed immutable G43 final qualification"
