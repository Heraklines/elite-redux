name: Rust Kernel M8 Oracle Refresh

on:
  push:
    branches:
      - arch/rust-kernel-m8-browser
      - arch/rust-kernel-m8-browser-refresh
    paths:
      - ".github/workflows/rust-kernel-m8-oracle-refresh.yml"
      - "scripts/*kernel-*.mjs"
      - "test/kernel-fixtures/m3/**"
      - "test/kernel-fixtures/m4/**"
      - "rust/fixtures/m8/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m8-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: M8 ${{ matrix.fixture }} current-browser oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fixture: [m3, m4]
    env:
      M8_BROWSER_SHA: b2ed1a6eb050a18d5f335ec826e01b7b425ce311
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore pinned BLAKE3 verifier
        id: b3sum-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m8-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6
      - name: Install pinned BLAKE3 verifier
        shell: bash
        run: |
          set -euo pipefail
          if ! b3sum --version 2>/dev/null | grep -Fxq 'b3sum 1.8.6'; then
            cargo install b3sum --version 1.8.6 --locked
          fi
          b3sum --version | grep -Fx 'b3sum 1.8.6'
      - name: Save pinned BLAKE3 verifier
        if: steps.b3sum-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/b3sum
            ~/.cargo/registry
            ~/.cargo/git
          key: m8-b3sum-${{ runner.os }}-${{ runner.arch }}-1.8.6
      - run: pnpm install --frozen-lockfile
      - name: Materialize current browser oracle
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/m8-browser-oracle" "$M8_BROWSER_SHA"
          node scripts/prepare-kernel-m8-oracle-refresh.mjs \
            --oracle-root "$RUNNER_TEMP/m8-browser-oracle" \
            --oracle-sha "$M8_BROWSER_SHA"
      - name: Install oracle dependencies
        working-directory: ${{ runner.temp }}/m8-browser-oracle
        run: pnpm install --frozen-lockfile
      - name: Export twice and compare
        working-directory: ${{ runner.temp }}/m8-browser-oracle
        env:
          LC_ALL: C
          LANG: C
          TZ: UTC
          M5_ORACLE_REFRESH_SHA: ${{ env.M8_BROWSER_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m8-${{ matrix.fixture }}-a" "$RUNNER_TEMP/m8-${{ matrix.fixture }}-b"
          if [[ "${{ matrix.fixture }}" == "m3" ]]; then
            node scripts/export-kernel-m3-oracle.mjs --output-root "$RUNNER_TEMP/m8-m3-a"
            node scripts/export-kernel-m3-oracle.mjs --output-root "$RUNNER_TEMP/m8-m3-b"
          else
            M4_ORACLE_GAP_REPORT="$RUNNER_TEMP/m8-m4-a/gaps.json" \
              node scripts/export-kernel-m4-oracle.mjs --output-root "$RUNNER_TEMP/m8-m4-a"
            M4_ORACLE_GAP_REPORT="$RUNNER_TEMP/m8-m4-b/gaps.json" \
              node scripts/export-kernel-m4-oracle.mjs --output-root "$RUNNER_TEMP/m8-m4-b"
          fi
          diff -ru "$RUNNER_TEMP/m8-${{ matrix.fixture }}-a" "$RUNNER_TEMP/m8-${{ matrix.fixture }}-b"
      - name: Seal deterministic oracle artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="m8-${{ matrix.fixture }}-oracle-${M8_BROWSER_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP/m8-${{ matrix.fixture }}-a" . \
            | gzip -n > "$RUNNER_TEMP/$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$archive" > "$archive.sha256"
          )
      - uses: actions/upload-artifact@v6
        with:
          name: m8-${{ matrix.fixture }}-oracle-${{ env.M8_BROWSER_SHA }}
          path: |
            ${{ runner.temp }}/m8-${{ matrix.fixture }}-oracle-${{ env.M8_BROWSER_SHA }}.tar.gz
            ${{ runner.temp }}/m8-${{ matrix.fixture }}-oracle-${{ env.M8_BROWSER_SHA }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
