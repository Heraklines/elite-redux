name: Rust Kernel M8 G41 Shadow Parity

on:
  push:
    branches:
      - arch/rust-kernel-m8-browser-g41
    paths:
      - ".github/workflows/rust-kernel-m8-shadow.yml"
      - "rust/fixtures/m8/**"
      - "scripts/check-kernel-m8-contract.mjs"
      - "src/rust-browser/shadow/**"
      - "test/node/rust-browser/shadow-*.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m8-g41-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow-contract:
    name: M8B capture projection comparison isolation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check shadow static boundary and unchanged default build
        shell: bash
        run: |
          set +e
          pnpm typecheck > m8b-typecheck.log 2>&1
          status=$?
          set -e
          owned="$(grep -E '^(src/rust-browser/shadow|test/node/rust-browser/shadow-)[^()]*\([0-9]+,[0-9]+\): error TS' m8b-typecheck.log || true)"
          if [ -n "$owned" ]; then printf '%s\n' "$owned"; exit 1; fi
          diagnostics="$(grep -Ec '^[^(]+\([0-9]+,[0-9]+\): error TS' m8b-typecheck.log || true)"
          if [ "$status" -ne 0 ] && [ "$diagnostics" -eq 0 ]; then cat m8b-typecheck.log; exit 1; fi
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched \
            src/rust-browser/shadow \
            test/node/rust-browser/shadow-corpus.test.ts \
            test/node/rust-browser/shadow-isolation.test.ts \
            test/node/rust-browser/shadow-performance.test.ts \
            rust/fixtures/m8/shadow \
            scripts/check-kernel-m8-contract.mjs
          node scripts/check-kernel-m8-contract.mjs
          pnpm build
      - name: Run ordered shadow corpus and isolation contracts
        run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/shadow-corpus.test.ts
          test/node/rust-browser/shadow-isolation.test.ts

  shadow-performance:
    name: M8B shadow CPU overhead ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/shadow-performance.test.ts

  inherited-regression:
    name: M8B complete inherited Rust regression
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m8-g41-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - working-directory: rust
        run: >-
          cargo test --workspace --all-targets --
          --skip m3_audited_production_surface_matches_frozen_manifest

  g41-aggregate:
    name: M8 G41 quarantined shadow qualification
    needs:
      - shadow-contract
      - shadow-performance
      - inherited-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M8 exact SHA $GITHUB_SHA passed G41 quarantined shadow qualification"
