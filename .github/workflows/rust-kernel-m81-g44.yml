name: Rust Kernel M8.1 G44 Contract Freeze

on:
  push:
    branches: [arch/rust-kernel-m8-hot-reload]
    paths:
      - ".github/workflows/rust-kernel-m81-*.yml"
      - "rust/contracts/m81-*"
      - "rust/crates/er-kernel-worker/**"
      - "rust/crates/er-lab/src/kernel_reload/**"
      - "src/rust-browser/hot-reload/**"
      - "scripts/check-kernel-m81-contract.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-m81-g44-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-kernel-m81-contract.mjs
      - run: cargo metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1 > /dev/null
      - run: >-
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched
          src/rust-browser/hot-reload src/rust-browser/worker/rust-kernel-worker.ts
          test/node/rust-browser/hot-reload test/browser/rust-browser/hot-reload
          scripts/check-kernel-m81-contract.mjs
