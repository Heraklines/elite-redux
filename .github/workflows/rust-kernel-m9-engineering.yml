name: Rust Kernel M9 Engineering Qualification

on:
  push:
    branches:
      - arch/rust-kernel-m9-engineering
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact M9 Engineering candidate SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-kernel-m9-engineering-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  candidate-binding:
    name: Exact candidate binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Verify immutable candidate
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git status --porcelain)" = ""
          test "$(git tag --points-at HEAD | grep -c '^rust-kernel-m9-engineering-final$' || true)" = "0"

  static:
    name: Independent static and architecture gate
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Retain the exact bounded remote Rust formatter correction
        if: failure() && steps.rustfmt.conclusion == 'failure'
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --binary -- rust/crates > "$RUNNER_TEMP/m9e-q-rustfmt.patch"
          test -s "$RUNNER_TEMP/m9e-q-rustfmt.patch"
          test "$(wc -c < "$RUNNER_TEMP/m9e-q-rustfmt.patch")" -le 262144
      - uses: actions/upload-artifact@v6
        if: failure() && steps.rustfmt.conclusion == 'failure'
        with:
          name: m9e-q-rustfmt-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/m9e-q-rustfmt.patch
          if-no-files-found: error
          retention-days: 14
      - run: cargo clippy --manifest-path rust/Cargo.toml -p er-production -p er-web --all-targets --no-deps -- -D warnings
      - run: node scripts/check-kernel-m9-engineering.mjs
      - name: Typecheck V7 browser boundary
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --pretty false --skipLibCheck --strict
          --exactOptionalPropertyTypes --moduleResolution bundler --module ESNext --target ES2024
          --types node,vitest/globals --lib ES2024,DOM,WebWorker
          src/rust-browser/contracts/browser-contracts-v2.ts
          src/rust-browser/routes/browser-effects-v2.ts
          test/node/rust-browser/engineering/browser-effects-v2.test.ts
          test/browser/rust-browser/m9e-v7-corrective.spec.ts
      - id: biome
        run: >-
          pnpm exec biome ci --diagnostic-level=error
          scripts/check-kernel-m9-engineering.mjs
          src/rust-browser/contracts/browser-contracts-v2.ts
          src/rust-browser/routes/browser-effects-v2.ts
          test/node/rust-browser/engineering/browser-effects-v2.test.ts
          scripts/build-kernel-m9e-v7-web.mjs
          test/browser/rust-browser/m9e-v7-corrective.spec.ts
      - name: Retain the exact bounded remote Biome correction
        if: failure() && steps.biome.conclusion == 'failure'
        shell: bash
        run: |
          pnpm exec biome check --write \
            scripts/check-kernel-m9-engineering.mjs \
            src/rust-browser/contracts/browser-contracts-v2.ts \
            src/rust-browser/routes/browser-effects-v2.ts \
            test/node/rust-browser/engineering/browser-effects-v2.test.ts \
            scripts/build-kernel-m9e-v7-web.mjs \
            test/browser/rust-browser/m9e-v7-corrective.spec.ts || true
          git diff --binary -- \
            scripts/check-kernel-m9-engineering.mjs \
            src/rust-browser/contracts/browser-contracts-v2.ts \
            src/rust-browser/routes/browser-effects-v2.ts \
            test/node/rust-browser/engineering/browser-effects-v2.test.ts \
            scripts/build-kernel-m9e-v7-web.mjs \
            test/browser/rust-browser/m9e-v7-corrective.spec.ts > "$RUNNER_TEMP/m9e-q-biome.patch"
          test -s "$RUNNER_TEMP/m9e-q-biome.patch"
          test "$(wc -c < "$RUNNER_TEMP/m9e-q-biome.patch")" -le 262144
      - uses: actions/upload-artifact@v6
        if: failure() && steps.biome.conclusion == 'failure'
        with:
          name: m9e-q-biome-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/m9e-q-biome.patch
          if-no-files-found: error
          retention-days: 14

  browser-contract:
    name: Browser V2 typed effect contract
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/engineering/browser-effects-v2.test.ts

  source-oracles:
    name: Pinned current source observations
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate and verify the complete pinned source cases
        run: python3 scripts/ci/m9e_q_source_oracles.py "$RUNNER_TEMP/m9e-q-oracles"
      - name: Bind the qualified actual friendship observations
        env:
          GH_TOKEN: ${{ github.token }}
          M9E_NATIVE_LANE: b
        run: |
          python3 scripts/ci/m9e_friendship_inputs.py
          mkdir "$RUNNER_TEMP/m9e-q-oracles/friendship"
          cp "$RUNNER_TEMP/m9e-feedback/full/qualified-oracle/export-one.json" "$RUNNER_TEMP/m9e-q-oracles/friendship/export-one.json"
          cp "$RUNNER_TEMP/m9e-feedback/full/qualified-oracle/effects-one.json" "$RUNNER_TEMP/m9e-q-oracles/friendship/effects-one.json"
      - uses: actions/upload-artifact@v6
        with:
          name: m9e-q-oracles-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/m9e-q-oracles/
          if-no-files-found: error
          retention-days: 14

  rust-shards:
    name: Rust shard ${{ matrix.shard.id }} — ${{ matrix.shard.name }}
    needs: [candidate-binding, source-oracles]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: "01", name: canonical-types, command: "cargo test --locked -p er-canonical -p er-types -p er-dev-types --lib --bins --tests" }
          - { id: "02", name: rng, command: "cargo test --locked -p er-rng --lib --bins --tests" }
          - { id: "03", name: content-mechanics, command: "cargo test --locked -p er-content -p er-mechanics --lib --bins --tests" }
          - { id: "04", name: content-compiler, command: "cargo test --locked -p er-content-compiler --lib --bins --tests" }
          - { id: "05", name: state, command: "cargo test --locked -p er-state --lib --bins --tests" }
          - { id: "06", name: battle, command: "cargo test --locked -p er-battle --lib --bins --tests" }
          - { id: "07", name: progression, command: "cargo test --locked -p er-progression --lib --bins --tests" }
          - { id: "08", name: world, command: "cargo test --locked -p er-world --lib --bins --tests" }
          - { id: "09", name: scenario, command: "cargo test --locked -p er-scenario --lib --bins --tests" }
          - { id: "10", name: ai, command: "cargo test --locked -p er-ai --lib --bins --tests" }
          - { id: "11", name: run, command: "cargo test --locked -p er-run --lib --bins --tests" }
          - { id: "12", name: save, command: "cargo test --locked -p er-save --lib --bins --tests" }
          - { id: "13", name: protocol, command: "cargo test --locked -p er-protocol --lib --bins --tests" }
          - { id: "14", name: game, command: "cargo test --locked -p er-game --lib --bins --tests" }
          - { id: "15", name: kernel, command: "cargo test --locked -p er-kernel --lib --bins --tests" }
          - { id: "16", name: simulator, command: "cargo test --locked -p er-sim --lib --bins --tests -- --skip m3_audited_production_surface_matches_frozen_manifest" }
          - { id: "17", name: testkit, command: "cargo test --locked -p er-testkit --lib --bins --tests" }
          - { id: "18", name: wasm-native, command: "cargo test --locked -p er-wasm --lib --bins --tests" }
          - { id: "19", name: wasm32-eventwise, command: "cargo test --locked -p er-wasm --test m9e_parity --target wasm32-unknown-unknown" , wasm: true }
          - { id: "20", name: model-render-model, command: "cargo test --locked -p er-model -p er-render-model --lib --bins --tests" }
          - { id: "21", name: renderer, command: "cargo test --locked -p er-renderer --lib --bins --tests" }
          - { id: "22", name: impact, command: "cargo test --locked -p er-impact --lib --bins --tests" }
          - { id: "23", name: environment, command: "cargo test --locked -p er-env --lib --bins --tests" }
          - { id: "24", name: developer-plane, command: "cargo test --locked -p er-devplane --lib --bins --tests" }
          - { id: "25", name: repro-batch, command: "cargo test --locked -p er-repro -p er-batch --lib --bins --tests" }
          - { id: "26", name: agent-lab, command: "cargo test --locked -p er-agent-protocol -p er-lab --lib --bins --tests" }
          - { id: "27", name: worker-production, command: "cargo test --locked -p er-kernel-worker -p er-production --lib --bins --tests" }
          - { id: "28", name: web-cli, command: "cargo test --locked -p er-web -p er-cli --lib --bins --tests" }
          - { id: "29", name: docs-examples, command: "cargo test --workspace --locked --doc && cargo check --workspace --locked --examples" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v6
        with:
          name: m9e-q-oracles-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/m9e-q-oracles
      - name: Bind exact pinned source observations
        shell: bash
        run: |
          for pair in \
            M9E_CURRENT_MOVE_TARGETS_ORACLE:current-move-targets \
            M9E_HELD_XP_ORACLE:held-xp \
            M9E_PARTY_XP_ORACLE:party-xp \
            M9E_PHASE_TREE_ORACLE:phase-tree \
            M9E_PHASE_TREE_QUERIES_ORACLE:phase-tree-queries \
            M9E_PHASE_XP_ORACLE:phase-xp \
            M9E_STANDARD_SCORE_ORACLE:standard-score \
            M9E_STARTER_POKERUS_ORACLE:starter-pokerus; do
            variable="${pair%%:*}"
            label="${pair#*:}"
            path="$RUNNER_TEMP/m9e-q-oracles/$label/source-cases.tsv"
            test -s "$path"
            printf '%s=%s\n' "$variable" "$path" >> "$GITHUB_ENV"
          done
          printf 'M9_FRIENDSHIP_COMPARISON_INPUT=%s\n' "$RUNNER_TEMP/m9e-q-oracles/friendship/export-one.json" >> "$GITHUB_ENV"
          printf 'M9_FRIENDSHIP_EFFECTS_INPUT=%s\n' "$RUNNER_TEMP/m9e-q-oracles/friendship/effects-one.json" >> "$GITHUB_ENV"
      - name: Restore Cargo dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9e-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - if: matrix.shard.wasm == true
        run: rustup target add wasm32-unknown-unknown
      - if: matrix.shard.wasm == true
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Bind the actual native Worker executable for public entry tests
        if: matrix.shard.id == '26' || matrix.shard.id == '28'
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p er-kernel-worker --bin er-kernel-worker
          worker="$PWD/rust/target/debug/er-kernel-worker"
          test -s "$worker"
          printf 'ER_M9E_WORKER_EXECUTABLE=%s\n' "$worker" >> "$GITHUB_ENV"
          printf 'ER_M9E_WORKER_EXECUTABLE_SHA256=%s\n' "$(sha256sum "$worker" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          printf 'ER_M9E_WORKER_SOURCE_SHA=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          printf 'ER_M9E_WORKER_BUILD_TARGET=%s\n' "$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
          printf 'ER_M9E_WORKER_BUILD_PROFILE=debug\n' >> "$GITHUB_ENV"
      - name: Bind exact-parent changed-rule Worker for complete CLI shard
        if: matrix.shard.id == '28'
        run: python3 scripts/ci/m9e_q_rule_worker.py
      - name: Check changed-rule Worker before the complete CLI shard
        if: matrix.shard.id == '28'
        working-directory: rust
        run: cargo test --locked -p er-cli --test m9e_current_rulechange_reload -- --nocapture
      - name: Run exact shard
        working-directory: rust
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: ${{ matrix.shard.command }}
      - name: Record exact-SHA shard evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m9e-shard"
          printf '{"candidate_sha":"%s","shard":"%s","name":"%s"}\n' \
            "$CANDIDATE_SHA" "${{ matrix.shard.id }}" "${{ matrix.shard.name }}" \
            > "$RUNNER_TEMP/m9e-shard/manifest.json"
          if [ -f "$RUNNER_TEMP/m9e-q-rule-${CANDIDATE_SHA:0:12}/manifest.json" ]; then
            cp "$RUNNER_TEMP/m9e-q-rule-${CANDIDATE_SHA:0:12}/manifest.json" "$RUNNER_TEMP/m9e-shard/rulechange.json"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m9e-${{ env.CANDIDATE_SHA }}-${{ matrix.shard.id }}-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/m9e-shard/
          if-no-files-found: error
          retention-days: 30

  v7-browser-wasm:
    name: V7 browser Wasm production artifact
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m9e-browser-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ env.CANDIDATE_SHA }}
          restore-keys: |
            m9e-browser-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: node scripts/build-kernel-m9e-v7-web.mjs --out-dir "$RUNNER_TEMP/m9e-v7-web"
      - name: Bind the actual CLI for browser-to-native capsule validation
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p er-cli --bin er-cli
          cli="$PWD/rust/target/debug/er-cli"
          test -s "$cli"
          printf 'ER_M9E_CLI_EXECUTABLE=%s\n' "$cli" >> "$GITHUB_ENV"
          printf 'ER_M9E_CLI_ROOT=%s\n' "$PWD/rust/target/debug" >> "$GITHUB_ENV"
          printf 'ER_M9E_CLI_SHA256=%s\n' "$(sha256sum "$cli" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          printf 'ER_M9E_CLI_SOURCE_SHA=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real V7 browser journey
        env:
          M9E_V7_WEB_DIR: ${{ runner.temp }}/m9e-v7-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=chromium test/browser/rust-browser/m9e-v7-corrective.spec.ts --workers=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m9e-v7-web-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/m9e-v7-web
            test-results/rust-browser
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: M9 Engineering exact-SHA aggregate
    if: always()
    needs:
      - candidate-binding
      - static
      - browser-contract
      - source-oracles
      - rust-shards
      - v7-browser-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every independent gate
        env:
          BINDING: ${{ needs.candidate-binding.result }}
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser-contract.result }}
          SOURCE_ORACLES: ${{ needs.source-oracles.result }}
          RUST_SHARDS: ${{ needs.rust-shards.result }}
          V7_BROWSER_WASM: ${{ needs.v7-browser-wasm.result }}
        run: |
          test "$BINDING" = success
          test "$STATIC" = success
          test "$BROWSER" = success
          test "$SOURCE_ORACLES" = success
          test "$RUST_SHARDS" = success
          test "$V7_BROWSER_WASM" = success
          printf '%s\n' "M9 Engineering candidate $CANDIDATE_SHA passed all 29 Rust shards, independent static checks, and the browser V2 contract."
