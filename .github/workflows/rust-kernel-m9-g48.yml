name: Rust Kernel M9 G48 Contract Freeze

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact executable candidate already exercised by G52
        required: true
        type: string
      g52_run_id:
        description: Successful exact-SHA G52 run that owns the full Rust workspace regression
        required: true
        type: number

permissions:
  actions: read
  contents: read
concurrency:
  group: rust-kernel-m9-g48-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-kernel-m9-contract.mjs
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml -p er-production --all-targets --no-deps -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml -p er-production
      - name: Typecheck frozen browser schemas
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --pretty false --skipLibCheck --strict
          --exactOptionalPropertyTypes --moduleResolution bundler --module ESNext --target ES2022
          --lib ES2022,DOM,WebWorker
          src/rust-browser/production/contracts.ts
          src/rust-browser/production/signature-verifier.ts
          src/rust-browser/production/release-manifest.ts
      - run: >-
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched
          src/rust-browser/production scripts/check-kernel-m9-contract.mjs
          rust/fixtures/m9

  inherited-rust-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consume exact-SHA G52 Rust regression result
        uses: actions/github-script@v8
        with:
          script: |
            const candidate = '${{ inputs.candidate_sha }}';
            if (!/^[0-9a-f]{40}$/.test(candidate)) {
              core.setFailed('G48 candidate SHA is invalid');
              return;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.g52_run_id }}'),
            });
            if (run.data.name !== 'Rust Kernel M9 G52 Production Qualification'
                || run.data.head_sha !== candidate
                || run.data.conclusion !== 'success') {
              core.setFailed('G48 requires the successful exact-candidate G52 result');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.data.id,
              per_page: 100,
            });
            const regression = jobs.filter(job => job.name === 'rust-regression');
            if (regression.length !== 1 || regression[0].conclusion !== 'success') {
              core.setFailed('G52 Rust regression result is missing or non-successful');
            }
  inherited-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/worker-abi.test.ts
          test/node/rust-browser/worker-security.test.ts
          test/node/rust-browser/hot-reload/transactional-reload.test.ts
          test/node/rust-browser/hot-reload/generation-worker-host.test.ts
          --pool=forks --isolate --no-file-parallelism

  g48-aggregate:
    name: M9 G48 production contract freeze
    needs: [contract-stubs, inherited-rust-regression, inherited-browser-regression]
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' "M9 exact SHA ${{ inputs.candidate_sha }} passed G48 contract freeze and consumed G52 Rust regression ${{ inputs.g52_run_id }}"
