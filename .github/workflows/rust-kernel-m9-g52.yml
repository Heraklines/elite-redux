name: Rust Kernel M9 G52 Production Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact executable candidate; harness-only differences are verified separately
        required: true
        type: string
      rust_regression_run_id:
        description: Optional prior G52 run with a successful exact-candidate Rust regression job
        required: false
        default: 0
        type: number

permissions:
  actions: read
  contents: read
concurrency:
  group: rust-kernel-m9-g52-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prove harness changes cannot alter executable bytes
        run: |
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "${{ inputs.candidate_sha }}^{commit}"
          git diff --name-only "${{ inputs.candidate_sha }}" HEAD > "$RUNNER_TEMP/changed-files.txt"
          test -z "$(grep -Ev '^(\.github/workflows/|test/|scripts/run-m9-preview-journey\.mjs$)' "$RUNNER_TEMP/changed-files.txt" || true)"

  source-static-security:
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-kernel-m9-contract.mjs
      - run: node scripts/check-kernel-m9-release-readiness.mjs
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml -p er-production -p er-web --all-targets --no-deps -- -D warnings
      - name: Typecheck complete M9 production ownership surface
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --pretty false --skipLibCheck --strict
          --exactOptionalPropertyTypes --moduleResolution bundler --module ESNext --target ES2024
          --types node,vitest/globals --lib ES2024,DOM,WebWorker
          workers/er-telemetry/src/cloudflare-workers.d.ts
          workers/er-save-api/src/cloudflare-workers.d.ts
          workers/er-m9-preview-save/src/index.ts
          workers/er-m9-preview-save/src/type-guards.ts
          src/rust-browser/production/contracts.ts
          src/rust-browser/production/signature-verifier.ts
          src/rust-browser/production/release-manifest.ts
          src/rust-browser/production/runtime-assignment.ts
          src/rust-browser/production/session-pin.ts
          src/rust-browser/production/generation-registry.ts
          src/rust-browser/production/runtime-selector.ts
          src/rust-browser/production/release-cache-v2.ts
          src/rust-browser/production/service-worker.ts
          src/rust-browser/production/production-worker-host.ts
          src/rust-browser/production/bootstrap.ts
          src/rust-browser/production/browser-session.ts
          src/rust-browser/production/configured-production-main.ts
          src/rust-browser/production/preview-account.ts
          src/rust-browser/production/preview-remote-lease.ts
          src/rust-browser/production/preview-save-storage.ts
          src/rust-browser/production/production-save-restore-worker.ts
          src/rust-browser/production/save-envelope.ts
          src/rust-browser/production/save-lease.ts
          src/rust-browser/production/save-migration.ts
          src/rust-browser/production/production-save-worker.ts
          src/rust-browser/production/platform-context.ts
          src/rust-browser/production/coop-release.ts
          src/rust-browser/production/coop-frame.ts
          src/rust-browser/production/health-event.ts
          src/rust-browser/production/health-reporter.ts
          src/rust-browser/production/repro-reporting.ts
          src/rust-browser/production/rollout.ts
          src/rust-browser/production/shadow-sampling.ts
          src/rust-browser/production/type-guards.ts
          src/rust-browser/adapters/cloud-save-adapter.ts
          src/rust-browser/adapters/indexeddb-adapter.ts
          src/rust-browser/adapters/input-adapter.ts
          src/rust-browser/adapters/lifecycle-adapter.ts
          src/rust-browser/adapters/mobile-input-adapter.ts
          src/rust-browser/adapters/signaling-adapter.ts
          src/rust-browser/adapters/storage-adapter.ts
          src/rust-browser/adapters/transport-adapter.ts
          src/rust-browser/contracts/browser-contracts.ts
          src/rust-browser/hot-reload/contracts.ts
          src/rust-browser/hot-reload/generation-worker-host.ts
          src/rust-browser/host/message-sequencer.ts
          src/rust-browser/host/rust-browser-host.ts
          src/rust-browser/worker/rust-kernel-worker.ts
          src/rust-browser/worker/rust-wasm-loader.ts
          workers/er-save-api/src/m9-production.ts
          workers/er-save-api/src/m9-type-guards.ts
          workers/er-telemetry/src/m9-health.ts
          test/node/rust-browser/production/*.test.ts
          test/node/rust-browser/adapters/adapter-contracts.test.ts
      - run: >-
          pnpm exec biome ci --diagnostic-level=error --no-errors-on-unmatched
          .github/workflows/*m9*.yml scripts/*m9*.mjs src/main.ts
          src/rust-browser/production
          src/rust-browser/adapters/cloud-save-adapter.ts
          src/rust-browser/adapters/signaling-adapter.ts
          src/rust-browser/adapters/transport-adapter.ts
          src/rust-browser/worker/rust-kernel-worker.ts
          src/rust-browser/worker/rust-wasm-loader.ts
          test/node/rust-browser/production
          test/node/rust-browser/adapters/adapter-contracts.test.ts
          workers/er-save-api/src/m9-production.ts
          workers/er-save-api/src/m9-type-guards.ts
          workers/er-m9-preview-save/src
          workers/er-telemetry/src/m9-health.ts
      - name: Enforce production import and API quarantine
        run: |
          node scripts/build-kernel-m9-browser.mjs --out-dir "$RUNNER_TEMP/m9-production" --authority rust
          for forbidden in 'battle-scene' 'game-manager' 'loadDevTools' 'startUpdateChecker' 'window.location.reload' 'AuthorityResolutionPlan'; do
            ! grep -R -E "$forbidden" "$RUNNER_TEMP/m9-production"
          done
          ! grep -R -E 'MIGRATE_LEGACY|MIGRATE_PRODUCTION_SAVE_V2|pokerogue_sessionId' "$RUNNER_TEMP/m9-production"
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const preview = readFileSync('workers/er-m9-preview-save/wrangler.toml', 'utf8');
          const legacy = readFileSync('workers/er-save-api/wrangler.toml', 'utf8');
          if (!/binding\s*=\s*"RUST_PREVIEW_DB"/.test(preview)
              || /binding\s*=\s*"DB"/.test(preview)
              || !/M9_PREVIEW_DATABASE_IDENTITY_HASH\s*=\s*"b860cac56eb16855e2a46fc6ba2f458666f06d0ab4e04ca4c83f0e3962afd36e"/.test(preview)
              || /RUST_PREVIEW_DB|M9_RUST_SAVES/.test(legacy)) {
            throw new Error('M9 preview and legacy D1 capabilities are not physically separated');
          }
          NODE
          grep -R -q 'ATTACH_PRODUCTION_ARTIFACTS_V1' "$RUNNER_TEMP/m9-production"
          ! grep -R -E 'reloadKernel|HOT_RELOAD|DEV_KERNEL' "$RUNNER_TEMP/m9-production"
          ! grep -E 'pokerogue_sessionId|authorization|M9_HEALTH_TOKEN|M9_RELEASE_SIGNING_PRIVATE_KEY' "$RUNNER_TEMP/m9-production/rust-kernel-worker.js"

  rust-regression:
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        if: inputs.rust_regression_run_id == 0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Restore Cargo dependency downloads
        if: inputs.rust_regression_run_id == 0
        id: correctness-deps-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9-g52-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9-g52-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore correctness compiled artifacts
        if: inputs.rust_regression_run_id == 0
        id: correctness-target-cache
        uses: actions/cache@v5
        with:
          path: |
            rust/target/debug/.fingerprint
            rust/target/debug/build
            rust/target/debug/deps
          key: m9-g52-target-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-test-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ inputs.candidate_sha }}
          restore-keys: |
            m9-g52-target-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-test-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Run locked Rust correctness targets
        if: inputs.rust_regression_run_id == 0
        working-directory: rust
        env:
          DEPS_CACHE_HIT: ${{ steps.correctness-deps-cache.outputs.cache-hit }}
          TARGET_CACHE_HIT: ${{ steps.correctness-target-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/m9-rust-correctness"
          START_MS=$(date +%s%3N)
          cargo test --workspace --locked --lib --bins --tests -- \
            --skip m3_audited_production_surface_matches_frozen_manifest
          TESTS_DONE_MS=$(date +%s%3N)
          cargo test --workspace --locked --doc
          DOCS_DONE_MS=$(date +%s%3N)
          cargo check --workspace --locked --examples
          END_MS=$(date +%s%3N)
          jq -n \
            --arg candidate "${{ inputs.candidate_sha }}" \
            --arg deps_cache_hit "$DEPS_CACHE_HIT" \
            --arg target_cache_hit "$TARGET_CACHE_HIT" \
            --argjson tests_ms "$((TESTS_DONE_MS - START_MS))" \
            --argjson doctests_ms "$((DOCS_DONE_MS - TESTS_DONE_MS))" \
            --argjson examples_ms "$((END_MS - DOCS_DONE_MS))" \
            --argjson total_ms "$((END_MS - START_MS))" \
            '{schema_version:1,candidate_sha:$candidate,profile:"test",target:"x86_64-unknown-linux-gnu",
              dependency_cache_hit:$deps_cache_hit,compiled_cache_hit:$target_cache_hit,
              correctness_tests_ms:$tests_ms,doctests_ms:$doctests_ms,example_check_ms:$examples_ms,total_ms:$total_ms}' \
            > "$RUNNER_TEMP/m9-rust-correctness/timing.json"
      - uses: actions/upload-artifact@v6
        if: inputs.rust_regression_run_id == 0
        with:
          name: m9-g52-rust-correctness-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/m9-rust-correctness/timing.json
          if-no-files-found: error
          retention-days: 30
      - name: Consume exact-SHA G52 Rust regression result
        if: inputs.rust_regression_run_id != 0
        uses: actions/github-script@v8
        with:
          script: |
            const candidate = '${{ inputs.candidate_sha }}';
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.rust_regression_run_id }}'),
            });
            if (run.data.name !== 'Rust Kernel M9 G52 Production Qualification' || run.data.head_sha !== candidate) {
              core.setFailed('G52 aggregation requires the exact-candidate regression-owner run');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.data.id,
              per_page: 100,
            });
            const regression = jobs.filter(job => job.name === 'rust-regression');
            if (regression.length !== 1 || regression[0].conclusion !== 'success') {
              core.setFailed('Exact-candidate Rust regression result is missing or non-successful');
            }

  optimized-benchmarks:
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        if: inputs.rust_regression_run_id == 0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Restore Cargo dependency downloads
        if: inputs.rust_regression_run_id == 0
        id: benchmark-deps-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m9-g52-cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            m9-g52-cargo-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore optimized benchmark artifacts
        if: inputs.rust_regression_run_id == 0
        id: benchmark-target-cache
        uses: actions/cache@v5
        with:
          path: |
            rust/target/release/.fingerprint
            rust/target/release/build
            rust/target/release/deps
          key: m9-g52-target-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-release-bench-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ inputs.candidate_sha }}
          restore-keys: |
            m9-g52-target-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-release-bench-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Run optimized historical throughput workloads
        if: inputs.rust_regression_run_id == 0
        working-directory: rust
        env:
          DEPS_CACHE_HIT: ${{ steps.benchmark-deps-cache.outputs.cache-hit }}
          TARGET_CACHE_HIT: ${{ steps.benchmark-target-cache.outputs.cache-hit }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/m9-optimized-benchmarks"
          START_MS=$(date +%s%3N)
          M2_START_MS=$START_MS
          cargo test --locked --release -p er-sim --bench m2_benchmark -- --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/m9-optimized-benchmarks/m2.log"
          M2_END_MS=$(date +%s%3N)
          test "$(grep -c 'M2_BENCHMARK_RESULT ' "$RUNNER_TEMP/m9-optimized-benchmarks/m2.log")" -eq 4
          cargo test --locked --release -p er-sim --bench m3_benchmark -- --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/m9-optimized-benchmarks/m3.log"
          M3_END_MS=$(date +%s%3N)
          test "$(grep -c 'M3_BENCHMARK_RESULT ' "$RUNNER_TEMP/m9-optimized-benchmarks/m3.log")" -eq 5
          cargo test --locked --release -p er-sim --bench m4_runtime_benchmark -- --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/m9-optimized-benchmarks/m4.log"
          END_MS=$(date +%s%3N)
          for marker in \
            run-surface-raw-key-events-100000 \
            two-client-wave-transitions-1000 \
            reward-market-cycles-1000 \
            biome-transitions-1000 \
            wave-transitions-10000; do
            test "$(grep -c "\"id\":\"$marker\"" "$RUNNER_TEMP/m9-optimized-benchmarks/m4.log")" -eq 1
          done
          test "$(grep -c '"id":"complete-runs-200-waves-100"' "$RUNNER_TEMP/m9-optimized-benchmarks/m4.log")" -eq 4
          jq -n \
            --arg candidate "${{ inputs.candidate_sha }}" \
            --arg deps_cache_hit "$DEPS_CACHE_HIT" \
            --arg target_cache_hit "$TARGET_CACHE_HIT" \
            --argjson m2_ms "$((M2_END_MS - M2_START_MS))" \
            --argjson m3_ms "$((M3_END_MS - M2_END_MS))" \
            --argjson m4_ms "$((END_MS - M3_END_MS))" \
            --argjson total_ms "$((END_MS - START_MS))" \
            '{schema_version:1,candidate_sha:$candidate,profile:"release",target:"x86_64-unknown-linux-gnu",
              dependency_cache_hit:$deps_cache_hit,compiled_cache_hit:$target_cache_hit,
              workloads:{m2:{tests:4},m3:{tests:5},m4:{tests:9}},
              m2_ms:$m2_ms,m3_ms:$m3_ms,m4_ms:$m4_ms,total_ms:$total_ms}' \
            > "$RUNNER_TEMP/m9-optimized-benchmarks/timing.json"
      - uses: actions/upload-artifact@v6
        if: inputs.rust_regression_run_id == 0
        with:
          name: m9-g52-optimized-benchmarks-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/m9-optimized-benchmarks
          if-no-files-found: error
          retention-days: 30
      - name: Consume exact-SHA optimized benchmark result
        if: inputs.rust_regression_run_id != 0
        uses: actions/github-script@v8
        with:
          script: |
            const candidate = '${{ inputs.candidate_sha }}';
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.rust_regression_run_id }}'),
            });
            if (run.data.name !== 'Rust Kernel M9 G52 Production Qualification' || run.data.head_sha !== candidate) {
              core.setFailed('G52 benchmark reuse requires the exact-candidate regression-owner run');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.data.id,
              per_page: 100,
            });
            const benchmark = jobs.filter(job => job.name === 'optimized-benchmarks');
            if (benchmark.length !== 1 || benchmark[0].conclusion !== 'success') {
              core.setFailed('Exact-candidate optimized benchmark result is missing or non-successful');
            }
  node-contracts:
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run production selector artifact save co-op health generation and rollback contracts
        run: >-
          pnpm exec vitest run --config test/node/vitest.config.ts
          test/node/rust-browser/production/*.test.ts
          test/node/rust-browser/adapters/adapter-contracts.test.ts
          test/node/rust-browser/release-contract.test.ts
          test/node/rust-browser/shadow-isolation.test.ts
          test/node/rust-browser/shadow-performance.test.ts
          --pool=forks --isolate --no-file-parallelism

  sealed-bundle:
    needs: candidate-binding
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: m9-g52-wasm-${{ runner.os }}-${{ runner.arch }}-0.2.127-${{ hashFiles('rust/Cargo.lock') }}
      - run: rustup target add wasm32-unknown-unknown
      - run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fxq 'wasm-bindgen 0.2.127'; then cargo install wasm-bindgen-cli --version 0.2.127 --locked; fi
          node scripts/build-kernel-m8-web.mjs --out-dir "$RUNNER_TEMP/m9-web" --content rust/fixtures/m8/browser-reference/content-pack.json --identity rust/fixtures/m8/browser-reference/execution-identity.bin --session rust/fixtures/m8/browser-reference/session-start.json --authority-session rust/fixtures/m8/browser-reference/session-authority.json --replica-session rust/fixtures/m8/browser-reference/session-replica.json
          cp rust/fixtures/m8/browser-reference/expected-terminal-digest.txt "$RUNNER_TEMP/m9-web/"
          grep -q 'restore_production_save_v2' "$RUNNER_TEMP/m9-web/er_web.js"
          ! grep -q 'migrate_production_save_v2' "$RUNNER_TEMP/m9-web/er_web.js"
          node scripts/build-kernel-m9-browser.mjs --out-dir "$RUNNER_TEMP/m9-browser-one" --authority rust
          node scripts/build-kernel-m9-browser.mjs --out-dir "$RUNNER_TEMP/m9-browser-two" --authority rust
          for file in bootstrap.js browser.js rust-kernel-worker.js service-worker.js; do cmp "$RUNNER_TEMP/m9-browser-one/$file" "$RUNNER_TEMP/m9-browser-two/$file"; done
      - uses: actions/upload-artifact@v6
        with:
          name: m9-g52-web-${{ github.sha }}
          path: ${{ runner.temp }}/m9-web
          if-no-files-found: error
          retention-days: 30

  browser-matrix:
    name: M9 production browser matrix (${{ matrix.browser }})
    needs: sealed-bundle
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: m9-g52-web-${{ github.sha }}
          path: ${{ runner.temp }}/m9-web
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run cache and input platform matrix
        env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m9-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=${{ matrix.browser }}
          test/browser/rust-browser/release-cache.spec.ts
          test/browser/rust-browser/input-accessibility.spec.ts
      - name: Run mobile touch in a fresh browser process
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=${{ matrix.browser }}
          test/browser/rust-browser/mobile-profile.spec.ts
      - name: Run cross-engine Rust Wasm journey
        if: matrix.browser != 'firefox'
        env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m9-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=${{ matrix.browser }}
          test/browser/rust-browser/rust-local.spec.ts
      - name: Run Chromium solo co-op reconnect and Phaser journeys
        if: matrix.browser == 'chromium'
        env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m9-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts
          --project=chromium
          test/browser/rust-browser/full-solo.spec.ts
          test/browser/rust-browser/full-coop.spec.ts
          test/browser/rust-browser/adapters/phaser-adapter.spec.ts
          test/browser/rust-browser/adapters/webrtc-two-browser.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m9-g52-browser-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/rust-browser
          if-no-files-found: warn
          retention-days: 30

  performance-resource:
    needs: sealed-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: m9-g52-web-${{ github.sha }}
          path: ${{ runner.temp }}/m9-web
      - run: pnpm exec playwright install --with-deps chromium
      - env:
          M8_RUST_BROWSER_FIXTURE_DIR: ${{ runner.temp }}/m9-web
        run: >-
          pnpm exec playwright test --config playwright.rust-browser.config.ts --project=chromium
          test/browser/rust-browser/performance.spec.ts
          --workers=1

  g52-aggregate:
    name: M9 exact-SHA production qualification
    needs:
      - candidate-binding
      - source-static-security
      - rust-regression
      - optimized-benchmarks
      - node-contracts
      - sealed-bundle
      - browser-matrix
      - performance-resource
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' "M9 executable candidate ${{ inputs.candidate_sha }} with harness $GITHUB_SHA passed immutable G52 production qualification; reused Rust regression ${{ inputs.rust_regression_run_id }}"
