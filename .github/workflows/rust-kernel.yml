            exit 0
          fi
          if ((${#missing[@]} > 0)); then
            printf '::error::Rust workspace contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

