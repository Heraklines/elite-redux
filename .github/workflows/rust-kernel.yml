        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ matrix.target }}-success
          path: rust-ci-summary/${{ matrix.target }}-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ matrix.target }}-failure
          path: rust-ci-summary/**
          if-no-files-found: warn
