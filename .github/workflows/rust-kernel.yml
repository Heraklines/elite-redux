        working-directory: rust
        shell: bash
        env:
          M3_EVIDENCE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p ../rust-ci-summary
          {
            case "$M3_EVIDENCE_TARGET" in
              rng-parity)
                cargo nextest run --profile ci -p er-rng --test m3_rng
                ;;
              state-properties)
                cargo nextest run --profile ci -p er-state \
                  --test m3_validation --test m3_pokemon_state --test m3_battle_state
