            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn

  rust-wasm-node-parity:
    name: Rust wasm32 er-wasm Node parity
    needs: m3-oracle-publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Detect er-wasm contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          m1_contract=rust/contracts/m1-api.md
          if [[ ! -f "$m1_contract" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: the M1 er-wasm interface is not frozen yet."
            exit 0
          fi
          present=0
          missing=()
          for path in "${core[@]}"; do
            if [[ -e "$path" ]]; then
              present=1
            else
              missing+=("$path")
            fi
          done
          wasm_manifest=rust/crates/er-wasm/Cargo.toml
          if [[ ! -f "$wasm_manifest" ]]; then
            missing+=("$wasm_manifest")
          fi
          if ((${#missing[@]} > 0)); then
            printf '::error::er-wasm contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install repository-pinned Node.js
        if: steps.contract.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve the repository Rust toolchain semantics
        id: rust-toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t toolchain_spec < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/rust-toolchain.toml").open("rb") as stream:
              document = tomllib.load(stream)
          spec = document.get("toolchain")
          if not isinstance(spec, dict):
              raise SystemExit("rust/rust-toolchain.toml must contain a [toolchain] table")
          unknown = set(spec) - {"channel", "profile", "components", "targets"}
          if unknown:
              raise SystemExit(f"unsupported rust-toolchain.toml keys: {sorted(unknown)}")
          channel = spec.get("channel")
          profile = spec.get("profile", "default")
          if not isinstance(channel, str) or not channel:
              raise SystemExit("rust/rust-toolchain.toml channel must be a non-empty string")
          if profile not in {"minimal", "default", "complete"}:
              raise SystemExit(f"invalid rust-toolchain.toml profile: {profile!r}")
          print(f"channel\t{channel}")
          print(f"profile\t{profile}")
          for key, kind in (("components", "component"), ("targets", "target")):
              values = spec.get(key, [])
              if not isinstance(values, list) or any(not isinstance(value, str) or not value for value in values):
                  raise SystemExit(f"rust-toolchain.toml {key} must be a list of non-empty strings")
              for value in values:
                  print(f"{kind}\t{value}")
          PY
          )
          channel=""
          rustup_args=()
          for line in "${toolchain_spec[@]}"; do
            IFS=$'\t' read -r kind value <<< "$line"
            case "$kind" in
              channel) channel="$value" ;;
              profile|component|target)
                rustup_args+=("--${kind}" "$value")
                ;;
              *)
                echo "::error::Unknown parsed rust-toolchain.toml field: $kind"
                exit 1
                ;;
            esac
          done
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$channel"
          rustup toolchain install "$channel" "${rustup_args[@]}"
          active="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          [[ "$active" == "$channel"* ]]

      - name: Confirm the repository Rust toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Rust dependencies and targets
        if: steps.contract.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Locate er-wasm crate
        id: er-wasm
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest=rust/crates/er-wasm/Cargo.toml
          python3 - "$manifest" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          manifest = Path(sys.argv[1])
          with manifest.open("rb") as stream:
              document = tomllib.load(stream)
          if document.get("package", {}).get("name") != "er-wasm":
              raise SystemExit(f"{manifest} must declare package.name = 'er-wasm'")
          PY
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "directory=$(dirname "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Install wasm-pack
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          set +e
          cargo install wasm-pack --locked \
            2>&1 | tee rust-ci-summary/wasm-pack-install.log
          install_status=${PIPESTATUS[0]}
          set -e
          exit "$install_status"

      - name: Run wasm32 er-wasm tests through Node
        if: steps.contract.outputs.ready == 'true'
        env:
          CARGO_BUILD_TARGET: wasm32-unknown-unknown
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
          set +e
          wasm-pack test --node "${{ steps.er-wasm.outputs.directory }}" \
            2>&1 | tee rust-ci-summary/wasm-node.log
          wasm_status=${PIPESTATUS[0]}
          set -e
          exit "$wasm_status"

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "status=${JOB_STATUS:-unknown}"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-success
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*trace*
            **/*seed*
            **/*divergence*
            **/*digest*
            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn

  rust-benchmarks:
