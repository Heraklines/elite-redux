          baseline=rust/fixtures/v1/m2-benchmark-baseline.json
          benchmark_args=(
            --mode measure
            --manifest rust/fixtures/v1/m2-benchmark-manifest.json
            --oracle-game-sha "$ORACLE_SHA"
            --output "$output"
          )
          expected_regression_status=not_requested
          if [[ -f "$baseline" ]]; then
            benchmark_args+=(--baseline "$baseline")
            expected_regression_status=passed
          fi

          set +e
          node scripts/benchmark-kernel-m2.mjs "${benchmark_args[@]}" \
            2>&1 | tee rust-ci-summary/m2-benchmark-command.log
          benchmark_status=${PIPESTATUS[0]}
          set -e

          test -s "$output"
          cat "$output"
          node --input-type=module - "$output" "$expected_regression_status" <<'NODE'
          import { readFileSync } from "node:fs";

          const file = process.argv[2];
          const expectedRegressionStatus = process.argv[3];
          const value = JSON.parse(readFileSync(file, "utf8"));
          const expected = [
            { id: "raw-input-menu-transitions", iterations: 1000, schedules: 0, steps: 0 },
            { id: "proposal-receipt-cycles", iterations: 1000, schedules: 0, steps: 0 },
            { id: "fault-network-schedules", iterations: 0, schedules: 10000, steps: 0 },
            { id: "synthetic-pair-campaign", iterations: 0, schedules: 0, steps: 100000 },
          ];
          const assert = (condition, message) => {
            if (!condition) throw new Error(`${file}: ${message}`);
          };
          const measuredInteger = (candidate, label, positive = false) => {
            assert(Number.isSafeInteger(candidate), `${label} must be a safe integer`);
            assert(positive ? candidate > 0 : candidate >= 0, `${label} is outside its measured range`);
          };

          assert(value.schema_version === 1, "schema_version must be 1");
          assert(value.manifest_id === "rust-kernel-m2-bench-v1", "manifest_id mismatch");
          assert(value.mode === "measure" && value.status === "passed", "measurement did not pass");
          assert(value.oracle_game_sha === process.env.ORACLE_SHA, "oracle SHA mismatch");
          assert(value.oracle_branch === "ci/coop/v2-showdown-command-coordinate-20260720", "oracle branch mismatch");
          assert(value.protocol_version === "er-coop-47", "protocol version mismatch");
          assert(value.frame_protocol_version === 2, "frame protocol version mismatch");
          assert(typeof value.manifest_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.manifest_sha256), "manifest digest missing");
          assert(typeof value.source_lock_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.source_lock_sha256), "source-lock digest missing");
          assert(typeof value.content_identity?.content_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.content_identity.content_sha256), "content digest missing");
          assert(value.toolchain?.channel === "1.97.1", "toolchain channel mismatch");
          assert(value.toolchain?.profile === "minimal", "toolchain profile mismatch");
          assert(value.toolchain?.package === "er-sim", "toolchain package mismatch");
          assert(value.toolchain?.bench_target === "m2_benchmark", "bench target mismatch");
          assert(value.toolchain?.build_profile === "release", "build profile mismatch");
          assert(value.setup?.status === "passed", "benchmark setup did not pass");
          measuredInteger(value.setup.elapsed_wall_ms, "setup.elapsed_wall_ms");

          const runner = value.runner;
          assert(runner?.provider === "github-hosted", "runner provider mismatch");
          assert(runner?.hosted === true && runner?.github_actions === true, "runner is not attested as hosted Actions");
          assert(runner?.os === "linux" && runner?.runner_os === "Linux", "runner OS mismatch");
          assert(runner?.arch === process.arch, "runner architecture mismatch");
          assert(runner?.runner_arch === process.env.RUNNER_ARCH, "RUNNER_ARCH mismatch");
          assert(runner?.class === "linux-github-hosted", "runner class mismatch");
          assert(runner?.peak_rss_method === "gnu-time-%M-kib", "peak RSS method mismatch");
          const github = runner.github_run;
          const githubFields = {
            server_url: "GITHUB_SERVER_URL",
            repository: "GITHUB_REPOSITORY",
            workflow: "GITHUB_WORKFLOW",
            job: "GITHUB_JOB",
            ref: "GITHUB_REF",
            sha: "GITHUB_SHA",
            run_id: "GITHUB_RUN_ID",
            run_attempt: "GITHUB_RUN_ATTEMPT",
            run_number: "GITHUB_RUN_NUMBER",
          };
          for (const [field, environment] of Object.entries(githubFields)) {
            assert(github?.[field] === process.env[environment], `runner ${field} mismatch`);
          }

          assert(Array.isArray(value.workloads) && value.workloads.length === expected.length, "workload count mismatch");
          for (const [index, specification] of expected.entries()) {
            const workload = value.workloads[index];
            assert(workload?.scenario_id === specification.id, `workload ${index} id/order mismatch`);
            for (const field of ["iterations", "schedules", "steps"]) {
              assert(workload[field] === specification[field], `${specification.id} ${field} mismatch`);
            }
            assert(workload.status === "passed" && workload.success === true, `${specification.id} did not pass`);
            assert(workload.failure === null, `${specification.id} recorded a failure`);
            measuredInteger(workload.elapsed_wall_ms, `${specification.id}.elapsed_wall_ms`);
            measuredInteger(workload.peak_rss_bytes, `${specification.id}.peak_rss_bytes`, true);
            assert(typeof workload.checksum === "string" && /^[0-9a-f]{16}$/u.test(workload.checksum), `${specification.id} checksum missing`);
            assert(workload.oracle_game_sha === value.oracle_game_sha, `${specification.id} oracle mismatch`);
            assert(workload.protocol_version === value.protocol_version, `${specification.id} protocol mismatch`);
            assert(workload.manifest_sha256 === value.manifest_sha256, `${specification.id} manifest mismatch`);
            assert(workload.source_lock_sha256 === value.source_lock_sha256, `${specification.id} source-lock mismatch`);
            assert(workload.content_sha256 === value.content_identity.content_sha256, `${specification.id} content mismatch`);
            assert(workload.runner?.provider === runner.provider, `${specification.id} runner provider mismatch`);
            assert(workload.runner?.os === runner.os && workload.runner?.arch === runner.arch, `${specification.id} runner platform mismatch`);
            assert(workload.runner?.class === runner.class, `${specification.id} runner class mismatch`);
            assert(workload.runner?.github_run?.sha === process.env.GITHUB_SHA, `${specification.id} SHA mismatch`);
          }
          const fault = value.workloads.find(workload => workload.scenario_id === "fault-network-schedules");
          assert(fault.elapsed_wall_ms < 60000, "10,000 fault schedules must complete in under 60 seconds");
          assert(value.regression_check?.factor === 1.25, "regression factor must be 1.25");
          assert(value.regression_check?.status === expectedRegressionStatus, "regression status mismatch");
          if (expectedRegressionStatus === "passed") {
            assert(Array.isArray(value.regression_check.regressions), "regression list missing");
            assert(value.regression_check.regressions.length === 0, "wall/RSS regression exceeded 25 percent");
          }
          NODE
          exit "$benchmark_status"

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "job_status=${JOB_STATUS:-unknown}"
            echo "benchmark_status=measured"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact measured evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-measured
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*trace*
            **/*seed*
            **/*divergence*
            **/*digest*
            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn
