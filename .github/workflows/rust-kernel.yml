name: Rust Kernel Gate

on:
  push:
    branches:
      - "arch/rust-kernel-v0"
      - "arch/rust-kernel-m3"
      - "arch/rust-kernel/**"
      - "codex/rust-kernel-m2-*"
      - "wrk/rk-m3-*"
      - "wrk/rk-m3a-*"
      - "wrk/rk-m3b-*"
      - "wrk/rk-m3c-*"
    paths:
      - ".nvmrc"
      - ".gitmodules"
      - "assets"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust/**"
      - "rust/rust-toolchain.toml"
      - "rust/fixtures/**"
      - "schemas/kernel/**"
      - "test/kernel-fixtures/**"
      - "scripts/export-kernel-*.mjs"
      - "scripts/benchmark-kernel-*.mjs"
      - "docs/plans/rust-kernel/m3-*.md"
      - "src/**"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    paths:
      - ".nvmrc"
      - ".gitmodules"
      - "assets"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust/**"
      - "rust/rust-toolchain.toml"
      - "rust/fixtures/**"
      - "schemas/kernel/**"
      - "test/kernel-fixtures/**"
      - "scripts/export-kernel-*.mjs"
      - "scripts/benchmark-kernel-*.mjs"
      - "docs/plans/rust-kernel/m3-*.md"
      - "src/**"
      - ".github/workflows/rust-kernel.yml"

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  m3-production-source-lock:
    name: M3 production source lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable production surface
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /.gitmodules
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /rust/contracts/m3-contract.toml
            /rust/source-lock.toml
            /rust/fixtures/m3/m3-audited-production-blobs.json
            /src/
          submodules: false

      - name: Require the immutable production surface and active protocol sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f rust/contracts/m3-contract.toml ]]; then
            echo "M3 contract surface is not present on this branch"
            exit 0
          fi
          base=7357166c19bdb5cf0e32c84b0f74f22e79d80798
          oracle=3b534099919efae827019d4a3f3c4ab0ecd6d67b
          audited_production_head=2bb5d04a62cbf443f2a82322f941d4720f896a85
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${oracle}^{commit}"
          git cat-file -e "${audited_production_head}^{commit}"
          test "$GITHUB_SHA" != "$audited_production_head"
          git merge-base --is-ancestor "$oracle" "$base"
          git merge-base --is-ancestor "$audited_production_head" "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          locked_runtime=(.nvmrc .gitmodules package.json pnpm-lock.yaml pnpm-workspace.yaml src)
          git diff --exit-code "$oracle" "$base" -- "${locked_runtime[@]}"
          immutable_runtime=(.nvmrc .gitmodules package.json pnpm-lock.yaml pnpm-workspace.yaml rust/source-lock.toml)
          git diff --exit-code "$base" "$GITHUB_SHA" -- "${immutable_runtime[@]}"

          manifest=rust/fixtures/m3/m3-audited-production-blobs.json
          test -f "$manifest"
          git cat-file -e "$GITHUB_SHA:$manifest"
          manifest_entries="$(python3 - "$manifest" "$base" "$audited_production_head" "$GITHUB_SHA" <<'PY'
          import json
          import re
          import subprocess
          import sys

          manifest_path, expected_base, expected_audited_head, checkpoint_head = sys.argv[1:]

          def reject_duplicate_keys(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise SystemExit(f"duplicate JSON key: {key}")
                  document[key] = value
              return document

          with open(manifest_path, "r", encoding="utf-8") as stream:
              manifest = json.load(stream, object_pairs_hook=reject_duplicate_keys)

          required_keys = {
              "schema_version",
              "manifest_id",
              "m2_base_sha",
              "head_sha",
              "source_root",
              "path_count",
              "paths",
          }
          if set(manifest) != required_keys:
              raise SystemExit(
                  "audited production blob manifest keys are not exact: "
                  f"missing={sorted(required_keys - set(manifest))} "
                  f"unexpected={sorted(set(manifest) - required_keys)}"
              )
          if type(manifest["schema_version"]) is not int or manifest["schema_version"] != 1:
              raise SystemExit("audited production blob manifest schema_version must be 1")
          if manifest["manifest_id"] != "m3-audited-production-blobs-v1":
              raise SystemExit("audited production blob manifest ID is not exact")
          hash40 = re.compile(r"[0-9a-f]{40}\Z")
          if manifest["m2_base_sha"] != expected_base or hash40.fullmatch(manifest["m2_base_sha"]) is None:
              raise SystemExit("audited production blob manifest M2 base SHA is not exact")
          if manifest["head_sha"] != expected_audited_head or hash40.fullmatch(manifest["head_sha"]) is None:
              raise SystemExit("audited production blob manifest head SHA is not exact")
          if manifest["source_root"] != "src":
              raise SystemExit("audited production blob manifest source root is not exact")
          if type(manifest["path_count"]) is not int or manifest["path_count"] != 41:
              raise SystemExit("audited production blob manifest path count must be 41")

          entries = manifest["paths"]
          if not isinstance(entries, list) or len(entries) != manifest["path_count"]:
              raise SystemExit("audited production blob manifest path list count is not exact")
          path_pattern = re.compile(r"src/[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*\Z")
          paths = []
          for entry in entries:
              if not isinstance(entry, dict) or set(entry) != {"path", "blob_oid"}:
                  raise SystemExit(f"audited production blob entry keys are not exact: {entry!r}")
              path = entry["path"]
              blob_oid = entry["blob_oid"]
              if not isinstance(path, str) or path_pattern.fullmatch(path) is None:
                  raise SystemExit(f"unsafe audited production source path: {path!r}")
              if not isinstance(blob_oid, str) or hash40.fullmatch(blob_oid) is None:
                  raise SystemExit(f"invalid audited production blob object ID: {blob_oid!r}")
              paths.append(path)
          if len(paths) != len(set(paths)):
              raise SystemExit("audited production blob manifest contains duplicate paths")
          if paths != sorted(paths):
              raise SystemExit("audited production blob manifest paths are not sorted")

          actual = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", expected_base, checkpoint_head, "--", "src"],
              text=True,
          ).splitlines()
          if len(actual) != len(set(actual)) or actual != sorted(actual):
              raise SystemExit("actual production src diff is not a unique sorted path set")
          if actual != paths:
              missing = sorted(set(paths) - set(actual))
              extra = sorted(set(actual) - set(paths))
              raise SystemExit(
                  "actual M2-to-HEAD production src path set differs from the manifest: "
                  f"missing={missing} extra={extra}"
              )

          for entry in entries:
              print(f"{entry['path']}\t{entry['blob_oid']}")
          PY
          )"
          while IFS=$'\t' read -r path expected_blob; do
            test -n "$path"
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
            audited_blob="$(git rev-parse "$audited_production_head:$path")"
            test "$(git cat-file -t "$audited_blob")" = blob
            test "$audited_blob" = "$expected_blob"
            checkpoint_blob="$(git rev-parse "$GITHUB_SHA:$path")"
            test "$(git cat-file -t "$checkpoint_blob")" = blob
            test "$checkpoint_blob" = "$expected_blob"
          done <<< "$manifest_entries"
          echo "M3 production source manifest matches actual src delta: 41 paths and pinned blobs"
          oracle_gitlinks="$(git ls-tree -r "$oracle" | awk '$1 == "160000"')"
          base_gitlinks="$(git ls-tree -r "$base" | awk '$1 == "160000"')"
          head_gitlinks="$(git ls-tree -r "$GITHUB_SHA" | awk '$1 == "160000"')"
          test "$oracle_gitlinks" = "$base_gitlinks"
          test "$base_gitlinks" = "$head_gitlinks"
          echo "M3 production TypeScript and asset gitlinks match oracle ${oracle} through base ${base}"

  m3-contract-freeze:
    name: M3 contract freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out M3 contract surface
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/rust-kernel.yml
            /rust/contracts/
            /rust/fixtures/m3/
            /rust/source-lock.toml
          submodules: false

      - name: Validate frozen contract and evidence catalogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          contract_dir = Path("rust/contracts")
          fixture_dir = Path("rust/fixtures/m3")
          required_contracts = {
              "m3-api.md",
              "m3-atomic-transition.md",
              "m3-contract.toml",
              "m3-error-policy.md",
              "m3-internal-event-loop.md",
              "m3-js-number-rng.md",
              "m3-oracle-export.md",
              "m3-ownership.toml",
              "m3-presentation-control.md",
              "m3-snapshot-trace.md",
              "m3-ui-navigation.md",
          }
          required_manifests = {
              "m3-slice-manifest.json",
              "m3-capability-manifest.json",
              "m3-oracle-manifest.json",
              "m3-coverage-map.json",
              "m3-audited-production-blobs.json",
          }
          generated_manifests = {
              "m3-benchmark-manifest.json",
          }

          present_contracts = {path.name for path in contract_dir.glob("m3-*")}
          present_manifests = {path.name for path in fixture_dir.glob("m3-*.json")}
          ref_name = os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME", "")
          m3_surface_required = (
              ref_name == "arch/rust-kernel-m3"
              or re.fullmatch(r"wrk/rk-m3[abc]-.*", ref_name) is not None
          )
          release_generation = re.fullmatch(r"wrk/rk-m3[bc]-.*", ref_name) is not None
          feature_present = bool(present_contracts or present_manifests)
          if not feature_present:
              if m3_surface_required:
                  raise SystemExit(f"{ref_name} may not delete or omit the frozen M3 surface")
              print("M3 contract surface is not present on this branch")
              raise SystemExit(0)
          if present_contracts != required_contracts:
              raise SystemExit(
                  "M3 contract surface is not exact; "
                  f"missing={sorted(required_contracts - present_contracts)} "
                  f"unexpected={sorted(present_contracts - required_contracts)}"
              )
          missing_manifests = required_manifests - present_manifests
          unexpected_manifests = present_manifests - required_manifests - generated_manifests
          if missing_manifests or unexpected_manifests:
              raise SystemExit(
                  "M3 fixture surface is not exact; "
                  f"missing={sorted(missing_manifests)} "
                  f"unexpected={sorted(unexpected_manifests)}"
              )
          if (
              generated_manifests & present_manifests
              and ref_name != "arch/rust-kernel-m3"
              and re.fullmatch(r"wrk/rk-m3c-.*", ref_name) is None
          ):
              raise SystemExit("the generated M3 benchmark manifest is restricted to M3C/integration")

          with (contract_dir / "m3-contract.toml").open("rb") as stream:
              lock = tomllib.load(stream)
          with (contract_dir / "m3-ownership.toml").open("rb") as stream:
              ownership = tomllib.load(stream)
          with Path("rust/source-lock.toml").open("rb") as stream:
              source_lock = tomllib.load(stream)

          expected_lock = {
              "m2_base_sha": "7357166c19bdb5cf0e32c84b0f74f22e79d80798",
              "oracle_game_sha": "3b534099919efae827019d4a3f3c4ab0ecd6d67b",
              "oracle_protocol_version": "er-coop-47",
              "battle_state_schema_version": 1,
              "content_pack_schema_version": 1,
              "battle_turn_material_version": 1,
              "battle_replacement_material_version": 1,
              "command_proposal_version": 1,
              "replacement_proposal_version": 1,
              "battle_control_plan_version": 1,
              "battle_start_version": 1,
              "restorable_snapshot_version": 2,
              "kernel_trace_version": 2,
              "rng_algorithm_version": 1,
              "menu_navigation_version": 1,
              "capability_manifest_version": 1,
              "oracle_manifest_version": 1,
              "coverage_map_version": 1,
              "turn_coordinate_version": 1,
              "mechanical_digest_version": 1,
              "kernel_determinism_digest_version": 1,
              "presentation_plan_digest_version": 1,
              "pair_determinism_digest_version": 1,
          }
          if lock != expected_lock:
              raise SystemExit(f"m3-contract.toml is not exact: {lock!r}")
          if source_lock.get("oracle_game_sha") != expected_lock["oracle_game_sha"]:
              raise SystemExit("M3 oracle pin differs from rust/source-lock.toml")
          if source_lock.get("protocol_version") != expected_lock["oracle_protocol_version"]:
              raise SystemExit("M3 oracle protocol pin differs from rust/source-lock.toml")
          expected_source_lock = {
              "oracle_game_sha": "3b534099919efae827019d4a3f3c4ab0ecd6d67b",
              "oracle_branch": "ci/coop/v2-showdown-command-coordinate-20260720",
              "protocol_version": "er-coop-47",
              "schema_version": 1,
              "input_repeat_delay_ms": 250,
              "input_repeat_interval_ms": 250,
          }
          if source_lock != expected_source_lock:
              raise SystemExit("rust/source-lock.toml differs from the immutable M2 oracle source lock")
          if ownership.get("m2_base_sha") != expected_lock["m2_base_sha"]:
              raise SystemExit("ownership M2 base differs from contract lock")
          if ownership.get("oracle_game_sha") != expected_lock["oracle_game_sha"]:
              raise SystemExit("ownership oracle differs from contract lock")
          if ownership.get("integration_branch") != "arch/rust-kernel-m3":
              raise SystemExit("ownership integration branch is not exact")
          if ownership.get("branch_base_resolution") != (
              "head_sha in the m3-g6-attestation artifact from a successful overall "
              "Rust Kernel Gate run on arch/rust-kernel-m3"
          ):
              raise SystemExit("ownership branch-base resolution is not exact")
          rules = ownership.get("rules", {})
          required_true_rules = {
              "isolated_worktree",
              "exclusive_paths",
              "same_freeze_sha_for_each_generation",
              "public_signatures_frozen_after_g6",
              "integration_owner_only_merges",
              "integration_owner_only_pushes",
              "integration_owner_only_contract_changes",
              "integration_owner_only_shared_crate_roots",
              "integration_owner_only_kernel_step",
              "production_typescript_read_only",
              "m2_source_lock_read_only",
              "hosted_rust_gate_required",
              "branch_base_must_equal_hosted_green_head",
              "integration_owner_verifies_green_attestation",
              "one_behavioral_concern_per_commit",
          }
          false_rules = sorted(key for key in required_true_rules if rules.get(key) is not True)
          if false_rules:
              raise SystemExit(f"ownership rules must be true: {false_rules}")
          if rules.get("local_rust_execution") is not False or rules.get("local_coop_vitest") is not False:
              raise SystemExit("local heavy-test prohibitions must remain false")
          if rules.get("workers_may_spawn_agents") is not False:
              raise SystemExit("M3 workers must not spawn nested agents")
          if rules.get("workers_may_rebase_onto_each_other") is not False:
              raise SystemExit("M3 workers may not rebase onto one another")
          generation_gates = ownership.get("generation_gates", {})
          required_generation_gates = {
              "m3b_requires_all_38_published_fixtures",
              "m3b_requires_both_published_supporting_artifacts",
              "m3b_requires_fresh_process_double_export_job",
              "m3b_requires_gap_free_manifest",
              "m3b_requires_branch_aware_hosted_publication_job",
              "m3b_requires_independent_exact_sha_export_checkouts",
              "m3b_requires_verified_git_and_content_provenance",
          }
          false_generation_gates = sorted(
              key for key in required_generation_gates if generation_gates.get(key) is not True
          )
          if false_generation_gates:
              raise SystemExit(f"M3 generation gates must be true: {false_generation_gates}")

          lanes = ownership.get("lanes", [])
          required_lane_ids = {
              *(f"M3A-{index:02d}" for index in range(1, 13)),
              *(f"M3B-{index:02d}" for index in range(1, 13)),
              *(f"M3C-{index:02d}" for index in range(1, 13)),
          }
          lane_ids = [lane["id"] for lane in lanes]
          lane_branches = [lane["branch"] for lane in lanes]
          if set(lane_ids) != required_lane_ids or len(lane_ids) != 36:
              raise SystemExit("the exact 36-lane M3 ownership matrix is not frozen")
          if len(lane_branches) != len(set(lane_branches)) or any(
              not branch.startswith(("wrk/rk-m3a-", "wrk/rk-m3b-", "wrk/rk-m3c-"))
              for branch in lane_branches
          ):
              raise SystemExit("every M3 lane must have one unique isolated branch")
          owned_paths = {}
          for lane in lanes:
              for path in lane["paths"]:
                  if path in owned_paths:
                      raise SystemExit(
                          f"owned path collision: {path} in {owned_paths[path]} and {lane['id']}"
                      )
                  if (
                      re.match(r"^[A-Za-z]:[\\/]", path)
                      or path.startswith(("/", "\\", "src/"))
                      or "onedrive" in path.lower()
                  ):
                      raise SystemExit(f"lane path escapes the repository-owned M3 surface: {path}")
                  owned_paths[path] = lane["id"]
          integration_owned = ownership.get("integration_owned", {}).get("paths", [])
          exact_overlap = sorted(set(integration_owned) & set(owned_paths))
          if exact_overlap:
              raise SystemExit(f"lane paths overlap exact integration-owned paths: {exact_overlap}")

          def load_json(name):
              with (fixture_dir / name).open("r", encoding="utf-8") as stream:
                  return json.load(stream)

          slice_manifest = load_json("m3-slice-manifest.json")
          capability = load_json("m3-capability-manifest.json")
          coverage = load_json("m3-coverage-map.json")
          oracle = load_json("m3-oracle-manifest.json")
          documents = [slice_manifest, capability, coverage, oracle]
          for document in documents:
              if document.get("schema_version") != 1:
                  raise SystemExit("every M3 JSON manifest must use schema version 1")
              if document.get("oracle_game_sha") != expected_lock["oracle_game_sha"]:
                  raise SystemExit("every M3 JSON manifest must use the pinned oracle SHA")
              if document.get("project") != "PokéRogue Redux":
                  raise SystemExit("every M3 JSON manifest must name PokéRogue Redux")

          expected_species = {1, 7, 19, 23, 50, 52}
          expected_moves = {1, 52, 77, 78, 351, 589}
          expected_abilities = {0, 22, 25}
          expected_statuses = {1, 3, 6}
          species = {entry["id"] for entry in slice_manifest["species_definitions"]}
          moves = {entry["id"] for entry in slice_manifest["move_definitions"]}
          abilities = {entry["id"] for entry in slice_manifest["ability_definitions"]}
          statuses = {entry["id"] for entry in slice_manifest["statuses"]}
          if (species, moves, abilities, statuses) != (
              expected_species,
              expected_moves,
              expected_abilities,
              expected_statuses,
          ):
              raise SystemExit("selected species/move/ability/status IDs are not exact")
          if set(slice_manifest["abilities"].values()) != expected_abilities:
              raise SystemExit("ability role mapping is not exact")
          if set(slice_manifest["moves"].values()) != expected_moves:
              raise SystemExit("move role mapping is not exact")

          expected_formats = {
              "single": {
                  "player_capacity": 1,
                  "enemy_capacity": 1,
                  "authority_seat": 1,
                  "player_seat_ownership": [1],
                  "adjacency": [
                      {"first": ["PLAYER", 0], "second": ["ENEMY", 0]},
                  ],
              },
              "coop_double": {
                  "player_capacity": 2,
                  "enemy_capacity": 2,
                  "authority_seat": 1,
                  "player_seat_ownership": [1, 2],
                  "adjacency": [
                      {"first": ["PLAYER", 0], "second": ["PLAYER", 1]},
                      {"first": ["PLAYER", 0], "second": ["ENEMY", 0]},
                      {"first": ["PLAYER", 0], "second": ["ENEMY", 1]},
                      {"first": ["PLAYER", 1], "second": ["ENEMY", 0]},
                      {"first": ["PLAYER", 1], "second": ["ENEMY", 1]},
                      {"first": ["ENEMY", 0], "second": ["ENEMY", 1]},
                  ],
              },
          }
          if slice_manifest.get("battle_formats") != expected_formats:
              raise SystemExit("selected battle capacities, seat ownership, or adjacency are not exact")

          loadout_ids = set()
          required_loadouts = {
              "player-physical-none": (19, [1, 52, 351, 589], 0),
              "player-special-none": (7, [351, 52, 1, 589], 0),
              "player-status-none": (1, [77, 78, 589, 1], 0),
              "switch-in-intimidate": (23, [1, 77, 78, 589], 22),
              "enemy-neutral-none": (52, [1, 52, 351, 589], 0),
              "enemy-weak-none": (7, [1, 52, 351, 589], 0),
              "enemy-resistant-none": (1, [1, 52, 351, 589], 0),
              "enemy-native-immune-none": (50, [1, 52, 351, 589], 0),
              "enemy-wonder-guard": (52, [1, 52, 351, 589], 25),
          }
          for loadout in slice_manifest["loadouts"]:
              identity = loadout["loadout_id"]
              if identity in loadout_ids:
                  raise SystemExit(f"duplicate loadout {identity}")
              loadout_ids.add(identity)
              if loadout["species_id"] not in species:
                  raise SystemExit(f"loadout {identity} uses unknown species")
              if len(loadout["move_slots"]) != 4 or any(value not in moves for value in loadout["move_slots"]):
                  raise SystemExit(f"loadout {identity} must have four selected moves")
              if loadout["active_ability_id"] not in abilities:
                  raise SystemExit(f"loadout {identity} uses unknown active ability")
              if loadout["passive_ability_ids"] != [None, None, None]:
                  raise SystemExit(f"loadout {identity} must retain three explicit null passives")
              if identity in required_loadouts and (
                  loadout["species_id"],
                  loadout["move_slots"],
                  loadout["active_ability_id"],
              ) != required_loadouts[identity]:
                  raise SystemExit(f"loadout {identity} differs from its exact frozen shape")
          if loadout_ids != set(required_loadouts):
              raise SystemExit(
                  f"loadout catalog mismatch: {sorted(loadout_ids ^ set(required_loadouts))}"
              )

          coverage_ids = [entry["case_id"] for entry in coverage["oracle_cases"]]
          oracle_ids = [entry["scenario_id"] for entry in oracle["case_contracts"]]
          if len(coverage_ids) != len(set(coverage_ids)):
              raise SystemExit("coverage case IDs must be unique")
          if len(oracle_ids) != len(set(oracle_ids)):
              raise SystemExit("oracle contract IDs must be unique")
          if set(coverage_ids) != set(oracle_ids):
              raise SystemExit("oracle case catalog must exactly equal coverage catalog")
          required_case_ids = {
              "physical-hit",
              "critical-hit",
              "special-hit-priority",
              "always-hit",
              "miss",
              "poison-type-immunity",
              "grass-powder-immunity",
              "existing-status-rejected",
              "speed-tie",
              "pp-consumption",
              "pp-unusable-rejected",
              "poison-application",
              "poison-residual",
              "paralysis-application",
              "paralysis-full-stop",
              "paralysis-speed-order",
              "burn-application",
              "burn-residual",
              "burn-physical-penalty",
              "spread-stage-down",
              "stage-floor-cap",
              "none-ability-no-trigger",
              "intimidate-switch-in",
