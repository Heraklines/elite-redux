          import hashlib
          import json
          import os
          from pathlib import Path

          paths = sorted(Path("rust/contracts").glob("m3-*"), key=str)
          paths += sorted(Path("rust/fixtures/m3").glob("m3-*.json"), key=str)
          digest = hashlib.sha256()
          for path in paths:
              digest.update(path.read_bytes())
          attestation = {
              "schema_version": 1,
              "branch": os.environ["G6_BRANCH"],
              "head_sha": os.environ["G6_HEAD_SHA"],
              "run_id": os.environ["G6_RUN_ID"],
              "run_attempt": os.environ["G6_RUN_ATTEMPT"],
              "workflow": "Rust Kernel Gate",
              "contract_aggregate_sha256": digest.hexdigest(),
              "valid_only_when_overall_run_conclusion": "success",
          }
          Path("m3-g6-attestation.json").write_text(
              json.dumps(attestation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload G6 run attestation
        if: ${{ hashFiles('rust/contracts/m3-contract.toml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-g6-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-g6-attestation.json
          if-no-files-found: error
          retention-days: 30

  m3-oracle-publication:
    name: M3 oracle publication and fresh-process determinism
    needs: m3-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out M3 oracle publication surface
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /rust/fixtures/m3/
            /scripts/export-kernel-m3-oracle.mjs
            /test/kernel-fixtures/m3/export-battle-oracle.test.ts
          submodules: false

      - name: Enforce publication generation barrier
        id: publication
        shell: bash
        env:
          M3_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          output = Path(os.environ["GITHUB_OUTPUT"])
          manifest_path = Path("rust/fixtures/m3/m3-oracle-manifest.json")
          exporter = Path("scripts/export-kernel-m3-oracle.mjs")
          exporter_test = Path("test/kernel-fixtures/m3/export-battle-oracle.test.ts")
          ref_name = os.environ.get("M3_REF_NAME", "")
          m3_surface_required = (
              ref_name == "arch/rust-kernel-m3"
              or re.fullmatch(r"wrk/rk-m3[abc]-.*", ref_name) is not None
          )
          release_generation = re.fullmatch(r"wrk/rk-m3[bc]-.*", ref_name) is not None
          if not manifest_path.is_file():
              if m3_surface_required:
                  raise SystemExit(f"{ref_name} may not delete or omit the frozen M3 oracle manifest")
              if exporter.exists() or exporter_test.exists():
                  raise SystemExit("M3 exporter exists without its frozen oracle manifest")
              output.write_text("ready=false\npublication_state=ABSENT\n", encoding="utf-8")
              print("M3 oracle publication surface is not present on this branch")
              raise SystemExit(0)

          with manifest_path.open("r", encoding="utf-8") as stream:
              manifest = json.load(stream)
          state = manifest.get("publication_state")
          if state not in {"CONTRACT_CATALOG_FROZEN", "ORACLE_EVIDENCE_PUBLISHED"}:
              raise SystemExit(f"unknown M3 oracle publication state: {state!r}")
          if release_generation and state != "ORACLE_EVIDENCE_PUBLISHED":
              raise SystemExit(
                  f"{ref_name} cannot start until all 38 cases and two support artifacts are published"
              )
          exporter_exists = exporter.is_file()
          test_exists = exporter_test.is_file()
          if exporter_exists != test_exists:
              raise SystemExit("M3 exporter implementation is partial")
          if state == "ORACLE_EVIDENCE_PUBLISHED" and not exporter_exists:
              raise SystemExit("published M3 oracle evidence requires the pinned exporter and test")
          ready = exporter_exists and test_exists
          expected_oracle_files = {
              entry["fixture_path"]
              for entry in manifest["case_contracts"]
          } | {
              entry["fixture_path"]
              for entry in manifest["supporting_artifact_contracts"]
          }
          oracle_root = Path("rust/fixtures/m3/oracle")
          actual_oracle_files = {
              path.as_posix()
              for path in oracle_root.rglob("*")
              if path.is_file()
          }
          if actual_oracle_files and actual_oracle_files != expected_oracle_files:
              raise SystemExit(
                  "checked-in M3 oracle tree is partial or contains unlisted files; "
                  f"missing={sorted(expected_oracle_files - actual_oracle_files)} "
                  f"unexpected={sorted(actual_oracle_files - expected_oracle_files)}"
              )
          checked_in_tree = actual_oracle_files == expected_oracle_files
          if state == "ORACLE_EVIDENCE_PUBLISHED" and not checked_in_tree:
              raise SystemExit("published M3 oracle state requires the exact checked-in 40-file tree")
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"ready={'true' if ready else 'false'}\n")
              stream.write(f"publication_state={state}\n")
              stream.write(f"checked_in_tree={'true' if checked_in_tree else 'false'}\n")
          if not ready:
              print("M3 oracle catalog is frozen; exporter publication has not started")
          PY

      - name: Expand exact publication checkout
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout disable

      - name: Install repository-pinned pnpm
        if: steps.publication.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install repository-pinned Node.js
        if: steps.publication.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned independent BLAKE3 verifier
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! b3sum --version 2>/dev/null | grep -Fxq 'b3sum 1.8.6'; then
            cargo install b3sum --version 1.8.6 --locked --force
          fi
          b3sum --version | grep -Fx 'b3sum 1.8.6'

      - name: Prepare two immutable exact-SHA exporter checkouts
        id: exporter-checkouts
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          checkout_root="$RUNNER_TEMP/m3-oracle-immutable-checkouts"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$checkout_root"
          mkdir -p "$checkout_root"
          for label in one two; do
            checkout="$checkout_root/$label"
            git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$checkout"
            git -C "$checkout" checkout --detach "$GITHUB_SHA"
            test "$(git -C "$checkout" rev-parse HEAD)" = "$GITHUB_SHA"
            git -C "$checkout" submodule update --init --recursive
            pnpm --dir "$checkout" install --frozen-lockfile
            git -C "$checkout" diff --exit-code
            changed="$(git -C "$checkout" status --porcelain --untracked-files=all)"
            if [[ -n "$changed" ]]; then
              echo "::error::Dependency setup mutated immutable exporter checkout $label"
              printf '%s\n' "$changed"
              exit 1
            fi
            git -C "$checkout" submodule foreach --recursive \
              'git diff --exit-code -- . && test -z "$(git status --porcelain --untracked-files=all)"'
          done
          echo "one=$checkout_root/one" >> "$GITHUB_OUTPUT"
          echo "two=$checkout_root/two" >> "$GITHUB_OUTPUT"

      - name: Verify two independent M3 oracle exports
        id: m3-export
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
          PUBLICATION_STATE: ${{ steps.publication.outputs.publication_state }}
          CHECKED_IN_TREE: ${{ steps.publication.outputs.checked_in_tree }}
          M3_CHECKOUT_ONE: ${{ steps.exporter-checkouts.outputs.one }}
          M3_CHECKOUT_TWO: ${{ steps.exporter-checkouts.outputs.two }}
          ORACLE_SHA: 3b534099919efae827019d4a3f3c4ab0ecd6d67b
        run: |
          set -euo pipefail
          retry_marker="$RUNNER_TEMP/m3-oracle-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.retry"
          if [[ -e "$retry_marker" ]]; then
            echo "::notice::M3 oracle verification retry: fresh shell and exporter processes"
          else
            : > "$retry_marker"
            trap '
              status=$?
              if (( status != 0 )); then
                echo "::warning::M3 oracle verification attempt 1 failed (status ${status}); rerunning the complete two-pass check once"
                rm -f -- m3-oracle-double-export.json
                trap - EXIT
                exec bash --noprofile --norc -euo pipefail "$0"
              fi
            ' EXIT
          fi
          test "$(git -C "$M3_CHECKOUT_ONE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$M3_CHECKOUT_TWO" rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          pass_one="$(mktemp -d "$RUNNER_TEMP/m3-oracle-pass-one.XXXXXX")"
          pass_two="$(mktemp -d "$RUNNER_TEMP/m3-oracle-pass-two.XXXXXX")"
          (
            cd "$M3_CHECKOUT_ONE"
            node scripts/export-kernel-m3-oracle.mjs --output-root "$pass_one"
          )
          git -C "$M3_CHECKOUT_ONE" diff --exit-code
          test -z "$(git -C "$M3_CHECKOUT_ONE" status --porcelain --untracked-files=all)"
          git -C "$M3_CHECKOUT_ONE" submodule foreach --recursive \
            'git diff --exit-code -- . && test -z "$(git status --porcelain --untracked-files=all)"'
          (
            cd "$M3_CHECKOUT_TWO"
            node scripts/export-kernel-m3-oracle.mjs --output-root "$pass_two"
          )
          git -C "$M3_CHECKOUT_TWO" diff --exit-code
          test -z "$(git -C "$M3_CHECKOUT_TWO" status --porcelain --untracked-files=all)"
          git -C "$M3_CHECKOUT_TWO" submodule foreach --recursive \
            'git diff --exit-code -- . && test -z "$(git status --porcelain --untracked-files=all)"'
          M3_PASS_ONE="$pass_one" M3_PASS_TWO="$pass_two" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          with Path("rust/fixtures/m3/m3-oracle-manifest.json").open(
              "r", encoding="utf-8"
          ) as stream:
              manifest = json.load(stream)
          resolved_oracle_tree = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['ORACLE_SHA']}^{{tree}}"],
              text=True,
          ).strip()
          prefix = "rust/fixtures/m3/oracle/"
          expected = [
              entry["fixture_path"].removeprefix(prefix)
              for entry in manifest["case_contracts"]
          ]
          expected += [
              entry["fixture_path"].removeprefix(prefix)
              for entry in manifest["supporting_artifact_contracts"]
          ]
          if len(expected) != 40 or len(expected) != len(set(expected)):
              raise SystemExit("M3 oracle export catalog must contain exactly 40 unique paths")

          roots = [
              Path(os.environ["M3_PASS_ONE"]),
              Path(os.environ["M3_PASS_TWO"]),
          ]
          if os.environ["CHECKED_IN_TREE"] == "true":
              roots.append(Path("rust/fixtures/m3/oracle"))
          inventories = []
          for root in roots:
              inventory = sorted(
                  path.relative_to(root).as_posix()
                  for path in root.rglob("*")
                  if path.is_file()
              )
              if inventory != sorted(expected):
                  raise SystemExit(
                      f"fresh M3 oracle inventory differs from catalog at {root}: {inventory!r}"
                  )
              inventories.append(inventory)

          def first_byte_offset(left, right):
              for index, (first, second) in enumerate(zip(left, right, strict=False)):
                  if first != second:
                      return index
              return min(len(left), len(right))

          def first_json_path(left, right, path="$"):
              if type(left) is not type(right):
                  return path
              if isinstance(left, dict):
                  for key in sorted(set(left) | set(right)):
                      child = f"{path}.{key}"
                      if key not in left or key not in right:
                          return child
                      found = first_json_path(left[key], right[key], child)
                      if found is not None:
                          return found
                  return None
              if isinstance(left, list):
                  limit = min(len(left), len(right))
                  for index in range(limit):
                      found = first_json_path(left[index], right[index], f"{path}[{index}]")
                      if found is not None:
                          return found
                  return None if len(left) == len(right) else f"{path}[{limit}]"
              return None if left == right else path

          def require_equal(relative, label, left, right):
              if left == right:
                  return
              offset = first_byte_offset(left, right)
              decoded_path = None
              try:
                  decoded_path = first_json_path(json.loads(left), json.loads(right))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  pass
              suffix = f" json_path={decoded_path}" if decoded_path is not None else ""
              raise SystemExit(
                  f"M3 oracle bytes differ ({label}): {relative} offset={offset}{suffix}"
              )

          def reject_nonfinite(token):
              raise ValueError(f"non-finite JSON number: {token}")

          def require_sorted_keys(value, path="$"):
              if isinstance(value, dict):
                  keys = list(value)
                  if keys != sorted(keys):
                      raise SystemExit(f"M3 oracle object keys are not sorted at {path}")
                  for key, child in value.items():
                      require_sorted_keys(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      require_sorted_keys(child, f"{path}[{index}]")

          node_version = subprocess.check_output(["node", "--version"], text=True).strip()
          with (
              Path(os.environ["M3_CHECKOUT_ONE"]) / "node_modules/phaser/package.json"
          ).open("r", encoding="utf-8") as stream:
              phaser_version = json.load(stream)["version"]
          expected_runtime_provenance = {
              "node_version": node_version,
              "phaser_version": phaser_version,
              "runner_class": "GITHUB_HOSTED_UBUNTU",
              "platform": "linux",
              "architecture": "x64",
              "locale": "C",
              "timezone": "UTC",
          }

          def require_provenance(value, relative):
              provenance = value.get("provenance") if isinstance(value, dict) else None
              if not isinstance(provenance, dict):
                  raise SystemExit(f"M3 oracle provenance is absent: {relative}")
              for key, expected_value in expected_runtime_provenance.items():
                  if provenance.get(key) != expected_value:
                      raise SystemExit(
                          f"M3 oracle runtime provenance {key} is wrong: {relative}"
                      )
              identity = (
                  provenance.get("oracle_game_sha"),
                  provenance.get("oracle_tree_sha"),
                  provenance.get("exporter_commit_sha"),
                  provenance.get("content_pack_hash"),
              )
              if any(not isinstance(component, str) for component in identity):
                  raise SystemExit(f"M3 oracle identity provenance is malformed: {relative}")
              return identity

          def require_strict_content_value(value, path="$"):
              if value is None or type(value) is bool:
                  return
              if type(value) is int:
                  if not -(2**53 - 1) <= value <= 2**53 - 1:
                      raise SystemExit(f"content canonical integer is outside SafeU53 at {path}")
                  return
              if type(value) is float:
                  raise SystemExit(f"content canonical value contains a float at {path}")
              if isinstance(value, str):
                  try:
                      value.encode("utf-8")
                  except UnicodeEncodeError as error:
                      raise SystemExit(f"content string contains a lone surrogate at {path}: {error}")
                  return
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      require_strict_content_value(child, f"{path}[{index}]")
                  return
              if isinstance(value, dict):
                  for key, child in value.items():
                      if not isinstance(key, str) or not key.isascii():
                          raise SystemExit(f"content canonical object key is not ASCII at {path}")
                      require_strict_content_value(child, f"{path}.{key}")
                  return
              raise SystemExit(f"unsupported content canonical value at {path}: {type(value)}")

          case_fields = {
              "schema_version",
              "scenario_id",
              "provenance",
              "initial_state",
              "initial_rng",
              "commands",
              "expected_rng_draws",
              "expected_action_order",
              "expected_mutations",
              "expected_presentation",
              "expected_final_state",
              "final_rng",
              "expected_next_control",
              "gaps",
          }

          entries = []
          aggregate = hashlib.sha256()
          provenance_identities = set()
          content_pack_artifact = None
          for relative in inventories[0]:
              first = roots[0] / relative
              second = roots[1] / relative
              first_bytes = first.read_bytes()
              second_bytes = second.read_bytes()
              require_equal(relative, "fresh process 1 vs 2", first_bytes, second_bytes)
              if len(roots) == 3:
                  checked_bytes = (roots[2] / relative).read_bytes()
                  require_equal(relative, "fresh process vs checked-in", first_bytes, checked_bytes)
              if (
                  not first_bytes.endswith(b"\n")
                  or first_bytes.endswith(b"\n\n")
                  or b"\r" in first_bytes
              ):
                  raise SystemExit(f"M3 oracle output must have one trailing newline: {relative}")
              try:
                  value = json.loads(first_bytes, parse_constant=reject_nonfinite)
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
                  raise SystemExit(f"M3 oracle output is not finite UTF-8 JSON: {relative}: {error}")
              require_sorted_keys(value)
              provenance_identities.add(require_provenance(value, relative))
              digest = hashlib.sha256(first_bytes).hexdigest()
              aggregate.update(relative.encode("utf-8"))
              aggregate.update(b"\0")
              aggregate.update(first_bytes)
              if relative.startswith("battle-cases/"):
                  if set(value) != case_fields:
                      raise SystemExit(f"generated case envelope is not exact: {relative}")
                  if value.get("scenario_id") != Path(relative).stem or value.get("gaps") != []:
                      raise SystemExit(f"generated case is not gap-free/canonical: {relative}")
              elif relative == "content-pack-v1.json":
                  if set(value) != {
                      "artifact_id",
                      "schema_version",
                      "provenance",
                      "content_pack",
                  } or value.get("artifact_id") != "content-pack-v1":
                      raise SystemExit("generated content-pack envelope is not exact")
                  if value.get("schema_version") != 1:
                      raise SystemExit("generated content-pack envelope version is wrong")
                  content_pack_artifact = value
              elif relative == "rng-vectors-v1.json":
                  if set(value) != {
                      "artifact_id",
                      "schema_version",
                      "provenance",
                      "vectors",
                  } or value.get("artifact_id") != "rng-vectors-v1":
                      raise SystemExit("generated RNG-vector envelope is not exact")
                  if value.get("schema_version") != 1 or not value.get("vectors"):
                      raise SystemExit("generated RNG-vector evidence is empty or wrong-version")
              entries.append({"path": relative, "sha256": digest})

          if len(provenance_identities) != 1:
              raise SystemExit("all 40 generated oracle files must share one provenance identity")
          oracle_game_sha, oracle_tree_sha, exporter_commit_sha, content_pack_hash = next(
              iter(provenance_identities)
          )
          if oracle_game_sha != os.environ["ORACLE_SHA"]:
              raise SystemExit("generated oracle commit provenance is not pinned")
          if oracle_tree_sha != resolved_oracle_tree:
              raise SystemExit("generated oracle tree provenance does not resolve from its commit")
          if len(content_pack_hash) != 64 or any(
              character not in "0123456789abcdef" for character in content_pack_hash
          ):
              raise SystemExit("generated content-pack provenance is not lowercase 64-hex")
          subprocess.run(
              ["git", "cat-file", "-e", f"{exporter_commit_sha}^{{commit}}"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", exporter_commit_sha, os.environ["GITHUB_SHA"]],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "diff",
                  "--quiet",
                  exporter_commit_sha,
                  os.environ["GITHUB_SHA"],
                  "--",
                  "scripts/export-kernel-m3-oracle.mjs",
                  "test/kernel-fixtures/m3/export-battle-oracle.test.ts",
              ],
              check=True,
          )

          if content_pack_artifact is None:
              raise SystemExit("generated content-pack artifact is absent")
          pack = content_pack_artifact["content_pack"]
          expected_pack_fields = {
              "schema_version",
              "oracle_game_sha",
              "hash",
              "species",
              "moves",
              "abilities",
              "type_chart",
              "capability_manifest",
          }
          if not isinstance(pack, dict) or set(pack) != expected_pack_fields:
              raise SystemExit("generated ContentPack fields are not exact")
          if pack["schema_version"] != 1 or pack["oracle_game_sha"] != os.environ["ORACLE_SHA"]:
              raise SystemExit("generated ContentPack schema/oracle identity is wrong")
          pack_view = {key: value for key, value in pack.items() if key != "hash"}
          require_strict_content_value(pack_view)
          canonical_pack_bytes = json.dumps(
              pack_view,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          preimage_path = Path(os.environ["RUNNER_TEMP"]) / "m3-content-pack-preimage.json"
          preimage_path.write_bytes(canonical_pack_bytes)
          recomputed_content_hash = subprocess.check_output(
              ["b3sum", str(preimage_path)],
              text=True,
          ).split()[0]
          if recomputed_content_hash != content_pack_hash:
              raise SystemExit("recomputed BLAKE3 content-pack hash differs from provenance")
          if pack["hash"] != "blake3-v1:" + recomputed_content_hash:
              raise SystemExit("ContentPack.hash differs from independently recomputed BLAKE3")

          published_entries = manifest["published_fixtures"] + manifest[
              "published_supporting_artifacts"
          ]
          if os.environ["PUBLICATION_STATE"] == "ORACLE_EVIDENCE_PUBLISHED":
              if len(published_entries) != 40:
                  raise SystemExit("published state must bind all 40 generated files")
              for entry in published_entries:
                  if (
                      entry["oracle_game_sha"],
                      entry["oracle_tree_sha"],
                      entry["exporter_commit_sha"],
                      entry["content_pack_hash"],
                  ) != next(iter(provenance_identities)):
                      raise SystemExit("published manifest provenance differs from generated evidence")
          elif published_entries:
              raise SystemExit("catalog-only state may not contain publication entries")

          evidence = {
              "schema_version": 1,
              "head_sha": os.environ["GITHUB_SHA"],
              "publication_state": os.environ["PUBLICATION_STATE"],
              "checked_in_tree": os.environ["CHECKED_IN_TREE"] == "true",
              "oracle_tree_sha": oracle_tree_sha,
              "exporter_commit_sha": exporter_commit_sha,
              "content_pack_hash": recomputed_content_hash,
              "b3sum_version": subprocess.check_output(
                  ["b3sum", "--version"], text=True
              ).strip(),
              "fresh_process_count": 2,
              "file_count": len(entries),
              "aggregate_sha256": aggregate.hexdigest(),
              "files": entries,
          }
          Path("m3-oracle-double-export.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "M3 oracle fresh-process export valid; "
              f"files={len(entries)} sha256={aggregate.hexdigest()}"
          )
          PY
          echo "generated_tree=$pass_one" >> "$GITHUB_OUTPUT"
          echo "checked_in_tree=$CHECKED_IN_TREE" >> "$GITHUB_OUTPUT"
          git diff --exit-code
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ "$changed" != "?? m3-oracle-double-export.json" ]]; then
            echo "::error::M3 publication job mutated the exact checkout"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Upload first hosted M3 oracle generation tree
        if: >-
          steps.publication.outputs.ready == 'true' &&
          steps.m3-export.outputs.checked_in_tree != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m3-oracle-generated-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.m3-export.outputs.generated_tree }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload M3 oracle determinism evidence
        if: steps.publication.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m3-oracle-double-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: m3-oracle-double-export.json
          if-no-files-found: error
          retention-days: 30

  m3-source-lock-and-oracle:
    name: m3-source-lock-and-oracle
    needs:
      - m3-production-source-lock
      - m3-oracle-publication
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both immutable source and oracle publication gates
        shell: bash
        env:
          SOURCE_LOCK_RESULT: ${{ needs.m3-production-source-lock.result }}
          ORACLE_RESULT: ${{ needs.m3-oracle-publication.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_LOCK_RESULT" = success
          test "$ORACLE_RESULT" = success
          printf 'sha=%s\nsource_lock=%s\noracle=%s\n' \
            "$GITHUB_SHA" "$SOURCE_LOCK_RESULT" "$ORACLE_RESULT"

  m3-schema-and-content:
    name: m3-schema-and-content
    needs: m3-source-lock-and-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /rust/
            /schemas/kernel/
            /test/kernel-fixtures/
            /scripts/export-kernel-fixtures.mjs
            /scripts/export-kernel-schema.mjs
            /src/enums/buttons.ts
            /src/enums/game-modes.ts
            /src/constants/app-constants.ts
            /src/inputs-controller.ts
            /src/ui-inputs.ts
            /src/data/elite-redux/coop/coop-transport.ts
            /src/data/elite-redux/coop/authority-v2/contract.ts
            /src/data/elite-redux/coop/authority-v2/authority-entry.ts
            /src/data/elite-redux/coop/authority-v2/next-control.ts
            /src/data/elite-redux/coop/authority-v2/frame-codec.ts
            /src/data/elite-redux/coop/authority-v2/protocol-validator.ts
            /src/data/elite-redux/coop/authority-v2/frame-context.ts
            /src/data/elite-redux/coop/coop-battle-checkpoint.ts
            /src/data/elite-redux/replay-trace.ts
            /src/configs/inputs/cfg-keyboard-qwerty.ts
            /src/configs/inputs/pad-generic.ts
            /src/configs/inputs/pad-dualshock.ts
            /src/configs/inputs/pad-procon.ts
            /src/configs/inputs/pad-unlicensed-snes.ts
            /src/configs/inputs/pad-xbox360.ts
          submodules: false

      - name: Detect source-lock and fixture contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          shopt -s nullglob
          exporters=(
            scripts/export-kernel-fixtures.mjs
            scripts/export-kernel-schema.mjs
          )
          fixture_dir_present=0
          fixture_files=()
          if [[ -d test/kernel-fixtures ]]; then
            fixture_dir_present=1
            while IFS= read -r -d '' fixture; do
              fixture_files+=("$fixture")
            done < <(find test/kernel-fixtures -type f -not -path '*/.*' -print0)
            if ((${#fixture_files[@]} == 0)); then
              echo "::error::test/kernel-fixtures exists but is empty or contains only hidden files; refusing a false pre-contract pass."
              exit 1
            fi
          fi
          feature_present=0
          if [[ -e rust/source-lock.toml ]]; then
            feature_present=1
          fi
          if ((${#exporters[@]} > 0)); then
            feature_present=1
          fi
          if ((fixture_dir_present == 1)); then
            feature_present=1
          fi
          if ((feature_present == 0)); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: source-lock/exporter/fixture milestone is not present yet."
            exit 0
          fi
          missing=()
          for path in "${core[@]}" rust/source-lock.toml; do
            [[ -e "$path" ]] || missing+=("$path")
          done
          for exporter in "${exporters[@]}"; do
            [[ -e "$exporter" ]] || missing+=("$exporter")
          done
          ((${#fixture_files[@]} > 0)) || missing+=("test/kernel-fixtures/*")
          if ((${#missing[@]} > 0)); then
            printf '::error::Rust kernel source-lock contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install repository-pinned Node.js
        if: steps.contract.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify source-lock metadata and oracle tree identity
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        env:
          ORACLE_SHA: 3b534099919efae827019d4a3f3c4ab0ecd6d67b
          ORACLE_BRANCH: ci/coop/v2-showdown-command-coordinate-20260720
          AUDITED_PRODUCTION_HEAD: 2bb5d04a62cbf443f2a82322f941d4720f896a85
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/source-lock.toml").open("rb") as stream:
              document = tomllib.load(stream)

          expected = {
              "oracle_game_sha": "3b534099919efae827019d4a3f3c4ab0ecd6d67b",
              "oracle_branch": "ci/coop/v2-showdown-command-coordinate-20260720",
              "protocol_version": "er-coop-47",
              "schema_version": 1,
              "input_repeat_delay_ms": 250,
              "input_repeat_interval_ms": 250,
          }
          actual_keys = set(document)
          expected_keys = set(expected)
          if actual_keys != expected_keys:
              missing = sorted(expected_keys - actual_keys)
              unknown = sorted(actual_keys - expected_keys)
              raise SystemExit(
                  f"source-lock.toml fields must be exact; missing={missing!r}, unknown={unknown!r}"
              )
          for key, expected_value in expected.items():
              actual_value = document[key]
              if type(actual_value) is not type(expected_value) or actual_value != expected_value:
                  raise SystemExit(
                      f"source-lock.toml {key} must be {expected_value!r} "
                      f"({type(expected_value).__name__}), got {actual_value!r} "
                      f"({type(actual_value).__name__})"
                  )
          print("source-lock metadata matches the exact six-field contract")
          PY

          git fetch --no-tags origin \
            "refs/heads/${ORACLE_BRANCH}:refs/remotes/origin/${ORACLE_BRANCH}"
          oracle_ref="refs/remotes/origin/${ORACLE_BRANCH}"
          test "$(git rev-parse "$oracle_ref")" = "$ORACLE_SHA"
          git cat-file -e "${ORACLE_SHA}^{commit}"
          git merge-base --is-ancestor "$ORACLE_SHA" HEAD
          git cat-file -e "${AUDITED_PRODUCTION_HEAD}^{commit}"
          git merge-base --is-ancestor "$AUDITED_PRODUCTION_HEAD" "$GITHUB_SHA"

          consumed_sources=(
            src/enums/buttons.ts
            src/enums/game-modes.ts
            src/constants/app-constants.ts
            src/inputs-controller.ts
            src/ui-inputs.ts
            src/data/elite-redux/coop/coop-transport.ts
            src/data/elite-redux/coop/authority-v2/contract.ts
            src/data/elite-redux/coop/authority-v2/authority-entry.ts
            src/data/elite-redux/coop/authority-v2/next-control.ts
            src/data/elite-redux/coop/authority-v2/frame-codec.ts
            src/data/elite-redux/coop/authority-v2/protocol-validator.ts
            src/data/elite-redux/coop/authority-v2/frame-context.ts
            src/data/elite-redux/coop/coop-battle-checkpoint.ts
            src/data/elite-redux/replay-trace.ts
            src/configs/inputs/cfg-keyboard-qwerty.ts
            src/configs/inputs/pad-generic.ts
            src/configs/inputs/pad-dualshock.ts
            src/configs/inputs/pad-procon.ts
            src/configs/inputs/pad-unlicensed-snes.ts
            src/configs/inputs/pad-xbox360.ts
          )
          active_m3_sources=(
            src/data/elite-redux/coop/coop-transport.ts
            src/data/elite-redux/coop/authority-v2/next-control.ts
            src/data/elite-redux/coop/authority-v2/frame-codec.ts
            src/data/elite-redux/coop/authority-v2/protocol-validator.ts
          )
          blob_manifest=rust/fixtures/m3/m3-audited-production-blobs.json
          manifest_entries="$(python3 - "$blob_manifest" "$AUDITED_PRODUCTION_HEAD" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open("r", encoding="utf-8") as stream:
              manifest = json.load(stream)
          expected_audited_head = sys.argv[2]
          hash40 = re.compile(r"[0-9a-f]{40}\Z")
          manifest_head = manifest.get("head_sha")
          if (
              not isinstance(manifest_head, str)
              or hash40.fullmatch(manifest_head) is None
              or manifest_head != expected_audited_head
          ):
              raise SystemExit("active exporter manifest audited production head is not exact")
          for entry in manifest["paths"]:
              print(f"{entry['path']}\t{entry['blob_oid']}")
          PY
          )"
          declare -A audited_blob_oids=()
          while IFS=$'\t' read -r path blob_oid; do
            test -n "$path"
            [[ "$blob_oid" =~ ^[0-9a-f]{40}$ ]]
            if [[ -n "${audited_blob_oids[$path]+present}" ]]; then
              echo "duplicate audited blob path: $path"
              exit 1
            fi
            audited_blob_oids["$path"]="$blob_oid"
          done <<< "$manifest_entries"
          declare -A active_m3_sources_set=()
          for path in "${active_m3_sources[@]}"; do
            active_m3_sources_set["$path"]=1
          done
          for path in "${consumed_sources[@]}"; do
            git cat-file -e "${ORACLE_SHA}:${path}"
            if [[ -n "${active_m3_sources_set[$path]+present}" ]]; then
              expected_blob="${audited_blob_oids[$path]:-}"
              [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
              audited_blob="$(git rev-parse "$AUDITED_PRODUCTION_HEAD:$path")"
              test "$(git cat-file -t "$audited_blob")" = blob
              test "$audited_blob" = "$expected_blob"
              checkpoint_blob="$(git rev-parse "$GITHUB_SHA:$path")"
              test "$(git cat-file -t "$checkpoint_blob")" = blob
              test "$checkpoint_blob" = "$expected_blob"
            else
              git diff --quiet --no-ext-diff "$ORACLE_SHA" -- "$path"
            fi
          done

      - name: Resolve the repository Rust toolchain semantics
        id: rust-toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t toolchain_spec < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/rust-toolchain.toml").open("rb") as stream:
              document = tomllib.load(stream)
          spec = document.get("toolchain")
          if not isinstance(spec, dict):
              raise SystemExit("rust/rust-toolchain.toml must contain a [toolchain] table")
          unknown = set(spec) - {"channel", "profile", "components", "targets"}
          if unknown:
              raise SystemExit(f"unsupported rust-toolchain.toml keys: {sorted(unknown)}")
          channel = spec.get("channel")
          profile = spec.get("profile", "default")
          if not isinstance(channel, str) or not channel:
              raise SystemExit("rust/rust-toolchain.toml channel must be a non-empty string")
          if profile not in {"minimal", "default", "complete"}:
              raise SystemExit(f"invalid rust-toolchain.toml profile: {profile!r}")
          print(f"channel\t{channel}")
          print(f"profile\t{profile}")
          for key, kind in (("components", "component"), ("targets", "target")):
              values = spec.get(key, [])
              if not isinstance(values, list) or any(not isinstance(value, str) or not value for value in values):
                  raise SystemExit(f"rust-toolchain.toml {key} must be a list of non-empty strings")
              for value in values:
                  print(f"{kind}\t{value}")
          PY
          )
          channel=""
          rustup_args=()
          for line in "${toolchain_spec[@]}"; do
            IFS=$'\t' read -r kind value <<< "$line"
            case "$kind" in
              channel) channel="$value" ;;
              profile|component|target)
                rustup_args+=("--${kind}" "$value")
                ;;
              *)
                echo "::error::Unknown parsed rust-toolchain.toml field: $kind"
                exit 1
                ;;
            esac
          done
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$channel"
          rustup toolchain install "$channel" "${rustup_args[@]}"
          active="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          [[ "$active" == "$channel"* ]]

      - name: Confirm the repository Rust toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Rust dependencies and targets
        if: steps.contract.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Verify Cargo.lock is current
        if: steps.contract.outputs.ready == 'true'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          committed_lock="$RUNNER_TEMP/Cargo.lock.committed"
          cp Cargo.lock "$committed_lock"
          cargo generate-lockfile
          if ! cmp -s "$committed_lock" Cargo.lock; then
            mkdir -p ../rust-ci-summary
            cp Cargo.lock ../rust-ci-summary/generated-Cargo.lock
            echo "::error::rust/Cargo.lock is stale; generated-Cargo.lock is attached to the failure artifact."
            exit 1
          fi

      - name: Verify locked workspace metadata
        if: steps.contract.outputs.ready == 'true'
        working-directory: rust
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Verify two-run exporter determinism
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
        run: |
          set -euo pipefail
          shopt -s nullglob
          exporters=(
            scripts/export-kernel-fixtures.mjs
            scripts/export-kernel-schema.mjs
          )
          for pass in 1 2; do
            echo "Running kernel exporters, determinism pass $pass/2"
            for exporter in "${exporters[@]}"; do
              node "$exporter"
            done
            if ! git diff --no-ext-diff --exit-code -- rust/source-lock.toml test/kernel-fixtures; then
              echo "::error::Exporter determinism pass $pass/2 differs from the checked-in contract."
              git diff --no-ext-diff -- rust/source-lock.toml test/kernel-fixtures
              exit 1
            fi
            changed="$(git status --porcelain --untracked-files=all -- rust/source-lock.toml test/kernel-fixtures)"
            if [[ -n "$changed" ]]; then
              echo "::error::Exporter determinism pass $pass/2 produced untracked files:"
              printf '%s\n' "$changed"
              exit 1
            fi
          done

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "status=${JOB_STATUS:-unknown}"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-success
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**
          retention-days: 14
          if-no-files-found: warn

  m3-format:
    name: m3-format
    needs: m3-source-lock-and-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Detect Rust workspace contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          present=0
          missing=()
          for path in "${core[@]}"; do
            if [[ -e "$path" ]]; then
              present=1
            else
              missing+=("$path")
            fi
          done
          if ((present == 0)); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: rust workspace milestone is not present yet."
            exit 0
          fi
          if ((${#missing[@]} > 0)); then
            printf '::error::Rust workspace contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve the repository Rust toolchain semantics
        id: rust-toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t toolchain_spec < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/rust-toolchain.toml").open("rb") as stream:
              document = tomllib.load(stream)
          spec = document.get("toolchain")
          if not isinstance(spec, dict):
              raise SystemExit("rust/rust-toolchain.toml must contain a [toolchain] table")
          unknown = set(spec) - {"channel", "profile", "components", "targets"}
          if unknown:
              raise SystemExit(f"unsupported rust-toolchain.toml keys: {sorted(unknown)}")
          channel = spec.get("channel")
          profile = spec.get("profile", "default")
          if not isinstance(channel, str) or not channel:
              raise SystemExit("rust/rust-toolchain.toml channel must be a non-empty string")
          if profile not in {"minimal", "default", "complete"}:
              raise SystemExit(f"invalid rust-toolchain.toml profile: {profile!r}")
          print(f"channel\t{channel}")
          print(f"profile\t{profile}")
          for key, kind in (("components", "component"), ("targets", "target")):
              values = spec.get(key, [])
              if not isinstance(values, list) or any(not isinstance(value, str) or not value for value in values):
                  raise SystemExit(f"rust-toolchain.toml {key} must be a list of non-empty strings")
              for value in values:
                  print(f"{kind}\t{value}")
          PY
          )
          channel=""
          rustup_args=()
          for line in "${toolchain_spec[@]}"; do
            IFS=$'\t' read -r kind value <<< "$line"
            case "$kind" in
              channel) channel="$value" ;;
              profile|component|target)
                rustup_args+=("--${kind}" "$value")
                ;;
              *)
                echo "::error::Unknown parsed rust-toolchain.toml field: $kind"
                exit 1
                ;;
            esac
          done
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$channel"
          rustup toolchain install "$channel" "${rustup_args[@]}"
          active="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          [[ "$active" == "$channel"* ]]

      - name: Confirm the repository Rust toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Rust dependencies and targets
        if: steps.contract.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Check Rust formatting
        if: steps.contract.outputs.ready == 'true'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            mkdir -p ../rust-ci-summary
            git diff --no-ext-diff --binary -- . > ../rust-ci-summary/rustfmt.patch
            echo "::error::Rust formatting differs; rustfmt.patch is attached to the failure artifact."
            exit 1
          fi

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "status=${JOB_STATUS:-unknown}"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-success
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*trace*
            **/*seed*
            **/*divergence*
            **/*digest*
            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn

  m3-clippy:
    name: m3-clippy
    needs: m3-source-lock-and-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Detect Rust workspace contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          present=0
          missing=()
          for path in "${core[@]}"; do
            if [[ -e "$path" ]]; then
              present=1
            else
              missing+=("$path")
            fi
          done
          if ((present == 0)); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: rust workspace milestone is not present yet."
            exit 0
          fi
          if ((${#missing[@]} > 0)); then
            printf '::error::Rust workspace contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve the repository Rust toolchain semantics
        id: rust-toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t toolchain_spec < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/rust-toolchain.toml").open("rb") as stream:
              document = tomllib.load(stream)
          spec = document.get("toolchain")
          if not isinstance(spec, dict):
              raise SystemExit("rust/rust-toolchain.toml must contain a [toolchain] table")
          unknown = set(spec) - {"channel", "profile", "components", "targets"}
          if unknown:
              raise SystemExit(f"unsupported rust-toolchain.toml keys: {sorted(unknown)}")
          channel = spec.get("channel")
          profile = spec.get("profile", "default")
          if not isinstance(channel, str) or not channel:
              raise SystemExit("rust/rust-toolchain.toml channel must be a non-empty string")
          if profile not in {"minimal", "default", "complete"}:
              raise SystemExit(f"invalid rust-toolchain.toml profile: {profile!r}")
          print(f"channel\t{channel}")
          print(f"profile\t{profile}")
          for key, kind in (("components", "component"), ("targets", "target")):
              values = spec.get(key, [])
              if not isinstance(values, list) or any(not isinstance(value, str) or not value for value in values):
                  raise SystemExit(f"rust-toolchain.toml {key} must be a list of non-empty strings")
              for value in values:
                  print(f"{kind}\t{value}")
          PY
          )
          channel=""
          rustup_args=()
          for line in "${toolchain_spec[@]}"; do
            IFS=$'\t' read -r kind value <<< "$line"
            case "$kind" in
              channel) channel="$value" ;;
              profile|component|target)
                rustup_args+=("--${kind}" "$value")
                ;;
              *)
                echo "::error::Unknown parsed rust-toolchain.toml field: $kind"
                exit 1
                ;;
            esac
          done
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$channel"
          rustup toolchain install "$channel" "${rustup_args[@]}"
          active="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          [[ "$active" == "$channel"* ]]

      - name: Confirm the repository Rust toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Rust dependencies and targets
        if: steps.contract.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Run workspace clippy with warnings denied
        if: steps.contract.outputs.ready == 'true'
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "status=${JOB_STATUS:-unknown}"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-success
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*trace*
            **/*seed*
            **/*divergence*
            **/*digest*
            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn

