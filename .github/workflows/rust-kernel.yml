          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Locate er-wasm crate
        id: er-wasm
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest=rust/crates/er-wasm/Cargo.toml
          python3 - "$manifest" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          manifest = Path(sys.argv[1])
          with manifest.open("rb") as stream:
              document = tomllib.load(stream)
          if document.get("package", {}).get("name") != "er-wasm":
              raise SystemExit(f"{manifest} must declare package.name = 'er-wasm'")
          PY
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "directory=$(dirname "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Install wasm-pack
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          install_started_ns="$(date +%s%N)"
          set +e
          cargo install wasm-pack --locked \
            2>&1 | tee rust-ci-summary/wasm-pack-install.log
          install_status=${PIPESTATUS[0]}
          install_finished_ns="$(date +%s%N)"
          echo "wasm_pack_install_elapsed_ms=$(( (install_finished_ns - install_started_ns) / 1000000 ))" \
            > rust-ci-summary/m3-continuation-build.txt
          set -e
          exit "$install_status"

      - name: Emit hosted native M3 report from the serialized trace
        if: steps.contract.outputs.ready == 'true'
        env:
          M3_PARITY_ARTIFACT_DIR: ${{ github.workspace }}/m3-native-wasm-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$M3_PARITY_ARTIFACT_DIR" rust-ci-summary
          cargo test --manifest-path rust/Cargo.toml -p er-wasm --test m3_parity \
            native_m3_serialized_trace_emits_hosted_report_artifact -- --exact --nocapture \
            2>&1 | tee rust-ci-summary/native-report.log
          test -s "$M3_PARITY_ARTIFACT_DIR/trace.json"
          test -s "$M3_PARITY_ARTIFACT_DIR/native-report.json"

      - name: Build native M3 continuation test for timed replay
        if: steps.contract.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          native_build_started_ns="$(date +%s%N)"
          cargo test --manifest-path rust/Cargo.toml -p er-sim --release \
            --test m3_snapshot_continuation --no-run \
            2>&1 | tee rust-ci-summary/native-continuation-build.log
          native_build_finished_ns="$(date +%s%N)"
          printf 'native_build_elapsed_ms=%s\n' \
            "$(( (native_build_finished_ns - native_build_started_ns) / 1000000 ))" \
            >> rust-ci-summary/m3-continuation-build.txt

      - name: Emit hosted native M3 continuation suite report
        if: steps.contract.outputs.ready == 'true'
        env:
          M3_CONTINUATION_ARTIFACT_DIR: ${{ github.workspace }}/m3-native-wasm-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$M3_CONTINUATION_ARTIFACT_DIR" rust-ci-summary
          native_execution_started_ns="$(date +%s%N)"
          cargo test --manifest-path rust/Cargo.toml -p er-sim --release --test m3_snapshot_continuation \
            live_coop_production::hosted_m3_native_wasm_continuation_suite_emits_artifacts -- --exact --nocapture \
            2>&1 | tee rust-ci-summary/native-continuation-report.log
          native_execution_finished_ns="$(date +%s%N)"
          echo "native_execution_ms=$(( (native_execution_finished_ns - native_execution_started_ns) / 1000000 ))" \
            > rust-ci-summary/m3-continuation-native-timing.txt
          test -s "$M3_CONTINUATION_ARTIFACT_DIR/suite.json"
          test -s "$M3_CONTINUATION_ARTIFACT_DIR/native-continuation-report.json"

      - name: Run wasm32 er-wasm tests through Node
        if: steps.contract.outputs.ready == 'true'
        env:
          CARGO_BUILD_TARGET: wasm32-unknown-unknown
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
          wasm_test_started_ns="$(date +%s%N)"
          set +e
          wasm-pack test --node "${{ steps.er-wasm.outputs.directory }}" \
            2>&1 | tee rust-ci-summary/wasm-node.log
          wasm_status=${PIPESTATUS[0]}
          wasm_test_finished_ns="$(date +%s%N)"
          printf 'wasm_pack_test_elapsed_ms=%s\n' \
            "$(( (wasm_test_finished_ns - wasm_test_started_ns) / 1000000 ))" \
            >> rust-ci-summary/m3-continuation-build.txt
          set -e
          exit "$wasm_status"

      - name: Build the wasm32/Node report runner
        if: steps.contract.outputs.ready == 'true'
        env:
          CARGO_BUILD_TARGET: wasm32-unknown-unknown
        run: |
          set -euo pipefail
          wasm_build_started_ns="$(date +%s%N)"
          wasm-pack build --release --target nodejs \
            --out-dir "$RUNNER_TEMP/m3-er-wasm" \
            "${{ steps.er-wasm.outputs.directory }}" \
            2>&1 | tee rust-ci-summary/wasm-build.log
          wasm_build_finished_ns="$(date +%s%N)"
          printf 'er_wasm_build_elapsed_ms=%s\n' \
            "$(( (wasm_build_finished_ns - wasm_build_started_ns) / 1000000 ))" \
            >> rust-ci-summary/m3-continuation-build.txt

      - name: Emit wasm32/Node report from the native serialized trace
        if: steps.contract.outputs.ready == 'true'
        env:
          M3_TRACE_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/trace.json
          M3_WASM_PACKAGE: ${{ runner.temp }}/m3-er-wasm
          M3_WASM_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/wasm-report.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const trace = fs.readFileSync(process.env.M3_TRACE_PATH, "utf8");
          const wasm = require(path.resolve(process.env.M3_WASM_PACKAGE));
          const report = wasm.replayM3FinalEvidence(trace);
          if (typeof report !== "string" || report.length === 0) {
            throw new Error("wasm32/Node M3 export returned no canonical report");
          }
          fs.writeFileSync(process.env.M3_WASM_REPORT_PATH, report, "utf8");
          NODE
          test -s "$M3_WASM_REPORT_PATH"

      - name: Build ephemeral M3 continuation wasm replay wrapper
        if: steps.contract.outputs.ready == 'true'
        env:
          CARGO_BUILD_TARGET: wasm32-unknown-unknown
        run: |
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/m3-continuation-wrapper"
          package_dir="$RUNNER_TEMP/m3-continuation-wasm"
          rm -rf "$wrapper_dir" "$package_dir"
          mkdir -p "$wrapper_dir/src" rust-ci-summary
          cat > "$wrapper_dir/Cargo.toml" <<TOML
          [package]
          name = "m3-continuation-wasm-wrapper"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          er-sim = { path = "$GITHUB_WORKSPACE/rust/crates/er-sim" }
          er-canonical = { path = "$GITHUB_WORKSPACE/rust/crates/er-canonical" }
          er-content = { path = "$GITHUB_WORKSPACE/rust/crates/er-content" }
          er-types = { path = "$GITHUB_WORKSPACE/rust/crates/er-types" }
          serde = { version = "=1.0.229", features = ["derive"] }
          serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
          wasm-bindgen = "=0.2.127"
          TOML
          cat > "$wrapper_dir/src/lib.rs" <<'RUST'
          use std::collections::BTreeSet;
          use std::fmt;
          use std::sync::Arc;

          use er_canonical::{canonicalize, content_digest};
          use er_content::pack::ContentPack;
          use er_sim::snapshot::{PairDeterminismDigest, PairKernelTraceV2};
          use er_types::SafeU53;
          use serde::{Deserialize, Serialize};
          use wasm_bindgen::prelude::*;

          const M3_CONTINUATION_SUITE_SCHEMA_VERSION: u32 = 1;
          const M3_CONTINUATION_REPORT_SCHEMA_VERSION: u32 = 1;
          const M3_CONTINUATION_SUITE_ID: &str =
              "pokerogue-redux/m3/native-wasm-continuation/v1";
          const REQUIRED_CONTINUATION_BOUNDARIES: [&str; 10] = [
              "held-fight-before-keyup",
              "doubles-one-command-pending",
              "guest-proposal-delivery-pending",
              "turn-packet-delayed",
              "control-receipt-delayed",
              "replacement-menu-open",
              "recovery-fence-held",
              "blocking-presentation-pending",
              "terminal-before-teardown",
              "mixed-network-fault-queue",
          ];

          #[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct M3ContinuationScenarioV1 {
              boundary_id: String,
              trace: PairKernelTraceV2,
          }

          #[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct M3ContinuationSuiteV1 {
              schema_version: u32,
              suite_id: String,
              content_pack: ContentPack,
              scenarios: Vec<M3ContinuationScenarioV1>,
          }

          #[derive(Clone, Debug, Eq, PartialEq, Serialize)]
          #[serde(deny_unknown_fields)]
          struct M3ContinuationScenarioReportV1 {
              boundary_id: String,
              trace_digest: String,
              initial_snapshot_digest: String,
              initial_pair_determinism_digest: PairDeterminismDigest,
              operation_count: SafeU53,
              replayed_operation_count: SafeU53,
              host_rng_draw_count: SafeU53,
              guest_rng_draw_count: SafeU53,
              final_entry_digest: String,
              final_pair_determinism_digest: PairDeterminismDigest,
          }

          #[derive(Clone, Debug, Eq, PartialEq, Serialize)]
          #[serde(deny_unknown_fields)]
          struct M3ContinuationReportV1 {
              schema_version: u32,
              suite_id: String,
              suite_digest: String,
              content_hash: String,
              scenario_count: SafeU53,
              scenarios: Vec<M3ContinuationScenarioReportV1>,
          }

          #[derive(Debug)]
          struct WrapperError(String);

          impl fmt::Display for WrapperError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(&self.0)
              }
          }

          impl std::error::Error for WrapperError {}

          type WrapperResult<T> = Result<T, Box<dyn std::error::Error>>;

          fn invalid(message: impl Into<String>) -> Box<dyn std::error::Error> {
              Box::new(WrapperError(message.into()))
          }

          fn safe_len(length: usize, field: &str) -> WrapperResult<SafeU53> {
              let value = u64::try_from(length)?;
              SafeU53::new(value).map_err(|error| {
                  invalid(format!("{field} length is not JS-safe: {error}"))
              })
          }

          impl M3ContinuationSuiteV1 {
              fn validate(&self) -> WrapperResult<()> {
                  if self.schema_version != M3_CONTINUATION_SUITE_SCHEMA_VERSION {
                      return Err(invalid(format!(
                          "schema_version is {}, expected {}",
                          self.schema_version, M3_CONTINUATION_SUITE_SCHEMA_VERSION
                      )));
                  }
                  if self.suite_id != M3_CONTINUATION_SUITE_ID {
                      return Err(invalid(format!(
                          "suite_id is {:?}, expected {:?}",
                          self.suite_id, M3_CONTINUATION_SUITE_ID
                      )));
                  }
                  self.content_pack.validate()?;
                  if self.scenarios.len() != REQUIRED_CONTINUATION_BOUNDARIES.len() {
                      return Err(invalid(format!(
                          "scenario count is {}, expected {}",
                          self.scenarios.len(),
                          REQUIRED_CONTINUATION_BOUNDARIES.len()
                      )));
                  }

                  let mut seen = BTreeSet::new();
                  for (index, (scenario, expected_id)) in self
                      .scenarios
                      .iter()
                      .zip(REQUIRED_CONTINUATION_BOUNDARIES)
                      .enumerate()
                  {
                      if scenario.boundary_id != expected_id {
                          return Err(invalid(format!(
                              "scenario {index} is {:?}, expected {expected_id:?}",
                              scenario.boundary_id
                          )));
                      }
                      if !seen.insert(scenario.boundary_id.as_str()) {
                          return Err(invalid(format!(
                              "duplicate boundary_id {:?}",
                              scenario.boundary_id
                          )));
                      }
                      scenario.trace.validate()?;
                      if scenario.trace.entries.is_empty() {
                          return Err(invalid(format!(
                              "boundary {:?} has no continuation operations",
                              scenario.boundary_id
                          )));
                      }
                      let initial = &scenario.trace.initial_snapshot;
                      if initial.host.content_hash != self.content_pack.hash
                          || initial.guest.content_hash != self.content_pack.hash
                      {
                          return Err(invalid(format!(
                              "boundary {:?} content identity differs from the suite content pack",
                              scenario.boundary_id
                          )));
                      }
                  }
                  Ok(())
              }
          }

          fn parse_suite_json(input: &str) -> WrapperResult<M3ContinuationSuiteV1> {
              let suite: M3ContinuationSuiteV1 = serde_json::from_str(input)?;
              suite.validate()?;
              Ok(suite)
          }

          fn replay_suite(suite: &M3ContinuationSuiteV1) -> WrapperResult<M3ContinuationReportV1> {
              suite.validate()?;
              let content = Arc::new(suite.content_pack.clone());
              let mut scenarios = Vec::with_capacity(suite.scenarios.len());

              for scenario in &suite.scenarios {
                  let replay = scenario
                      .trace
                      .replay_simulated_pair(Arc::clone(&content))?;
                  if let Some(divergence) = replay.first_divergence {
                      return Err(invalid(format!(
                          "M3 continuation diverged at {}, operation {}, time {} ms, path {}, code {}",
                          scenario.boundary_id,
                          divergence.sequence,
                          divergence.virtual_time_ms,
                          divergence.path,
                          divergence.code,
                      )));
                  }

                  let final_entry = scenario.trace.entries.last().ok_or_else(|| {
                      invalid(format!(
                          "boundary {:?} has no final entry",
                          scenario.boundary_id
                      ))
                  })?;
                  let host_rng_draw_count = scenario
                      .trace
                      .entries
                      .iter()
                      .try_fold(0usize, |total, entry| {
                          total.checked_add(entry.host.rng_audit.len())
                      })
                      .ok_or_else(|| {
                          invalid(format!(
                              "boundary {:?} host RNG count overflowed",
                              scenario.boundary_id
                          ))
                      })?;
                  let guest_rng_draw_count = scenario
                      .trace
                      .entries
                      .iter()
                      .try_fold(0usize, |total, entry| {
                          total.checked_add(entry.guest.rng_audit.len())
                      })
                      .ok_or_else(|| {
                          invalid(format!(
                              "boundary {:?} guest RNG count overflowed",
                              scenario.boundary_id
                          ))
                      })?;
                  scenarios.push(M3ContinuationScenarioReportV1 {
                      boundary_id: scenario.boundary_id.clone(),
                      trace_digest: content_digest(&scenario.trace)?,
                      initial_snapshot_digest: content_digest(&scenario.trace.initial_snapshot)?,
                      initial_pair_determinism_digest: PairDeterminismDigest::compute(
                          &scenario.trace.initial_snapshot,
                      )?,
                      operation_count: safe_len(
                          scenario.trace.entries.len(),
                          "scenario operations",
                      )?,
                      replayed_operation_count: replay.replayed_entries,
                      host_rng_draw_count: safe_len(host_rng_draw_count, "host RNG draws")?,
                      guest_rng_draw_count: safe_len(guest_rng_draw_count, "guest RNG draws")?,
                      final_entry_digest: content_digest(final_entry)?,
                      final_pair_determinism_digest: final_entry.pair_after.clone(),
                  });
              }

              Ok(M3ContinuationReportV1 {
                  schema_version: M3_CONTINUATION_REPORT_SCHEMA_VERSION,
                  suite_id: suite.suite_id.clone(),
                  suite_digest: content_digest(suite)?,
                  content_hash: suite.content_pack.hash.to_string(),
                  scenario_count: safe_len(scenarios.len(), "report scenarios")?,
                  scenarios,
              })
          }

          fn replay_suite_json(input: &str) -> WrapperResult<String> {
              Ok(canonicalize(&replay_suite(&parse_suite_json(input)?)?)?)
          }

          #[wasm_bindgen(js_name = replayM3ContinuationSuite)]
          pub fn replay_m3_continuation_suite(input: &str) -> Result<String, JsValue> {
              replay_suite_json(input)
                  .map_err(|error| JsValue::from_str(&error.to_string()))
          }
          RUST
          wrapper_started_ns="$(date +%s%N)"
          wasm-pack build --release --target nodejs \
            --out-dir "$package_dir" "$wrapper_dir" \
            2>&1 | tee rust-ci-summary/m3-continuation-wasm-build.log
          wrapper_finished_ns="$(date +%s%N)"
          printf 'continuation_wrapper_build_elapsed_ms=%s\n' \
            "$(( (wrapper_finished_ns - wrapper_started_ns) / 1000000 ))" \
            >> rust-ci-summary/m3-continuation-build.txt
          test -s "$package_dir/package.json"
          test -s "$package_dir/m3_continuation_wasm_wrapper.js"

      - name: Emit wasm32/Node continuation report from the native suite
        if: steps.contract.outputs.ready == 'true'
        env:
          M3_CONTINUATION_SUITE_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/suite.json
          M3_WASM_CONTINUATION_PACKAGE: ${{ runner.temp }}/m3-continuation-wasm
          M3_WASM_CONTINUATION_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/wasm-continuation-report.json
        run: |
          set -euo pipefail
          node <<'NODE' | tee rust-ci-summary/wasm-continuation-replay.log
          const fs = require("fs");
          const path = require("path");

          const suite = fs.readFileSync(process.env.M3_CONTINUATION_SUITE_PATH, "utf8");
          const wasm = require(path.resolve(process.env.M3_WASM_CONTINUATION_PACKAGE));
          const replayStarted = process.hrtime.bigint();
          const report = wasm.replayM3ContinuationSuite(suite);
          const replayElapsedMs = Number((process.hrtime.bigint() - replayStarted) / 1000000n);
          if (typeof report !== "string" || report.length === 0) {
            throw new Error("ephemeral wasm32/Node M3 continuation wrapper returned no canonical report");
          }
          fs.writeFileSync(process.env.M3_WASM_CONTINUATION_REPORT_PATH, report, "utf8");
          process.stdout.write(`M3_WASM_CONTINUATION_REPLAY_EXECUTION_MS=${replayElapsedMs}\n`);
          NODE
          test -s "$M3_WASM_CONTINUATION_REPORT_PATH"
          native_execution_ms="$(sed -n 's/^native_execution_ms=//p' rust-ci-summary/m3-continuation-native-timing.txt)"
          wasm_replay_execution_ms="$(sed -n 's/^M3_WASM_CONTINUATION_REPLAY_EXECUTION_MS=//p' rust-ci-summary/wasm-continuation-replay.log)"
          [[ "$native_execution_ms" =~ ^[0-9]+$ ]]
          [[ "$wasm_replay_execution_ms" =~ ^[0-9]+$ ]]
          execution_elapsed_ms=$(( native_execution_ms + wasm_replay_execution_ms ))
          target_ms="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const manifest = JSON.parse(readFileSync("rust/fixtures/m3/m3-benchmark-manifest.json", "utf8")); process.stdout.write(String(manifest.cross_target_suite_target.max_exclusive_ms));')"
          {
            echo "metric=execution_elapsed_ms"
            echo "native_execution_ms=$native_execution_ms"
            echo "wasm_replay_execution_ms=$wasm_replay_execution_ms"
            echo "execution_elapsed_ms=$execution_elapsed_ms"
            echo "target_operator=<"
            echo "target_max_exclusive_ms=$target_ms"
          } > rust-ci-summary/m3-continuation-timing.txt
          if (( execution_elapsed_ms >= target_ms )); then
            echo "::error::M3 native/Wasm continuation execution exceeded ${target_ms}ms: ${execution_elapsed_ms}ms"
            exit 1
          fi

      - name: Compare native and wasm M3 report bytes and digests
        if: steps.contract.outputs.ready == 'true'
        env:
          M3_TRACE_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/trace.json
          M3_NATIVE_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/native-report.json
          M3_WASM_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/wasm-report.json
          M3_CONTINUATION_SUITE_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/suite.json
          M3_NATIVE_CONTINUATION_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/native-continuation-report.json
          M3_WASM_CONTINUATION_REPORT_PATH: ${{ github.workspace }}/m3-native-wasm-artifacts/wasm-continuation-report.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          trace_path = Path(os.environ["M3_TRACE_PATH"])
          native_path = Path(os.environ["M3_NATIVE_REPORT_PATH"])
          wasm_path = Path(os.environ["M3_WASM_REPORT_PATH"])
          continuation_suite_path = Path(os.environ["M3_CONTINUATION_SUITE_PATH"])
          native_continuation_path = Path(os.environ["M3_NATIVE_CONTINUATION_REPORT_PATH"])
          wasm_continuation_path = Path(os.environ["M3_WASM_CONTINUATION_REPORT_PATH"])
          continuation_build_path = Path("rust-ci-summary/m3-continuation-build.txt")
          continuation_timing_path = Path("rust-ci-summary/m3-continuation-timing.txt")
          summary_path = Path("rust-ci-summary/m3-parity-summary.txt")
          continuation_summary_path = Path("rust-ci-summary/m3-continuation-summary.txt")
          divergence_path = Path("rust-ci-summary/m3-cross-target-divergence.txt")

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              )

          def first_rng_divergence(left_draws, right_draws):
              left_draws = left_draws if isinstance(left_draws, list) else []
              right_draws = right_draws if isinstance(right_draws, list) else []
              common = min(len(left_draws), len(right_draws))
              for draw_index in range(common):
                  if left_draws[draw_index] != right_draws[draw_index]:
                      return {
                          "kind": "draw",
                          "index": draw_index,
                          "left": left_draws[draw_index],
                          "right": right_draws[draw_index],
                      }
              if len(left_draws) != len(right_draws):
                  return {
                      "kind": "length",
                      "index": common,
                      "left": left_draws[common] if common < len(left_draws) else None,
                      "right": right_draws[common] if common < len(right_draws) else None,
                      "left_length": len(left_draws),
                      "right_length": len(right_draws),
                  }
              return None

          def rng_draw_value(draw, field):
              return "<missing>" if draw is None else str(draw.get(field))

          def rng_divergence_detail(observation, mismatch):
              left_draw = mismatch["left"]
              right_draw = mismatch["right"]
              lines = [
                  f"observation_sequence={observation.get('sequence')}",
                  f"observation_virtual_time_ms={observation.get('virtual_time_ms')}",
                  "field=rng_audit",
                  f"draw_index={mismatch['index']}",
                  f"left_rng_sequence={rng_draw_value(left_draw, 'sequence')}",
                  f"right_rng_sequence={rng_draw_value(right_draw, 'sequence')}",
                  f"left_rng_reason={rng_draw_value(left_draw, 'reason')}",
                  f"right_rng_reason={rng_draw_value(right_draw, 'reason')}",
                  f"left_rng_stream={rng_draw_value(left_draw, 'stream')}",
                  f"right_rng_stream={rng_draw_value(right_draw, 'stream')}",
                  f"left_canonical_value={canonical(left_draw) if left_draw is not None else '<missing>'}",
                  f"right_canonical_value={canonical(right_draw) if right_draw is not None else '<missing>'}",
              ]
              if mismatch["kind"] == "length":
                  lines.extend(
                      (
                          f"left_rng_audit_length={mismatch['left_length']}",
                          f"right_rng_audit_length={mismatch['right_length']}",
                          "rng_audit_mismatch=length_boundary",
                      )
                  )
              return " ".join(lines)

          trace_digest = digest(trace_path)
          native_digest = digest(native_path)
          wasm_digest = digest(wasm_path)
          continuation_suite_digest = digest(continuation_suite_path)
          native_continuation_digest = digest(native_continuation_path)
          wasm_continuation_digest = digest(wasm_continuation_path)
          native_bytes = native_path.read_bytes()
          wasm_bytes = wasm_path.read_bytes()
          native_continuation_bytes = native_continuation_path.read_bytes()
          wasm_continuation_bytes = wasm_continuation_path.read_bytes()

          try:
              native = json.loads(native_bytes)
              wasm = json.loads(wasm_bytes)
          except Exception as error:
              divergence_path.write_text(
                  f"report JSON could not be decoded: {error}\n",
                  encoding="utf-8",
              )
              raise

          if trace_digest != native.get("trace_digest") or trace_digest != wasm.get("trace_digest"):
              divergence_path.write_text(
                  "trace digest mismatch\n"
                  f"artifact_sha256={trace_digest}\n"
                  f"native_report_trace_digest={native.get('trace_digest')}\n"
                  f"wasm_report_trace_digest={wasm.get('trace_digest')}\n",
                  encoding="utf-8",
              )
              raise SystemExit("M3 native/wasm trace digest mismatch")

          if native_bytes != wasm_bytes:
              native_observations = native.get("observations", [])
              wasm_observations = wasm.get("observations", [])
              divergence = None
              if len(native_observations) != len(wasm_observations):
                  divergence = (
                      "observation_count",
                      str(len(native_observations)),
                      str(len(wasm_observations)),
                      None,
                      None,
                  )
              else:
                  fields = (
                      "sequence",
                      "virtual_time_ms",
                      "input_kind",
                      "battle_turn",
                      "effect_digest",
                      "state_digest",
                      "snapshot_digest",
                      "ui_projection_digest",
                      "rng_audit",
                      "rng_audit_digest",
                      "internal_events",
                      "internal_events_digest",
                      "live_resources",
                      "live_resources_digest",
                  )
                  for index, (left, right) in enumerate(zip(native_observations, wasm_observations)):
                      for field in fields:
                          if left.get(field) != right.get(field):
                              rng_mismatch = (
                                  first_rng_divergence(left.get("rng_audit"), right.get("rng_audit"))
                                  if field == "rng_audit"
                                  else None
                              )
                              divergence = (
                                  field,
                                  canonical(left.get(field)),
                                  canonical(right.get(field)),
                                  index,
                                  rng_mismatch,
                              )
                              break
                      if divergence is not None:
                          break
                  if divergence is None:
                      divergence = (
                          "report_metadata" if native != wasm else "report_bytes",
                          canonical(native),
                          canonical(wasm),
                          None,
                          None,
                      )

              field, left, right, index, rng_mismatch = divergence
              if index is None:
                  detail = f"field={field} left={left} right={right}"
              else:
                  observation = native_observations[index]
                  if field == "rng_audit" and rng_mismatch is not None:
                      detail = rng_divergence_detail(observation, rng_mismatch)
                  else:
                      detail = (
                          f"sequence={observation.get('sequence')} "
                          f"virtual_time_ms={observation.get('virtual_time_ms')} "
                          f"field={field} left={left} right={right}"
                      )
              divergence_path.write_text(
                  "first cross-target divergence\n"
                  f"{detail}\n"
                  f"native_sha256={native_digest}\n"
                  f"wasm_sha256={wasm_digest}\n",
                  encoding="utf-8",
              )
              raise SystemExit(f"M3 native/wasm report divergence: {detail}")

          try:
              native_continuation = json.loads(native_continuation_bytes)
              wasm_continuation = json.loads(wasm_continuation_bytes)
          except Exception as error:
              divergence_path.write_text(
                  f"continuation report JSON could not be decoded: {error}\n",
                  encoding="utf-8",
              )
              raise

          continuation_timing = {}
          for line in continuation_timing_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  continuation_timing[key] = value
          continuation_build = {}
          for line in continuation_build_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  continuation_build[key] = int(value)
          build_fields = (
              "wasm_pack_install_elapsed_ms",
              "native_build_elapsed_ms",
              "wasm_pack_test_elapsed_ms",
              "er_wasm_build_elapsed_ms",
              "continuation_wrapper_build_elapsed_ms",
          )
          for field in build_fields:
              if field not in continuation_build or continuation_build[field] < 0:
                  raise SystemExit(f"M3 continuation build timing is missing or invalid: {field}")
          manifest = json.loads(
              Path("rust/fixtures/m3/m3-benchmark-manifest.json").read_text(encoding="utf-8")
          )
          manifest_target = manifest.get("cross_target_suite_target", {})
          if continuation_timing.get("metric") != manifest_target.get("metric"):
              raise SystemExit("M3 continuation timing metric does not match the manifest target")
          if continuation_timing.get("target_operator") != manifest_target.get("operator"):
              raise SystemExit("M3 continuation timing operator does not match the manifest target")
          native_execution_ms = int(continuation_timing["native_execution_ms"])
          wasm_replay_execution_ms = int(continuation_timing["wasm_replay_execution_ms"])
          execution_elapsed_ms = int(continuation_timing["execution_elapsed_ms"])
          if min(native_execution_ms, wasm_replay_execution_ms, execution_elapsed_ms) < 0:
              raise SystemExit("M3 continuation execution timing cannot be negative")
          if execution_elapsed_ms != native_execution_ms + wasm_replay_execution_ms:
              raise SystemExit("M3 continuation execution timing components do not add up")
          target_max_exclusive_ms = int(continuation_timing["target_max_exclusive_ms"])
          if target_max_exclusive_ms != manifest_target.get("max_exclusive_ms"):
              raise SystemExit("M3 continuation timing limit does not match the manifest target")
          if execution_elapsed_ms >= target_max_exclusive_ms:
              divergence_path.write_text(
                  "M3 continuation suite timing target exceeded\n"
                  f"native_execution_ms={native_execution_ms}\n"
                  f"wasm_replay_execution_ms={wasm_replay_execution_ms}\n"
                  f"execution_elapsed_ms={execution_elapsed_ms}\n"
                  f"target_max_exclusive_ms={target_max_exclusive_ms}\n",
                  encoding="utf-8",
              )
              raise SystemExit("M3 continuation suite exceeded its exclusive timing target")

          continuation_fields = (
              "trace_digest",
              "initial_snapshot_digest",
              "initial_pair_determinism_digest",
              "operation_count",
              "replayed_operation_count",
              "host_rng_draw_count",
              "guest_rng_draw_count",
              "final_entry_digest",
              "final_pair_determinism_digest",
          )
          continuation_mismatch = None
          if native_continuation_bytes != wasm_continuation_bytes:
              for field in ("schema_version", "suite_id", "suite_digest", "content_hash", "scenario_count"):
                  if native_continuation.get(field) != wasm_continuation.get(field):
                      continuation_mismatch = (
                          field,
                          canonical(native_continuation.get(field)),
                          canonical(wasm_continuation.get(field)),
                          None,
                      )
                      break
              if continuation_mismatch is None:
                  native_scenarios = native_continuation.get("scenarios", [])
                  wasm_scenarios = wasm_continuation.get("scenarios", [])
                  if len(native_scenarios) != len(wasm_scenarios):
                      continuation_mismatch = (
                          "scenario_count",
                          str(len(native_scenarios)),
                          str(len(wasm_scenarios)),
                          None,
                      )
                  else:
                      for boundary_index, (left, right) in enumerate(zip(native_scenarios, wasm_scenarios)):
                          if left.get("boundary_id") != right.get("boundary_id"):
                              continuation_mismatch = (
                                  "boundary_id",
                                  canonical(left.get("boundary_id")),
                                  canonical(right.get("boundary_id")),
                                  boundary_index,
                              )
                              break
                          for field in continuation_fields:
                              if left.get(field) != right.get(field):
                                  continuation_mismatch = (
                                      field,
                                      canonical(left.get(field)),
                                      canonical(right.get(field)),
                                      boundary_index,
                                  )
                                  break
                          if continuation_mismatch is not None:
                              break
              if continuation_mismatch is None:
                  continuation_mismatch = (
                      "continuation_report_bytes",
                      canonical(native_continuation),
                      canonical(wasm_continuation),
                      None,
                  )

          native_scenarios = native_continuation.get("scenarios", [])
          if continuation_mismatch is not None:
              field, left, right, boundary_index = continuation_mismatch
              if boundary_index is None:
                  detail = f"field={field} left={left} right={right}"
              else:
                  boundary = native_scenarios[boundary_index]
                  detail = (
                      f"boundary_id={boundary.get('boundary_id')} "
                      f"field={field} left={left} right={right}"
                  )
              divergence_path.write_text(
                  "first continuation cross-target divergence\n"
                  f"{detail}\n"
                  f"suite_sha256={continuation_suite_digest}\n"
                  f"native_continuation_sha256={native_continuation_digest}\n"
                  f"wasm_continuation_sha256={wasm_continuation_digest}\n",
                  encoding="utf-8",
              )
              raise SystemExit(f"M3 continuation report divergence: {detail}")

          continuation_lines = [
              "status=passed",
              f"metric={continuation_timing['metric']}",
              f"native_execution_ms={native_execution_ms}",
              f"wasm_replay_execution_ms={wasm_replay_execution_ms}",
              f"execution_elapsed_ms={execution_elapsed_ms}",
              f"target_operator={continuation_timing['target_operator']}",
              f"target_max_exclusive_ms={target_max_exclusive_ms}",
              *(f"{field}={continuation_build[field]}" for field in build_fields),
              f"suite_sha256={continuation_suite_digest}",
              f"native_continuation_report_sha256={native_continuation_digest}",
              f"wasm_continuation_report_sha256={wasm_continuation_digest}",
              f"scenario_count={native_continuation.get('scenario_count')}",
          ]
          for boundary in native_scenarios:
              missing = [field for field in continuation_fields if field not in boundary]
              if missing:
                  raise SystemExit(
                      f"M3 continuation boundary {boundary.get('boundary_id')} is missing {missing}"
                  )
              continuation_lines.append(
                  " ".join(
                      [
                          f"boundary_id={boundary.get('boundary_id')}",
                          *(f"{field}={canonical(boundary.get(field))}" for field in continuation_fields),
                      ]
                  )
              )
          continuation_summary_path.write_text("\n".join(continuation_lines) + "\n", encoding="utf-8")

          coverage = native.get("coverage", {})
          boundary = native.get("snapshot_boundary", {})
          summary_path.write_text(
              "\n".join(
                  (
                      "status=passed",
                      f"trace_sha256={trace_digest}",
                      f"native_report_sha256={native_digest}",
                      f"wasm_report_sha256={wasm_digest}",
                      f"observations={len(native.get('observations', []))}",
                      f"raw_events={coverage.get('raw_event_count')}",
                      f"presentation_settlements={coverage.get('presentation_settlement_count')}",
                      f"continuation_inputs={coverage.get('continuation_input_count')}",
                      f"snapshot_boundary_after_raw_event={boundary.get('after_raw_event')}",
                      f"pending_presentation_count={boundary.get('pending_presentation_count')}",
                  )
              )
              + "\n",
              encoding="utf-8",
          )
          print(summary_path.read_text(encoding="utf-8"), end="")
          PY

      - name: Write compact job summary and report digests
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "status=${JOB_STATUS:-unknown}"
          } > rust-ci-summary/summary.txt
          if [[ -f m3-native-wasm-artifacts/native-report.json \
            && -f m3-native-wasm-artifacts/wasm-report.json \
            && -f m3-native-wasm-artifacts/suite.json \
            && -f m3-native-wasm-artifacts/native-continuation-report.json \
            && -f m3-native-wasm-artifacts/wasm-continuation-report.json ]]; then
            sha256sum m3-native-wasm-artifacts/trace.json \
              m3-native-wasm-artifacts/native-report.json \
              m3-native-wasm-artifacts/wasm-report.json \
              m3-native-wasm-artifacts/suite.json \
              m3-native-wasm-artifacts/native-continuation-report.json \
              m3-native-wasm-artifacts/wasm-continuation-report.json \
              > rust-ci-summary/report-artifact-sha256.txt
          fi

      - name: Upload compact success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-success
          path: |
            rust-ci-summary/summary.txt
            rust-ci-summary/m3-parity-summary.txt
            rust-ci-summary/m3-continuation-summary.txt
            rust-ci-summary/m3-continuation-timing.txt
            rust-ci-summary/m3-continuation-build.txt
            rust-ci-summary/report-artifact-sha256.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            m3-native-wasm-artifacts/**
          retention-days: 14
          if-no-files-found: warn

  m3-benchmarks:
    name: m3-benchmarks
    needs: m3-source-lock-and-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Detect benchmark contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          benchmark=scripts/benchmark-kernel-m3.mjs
          manifest=rust/fixtures/m3/m3-benchmark-manifest.json
          feature_present=0
          missing=()
          if [[ -e "$benchmark" ]] || [[ -e "$manifest" ]]; then
            feature_present=1
          fi
          if ((feature_present == 0)); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: the measured M3 benchmark milestone is not present yet."
            exit 0
          fi
          for path in "${core[@]}"; do
            [[ -e "$path" ]] || missing+=("$path")
          done
          [[ -f "$benchmark" ]] || missing+=("$benchmark")
          [[ -e "$manifest" ]] || missing+=("$manifest")
          if ((${#missing[@]} > 0)); then
            printf '::error::Benchmark contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install repository-pinned Node.js
        if: steps.contract.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve the repository Rust toolchain semantics
        id: rust-toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t toolchain_spec < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("rust/rust-toolchain.toml").open("rb") as stream:
              document = tomllib.load(stream)
          spec = document.get("toolchain")
          if not isinstance(spec, dict):
              raise SystemExit("rust/rust-toolchain.toml must contain a [toolchain] table")
          unknown = set(spec) - {"channel", "profile", "components", "targets"}
          if unknown:
              raise SystemExit(f"unsupported rust-toolchain.toml keys: {sorted(unknown)}")
          channel = spec.get("channel")
          profile = spec.get("profile", "default")
          if not isinstance(channel, str) or not channel:
              raise SystemExit("rust/rust-toolchain.toml channel must be a non-empty string")
          if profile not in {"minimal", "default", "complete"}:
              raise SystemExit(f"invalid rust-toolchain.toml profile: {profile!r}")
          print(f"channel\t{channel}")
          print(f"profile\t{profile}")
          for key, kind in (("components", "component"), ("targets", "target")):
              values = spec.get(key, [])
              if not isinstance(values, list) or any(not isinstance(value, str) or not value for value in values):
                  raise SystemExit(f"rust-toolchain.toml {key} must be a list of non-empty strings")
              for value in values:
                  print(f"{kind}\t{value}")
          PY
          )
          channel=""
          rustup_args=()
          for line in "${toolchain_spec[@]}"; do
            IFS=$'\t' read -r kind value <<< "$line"
            case "$kind" in
              channel) channel="$value" ;;
              profile|component|target)
                rustup_args+=("--${kind}" "$value")
                ;;
              *)
                echo "::error::Unknown parsed rust-toolchain.toml field: $kind"
                exit 1
                ;;
            esac
          done
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$channel"
          rustup toolchain install "$channel" "${rustup_args[@]}"
          active="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          [[ "$active" == "$channel"* ]]

      - name: Confirm the repository Rust toolchain
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Rust dependencies and targets
        if: steps.contract.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/source-lock.toml') }}
          restore-keys: |
            rust-kernel-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Measure and validate the exact M3 workload inventory
        if: steps.contract.outputs.ready == 'true'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
          ORACLE_SHA: 3b534099919efae827019d4a3f3c4ab0ecd6d67b
          RUST_KERNEL_M3_ATTESTATION: rust-kernel-m3-v1:measure:github-hosted
        run: |
          set -euo pipefail
          mkdir -p rust-ci-benchmarks rust-ci-summary
          output=rust-ci-benchmarks/m3-benchmark.json
          baseline=rust/fixtures/m3/m3-benchmark-baseline.json
          benchmark_args=(
            --mode measure
            --manifest rust/fixtures/m3/m3-benchmark-manifest.json
            --output "$output"
          )
          expected_regression_status=baseline_created
          if [[ -f "$baseline" ]]; then
            benchmark_args+=(--baseline "$baseline")
            expected_regression_status=passed
          fi

          node --input-type=module - rust/fixtures/m3/m3-benchmark-manifest.json <<'NODE' > rust-ci-summary/m3-benchmark-command.log
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync(process.argv[2], "utf8"));
          console.log(`manifest_id=${manifest.manifest_id}`);
          for (const workload of manifest.workloads) {
            console.log(
              `input_workload=${workload.id} test_name=${workload.test_name} seed=${workload.seed} `
                + "fixture_id=reported-in-measured-details",
            );
          }
          NODE

          set +e
          node scripts/benchmark-kernel-m3.mjs "${benchmark_args[@]}" \
            2>&1 | tee -a rust-ci-summary/m3-benchmark-command.log
          benchmark_status=${PIPESTATUS[0]}
          set -e

          test -s "$output"
          cat "$output" | tee -a rust-ci-summary/m3-benchmark-command.log
          node --input-type=module - "$output" "$expected_regression_status" <<'NODE'
          import { readFileSync } from "node:fs";

          const file = process.argv[2];
          const expectedRegressionStatus = process.argv[3];
          const value = JSON.parse(readFileSync(file, "utf8"));
          const manifest = JSON.parse(readFileSync("rust/fixtures/m3/m3-benchmark-manifest.json", "utf8"));
          const expected = manifest.workloads;
          const assert = (condition, message) => {
            if (!condition) throw new Error(`${file}: ${message}`);
          };
          const measuredInteger = (candidate, label, positive = false) => {
            assert(Number.isSafeInteger(candidate), `${label} must be a safe integer`);
            assert(positive ? candidate > 0 : candidate >= 0, `${label} is outside its measured range`);
          };

          assert(value.schema_version === 1, "schema_version must be 1");
          assert(value.manifest_id === "rust-kernel-m3-bench-v1", "manifest_id mismatch");
          assert(value.mode === "measure" && value.measured === true, "measurement did not run");
          assert(value.accepted === true && value.acceptance_status === "accepted", "measurement was not accepted");
          assert(value.oracle_game_sha === process.env.ORACLE_SHA, "oracle SHA mismatch");
          assert(value.oracle_branch === "ci/coop/v2-showdown-command-coordinate-20260720", "oracle branch mismatch");
          assert(value.protocol_version === "er-coop-48", "protocol version mismatch");
          assert(value.frame_protocol_version === 2, "frame protocol version mismatch");
          assert(JSON.stringify(value.cross_target_suite_target) === JSON.stringify(manifest.cross_target_suite_target), "cross-target suite target mismatch");
          assert(typeof value.manifest_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.manifest_sha256), "manifest digest missing");
          assert(typeof value.source_lock_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.source_lock_sha256), "source-lock digest missing");
          assert(typeof value.content_identity_sha256 === "string" && /^[0-9a-f]{64}$/u.test(value.content_identity_sha256), "content identity digest missing");
          assert(value.toolchain?.channel === "1.97.1", "toolchain channel mismatch");
          assert(value.toolchain?.profile === "minimal", "toolchain profile mismatch");
          assert(value.toolchain?.package === "er-sim", "toolchain package mismatch");
          assert(value.toolchain?.bench_target === "m3_benchmark", "bench target mismatch");
          assert(value.toolchain?.build_profile === "release", "build profile mismatch");
          measuredInteger(value.setup?.elapsed_wall_ms, "setup.elapsed_wall_ms");
          measuredInteger(value.setup?.peak_rss_bytes, "setup.peak_rss_bytes", true);
          assert(value.setup?.status === "measured" && value.setup?.accepted === true, "setup was not measured");

          const runner = value.runner;
          assert(runner?.provider === "github-hosted", "runner provider mismatch");
          assert(runner?.hosted === true && runner?.github_actions === true, "runner is not attested as hosted Actions");
          assert(runner?.os === "linux", "runner OS mismatch");
          assert(runner?.arch === process.arch, "runner architecture mismatch");
          assert(runner?.class === "linux-github-hosted", "runner class mismatch");
          const github = runner.github_run;
          const githubFields = {
            server_url: "GITHUB_SERVER_URL",
            repository: "GITHUB_REPOSITORY",
            workflow: "GITHUB_WORKFLOW",
            job: "GITHUB_JOB",
            ref: "GITHUB_REF",
            sha: "GITHUB_SHA",
            run_id: "GITHUB_RUN_ID",
            run_attempt: "GITHUB_RUN_ATTEMPT",
            run_number: "GITHUB_RUN_NUMBER",
          };
          for (const [field, environment] of Object.entries(githubFields)) {
            assert(github?.[field] === process.env[environment], `runner ${field} mismatch`);
          }

          assert(Array.isArray(value.workloads) && value.workloads.length === expected.length, "workload count mismatch");
          for (const [index, specification] of expected.entries()) {
            const workload = value.workloads[index];
            assert(workload?.id === specification.id, `workload ${index} id/order mismatch`);
            assert(workload.test_name === specification.test_name, `${specification.id} test name mismatch`);
            for (const field of ["iterations", "schedules", "steps"]) {
              assert(workload[field] === specification[field], `${specification.id} ${field} mismatch`);
            }
            assert(JSON.stringify(workload.target) === JSON.stringify(specification.target), `${specification.id} hard target mismatch`);
            assert(JSON.stringify(workload.target_counts) === JSON.stringify(specification.target_counts), `${specification.id} target count contract mismatch`);
            assert(workload.status === "measured" && workload.accepted === true, `${specification.id} was not accepted`);
            measuredInteger(workload.content_load_elapsed_ns, `${specification.id}.content_load_elapsed_ns`);
            measuredInteger(workload.execution_elapsed_ns, `${specification.id}.execution_elapsed_ns`);
            assert(workload.execution_elapsed_ns < specification.target.max_exclusive_ns, `${specification.id} exceeded its exclusive execution target`);
            measuredInteger(workload.elapsed_wall_ms, `${specification.id}.elapsed_wall_ms`);
            measuredInteger(workload.peak_rss_bytes, `${specification.id}.peak_rss_bytes`, true);
            for (const field of ["turns", "battles", "inputs", "rng_draws"]) {
              measuredInteger(workload.counts?.[field], `${specification.id}.counts.${field}`);
              if (specification.target_counts[field] !== null) {
                assert(workload.counts[field] === specification.target_counts[field], `${specification.id}.counts.${field} target mismatch`);
              }
            }
            assert(typeof workload.checksum === "string" && /^[0-9a-f]{16}$/u.test(workload.checksum), `${specification.id} checksum missing`);
          }
          assert(value.regression_check?.factor === 1.25, "regression factor must be 1.25");
          assert(value.regression_check?.status === expectedRegressionStatus, "regression status mismatch");
          NODE
          exit "$benchmark_status"

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "job_status=${JOB_STATUS:-unknown}"
            echo "benchmark_status=measured"
          } > rust-ci-summary/summary.txt
          if [[ -s rust-ci-benchmarks/m3-benchmark.json ]]; then
            node --input-type=module - rust-ci-benchmarks/m3-benchmark.json <<'NODE' >> rust-ci-summary/summary.txt
            import { readFileSync } from "node:fs";

            try {
              const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
              for (const workload of Array.isArray(value.workloads) ? value.workloads : []) {
                console.log(
                  `workload=${workload.id} seed=${workload.seed} checksum=${workload.checksum ?? "unavailable"} `
                    + `fixture_id=${workload.details?.fixture ?? "unavailable"}`,
                );
              }
            } catch (error) {
              console.log(`benchmark_identity=unavailable reason=${error.message}`);
            }
          NODE
          else
            echo "benchmark_identity=unavailable result_not_emitted=true" >> rust-ci-summary/summary.txt
          fi
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact measured evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-measured
          path: |
            rust-ci-summary/summary.txt
            rust-ci-summary/schema-hash.txt
            rust-ci-summary/benchmark-json-files.txt
            rust-ci-benchmarks/m3-benchmark.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**
          retention-days: 14
          if-no-files-found: warn
