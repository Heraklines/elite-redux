          cp Cargo.lock "$committed_lock"
          cargo generate-lockfile
          if ! cmp -s "$committed_lock" Cargo.lock; then
            mkdir -p ../rust-ci-summary
            cp Cargo.lock ../rust-ci-summary/generated-Cargo.lock
            echo "::error::rust/Cargo.lock is stale; generated-Cargo.lock is attached to the failure artifact."
            exit 1
