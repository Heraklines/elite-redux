    name: Rust native nextest and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Detect Rust workspace contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          core=(rust/rust-toolchain.toml rust/Cargo.toml rust/Cargo.lock)
          present=0
          missing=()
          for path in "${core[@]}"; do
            if [[ -e "$path" ]]; then
              present=1
            else
              missing+=("$path")
            fi
          done
          if ((present == 0)); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust kernel pre-contract: rust workspace milestone is not present yet."
            exit 0
          fi
          if ((${#missing[@]} > 0)); then
            printf '::error::Rust workspace contract is partially present; missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

