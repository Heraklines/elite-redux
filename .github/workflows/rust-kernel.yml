          }
          if (value.mode !== "metadata" || value.status !== "not_measured") {
            throw new Error(`${file} must report metadata/not_measured; measured or passed output is invalid`);
          }
          if (value.oracle_game_sha !== "3b534099919efae827019d4a3f3c4ab0ecd6d67b") {
            throw new Error(`${file} oracle_game_sha does not match the pinned oracle`);
          }
          if (value.protocol_version !== "er-coop-47") {
            throw new Error(`${file} protocol_version must be er-coop-47`);
          }
          if (!Array.isArray(value.scenarios)) {
            throw new Error(`${file} scenarios must be an array`);
          }
          const actualIds = value.scenarios.map(scenario => scenario.id);
          if (actualIds.length !== expectedIds.length || expectedIds.some(id => !actualIds.includes(id))) {
            throw new Error(`${file} scenario inventory mismatch: ${actualIds.join(", ")}`);
          }
          for (const scenario of value.scenarios) {
            if (scenario.status !== "not_measured") {
              throw new Error(`${file} scenario ${scenario.id} is not marked not_measured`);
            }
            for (const field of [
              "sample_count",
              "attempted_sample_count",
              "setup_build_ms",
              "cold_start_ms",
              "warm_start_ms",
              "spawn_latency_ms",
              "execution_ms",
              "peak_rss_bytes",
            ]) {
              if (scenario[field] !== null) {
                throw new Error(`${file} scenario ${scenario.id} has measured field ${field}`);
              }
            }
          }
          NODE

      - name: Write compact job summary and schema hash
        if: always()
        shell: bash
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p rust-ci-summary
          {
            echo "job=$GITHUB_JOB"
            echo "sha=$GITHUB_SHA"
            echo "contract_status=${CONTRACT_STATUS:-unknown}"
            echo "job_status=${JOB_STATUS:-unknown}"
            echo "benchmark_status=not_measured"
          } > rust-ci-summary/summary.txt
          schema_file="$(find schemas/kernel -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$schema_file" ]]; then
            find schemas/kernel -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > rust-ci-summary/schema-hash.txt
          else
            echo "pre-contract: schemas/kernel is absent" > rust-ci-summary/schema-hash.txt
          fi
          find . -type f -iname '*benchmark*.json' -not -path './.git/*' -not -path './node_modules/*' -print | sort > rust-ci-summary/benchmark-json-files.txt

      - name: Upload compact metadata evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-metadata
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*benchmark*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-${{ github.job }}-failure
          path: |
            rust-ci-summary/**
            rust-ci-benchmarks/**/*.json
            **/*trace*
            **/*seed*
            **/*divergence*
            **/*digest*
            **/*live-resource*
            **/*live_resource*
            **/trace/**
            **/traces/**
            **/seed/**
            **/seeds/**
            **/divergence/**
            **/divergences/**
            **/digest/**
            **/digests/**
            **/live-resources/**
            **/live_resources/**
            **/resources/**
          retention-days: 14
          if-no-files-found: warn
