name: Stats Site Nightly Refresh

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: stats-nightly
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Heraklines/elite-redux'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_WINDOW_DAYS: "30"
      STATS_MAX_AGE_HOURS: "12"
    steps:
      - name: Check out current Elite Redux source
        uses: actions/checkout@v6
        with:
          ref: feat/elite-redux-port

      - name: Record source revision
        run: echo "STATS_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-deps

      - name: Export initialized runtime catalog
        env:
          ER_SCENARIO: "1"
        run: pnpm exec vitest run test/tests/elite-redux/tools/dump-stats-dex.test.ts

      - name: Export anonymized production telemetry
        run: node stats/dump-cloudflare-data.mjs

      - name: Generate aggregate statistics and tiers
        run: |
          node stats/gen-real-stats.mjs
          node stats/gen-usage-tiers.mjs stats/data/usage-tiers.json
          node stats/apply-m5cap-tiers.mjs

      - name: Test leaderboard calculations
        run: node --test stats/*.test.mjs

      - name: Generate production leaderboards
        run: node stats/gen-leaderboards.mjs

      - name: Validate freshness, completeness, and privacy
        run: |
          node stats/validate-stats-data.mjs
          node stats/validate-leaderboards.mjs

      - name: Build clean deploy directory
        working-directory: stats
        run: |
          rm -rf _stats_deploy
          mkdir -p _stats_deploy/data
          cp index.html app.js styles.css leaderboards.html leaderboards.js leaderboards.css _stats_deploy/
          cp data/dex.json data/species-stats.json data/dex-detail.json data/species-extra.json data/leaderboards.json _stats_deploy/data/
          printf '%s' '{"note":"not public"}' > _stats_deploy/data/_runs.json
          printf '%s' '{"note":"not public"}' > _stats_deploy/data/_showdown.json
          printf '%s\n' '/data/*' '  Cache-Control: public, max-age=0, must-revalidate' > _stats_deploy/_headers

      - name: Validate deploy directory
        run: |
          node stats/validate-stats-data.mjs --deploy=stats/_stats_deploy
          node stats/validate-leaderboards.mjs --deploy=stats/_stats_deploy

      - name: Deploy er-stats to Cloudflare Pages
        working-directory: stats
        run: npx wrangler pages deploy _stats_deploy --project-name=er-stats --branch=main --commit-dirty=true
