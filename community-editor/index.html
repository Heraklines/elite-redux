<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokerogue Redux Community Editor</title>
  </head>
  <body>
    <script>
      const target = new URL("../editor/index.html", location.href);
      for (const [key, value] of new URLSearchParams(location.search)) {
        target.searchParams.set(key, value);
      }
      target.searchParams.set("mode", "community");
      location.replace(target);
    </script>
  </body>
</html>
