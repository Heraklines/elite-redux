schema_version = 1
milestone = "M3"
project = "PokéRogue Redux"
m2_base_sha = "7357166c19bdb5cf0e32c84b0f74f22e79d80798"
oracle_game_sha = "3b534099919efae827019d4a3f3c4ab0ecd6d67b"
integration_branch = "arch/rust-kernel-m3"
branch_base_resolution = "head_sha in the m3-g6-attestation artifact from a successful overall Rust Kernel Gate run on arch/rust-kernel-m3"
public_api = "rust/contracts/m3-api.md"
contract_lock = "rust/contracts/m3-contract.toml"

[rules]
isolated_worktree = true
exclusive_paths = true
same_freeze_sha_for_each_generation = true
public_signatures_frozen_after_g6 = true
workers_may_spawn_agents = false
workers_may_rebase_onto_each_other = false
integration_owner_only_merges = true
integration_owner_only_pushes = true
integration_owner_only_contract_changes = true
integration_owner_only_shared_crate_roots = true
integration_owner_only_kernel_step = true
production_typescript_read_only = true
m2_source_lock_read_only = true
local_rust_execution = false
local_coop_vitest = false
hosted_rust_gate_required = true
branch_base_must_equal_hosted_green_head = true
integration_owner_verifies_green_attestation = true
one_behavioral_concern_per_commit = true

[dependency_order]
m3a = ["types", "rng", "content", "state", "command_control", "fixtures", "tests"]
m3b = ["ordering", "numeric_mechanics", "effects", "switch_faint_outcome", "presentation", "differential_tests"]
m3c = ["game_runtime", "ui_adapter", "material_protocol", "kernel_step", "simulated_pair", "campaigns", "wasm_teardown_benchmarks"]

[generation_gates]
m3b_requires_all_38_published_fixtures = true
m3b_requires_both_published_supporting_artifacts = true
m3b_requires_fresh_process_double_export_job = true
m3b_requires_gap_free_manifest = true
m3b_requires_branch_aware_hosted_publication_job = true
m3b_requires_independent_exact_sha_export_checkouts = true
m3b_requires_verified_git_and_content_provenance = true

