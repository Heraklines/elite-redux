schema_version = 1
milestone = "M4"
project = "PokéRogue Redux"
m3_base_sha = "45c89493e7edec9c4da247a98cd7858b1f015c09"
m4_oracle_sha = "45c89493e7edec9c4da247a98cd7858b1f015c09"
integration_branch = "arch/rust-kernel-m4"
public_api = "rust/contracts/m4-api.md"
contract_lock = "rust/contracts/m4-contract.toml"

[rules]
isolated_worktree = true
exclusive_paths = true
same_freeze_sha_for_each_generation = true
public_signatures_frozen_after_g12 = true
workers_may_spawn_agents = false
workers_may_rebase_onto_each_other = false
integration_owner_only_merges = true
integration_owner_only_pushes = true
integration_owner_only_contract_changes = true
integration_owner_only_shared_crate_roots = true
integration_owner_only_kernel_step = true
production_typescript_read_only = true
m3_source_lock_read_only = true
local_rust_execution = false
local_coop_vitest = false
hosted_rust_gate_required = true
branch_base_must_equal_hosted_green_head = true
one_behavioral_concern_per_commit = true

[dependency_order]
g12 = ["oracle", "contracts", "slice", "stubs", "bootstrap_gate"]
m4a = ["types", "state_ownership", "migration", "run_content", "progression", "modifiers", "surfaces", "biomes", "fixtures", "tests"]
m4b = ["game_runtime", "controls", "materials", "common_applier", "kernel_step", "simulator", "campaigns", "snapshots", "wasm", "benchmarks"]
m4c = ["oracle_parity", "co_op_faults", "two_hundred_wave", "migration", "resources", "performance"]

[generation_gates]
m4a_requires_gap_classified_manifests = true
m4b_requires_hosted_foundation_green = true
m4c_requires_hosted_integration_green = true
final_requires_exact_sha_all_green = true

[[lanes]]
id = "M4A-01"
generation = "M4A"
branch = "wrk/rk-m4a-01-types"
