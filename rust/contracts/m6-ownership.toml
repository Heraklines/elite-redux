integration_branch = "arch/rust-kernel-m6"
integration_base_sha = "200caaee1697fe40a293f0a5da76af8b11f3cea9"
oracle_sha = "3bb6d49c924293ef79e3ab2f11e10cf4f5b9c6c7"
contract = "rust/contracts/m6-contract.toml"
production_typescript_read_only = true
isolated_writer_worktrees = true
worker_rebase = false
public_api_changes_after_g21 = "contract-change-request-only"

[integration_owner]
exclusive = [
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/crates/er-kernel/src/kernel.rs",
  "rust/contracts/m6-*",
  ".github/workflows/rust-kernel-m6.yml",
]
responsibilities = [
  "merge in frozen dependency order",
  "resolve contract requests",
  "stage and push exact integration candidates",
  "run G21 through G25 aggregates",
  "create final tag only after G25 green",
]

[semantic_extraction]
exclusive = [
  "scripts/export-kernel-m6-semantic-catalog.mjs",
  "test/kernel-fixtures/m6/export-semantic-runtime.test.ts",
  "rust/fixtures/m6/raw-source-catalog-v2.json",
  "rust/fixtures/m6/semantic-catalog-v1.json",
  "rust/fixtures/m6/behavior-unit-manifest-v1.json",
  "rust/fixtures/m6/primitive-gap-manifest-v1.json",
  "rust/fixtures/m6/bespoke-clusters-v1.json",
  "rust/fixtures/m6/oracle-witness-plan-v1.json",
  "rust/fixtures/m6/rng-site-manifest-v1.json",
  "docs/plans/rust-kernel/m6-*.md",
]

[m6a_ids_catalog]
exclusive = [
  "rust/crates/er-types/src/m6.rs",
  "rust/crates/er-content/src/m6_catalog.rs",
]

[m6a_ir_hooks_queries]
