[m6d_system]
exclusive = [
  "rust/crates/er-testkit/tests/m6_system_*.rs",
  "rust/crates/er-sim/tests/m6_*.rs",
  "rust/crates/er-wasm/tests/m6_*.rs",
  "rust/fixtures/m6/m6-benchmark-manifest.json",
]

[handoff]
required = [
  "branch",
  "base_sha",
  "head_sha",
  "owned_files",
  "static_checks",
  "hosted_run_and_jobs",
  "fixture_dependencies",
  "unsupported_or_pending_behavior_units",
  "contract_requests",
]
